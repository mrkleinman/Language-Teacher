  {id:'abs-beg-s1-01',num:1,title:'How to Greet Someone with Perfect Thai',situation:'Meeting someone for the first time.',coreConceptIds:['wellbeing_question'],keyPattern:{thai:'สบายดีไหมครับ',phonetic:'sà-baai-dii mǎi khráp',english:'How are you?'},teacherExplanation:'To ask how someone is, say สบายดีไหมครับ. สบายดี means well or fine. Adding ไหม at the end makes it a yes/no question.',examples:[{thai:'สวัสดีครับ',phonetic:'sà-wàt-dii khráp',english:'Hello.'},{thai:'สบายดีไหมครับ',phonetic:'sà-baai-dii mǎi khráp',english:'How are you?'},{thai:'สบายดีครับ ขอบคุณครับ',phonetic:'sà-baai-dii khráp khàawp-khun khráp',english:'Fine, thank you.'}],practicePrompts:[{prompt:'Say hello',thai:'สวัสดีครับ',phonetic:'sà-wàt-dii khráp',english:'Hello.'},{prompt:'Ask how they are',thai:'สบายดีไหมครับ',phonetic:'sà-baai-dii mǎi khráp',english:'How are you?'},{prompt:'Say you are fine',thai:'สบายดีครับ',phonetic:'sà-baai-dii khráp',english:'I am fine.'}]},

  {id:'abs-beg-s1-03',num:3,title:'Could You Please Teach Me Some Thai?',situation:'Asking someone to do something politely.',coreConceptIds:['polite_request_chuai'],keyPattern:{thai:'ช่วย...ได้ไหมครับ',phonetic:'chûuai...dâai mǎi khráp',english:'Could you please...?'},teacherExplanation:'To make a polite request, use ช่วย + verb + ได้ไหมครับ. ช่วย means help. ได้ไหม means is it possible.',examples:[{thai:'ช่วยพูดช้าๆได้ไหมครับ',phonetic:'chûuai phûut cháa-cháa dâai mǎi khráp',english:'Could you please speak slowly?'},{thai:'ช่วยสอนภาษาไทยได้ไหมครับ',phonetic:'chûuai sǎawn phaa-sǎa-thai dâai mǎi khráp',english:'Could you please teach me Thai?'}],practicePrompts:[{prompt:'Ask them to speak slowly',thai:'ช่วยพูดช้าๆได้ไหมครับ',phonetic:'chûuai phûut cháa-cháa dâai mǎi khráp',english:'Could you please speak slowly?'},{prompt:'Say excuse me',thai:'ขอโทษครับ',phonetic:'khǎaw-thôot khráp',english:'Excuse me.'}]},
  {id:'abs-beg-s1-04',num:4,title:"You're Not from Thailand, Are You?",situation:'Discussing nationalities.',coreConceptIds:['to_be_bpen'],keyPattern:{thai:'ผมเป็นคน + nationality',phonetic:'phǒm bpen khon + nationality',english:'I am nationality.'},teacherExplanation:'เป็น is the verb to be. คน means person. To say your nationality: ผมเป็นคน + country name.',examples:[{thai:'ผมเป็นคนอเมริกันครับ',phonetic:'phǒm bpen khon à-mee-rí-gan khrâp',english:'I am American.'},{thai:'คุณเป็นคนที่ไหนครับ',phonetic:'khun bpen khon thîi-nǎi khráp',english:'Where are you from?'}],practicePrompts:[{prompt:'Say you are American',thai:'ผมเป็นคนอเมริกันครับ',phonetic:'phǒm bpen khon à-mee-rí-gan khrâp',english:'I am American.'},{prompt:'Ask where they are from',thai:'คุณเป็นคนที่ไหนครับ',phonetic:'khun bpen khon thîi-nǎi khráp',english:'Where are you from?'}]},
  {id:'abs-beg-s1-05',num:5,title:'Did You Really Just Ask My Age in Thai?',situation:'Asking and saying ages and numbers.',coreConceptIds:['numbers_age'],keyPattern:{thai:'คุณอายุเท่าไหร่ครับ',phonetic:'khun aa-yú thâo-rài khráp',english:'How old are you?'},teacherExplanation:'เท่าไหร่ at the end means how much or how many. For age: อายุเท่าไหร่.',examples:[{thai:'คุณอายุเท่าไหร่ครับ',phonetic:'khun aa-yú thâo-rài khráp',english:'How old are you?'},{thai:'ผมอายุยี่สิบเจ็ดปีครับ',phonetic:'phǒm aa-yú yîi-sìp-jèt bpii khráp',english:'I am 27 years old.'}],practicePrompts:[{prompt:'Ask their age',thai:'คุณอายุเท่าไหร่ครับ',phonetic:'khun aa-yú thâo-rài khráp',english:'How old are you?'},{prompt:'Say you are 27',thai:'ผมอายุยี่สิบเจ็ดปีครับ',phonetic:'phǒm aa-yú yîi-sìp-jèt bpii khráp',english:'I am 27.'}]},
  {id:'abs-beg-s1-06',num:6,title:'Can You Tell Me Your Occupation in Thai?',situation:'Discussing jobs and abilities.',coreConceptIds:['can_you_daai_mai'],keyPattern:{thai:'verb + ได้ไหมครับ',phonetic:'verb + dâai mǎi khráp',english:'Can you verb?'},teacherExplanation:'Put ได้ไหม at the end to ask can you? or is it possible? ได้ alone means can or yes I can.',examples:[{thai:'คุณพูดภาษาไทยได้ไหมครับ',phonetic:'khun phûut phaa-sǎa-thai dâai mǎi khráp',english:'Can you speak Thai?'},{thai:'ได้ครับ นิดหน่อย',phonetic:'dâai khráp nít-nàwy',english:'Yes, a little.'}],practicePrompts:[{prompt:'Ask if they can speak Thai',thai:'คุณพูดภาษาไทยได้ไหมครับ',phonetic:'khun phûut phaa-sǎa-thai dâai mǎi khráp',english:'Can you speak Thai?'},{prompt:'Say yes a little',thai:'ได้ครับ นิดหน่อย',phonetic:'dâai khráp nít-nàwy',english:'Yes, a little.'}]},
  {id:'abs-beg-s1-07',num:7,title:'Can You Tell Me What Time It Is in Thailand?',situation:'Asking and telling the time.',coreConceptIds:['what_time_gii_moong'],keyPattern:{thai:'event + กี่โมงครับ',phonetic:'event + gìi moong khráp',english:'What time is event?'},teacherExplanation:'กี่โมง means what time? Place it after the event you are asking about.',examples:[{thai:'ตอนนี้กี่โมงแล้วครับ',phonetic:'dtaawn-níi gìi moong láaeo khráp',english:'What time is it now?'},{thai:'รถบัสมากี่โมงครับ',phonetic:'rót-bát maa gìi moong khráp',english:'What time does the bus come?'}],practicePrompts:[{prompt:'Ask what time it is',thai:'ตอนนี้กี่โมงแล้วครับ',phonetic:'dtaawn-níi gìi moong láaeo khráp',english:'What time is it now?'},{prompt:'Ask what time the bus comes',thai:'รถบัสมากี่โมงครับ',phonetic:'rót-bát maa gìi moong khráp',english:'What time does the bus come?'}]},
  {id:'abs-beg-s1-08',num:8,title:'Do You Have the Right Clothes for Thai Weather?',situation:'Talking about what you have.',coreConceptIds:['have_mii'],keyPattern:{thai:'ผมมี + noun + ครับ',phonetic:'phǒm mii + noun + khráp',english:'I have noun.'},teacherExplanation:'มี means to have. Subject + มี + object. ไม่มี means do not have. คุณมี...ไหมคะ asks do you have.',examples:[{thai:'ผมมีหมวกครับ',phonetic:'phǒm mii mùuak khráp',english:'I have a hat.'},{thai:'ผมไม่มีกางเกงขาสั้นครับ',phonetic:'phǒm mâi mii gaang-geeng-khǎa-sân khráp',english:'I do not have shorts.'}],practicePrompts:[{prompt:'Say you have a hat',thai:'ผมมีหมวกครับ',phonetic:'phǒm mii mùuak khráp',english:'I have a hat.'},{prompt:'Say you do not have shorts',thai:'ผมไม่มีกางเกงขาสั้นครับ',phonetic:'phǒm mâi mii gaang-geeng-khǎa-sân khráp',english:'I do not have shorts.'}]},
  {id:'abs-beg-s1-09',num:9,title:'Can I Get Your Number in Thailand?',situation:'Exchanging contact details.',coreConceptIds:['possession_khawng'],keyPattern:{thai:'noun + ของ + ผม/คุณ',phonetic:'noun + khǎawng + phǒm/khun',english:'My/Your noun'},teacherExplanation:'ของ shows possession. Thing + ของ + owner. This pattern makes possessives like my, your, his.',examples:[{thai:'นี่นามบัตรของผมครับ',phonetic:'nîi naam-bàt khǎawng phǒm khrâp',english:'This is my name card.'},{thai:'เบอร์โทรศัพท์ของคุณคืออะไรครับ',phonetic:'booe-thoo-rá-sàp khǎawng khun khuue à-rai khráp',english:'What is your phone number?'}],practicePrompts:[{prompt:'Give them your name card',thai:'นี่นามบัตรของผมครับ',phonetic:'nîi naam-bàt khǎawng phǒm khrâp',english:'This is my name card.'}]},
  {id:'abs-beg-s1-10',num:10,title:'How Long Can We Stay in Thailand?',situation:'At immigration, asked how long you will stay.',coreConceptIds:['how_long_naan','have_mii'],keyPattern:{thai:'จะอยู่นานเท่าไหร่ครับ',phonetic:'jà yùu naan thâo-rài khráp',english:'How long will you stay?'},teacherExplanation:'นานเท่าไหร่ means how long? Place it after the action.',examples:[{thai:'จะอยู่ประเทศไทยนานเท่าไหร่ครับ',phonetic:'jà yùu bprà-thêet-thai naan thâo-rài khráp',english:'How long will you stay in Thailand?'},{thai:'สองอาทิตย์ครับ',phonetic:'sǎawng aa-thít khráp',english:'Two weeks.'},{thai:'พักที่ไหนครับ',phonetic:'phák thîi-nǎi khráp',english:'Where will you stay?'}],practicePrompts:[{prompt:'Ask how long they will stay',thai:'จะอยู่นานเท่าไหร่ครับ',phonetic:'jà yùu naan thâo-rài khráp',english:'How long will you stay?'},{prompt:'Say two weeks',thai:'สองอาทิตย์ครับ',phonetic:'sǎawng aa-thít khráp',english:'Two weeks.'}]},
  {id:'abs-beg-s1-11',num:11,title:'Get What You Want Using Thai',situation:'Buying a bus ticket at the counter.',coreConceptIds:['what_time_gii_moong','request_item_kho'],keyPattern:{thai:'ขอตั๋วหนึ่งใบครับ',phonetic:'khǎaw dtǔua nùeng bai khráp',english:'One ticket please.'},teacherExplanation:'กี่โมง means what time? To buy things: ขอ + item + number + classifier.',examples:[{thai:'รถบัสเข้าเมืองกี่โมงครับ',phonetic:'rót-bát khâo muueang gìi moong khráp',english:'What time is the town bus?'},{thai:'ขอตั๋วรถบัสหนึ่งใบครับ',phonetic:'khǎaw dtǔua rót-bát nùeng bai khráp',english:'One bus ticket please.'},{thai:'ที่ขึ้นรถอยู่ที่ไหนครับ',phonetic:'thîi-khûen-rót yùu thîi-nǎi khráp',english:'Where is the bus stand?'}],practicePrompts:[{prompt:'Ask what time the bus is',thai:'รถบัสกี่โมงครับ',phonetic:'rót-bát gìi moong khráp',english:'What time is the bus?'},{prompt:'Ask for one ticket',thai:'ขอตั๋วหนึ่งใบครับ',phonetic:'khǎaw dtǔua nùeng bai khráp',english:'One ticket please.'}]},
  {id:'abs-beg-s1-12',num:12,title:"Don't Shop in Thailand When You're Hungry!",situation:'Ordering drinks and snacks.',coreConceptIds:['classifiers_basic','request_item_kho'],keyPattern:{thai:'noun + number + classifier + ครับ',phonetic:'noun + number + classifier + khráp',english:'number noun'},teacherExplanation:'Thai uses classifiers — special words after numbers. ขวด for bottles, กระป๋อง for cans, ใบ for tickets.',examples:[{thai:'น้ำเปล่าสามขวดครับ',phonetic:'nám-bplàao sǎam khùuat khráp',english:'Three bottles of water.'},{thai:'กาแฟหนึ่งกระป๋องครับ',phonetic:'gaa-faae nùeng grà-bpǎwng khráp',english:'One can of coffee.'}],practicePrompts:[{prompt:'Order three bottles of water',thai:'น้ำเปล่าสามขวดครับ',phonetic:'nám-bplàao sǎam khùuat khráp',english:'Three bottles of water.'},{prompt:'Order one coffee',thai:'กาแฟหนึ่งกระป๋องครับ',phonetic:'gaa-faae nùeng grà-bpǎwng khráp',english:'One can of coffee.'}]},
  {id:'abs-beg-s1-13',num:13,title:'Be Sure to Count Your Change in Thai!',situation:'Shopping and asking about prices.',coreConceptIds:['price_rao_khai'],keyPattern:{thai:'noun + ราคาเท่าไหร่ครับ',phonetic:'noun + raa-khaa thâo-rài khráp',english:'How much is noun?'},teacherExplanation:'To ask the price, say the item then ราคาเท่าไหร่. You can also say นี่ราคาเท่าไหร่ for anything in front of you.',examples:[{thai:'ซาลาเปาราคาเท่าไหร่ครับ',phonetic:'saa-laa-bpao raa-khaa thâo-rài khráp',english:'How much are the steamed buns?'},{thai:'นี่ราคาเท่าไหร่ครับ',phonetic:'nîi raa-khaa thâo-rài khráp',english:'How much is this?'}],practicePrompts:[{prompt:'Ask how much the steamed buns are',thai:'ซาลาเปาราคาเท่าไหร่ครับ',phonetic:'saa-laa-bpao raa-khaa thâo-rài khráp',english:'How much are the steamed buns?'},{prompt:'Ask how much this is',thai:'นี่ราคาเท่าไหร่ครับ',phonetic:'nîi raa-khaa thâo-rài khráp',english:'How much is this?'}]},
  {id:'abs-beg-s1-14',num:14,title:'How to Stay in Style While in Thailand',situation:'Asking about hotel services and opening hours.',coreConceptIds:['time_range_dtangtae'],keyPattern:{thai:'ตั้งแต่ time ถึง time',phonetic:'dtâng-dtàae time thǔeng time',english:'From time to time'},teacherExplanation:'To say a time range, use ตั้งแต่ + start time + ถึง + end time.',examples:[{thai:'ตั้งแต่หกโมงเช้าถึงเก้าโมงเช้าครับ',phonetic:'dtâng-dtàae hòk moong-cháao thǔeng gâao moong-cháao khráp',english:'From 6am to 9am.'}],practicePrompts:[{prompt:'Say from 6am to 9am',thai:'ตั้งแต่หกโมงเช้าถึงเก้าโมงเช้าครับ',phonetic:'dtâng-dtàae hòk moong-cháao thǔeng gâao moong-cháao khráp',english:'From 6am to 9am.'}]},
  {id:'abs-beg-s1-15',num:15,title:"What's the Weather Like Today in Thailand?",situation:'Talking about the weather.',coreConceptIds:['how_is_bpen_yangrai'],keyPattern:{thai:'noun + เป็นอย่างไรครับ',phonetic:'noun + bpen yàang-rai khráp',english:'What is noun like?'},teacherExplanation:'เป็นอย่างไร means what is it like? or how is it? Place it after the noun.',examples:[{thai:'วันนี้อากาศเป็นอย่างไรครับ',phonetic:'wan-níi aa-gàat bpen yàang-rai khráp',english:"What is the weather like today?"},{thai:'อากาศดีมากครับ',phonetic:'aa-gàat dii mâak khráp',english:'The weather is very good.'}],practicePrompts:[{prompt:"Ask what todays weather is like",thai:'วันนี้อากาศเป็นอย่างไรครับ',phonetic:'wan-níi aa-gàat bpen yàang-rai khráp',english:"What is the weather like today?"},{prompt:'Say the weather is very good',thai:'อากาศดีมากครับ',phonetic:'aa-gàat dii mâak khráp',english:'The weather is very good.'}]},
  {id:'abs-beg-s1-16',num:16,title:'Have a Good Day in Thailand',situation:'Asking for directions at the hotel.',coreConceptIds:['where_is_yuu_thinai'],keyPattern:{thai:'noun + อยู่ที่ไหนครับ',phonetic:'noun + yùu thîi-nǎi khráp',english:'Where is noun?'},teacherExplanation:'อยู่ means to be located. ที่ไหน means where. Put the noun first then อยู่ที่ไหน. Only use with people, places and things — not verbs or adjectives.',examples:[{thai:'รถแท็กซี่อยู่ที่ไหนครับ',phonetic:'rót-tháek-sîi yùu thîi-nǎi khráp',english:'Where are the taxis?'},{thai:'ห้องน้ำอยู่ที่ไหนครับ',phonetic:'hâwng-nám yùu thîi-nǎi khráp',english:'Where is the bathroom?'}],practicePrompts:[{prompt:'Ask where the taxis are',thai:'รถแท็กซี่อยู่ที่ไหนครับ',phonetic:'rót-tháek-sîi yùu thîi-nǎi khráp',english:'Where are the taxis?'},{prompt:'Ask where the bathroom is',thai:'ห้องน้ำอยู่ที่ไหนครับ',phonetic:'hâwng-nám yùu thîi-nǎi khráp',english:'Where is the bathroom?'}]},
  {id:'abs-beg-s1-17',num:17,title:'Can Any Thai Taxi Drivers Speak English?',situation:'In a taxi, asking about abilities.',coreConceptIds:['can_do_daai'],keyPattern:{thai:'verb + ได้ครับ',phonetic:'verb + dâai khráp',english:'I can verb.'},teacherExplanation:'ได้ after a verb means can or able to. ไม่ได้ means cannot. This differs from ได้ไหม which asks can you?',examples:[{thai:'ผมพูดภาษาอังกฤษได้ครับ',phonetic:'phǒm phûut phaa-sǎa-ang-grìt dâai khráp',english:'I can speak English.'},{thai:'ผมพูดภาษาไทยไม่ได้ครับ',phonetic:'phǒm phûut phaa-sǎa-thai mâi dâai khráp',english:'I cannot speak Thai.'}],practicePrompts:[{prompt:'Say you can speak English',thai:'ผมพูดภาษาอังกฤษได้ครับ',phonetic:'phǒm phûut phaa-sǎa-ang-grìt dâai khráp',english:'I can speak English.'},{prompt:'Say you cannot speak Thai',thai:'ผมพูดภาษาไทยไม่ได้ครับ',phonetic:'phǒm phûut phaa-sǎa-thai mâi dâai khráp',english:'I cannot speak Thai.'}]},
  {id:'abs-beg-s1-18',num:18,title:'How to Get Insider Thai Info from the Locals',situation:'Asking someone to help you.',coreConceptIds:['ask_someone_hai_nawy'],keyPattern:{thai:'ช่วย + verb + ให้หน่อยได้ไหมครับ',phonetic:'chûuai + verb + hâi nàawy dâai mǎi khráp',english:'Could you please verb for me?'},teacherExplanation:'ให้ shows direction of action — doing something for someone. ช่วย...ให้หน่อยได้ไหมครับ is the full polite request.',examples:[{thai:'ช่วยเขียนให้หน่อยได้ไหมครับ',phonetic:'chûuai khǐian hâi nàawy dâai mǎi khráp',english:'Could you write it down for me?'},{thai:'ช่วยบอกได้ไหมครับ',phonetic:'chûuai bàawk dâai mǎi khráp',english:'Could you tell me?'}],practicePrompts:[{prompt:'Ask them to write it down for you',thai:'ช่วยเขียนให้หน่อยได้ไหมครับ',phonetic:'chûuai khǐian hâi nàawy dâai mǎi khráp',english:'Could you write it down for me?'}]},
  {id:'abs-beg-s1-19',num:19,title:'Do You Know the Proper Way to Do Business in Thailand?',situation:'At a business meeting.',coreConceptIds:['conjunction_waa'],keyPattern:{thai:'verb + ว่า + clause',phonetic:'verb + wâa + clause',english:'verb that clause'},teacherExplanation:'ว่า connects a thinking or knowing verb to what was thought or said. ผมคิดว่า means I think that.',examples:[{thai:'ผมคิดว่าดีครับ',phonetic:'phǒm khít wâa dii khráp',english:'I think it is good.'},{thai:'ผมรู้ว่าเขาอยู่ที่ไหนครับ',phonetic:'phǒm rúu wâa khǎo yùu thîi-nǎi khráp',english:'I know where he is.'}],practicePrompts:[{prompt:'Say you think it is good',thai:'ผมคิดว่าดีครับ',phonetic:'phǒm khít wâa dii khráp',english:'I think it is good.'}]},
  {id:'abs-beg-s1-20',num:20,title:"We're in for One Busy Day in Thailand",situation:'At work, introducing people.',coreConceptIds:['to_be_khuue'],keyPattern:{thai:'นี่คือ + noun + ครับ',phonetic:'nîi khuue + noun + khráp',english:'This is noun.'},teacherExplanation:'คือ is another verb meaning to be — used for definitions and introductions. นี่คือ means this is.',examples:[{thai:'นี่คือเลขาฯของผมครับ',phonetic:'nîi khuue lee-khǎa khǎawng phǒm khráp',english:'This is my assistant.'},{thai:'นั่นคืออะไรครับ',phonetic:'nân khuue à-rai khráp',english:'What is that?'}],practicePrompts:[{prompt:'Introduce your assistant',thai:'นี่คือเลขาฯของผมครับ',phonetic:'nîi khuue lee-khǎa khǎawng phǒm khráp',english:'This is my assistant.'}]},

// ── SRS Logic ────────────────────────────────────────────────────────────────
const APP_VERSION = (() => { try { return document.querySelector('meta[name="app-version"]')?.content || 'v78' } catch { return 'v93' } })()

const EASE = { easy: 2.5, ok: 1.3, hard: 0.6 }
function calcInterval(cur, rating) {
  return Math.min(Math.round(Math.max(cur, 1) * (EASE[rating] || 1.3) * 1.5), 365)
}
function applyRating(word, rating) {
  const today = new Date().toISOString().slice(0, 10)
  const newInt = calcInterval(word.interval || 0, rating)
  const d = new Date(); d.setDate(d.getDate() + newInt)
  let { status, lapses = 0 } = word
  if (rating === 'hard') { if (status === 'known') { status = 'lapsed'; lapses++ } else status = 'learning' }
  else status = (rating === 'easy' && newInt >= 14) ? 'known' : 'learning'
  if (word.status === 'new') status = 'learning'
  return { ...word, interval: newInt, lastSeen: today, dueDate: d.toISOString().slice(0, 10), repCount: (word.repCount || 0) + 1, lapses, status, difficulty: rating }
}

function markWordKnown(word) {
  const today = new Date().toISOString().slice(0, 10)
  const d = new Date(); d.setDate(d.getDate() + 30)
  return { ...word, status: 'known', interval: 30, dueDate: d.toISOString().slice(0, 10), lastSeen: today, difficulty: 'easy' }
}

// ── Storage ───────────────────────────────────────────────────────────────────
async function stGet(key) {
  try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null } catch {}
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : null } catch {}
  return null
}
async function stSet(key, val) {
  try { await window.storage.set(key, JSON.stringify(val)) } catch {}
  try { localStorage.setItem(key, JSON.stringify(val)) } catch {}
}

// ── Vocab Helpers ─────────────────────────────────────────────────────────────
function initVocab() {
  return RAW_VOCAB.map((d, idx) => {
    const l = d.l
    let status = 'new', interval = 0, dueDate = null
    if (l === 'easy') {
      status = 'known'; interval = d.i || 24
      const dd = new Date(); dd.setDate(dd.getDate() + Math.floor(Math.random() * 7))
      dueDate = dd.toISOString().slice(0, 10)
    } else if (l === 'ok') {
      status = 'learning'; interval = d.i || 4
      const dd = new Date(); dd.setDate(dd.getDate() + Math.floor(Math.random() * 3))
      dueDate = dd.toISOString().slice(0, 10)
    }
    return { id: idx + 1, thai: d.t, english: d.e, phonetic: d.ph || null, status, difficulty: l, interval, lastSeen: null, dueDate, repCount: d.r || 0, lapses: d.lp || 0 }
  })
}

function getStats(vocab) {
  const today = new Date().toISOString().slice(0, 10)
  return {
    total: vocab.length,
    due: vocab.filter(w => w.status !== 'new' && w.dueDate && w.dueDate <= today).length,
    newW: vocab.filter(w => w.status === 'new').length,
    learning: vocab.filter(w => w.status === 'learning').length,
    known: vocab.filter(w => w.status === 'known').length,
  }
}

function pickWords(vocab, mode) {
  const today = new Date().toISOString().slice(0, 10)
  let targets
  if (mode === 'weak') {
    targets = vocab.filter(w => w.difficulty === 'hard' || w.status === 'lapsed' || w.lapses >= 2).slice(0, 30)
    if (!targets.length) targets = vocab.filter(w => w.status === 'learning').slice(0, 30)
  } else {
    const due = vocab.filter(w => w.status !== 'new' && w.dueDate && w.dueDate <= today).slice(0, 22)
    const newW = vocab.filter(w => w.status === 'new').slice(0, 9)
    targets = [...due, ...newW].slice(0, 30)
  }
  const targetIds = new Set(targets.map(w => w.id))
  const anchors = vocab
    .filter(w => (w.status === 'known' || w.status === 'learning') && !targetIds.has(w.id))
    .sort((a, b) => (!a.lastSeen ? -1 : !b.lastSeen ? 1 : a.lastSeen.localeCompare(b.lastSeen)))
    .slice(0, 25)
  // ── Repair and validate targets before generation ─────────────────────────
  const PURE_PARTICLES = new Set(['ก็','ที่','ของ','กับ','ว่า','แต่','หรือ','และ','เพราะ','แล้ว','ด้วย','นะ','ก็ได้'])
  const TOO_COMMON = new Set(['มี','ไป','มา','ผม','ฉัน','คุณ','เรา','เขา','เธอ','ไม่','ได้','จะ','เป็น','ทำ','รู้'])
  // Hard repairs: known broken entries
  const REPAIRS = {
    'เจ้า': { thai: 'เจ้าของ', english: 'owner', phonetic: 'jâo-khɔ̌ɔng' },
    'เจ้า ...': { thai: 'เจ้าของ', english: 'owner', phonetic: 'jâo-khɔ̌ɔng' },
    'ถนนคนเดิน ...': { thai: 'ถนนคนเดิน', english: 'walking street', phonetic: 'thà-nǒn-khon-dəən' },
  }
  targets = targets
    .map(t => {
      // Repair known broken entries
      if (REPAIRS[t.thai]) return { ...t, ...REPAIRS[t.thai] }
      // Strip trailing "..." or "…" from thai and english
      if (t.thai.includes('...') || t.thai.includes('…')) {
        return { ...t, thai: t.thai.replace(/\.{2,}|…/g,'').trim(), english: t.english.replace(/\.{2,}|…/g,'').trim() }
      }
      return t
    })
    .filter(t => {
      if (!t.thai || t.thai.length < 2) return false
      if (PURE_PARTICLES.has(t.thai)) return false
      if (TOO_COMMON.has(t.thai)) return false
      // Skip if target IS a full sentence (contains spaces AND has a verb particle pattern)
      // Full sentences like "คุณเป็นคนตลก" should be kept but flagged as phrase type
      return true
    })
  // Tag full-sentence targets so generator knows not to treat them as nouns
  targets = targets.map(t => {
    const isFull = t.thai.includes('คุณ') || t.thai.includes('ผม') || t.thai.includes('เขา')
    if (isFull && t.thai.split(' ').length > 1) return { ...t, _phraseType: 'full_sentence' }
    return t
  })
  // Shuffle to avoid same words always first/last
  for (let i = targets.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [targets[i], targets[j]] = [targets[j], targets[i]]
  }
  return { targets, anchors }
}

// ── Pimsleur Track Generator (local, no API) ──────────────────────────────────
// Generates ~90 challenge-response pairs using full Thai sentences.
// Each target word appears 3x at spaced intervals (intro → mid review → late review).
// Anchor words fill gaps with 1-2 sentence reviews.

function shuffle(arr) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] }
  return a
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)] }

// Each frame returns { prompt, thai, english }
// Thai answer is always a complete sentence (subject + verb + object + particle)
const FRAMES = [
  // "I want / would like"
  w => ({ prompt: `Tell someone you want ${w.english}`, thai: `ผมอยากได้${w.thai}ครับ`, english: `I'd like some ${w.english}` }),
  w => ({ prompt: `Say you really want to ${w.english}`, thai: `ผมอยาก${w.thai}มากครับ`, english: `I really want to ${w.english}` }),
  // "I like / don't like"
  w => ({ prompt: `Tell your friend you like ${w.english}`, thai: `ผมชอบ${w.thai}มากเลยครับ`, english: `I really like ${w.english}` }),
  w => ({ prompt: `Say you don't like ${w.english}`, thai: `ผมไม่ชอบ${w.thai}เลยครับ`, english: `I don't like ${w.english} at all` }),
  // "I have / don't have"
  w => ({ prompt: `Say you have ${w.english}`, thai: `ผมมี${w.thai}อยู่ครับ`, english: `I have ${w.english}` }),
  w => ({ prompt: `Say you don't have ${w.english}`, thai: `ผมไม่มี${w.thai}เลยครับ`, english: `I don't have any ${w.english}` }),
  // "I'm going to / just did"
  w => ({ prompt: `Tell someone you're about to ${w.english}`, thai: `ผมจะ${w.thai}แล้วครับ`, english: `I'm about to ${w.english}` }),
  w => ({ prompt: `Say you just ${w.english}`, thai: `ผมเพิ่ง${w.thai}มาเมื่อกี้ครับ`, english: `I just ${w.english} a moment ago` }),
  // "I need / must"
  w => ({ prompt: `Say you need ${w.english}`, thai: `ผมต้องการ${w.thai}ครับ`, english: `I need ${w.english}` }),
  w => ({ prompt: `Say you have to ${w.english}`, thai: `ผมต้อง${w.thai}ก่อนครับ`, english: `I have to ${w.english} first` }),
  // Questions
  w => ({ prompt: `Ask if they have ${w.english}`, thai: `มี${w.thai}ไหมครับ`, english: `Do you have ${w.english}?` }),
  w => ({ prompt: `Ask if you can ${w.english}`, thai: `ผม${w.thai}ได้ไหมครับ`, english: `Can I ${w.english}?` }),
  w => ({ prompt: `Ask how much the ${w.english} is`, thai: `${w.thai}นี้ราคาเท่าไหร่ครับ`, english: `How much is this ${w.english}?` }),
  // Describing / commenting
  w => ({ prompt: `Say this ${w.english} is very good`, thai: `${w.thai}นี้ดีมากเลยครับ`, english: `This ${w.english} is very good` }),
  w => ({ prompt: `Tell them the ${w.english} looks great`, thai: `${w.thai}นี้ดูดีมากครับ`, english: `This ${w.english} looks really good` }),
  w => ({ prompt: `Say the ${w.english} is too expensive`, thai: `${w.thai}นี้แพงเกินไปครับ`, english: `This ${w.english} is too expensive` }),
  // "Someone said / I think"
  w => ({ prompt: `Say you think ${w.english} is good`, thai: `ผมคิดว่า${w.thai}นี้ดีครับ`, english: `I think this ${w.english} is good` }),
  w => ({ prompt: `Tell them you heard about ${w.english}`, thai: `ผมได้ยินเรื่อง${w.thai}มาครับ`, english: `I heard about ${w.english}` }),
  // Currently doing / haven't yet
  w => ({ prompt: `Say you're currently ${w.english}ing`, thai: `ตอนนี้ผมกำลัง${w.thai}อยู่ครับ`, english: `I'm currently ${w.english}ing` }),
  w => ({ prompt: `Say you haven't ${w.english}ed yet`, thai: `ผมยังไม่ได้${w.thai}เลยครับ`, english: `I haven't ${w.english}ed yet` }),
]

// Reverse frames: Thai prompt → student recalls meaning / responds
const REV_FRAMES = [
  w => ({ prompt: `You hear: "${w.thai}" — what does this mean and how do you respond?`, thai: `${w.thai}`, english: `${w.english}` }),
  w => ({ prompt: `Respond to: "${w.thai}"`, thai: `${w.thai}`, english: `(means: ${w.english})` }),
]

function makePair(w, framePool) {
  const f = pick(framePool)(w)
  return { ...f, wordId: w.id }
}

function generatePairsLocal(targets, anchors) {
  // Target words get 3 appearances each: intro (early), review (middle), recall (late)
  // Anchors fill the gaps — 1-2 appearances each

  const TOTAL = 90  // ~45 min at ~30 sec per pair
  const targetSlots = targets.length * 3  // 3 reps per target word
  const anchorCount = Math.max(0, TOTAL - targetSlots)
  const anchorSample = shuffle(anchors).slice(0, Math.ceil(anchorCount / 1.5))

  // Build per-target triplets (intro, mid, late)
  const introGroup = targets.map(w => makePair(w, FRAMES.slice(0, 8)))   // want/like/have frames
  const midGroup   = targets.map(w => makePair(w, FRAMES.slice(6, 14)))  // need/question frames
  const lateGroup  = targets.map(w => makePair(w, FRAMES.slice(12, 20))) // describe/think frames

  // Build anchor review pairs (mix forward + some reverse)
  const anchorPairs = anchorSample.flatMap(w => {
    const fwd = makePair(w, FRAMES)
    return Math.random() < 0.3 ? [fwd, makePair(w, REV_FRAMES)] : [fwd]
  })

  // Weave everything into a 90-pair Pimsleur sequence:
  // [some anchors] → intro group → [anchors] → mid group → [anchors] → late group → [anchors]
  const anchorChunks = chunkArray(shuffle(anchorPairs), 4)
  const ac = i => anchorChunks[i] || []

  const track = [
    ...ac(0),
    ...shuffle(introGroup),
    ...ac(1),
    ...shuffle(midGroup),
    ...ac(2),
    ...shuffle(lateGroup),
    ...ac(3),
    ...ac(4),
  ].slice(0, TOTAL)

  return track
}

function chunkArray(arr, n) {
  const chunks = []
  for (let i = 0; i < arr.length; i += n) chunks.push(arr.slice(i, i + n))
  return chunks
}

async function askKru(msgs, ctx, apiKey) {
  const system = `You are Kru (ครู), a warm and knowledgeable Thai teacher.
Respond in English. Include Thai script + tone-marked romanization for examples.
Tone marks: mid=none, low=à, falling=â, high=á, rising=ǎ. Hyphens between syllables.
Keep answers focused and practical — 2-4 short paragraphs max.
${ctx ? `\nSTUDENT'S CURRENT LESSON:\n${ctx}` : ''}`
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(apiKey ? { 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' } : {}) },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 800, system, messages: msgs })
  })
  if (!res.ok) throw new Error(`API ${res.status}`)
  const data = await res.json()
  return data.content[0].text
}

function downloadTrack(track) {
  const keywords = track.keywords || []
  const pairs = track.pairs || []
  
  // Build readable text file
  const lines = []
  lines.push('THAI TEACHER — TRACK EXPORT')
  lines.push('=' .repeat(50))
  lines.push(`Date: ${track.date}`)
  lines.push(`Mode: ${track.mode || 'daily'}`)
  lines.push(`Pairs: ${pairs.length}`)
  lines.push(`Created: ${track.createdAt || ''}`)
  lines.push('')
  
  lines.push('TARGET WORDS (' + keywords.length + ')')
  lines.push('-'.repeat(30))
  keywords.forEach((k, i) => {
    lines.push(`${String(i+1).padStart(2,'0')}. ${k.thai}  [${k.phonetic || ''}]  —  ${k.english}`)
  })
  lines.push('')
  
  lines.push('TRACK PAIRS (' + pairs.length + ')')
  lines.push('-'.repeat(30))
  pairs.forEach((p, i) => {
    lines.push(`\n[${String(i+1).padStart(3,'0')}] ${p.prompt || ''}`)
    lines.push(`  TH: ${p.thai || ''}`)
    lines.push(`  PH: ${p.phonetic || ''}`)
    lines.push(`  EN: ${p.english || ''}`)
  })

  // Include conversation if present
  if (track.convo && track.convo.length) {
    lines.push('')
    lines.push('CONVERSATION (' + track.convo.length + ' lines)')
    lines.push('-'.repeat(30))
    track.convo.forEach(l => {
      lines.push(l.speaker + ': ' + l.thai)
      lines.push('   ' + l.phonetic)
      lines.push('   ' + l.english)
      lines.push('')
    })
  }

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = 'thai-track-' + track.date.replace(/ /g,'-') + '-' + (track.mode||'daily') + '.txt'
  document.body.appendChild(a)
  a.click()
  document.body.removeChild(a)
  URL.revokeObjectURL(url)
}

const BELT_RANKS = [
  { rank: 'Mukyu',   minWords: 0,    color: '#6b7280', belt: '#4b5563', label: 'No Belt' },
  { rank: '10th Kyu', minWords: 100,  color: '#f3f4f6', belt: '#e5e7eb', label: 'White' },

  { rank: '3rd Kyu',  minWords: 2000, color: '#22c55e', belt: '#16a34a', label: 'Green' },
  { rank: '2nd Kyu',  minWords: 3000, color: '#92400e', belt: '#78350f', label: 'Brown' },
  { rank: '1st Kyu',  minWords: 4000, color: '#92400e', belt: '#78350f', label: 'Brown' },
  { rank: 'Shodan',   minWords: 5000, color: '#d4a94a', belt: '#0b1120', label: 'Black' },
]

function calculateBeltRank(known) {
  let current = BELT_RANKS[0]
  let next = BELT_RANKS[1]
  for (let i = BELT_RANKS.length - 1; i >= 0; i--) {
    if (known >= BELT_RANKS[i].minWords) {
      current = BELT_RANKS[i]
      next = BELT_RANKS[i + 1] || null
      break
    }
  }
  const wordsToNext = next ? next.minWords - known : 0
  const rangeStart = current.minWords
  const rangeEnd = next ? next.minWords : current.minWords + 1000
  const progress = next ? Math.round(((known - rangeStart) / (rangeEnd - rangeStart)) * 100) : 100
  return { current, next, wordsToNext, progress, known }
}

function getSentenceLengthForVocab(vocab) {
  const known = (vocab||[]).filter(w => w.status === 'known').length
  const learning = (vocab||[]).filter(w => w.status === 'learning').length
  // Sentence length targets per belt rank
  let goalMin = 2, goalMax = 4, hardCeil = 4
  if      (known < 100)  { goalMin=2;  goalMax=4;  hardCeil=4  }  // Mukyu
  else if (known < 200)  { goalMin=5;  goalMax=6;  hardCeil=6  }  // 10th Kyu
  else if (known < 350)  { goalMin=6;  goalMax=7;  hardCeil=7  }  // 9th Kyu
  else if (known < 500)  { goalMin=7;  goalMax=8;  hardCeil=8  }  // 8th Kyu
  else if (known < 750)  { goalMin=8;  goalMax=9;  hardCeil=9  }  // 7th Kyu
  else if (known < 1000) { goalMin=9;  goalMax=10; hardCeil=10 }  // 6th Kyu
  else if (known < 1500) { goalMin=10; goalMax=11; hardCeil=11 }  // 5th Kyu
  else if (known < 2000) { goalMin=11; goalMax=12; hardCeil=12 }  // 4th Kyu
  else if (known < 3000) { goalMin=12; goalMax=13; hardCeil=13 }  // 3rd Kyu
  else if (known < 4000) { goalMin=13; goalMax=14; hardCeil=14 }  // 2nd Kyu
  else if (known < 5000) { goalMin=14; goalMax=15; hardCeil=15 }  // 1st Kyu
  else                   { goalMin=16; goalMax=20; hardCeil=25 }  // Shodan
  const learningPenalty = Math.min(learning, 3)
  const effectiveCeil = Math.max(goalMin + 1, hardCeil - learningPenalty)
  return { goalMin, goalMax, hardCeil, effectiveCeil, known }
}

function validatePairs(pairs, vocab) {
  const ALWAYS_ALLOWED = new Set([
    'ครับ','ค่ะ','คะ','นะ','เลย','มาก','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่',
    'หรือ','ว่า','ถ้า','ก่อน','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก',
    'ที่นี่','ตอนนี้','วันนี้','นี้','นั้น','เพราะ','หลัง','แล้วก็','ให้','กัน','เอง','ๆ','ไหม','ใช่','แค่',
    'ตาม','อย่าง','พอ','แบบ','ต้อง','อยาก','ทุก','บาง','เคย','เพิ่ง','กำลัง','ต่อ','เอา','ใส่','ออก',
    'เข้า','ขึ้น','ลง','ถึง','ผ่าน','แล้วก็','ก็คือ','นั่น','นี่','นั้น','ซึ่ง','เมื่อ','ตั้งแต่','จน','พร้อม',
    'แม้','ทั้ง','ทำให้','ทำให้','ต้องการ','สามารถ','เพื่อ','โดย','ระหว่าง','หลังจาก','ก่อนที่','เวลา',
    'ผม','ฉัน','คุณ','เขา','เธอ','เรา','พวกเขา','มัน','ท่าน'
  ])
  const vocabSet = new Set(vocab.map(w => w.thai))
  const allAllowed = new Set([...ALWAYS_ALLOWED, ...vocabSet])
  // Sort by length descending for greedy matching
  const allAllowedArr = [...allAllowed].sort((a, b) => b.length - a.length)

  function coverSentence(thai) {
    // Greedy: try to cover all Thai characters using known words
    let remaining = thai
    // Remove non-Thai chars (spaces, punctuation)
    remaining = remaining.replace(/[^ก-๙]/g, '')
    if (!remaining) return true
    // Try to consume from left using longest match first
    let attempts = 0
    while (remaining.length > 0 && attempts < 200) {
      attempts++
      const matched = allAllowedArr.find(w => remaining.startsWith(w))
      if (matched) {
        remaining = remaining.slice(matched.length)
      } else {
        // Can't match first char — unknown word
        // Allow up to 2 unmatched chars (tone markers, special chars)
        remaining = remaining.slice(1)
        // If we still have 3+ unmatched chars in a row, it's unknown
        const nextMatch = allAllowedArr.find(w => remaining.startsWith(w))
        if (!nextMatch && remaining.length >= 3) return false
      }
    }
    return remaining.length <= 2
  }

  return pairs.filter(p => {
    if (!p.thai) return false
    return coverSentence(p.thai)
  })
}

function parsePartialArray(str) {
  try { return JSON.parse(str) } catch {}
  const pairs = []
  let depth = 0, start = -1
  for (let i = 0; i < str.length; i++) {
    const c = str[i]
    if (c === '{') { if (depth === 0) start = i; depth++ }
    else if (c === '}') {
      depth--
      if (depth === 0 && start !== -1) {
        try {
          const obj = JSON.parse(str.slice(start, i + 1))
          if (obj.prompt && obj.thai) pairs.push(obj)
        } catch {}
        start = -1
      }
    }
  }
  return pairs
}

function checkBatchQuality(pairs, batchTargets, existingThais) {
  const issues = []
  const missing = batchTargets.filter(t => pairs.filter(p => p.thai && p.thai.includes(t.thai)).length < 3)
  if (missing.length) issues.push({ type:'missing', words: missing })
  const seen = new Set(); const dupes = []
  for (const p of pairs) { if (!p.thai) continue; if (seen.has(p.thai) || existingThais.has(p.thai)) dupes.push(p.thai); seen.add(p.thai) }
  if (dupes.length) issues.push({ type:'dupes', sentences: dupes })

}

function classifyWord(target) {
  const eng = (target.english || '').toLowerCase().trim()
  const thai = target.thai || ''

  // Corrupted entries
  if (thai.includes('...') || thai.includes('…') || eng.includes('...'))
    return 'corrupted'

  // Grammar/connector words
  if (thai === 'ซึ่ง' || eng === 'which' || eng === 'that (rel)') return 'connector_rel'
  if (thai === 'เกี่ยวกับ' || eng === 'about' || eng === 'regarding') return 'connector_about'
  if (['because','so','therefore'].includes(eng)) return 'connector_because'
  if (['but','however'].includes(eng)) return 'connector_but'
  if (['if','when','although'].includes(eng)) return 'connector_if'
  if (thai === 'เหมือน' || ['similar to','like','same as'].some(w => eng.includes(w))) return 'connector_like'

  // Degree/extent words
  if (['the most','most','best','worst'].some(w => eng.includes(w)) || thai === 'ที่สุด') return 'degree_super'
  if (['very','a lot','too much','too','too many'].some(w => eng === w || eng.startsWith(w + ' '))) return 'degree_modifier'
  if (thai === 'ขนาดนั้น' || thai === 'ขนาดนี้' || ['that much','this much','to that extent'].some(w => eng.includes(w))) return 'degree_extent'
  if (['more than','less than','fewer'].some(w => eng.includes(w))) return 'degree_compare'

  // Question words — must never be used as objects
  if (thai === 'เมื่อไหร่' || eng === 'when') return 'question_when'
  if (['who','whom'].includes(eng)) return 'question_who'
  if (['where','which place'].includes(eng)) return 'question_where'
  if (['what','which thing'].includes(eng)) return 'question_what'
  if (eng === 'why') return 'question_why'
  if (eng === 'how') return 'question_how'
  if (['how many','how much'].some(w => eng.startsWith(w))) return 'question_howmany'

  // Full sentence phrase targets
  if (target._phraseType === 'full_sentence') return 'full_sentence'

  // Quantifiers — must attach to noun, never standalone
  if (['every','all of','each','any','some','both','several','whole'].some(w => eng === w || eng.startsWith(w+' ')) ||
      ['ทุก','บาง','แต่ละ','ทั้งหมด','ทั้ง','หลาย'].includes(thai)) return 'quantifier'

  // Quantity phrases — classifier expressions
  if (/^(one|two|three|four|five|\d+) (plate|cup|glass|piece|item|portion|bottle|bowl|bag)/.test(eng) ||
      /^[หนึ่งสองสามสี่ห้า]+(จาน|แก้ว|ชิ้น|ที่|ขวด|ถ้วย|กล่อง)/.test(thai)) return 'quantity_phrase'

  // Verb phrases — cannot be used as nouns
  if (['come from','go out','go eat','pick up','arrive','work out','exercise'].some(w => eng === w) ||
      ['มาจาก','ไปเที่ยว','แวะรับ','มาถึง','ออกกำลังกาย','ไปกิน','ไปซื้อ'].includes(thai)) return 'verb_phrase'

  // Action verbs that need objects — high risk, route to hardcoded banks
  if (['stop by','drop by','cruise','float','drift','offer (religious)','worship'].some(w => eng === w) ||
      ['แวะ','ล่อง','ถวาย','บูชา'].includes(thai)) return 'verb_phrase'

  // Specific verbs with hardcoded banks
  if (['hang up','hang up the phone'].some(w => eng.includes(w)) || thai === 'วางหู') return 'verb_phrase'
  if (['crash into','bump into','collide','hit'].some(w => eng === w) || thai === 'ชน') return 'verb_phrase'
  if (['keep aside','put aside','save for later','set aside','keep it'].some(w => eng.includes(w)) || thai === 'เอาไว้') return 'verb_phrase'
  if (eng === 'run' || thai === 'วิ่ง') return 'verb_intrans'

  // Sports/activity venues — place, never body_part
  if (['football field','soccer field','stadium','sports ground'].some(w => eng.includes(w)) ||
      ['สนามฟุตบอล','สนามกีฬา'].includes(thai)) return 'place'

  // Mythological beings — person class
  if (['naga','nāga','sacred serpent','dragon'].some(w => eng.includes(w)) || thai === 'พญานาค') return 'person'

  // Winding/curved — adjective
  if (['winding','curved','meandering','twisting'].some(w => eng.includes(w)) || thai === 'คดเคี้ยว') return 'adjective'

  // Fit/just right — adjective
  if (['just right','fit','fitting','exact fit','perfect fit'].some(w => eng.includes(w)) || thai === 'พอดี') return 'adjective'

  // All of/everything — quantifier
  if (['all of it','everything','all of that','that is all'].some(w => eng.includes(w)) || thai === 'ทั้งนั้น') return 'quantifier'

  // Abstract concepts AI consistently mishandles
  if (['aviation','feng shui','nature','culture','lifestyle','tradition','freedom','justice'].some(w => eng === w) ||
      ['การบิน','ฮวงจุ้ย','ธรรมชาติ','วัฒนธรรม','วิถีชีวิต','ประเพณี','อิสรภาพ'].includes(thai)) return 'abstract'

  // Downtown/city locations
  if (['downtown','city center','city centre'].some(w => eng.includes(w)) || thai === 'ตัวเมือง') return 'location'

  // Family — person class
  if (thai === 'ครอบครัว' || eng === 'family') return 'person'

  // Emotion words
  if (['excited','happy','sad','afraid','bored','fun','nervous','proud','surprised','worried','angry','lonely'].some(w => eng.includes(w)) ||
      ['ตื่นเต้น','ดีใจ','เสียใจ','กลัว','เบื่อ','สนุก','ภูมิใจ','ตกใจ','กังวล','โกรธ'].includes(thai)) return 'emotion'

  // Polite command / invitation words
  if (thai === 'เชิญ' || eng === 'please (invite)' || eng === 'please come in') return 'polite_command'

  // Condition/event/situation phrases
  if (thai === 'รถติด' || eng.includes('traffic')) return 'condition_traffic'
  if (eng.includes('raining') || eng.includes('rain') || thai === 'ฝนตก') return 'condition_rain'
  if (eng.includes('power out') || thai === 'ไฟดับ') return 'condition_event'
  if (eng.includes('crowded') || thai === 'คนเยอะ') return 'condition_event'
  if (eng.includes('sold out') || thai === 'ของหมด') return 'condition_event'
  if (eng.includes('closed') || thai === 'ร้านปิด') return 'condition_event'
  if (eng.includes('flooded') || thai.includes('น้ำท่วม')) return 'condition_event'

  // Rank/achievement
  if (['first place','second place','third place','first','champion'].some(w => eng.includes(w)) || thai.startsWith('ที่หนึ่ง') || thai.startsWith('ที่สอง')) return 'rank'

  // Time/day expressions
  const TIME_ENG = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday',
    'today','tomorrow','yesterday','morning','afternoon','evening','tonight','night',
    '.m.','oclock','noon','midnight','this week','next week','last week','this month']
  if (TIME_ENG.some(w => eng.includes(w))) return 'time'

  // Location/position
  const LOC = ['upstairs','downstairs','above','below','inside','outside','in front','behind',
    'nearby','alley','soi','corner','middle','here','there','left side','right side']
  if (LOC.some(w => eng.includes(w))) return 'location'

  // Abstract nouns
  const ABSTRACT = ['income','earnings','revenue','travel','journey','homework','education',
    'studying','health','happiness','problem','opportunity','experience','knowledge',
    'culture','lifestyle','tradition','freedom','success','time (concept)','information']
  if (ABSTRACT.some(w => eng.includes(w))) return 'abstract'

  // Personality/tendency
  if (['homebody','shy','lazy','hardworking','kind','addicted'].some(w => eng.includes(w))
    || thai.startsWith('ขี้') || thai.startsWith('ติด') || thai.startsWith('ใจ')) return 'personality'

  // Person/relationship
  const PERSON = ['sibling','brother','sister','parent','father','mother','friend','teacher',
    'doctor','nurse','driver','owner','customer','staff','officer','person','older person','younger']
  if (PERSON.some(w => eng.includes(w)) || ['พี่','น้อง','เพื่อน','แม่','พ่อ','ครู','หมอ','เจ้าของ','ลูกค้า'].includes(thai)) return 'person'

  // Body parts
  const BODY = ['head','eye','ear','nose','mouth','tooth','neck','shoulder','arm','hand',
    'finger','chest','stomach','back','waist','leg','knee','foot','toe','skin','hair']
  if (BODY.some(w => eng.includes(w))) return 'body'

  // Nature/weather
  const NATURE = ['wave','wind','sun','cloud','storm','sea','ocean','river','mountain',
    'sky','sand','beach (natural)','flood','fog','thunder']
  if (NATURE.some(w => eng.includes(w))) return 'nature'

  // Food/drink
  const FOOD = ['chicken','pork','beef','fish','rice','noodle','soup','curry','salad',
    'stir','fried','grilled','ketchup','sauce','coffee','tea','beer','water','juice',
    'milk','bread','egg','vegetable','fruit','dessert','red bull','energy drink','drink']
  if (FOOD.some(w => eng.includes(w))) return 'food'

  // Meal words
  if (['lunch','breakfast','dinner','meal'].some(w => eng.includes(w))) return 'meal'

  // Colour words
  if (eng.startsWith('colour') || eng.startsWith('color') || thai.startsWith('สี')) return 'colour'

  // Study materials
  if (['worksheet','homework','exam','exercise book','notebook','letter/character','sentence (study)'].some(w => eng.includes(w))) return 'study_material'

  // Place/shop
  const PLACE = ['station','market','shop','store','hotel','restaurant','hospital','school',
    'temple','road','street','airport','bank','park','laundry','coffee shop','pharmacy']
  if (PLACE.some(w => eng.includes(w))) return 'place'

  // Adjectives/states
  const ADJ = ['broken','ready','strong','hot','cold','expensive','cheap','fast','slow',
    'difficult','easy','tired','hungry','painful','clean','dirty','full','empty','busy',
    'safe','dangerous','loud','quiet','clear','cloudy','wet','dry','late','early','long','short',
    'fit','fitting','just right','perfect fit','exact','precise','appropriate']
  if (ADJ.some(w => eng.includes(w))) return 'adjective'

  // Verb/action words — transitive
  const TRANSITIVE_VERBS = ['reduce','increase','send','pick up','deliver','give','buy','sell',
    'repair','fix','wash','cook','order','pay','forget','remember','call','photo','record','help']
  if (TRANSITIVE_VERBS.some(w => eng.includes(w))) return 'verb_transitive'

  // Verb/action — intransitive/state
  const INTRANS = ['hurry','arrive','wait','travel','work','sleep','walk','run','swim',
    'meet (attend)','practise','compete','interview','train']
  if (INTRANS.some(w => eng.includes(w))) return 'verb_intrans'

  // Object nouns
  return 'object'
}

// Returns risk level for routing: 'high' | 'medium' | 'low'
function getRisk(type) {
  const HIGH = new Set([
    'corrupted','full_sentence',
    'connector_rel','connector_about','connector_because','connector_but','connector_if','connector_like',
    'degree_super','degree_modifier','degree_extent','degree_compare',
    'question_when','question_who','question_where','question_what','question_why','question_how','question_howmany',
    'quantifier','quantity_phrase','verb_phrase',
    'polite_command','condition_traffic','condition_rain','condition_event','rank',
  ])
  const MEDIUM = new Set([
    'adjective','emotion','personality','body','nature','abstract','verb_transitive','verb_intrans',
    'location','person','colour','study_material',
  ])
  if (HIGH.has(type)) return 'high'
  if (MEDIUM.has(type)) return 'medium'
  return 'low'
}

function getCompatibleConceptsForTarget(target) {
  const type = classifyWord(target)
  return (typeof CONCEPT_CARDS !== 'undefined' ? CONCEPT_CARDS : []).filter(c => {
    if (c.bannedClasses && c.bannedClasses.some(b => type.includes(b) || b === type)) return false
    if (c.allowedClasses && c.allowedClasses.length > 0) {
      return c.allowedClasses.some(a => type.includes(a) || a === type ||
        // fuzzy match: object~noun, food~meal, place~location, verb~verb_intrans
        (a === 'noun' && ['object','food','drink','meal','ticket_document','clothing'].includes(type)) ||
        (a === 'place' && ['location','shop'].includes(type)) ||
        (a === 'verb' && ['verb_intrans','verb_transitive','verb_phrase'].includes(type)) ||
        (a === 'object' && type === 'normal') ||
        (a === 'activity' && ['verb_intrans','place'].includes(type))
      )
    }
    return true
  })
}

function selectConceptFrame(target, concepts) {
  if (!concepts || concepts.length === 0) return null
  const type = classifyWord(target)
  // Priority: price → where → how_long → what_time → have → want → can
  const priority = ['price_rao_khai','where_is_yuu_thinai','how_long_naan','what_time_gii_moong',
    'have_mii','want_to_yak','can_you_daai_mai','how_is_bpen_yangrai','not_yet_yang_mai',
    'request_item_kho','classifiers_basic']
  for (const id of priority) {
    const c = concepts.find(x => x.id === id)
    if (c && c.generatorFrames && c.generatorFrames.length > 0) {
      const frame = c.generatorFrames[0]
      return { concept: c, frame }
    }
  }
  const c = concepts[0]
  return c.generatorFrames && c.generatorFrames.length > 0
    ? { concept: c, frame: c.generatorFrames[0] }
    : null
}

function buildConceptPairs(target, conceptFrame) {
  const tw = target.thai
  const eng = target.english
  const ph = target.phonetic || ''
  const { concept, frame } = conceptFrame

  // Build 3 pairs using the concept's good examples as templates, substituting target
  const frames = concept.generatorFrames || []
  const pairs = []

  // Pattern 1: statement (ครับ)
  const f0 = (frames[0] || '{target}ครับ').replace('{target}', tw)
  const f1 = (frames[1] || frames[0] || '{target}ครับ').replace('{target}', tw)
  const f2 = (frames[2] || frames[0] || '{target}ครับ').replace('{target}', tw)

  // Use good examples as models, sub in target
  const ex = concept.goodExamples || []
  const model = ex[0] || { thai: tw + 'ครับ', phonetic: ph + ' khrâp', english: eng + '.' }

  pairs.push({
    prompt: 'Say: ' + eng,
    thai: f0.includes('ครับ') || f0.includes('คะ') ? f0 : f0 + 'ครับ',
    english: eng + '.',
    phonetic: ph + ' khrâp',
    words: [{p: ph, e: eng}, {p: 'khrâp', e: '[polite]'}],
    target_phonetic: ph,
    _source: 'concept:' + concept.id,
  })
  pairs.push({
    prompt: 'Ask: ' + eng + '?',
    thai: f1.includes('คะ') || f1.includes('ไหม') ? f1 : f1.replace('ครับ','').replace('คะ','') + 'ไหมคะ',
    english: eng + '?',
    phonetic: ph + ' mǎi khá',
    words: [{p: ph, e: eng}, {p: 'mǎi', e: '?'}, {p: 'khá', e: '[polite]'}],
    target_phonetic: ph,
    _source: 'concept:' + concept.id,
  })
  pairs.push({
    prompt: 'Negative: ' + eng,
    thai: 'ไม่ได้' + tw + 'ครับ',
    english: "I didn't " + eng + '.',
    phonetic: 'mâi-dâi ' + ph + ' khrâp',
    words: [{p: 'mâi-dâi', e: "didn't"}, {p: ph, e: eng}, {p: 'khrâp', e: '[polite]'}],
    target_phonetic: ph,
    _source: 'concept:' + concept.id,
  })

  return pairs.filter(p => p.thai && p.thai.includes(tw))
}

    body: { hint: 'BODY PART ('+thai+'): pain/condition. '+thai+'ผมเจ็บครับ, ปวด'+thai+'ครับ. NEVER: ไม่มี'+thai+' (silly), เห็น'+thai+' (weird).' },
    nature: { hint: 'NATURE WORD ('+thai+'): state/event. '+thai+'แรงครับ, '+thai+'สวยครับ. NEVER: มี'+thai+', ผมไป'+thai+', '+thai+'สบายดี (สบายดี is for people).' },
    food: { hint: 'FOOD/DRINK ('+thai+'): กิน/ดื่ม/สั่ง. อยากกิน'+thai+'ครับ, สั่ง'+thai+'ได้ไหมคะ, เพิ่งกิน'+thai+'ครับ. NEVER: จะไป'+thai+' (add กิน: จะไปกิน), อยาก'+thai+' alone (add กิน/ดื่ม).' },
    meal: { hint: 'MEAL WORD ('+thai+'): กิน/สั่ง/หรือยัง. กิน'+thai+'แล้วหรือยังคะ, ผมจะไปกิน'+thai+'ครับ. NEVER: ไป'+thai+' without กิน, เห็น'+thai+'.' },
    colour: { hint: 'COLOUR ('+thai+'): describe objects or state preference. [noun]+'+thai+'ครับ, ชอบ'+thai+'ครับ. NEVER: เห็น'+thai+' without naming an object.' },
    study_material: { hint: 'STUDY MATERIAL ('+thai+'): use ทำ/อ่าน/เขียนใน/ส่ง. ทำ'+thai+'ครับ, ส่ง'+thai+'แล้วหรือยังคะ. NEVER: เขียน'+thai+' (say เขียนใน'+thai+'), เห็น'+thai+'.' },
    place: { hint: 'PLACE ('+thai+'): use location/movement. '+thai+'อยู่ที่ไหนครับ, อยู่ใกล้'+thai+'ไหมคะ, ผมไปที่'+thai+'แล้วครับ. Use ที่ with ไป.' },
    adjective: { hint: 'ADJECTIVE ('+thai+'): must describe a subject. [subject]+'+thai+'ครับ, [noun]นี้'+thai+'ครับ. NEVER: เห็น'+thai+', มี'+thai+' as object. No subject = no sentence.' },
    verb_transitive: { hint: 'TRANSITIVE VERB ('+thai+'): needs an object. Add one from the word list. ลดราคาครับ not just ลดครับ. NEVER: เห็น+verb.' },
    verb_intrans: { hint: 'VERB ('+thai+'): action/state. ผมจะ'+thai+'ครับ, '+thai+'ได้ไหมคะ. If needs object, add one.' },
    object: { hint: 'OBJECT NOUN ('+thai+'): real-life use. ขอ'+thai+'หน่อยครับ, ลืม'+thai+'ครับ, ไม่มี'+thai+'ครับ. At least one sentence shows practical use.' },
  }

  return { type, ...(HINTS[type] || { hint: 'Write natural sentences where "'+eng+'" makes real-world sense.' }) }
}


function buildMicroPrompt(target, anchors, vocab, promptType1, promptType2, promptType3, existingThais, pairOffset, wordType) {
  const PARTICLES = ['ครับ','ค่ะ','คะ','นะ','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่',
    'หรือ','ว่า','ถ้า','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก',
    'ผม','ฉัน','คุณ','เรา','เขา','เธอ','ที่นี่','ตอนนี้','วันนี้','นี้','นั้น','เพราะ','ให้','กัน','เอง','ไหม','ก็ได้']
  const anchorLines = anchors.slice(0,8).map(w => w.thai + '=' + w.english).join(' | ')
  const existingList = [...existingThais].slice(-4).join(' | ')
  const { goalMin: gMin, goalMax: gMax, effectiveCeil: eCeil } = getSentenceLengthForVocab(vocab)
  const promptCap = Math.max(6, eCeil + 3)

  const tw = target.thai
  const eng = target.english
  const ph = target.phonetic || ''
  const wType = wordType || classifyWord(target)
  const risk = getRisk(wType)
  const { hint } = getWordTypeHint(target)

  // ── TIER 2: Medium-risk — locked frame, AI fills content ─────────────────
  if (risk === 'medium') {
    const FRAMES = {
      adjective: [
        'น้ำ'+tw+'ครับ (water is '+eng+')',
        'อาหาร'+tw+'ครับ (food is '+eng+')',
        'อากาศ'+tw+'ครับ (weather is '+eng+')',
        'มัน'+tw+'ครับ (it is '+eng+')',
      ],
      emotion: [
        'ผม'+tw+'ครับ (I am '+eng+')',
        'คุณ'+tw+'ไหมคะ (are you '+eng+'?)',
        'ผม'+tw+'มากครับ (I am very '+eng+')',
      ],
      body: [
        tw+'ผมเจ็บครับ (my '+eng+' hurts)',
        tw+'เจ็บไหมคะ (does your '+eng+' hurt?)',
        tw+'ผมดีขึ้นแล้วครับ (my '+eng+' is better)',
      ],
      nature: [
        tw+'แรงครับ (the '+eng+' is strong)',
        'วันนี้'+tw+'แรงไหมคะ (is the '+eng+' strong today?)',
        tw+'สวยครับ (the '+eng+' is beautiful)',
      ],
      abstract: [
        'ผมชอบ'+tw+'ครับ (I like '+eng+')',
        tw+'ดีไหมคะ (is the '+eng+' good?)',
        'ผมมี'+tw+'ครับ (I have '+eng+')',
      ],
      personality: [
        'ผมเป็นคน'+tw+'ครับ (I am a '+eng+' person)',
        'คุณเป็นคน'+tw+'ไหมคะ (are you '+eng+'?)',
        'ช่วงนี้ผม'+tw+'ครับ (lately I am '+eng+')',
      ],
      verb_transitive: [
        tw+'อะไรดีคะ (what should I '+eng+'?)',
        tw+'ได้ไหมคะ (can I '+eng+' it?)',
        tw+'แล้วครับ (I already '+eng+'d it)',
      ],
      verb_intrans: [
        'ผมจะ'+tw+'ครับ (I will '+eng+')',
        tw+'ได้ไหมคะ (can you '+eng+'?)',
        'ผม'+tw+'แล้วครับ (I already '+eng+'d)',
      ],
    }
    const frames = FRAMES[wType] || FRAMES.abstract
    return [
      'Complete these 3 Thai sentences. Each frame is fixed — only fill the blank if needed.',
      'Target: '+tw+' ('+eng+')'+( ph ? ', phonetic: '+ph : ''),
      '',
      'Frame 1 ('+promptType1+'): '+frames[0],
      'Frame 2 ('+promptType2+'): '+frames[1 % frames.length],
      'Frame 3 ('+promptType3+'): '+frames[2 % frames.length],
      '',
      'WORD CLASS: '+wType,
      hint,
      '',
      'RULES:',
      '- Write the complete Thai sentence based on the frame above',
      '- '+gMin+'–'+gMax+' Thai words (not counting ครับ/ค่ะ)',
      '- ONLY use: '+tw+' | '+anchorLines+' | grammar particles',
      '- Frame 1 ends ครับ, Frame 2 ends ค่ะ, Frame 3 ends ครับ',
      '- QUESTIONS end คะ not ค่ะ',
      '- Prompt must name the target concept in natural English (max '+promptCap+' words)',
      '- Thai must match English exactly',
      'Avoid repeating: '+(existingList || 'none yet'),
      '',
      'Return ONLY JSON array of 3:',
      '[{"prompt":"...","thai":"...","english":"...","phonetic":"tokens","words":[{"p":"...","e":"..."}],"target_phonetic":"'+ph+'"}]',
    ].join('\n')
  }

  // ── TIER 3: Low-risk — AI generates with class guidance ───────────────────
  return [
    'Write 3 Thai Pimsleur pairs. Target: '+tw+' ('+eng+')'+( ph ? ', phonetic: '+ph : ''),
    '',
    'WORD CLASS: '+wType+' ('+risk+' risk)',
    hint,
    (() => {
      const cc = (typeof getCompatibleConceptsForTarget !== 'undefined') ? getCompatibleConceptsForTarget(target) : []
      if (cc.length === 0) return ''
      const names = cc.slice(0,3).map(c => c.id).join(', ')
      const frames = cc[0]?.generatorFrames?.slice(0,2).join(' | ') || ''
      return 'APPROVED LESSON FRAMES: '+names+' → '+frames
    })(),
    '',
    'ABSOLUTE BANS (these produce nonsense — never generate):',
    '✗ ขอ+[word]+หน่อย unless word is a physical object, food, ticket, or document',
    '✗ ไม่มี+[word] unless word is a physical thing that can be absent',
    '✗ สบายดี for non-people/animals',
    '✗ [place/field]+ผมเจ็บ (only body parts can hurt)',
    '✗ ใคร+verb+ไหม — use ใคร+verb+คะ or มีใคร+verb+ไหมคะ',
    '✗ questions ending ค่ะ — questions use คะ, statements use ค่ะ',
    '✗ รู้+place/person — use รู้จัก',
    '✗ ไม่+verb translated as "never" — never uses ไม่เคย',
    '',
    'GENDER (no exceptions):',
    '- Learner = MALE: ผม+ครับ',
    '- Teacher question = FEMALE: ไหมคะ',
    '- Teacher statement = FEMALE: ค่ะ',
    '',
    'ALIGNMENT RULE: Write Thai first → derive prompt and English from it. All 3 must match exactly.',
    'Prompt must name the target word in natural English. Max '+promptCap+' words. No Thai script in prompt.',
    '',
    'Pair 1: '+promptType1+' using '+tw,
    'Pair 2: '+promptType2+' using '+tw+' differently',
    'Pair 3: '+promptType3+' using '+tw+' differently again',
    '',
    '- Sentence: '+gMin+'–'+gMax+' words (not counting ครับ/ค่ะ). Max '+eCeil+'.',
    '- ONLY: '+tw+' | '+anchorLines+' | particles',
    '- Pair 1 ends ครับ, Pair 2 ends ค่ะ, Pair 3 ends ครับ',
    'Avoid: '+(existingList || 'none'),
    '',
    'Return ONLY JSON array of 3:',
    '[{"prompt":"...","thai":"...","english":"...","phonetic":"...","words":[{"p":"...","e":"..."}],"target_phonetic":"'+ph+'"}]',
  ].join('\n')
}

    {prompt:'Say you already went',thai:'ไปแล้วครับ',english:'I already went.',phonetic:'pai lâeo khrâp',words:[{p:'pai',e:'go'},{p:'lâeo',e:'already'},{p:'khrâp',e:'[polite]'}],target_phonetic:ph},
  ]
}

function validatePair(pair, target, allAllowed, existingThais, wordType) {
  if (!pair || !pair.thai || !pair.prompt || !pair.english || !pair.phonetic) return false
  const th = pair.thai.trim()
  const en = pair.english.toLowerCase()
  const ph = pair.phonetic.toLowerCase()
  const pr = pair.prompt.toLowerCase()
  const tw = target.thai

  // Must contain target word
  if (!th.includes(tw)) return false
  // Must not be duplicate
  if (existingThais.has(th)) return false
  // Prompt must be complete
  if (pr.endsWith('...') || pr.length < 8) return false
  // Prompt must not contain Thai script
  if (/[ก-๙]/.test(pair.prompt)) return false
  // Phonetic must not contain Thai script
  if (/[ก-๙]/.test(ph)) return false
  // EN too long
  if (en.split(' ').length > 15) return false
  // Words array roughly matches phonetic
  const tokens = pair.phonetic.split(' ').filter(Boolean)
  if (pair.words && pair.words.length > 0 && Math.abs(pair.words.length - tokens.length) > 1) return false

  // ── TENSE ALIGNMENT ─────────────────────────────────────────────────────
  // "never" must use ไม่เคย, not ไม่
  if (en.includes('never') && !th.includes('ไม่เคย')) return false
  // "can" questions must use ได้ไหม not จะ+ไหม
  if ((en.endsWith('?') && en.includes('can ')) && th.includes('จะ') && !th.includes('ได้')) return false
  // "have you done" questions should not use bare ไหม
  // "already" needs แล้ว
  if (en.includes('already') && !th.includes('แล้ว')) return false
  // "not yet" needs ยังไม่ได้
  if (en.includes('not yet') && !th.includes('ยัง') && !th.includes('ไม่ได้')) return false

  // ── PROMPT/ANSWER ALIGNMENT ──────────────────────────────────────────────
  // Ask prompt → must have question marker in Thai
  if (pr.startsWith('ask') && !th.includes('ไหม') && !th.includes('หรือ') && !th.includes('เหรอ')
      && !th.includes('กี่') && !th.includes('ที่ไหน') && !th.includes('เมื่อไหร่')
      && !th.includes('ใคร') && !th.includes('อะไร') && !th.includes('ทำไม')) return false
  // Ask prompt → EN must be question
  if (pr.startsWith('ask') && !pair.english.trim().endsWith('?')) return false
  // Say/Tell prompt → EN must NOT be question
  if ((pr.startsWith('say') || pr.startsWith('tell')) && pair.english.trim().endsWith('?')) return false
  // "never" in prompt → ไม่เคย in Thai
  if (pr.includes('never') && !th.includes('ไม่เคย')) return false

  // ── CLASS-SPECIFIC BANNED PATTERNS ─────────────────────────────────────────
  // Never use ขอ+X+หน่อย unless X is a physical/requestable object (low risk)
  const wType = wordType || classifyWord(target)
  const risk = getRisk(wType)
  if (risk !== 'low') {
    if (th.startsWith('ขอ'+tw) || th.includes('ขอ'+tw+'หน่อย')) return false
    if (th.startsWith('ไม่มี'+tw) && risk === 'high') return false
    if (th.startsWith('มี'+tw+'ไหม') && risk === 'high') return false
  }
  // Hard block: ขอ+target+หน่อย only for physical requestable items
  if (!allowsRequestFrame(wType)) {
    if (th.includes('ขอ'+tw+'หน่อย') || (th.startsWith('ขอ'+tw) && th.includes('ครับ'))) return false
  }
  // Hard block: มี/ไม่มี/เห็น templates for high-risk words
  if (risk === 'high') {
    if (th.startsWith('ไม่มี'+tw+'ครับ')) return false
    if (th.startsWith('มี'+tw+'ไหม')) return false
    if (th.startsWith('เห็น'+tw+'ครับ') || th.startsWith('ผมเห็น'+tw)) return false
  }
  // Hard block: body-pain frame for non-body words
  if (wType !== 'body') {
    if (th.includes(tw+'ผมเจ็บ') || th.includes(tw+'เจ็บครับ')) return false
  }
    // ── HARD QA GATE ────────────────────────────────────────────────────────────
  // Generic filler — always reject
  const FILLER_SENTENCES = ['ผมชอบครับ','ดีไหมคะ','ไปแล้วครับ','ผมชอบค่ะ','ดีไหมค่ะ','ไม่มีครับ','ได้ไหมคะ','ผมชอบครับ']
  if (FILLER_SENTENCES.includes(th)) return false
  // Prompt must not say "using [word] differently" — template failure
  if (pr.includes(' using ') || pr.endsWith(' using') || pr.includes('differently')) return false
  // Target word MUST appear in Thai sentence
  if (!th.includes(tw)) return false
  // Prompt contains "using [word]" or "differently" = template failure
  if (/using .+ differently/.test(pr) || pr.includes(' using ') || pr.endsWith(' using')) return false
  // Questions must end คะ not ค่ะ (hard rule, no exceptions)
  const questionEndings = ['ไหมค่ะ','ที่ไหนค่ะ','เมื่อไหร่ค่ะ','ใครค่ะ','อะไรค่ะ','หรือเปล่าค่ะ','ยังค่ะ','หรือยังค่ะ']
  if (questionEndings.some(q => th.includes(q))) return false
  // Auto-fix: if thai has question marker but ends ค่ะ, reject
  const hasQuestion = th.includes('ไหม') || th.includes('หรือ') || th.includes('เหรอ') || /[ที่ไหนเมื่อไหร่ใครอะไรทำไม]/.test(th)
  if (hasQuestion && th.endsWith('ค่ะ')) return false
  // กี่ + ไหม together = broken question
  if (th.includes('กี่') && th.includes('ไหม')) return false
  // ขอ + time/verb phrase = nonsense
  if (th.startsWith('ขอเมื่อ') || th.startsWith('ขอวัน') || th.startsWith('ขอมา') || th.startsWith('ขอซึ่ง')) return false
  // ไม่มี + verb phrase = nonsense
  if (th.startsWith('ไม่มีมา') || th.startsWith('ไม่มีไป') || th.startsWith('ไม่มีซึ่ง')) return false
  // Incomplete relative clause (ซึ่ง at end or followed only by particle)
  if (th.includes('ซึ่งชอบ') || th.includes('ซึ่งอยู่') || th.includes('ซึ่งอยาก') || /ซึ่ง[ครับค่าคะนะ]/.test(th)) return false
  // Full sentence being used as noun  
  if (th.includes('ขอคุณเป็น') || th.includes('ไม่มีคุณเป็น') || th.includes('มีคุณเป็นคน')) return false
  // Quantifier used standalone
  if (/เอาทุก[ครับค่าคะ]/.test(th) || /มีทุก[ครับค่าคะ]/.test(th)) return false
  // Adjective used as destination/object (expanded)
  const ADJ_TARGETS = ['ใส','ช้า','ดึก','ตื่นเต้น','เผ็ด','แพง','ถูก','เหนื่อย','เบื่อ','สนุก','ดีใจ','เสียใจ','กลัว','พอดี']
  for (const adj of ADJ_TARGETS) {
    if (th === 'ผมไป'+adj+'ครับ' || th === 'ผมอยาก'+adj+'ครับ' || th === adj+'ผมเจ็บครับ') return false
    if (th.startsWith('ขอ'+adj) || th.startsWith('มี'+adj+'ไหม') || th.startsWith('ไม่มี'+adj)) return false
    if (en.includes('went to '+adj.toLowerCase()) || en.includes('want to '+adj.toLowerCase())) return false
  }
  // ซึ่ง incomplete clause — reject if ซึ่ง is not followed by subject+verb
  if (th.includes('ซึ่งชอบ') || th.includes('ซึ่งอยู่') || th.includes('ซึ่งอยาก') || th.includes('ซึ่งดี') || th.includes('ซึ่งอร่อย')) return false
  // เมื่อกี้ as object
  if (th.startsWith('ขอเมื่อกี้') || th.includes('มีเมื่อกี้') || th.includes('ไม่มีเมื่อกี้')) return false
  // ไม่เคย + เมื่อกี้ (logically contradictory)
  if (th.includes('ไม่เคย') && th.includes('เมื่อกี้')) return false
  // Double ได้ (จำได้ได้)
  if (th.includes('ได้ได้')) return false
  // รู้ + place/person without จัก (should be รู้จัก)
  const placePersonWords = ['เมืองไทย','กรุงเทพ','ร้าน','ตลาด','ซอย','ถนน','เพื่อน','พี่','น้อง']
  for (const w of placePersonWords) {
    if (th.includes('รู้'+w) && !th.includes('รู้จัก')) return false
  }
  // Food with เจอ/เห็น instead of กิน
  // (allow if really visual context, but flag as suspicious)
  const foodNouns = ['ผัดเปรี้ยว','คะน้า','ข้าวมันไก่','ต้มยำ','ข้าวผัด','ก๋วยเตี๋ยว','หมูปิ้ง']
  if (foodNouns.some(f => th.includes(f)) && (th.startsWith('เห็น') || th.startsWith('เจอ'))) return false

  // ── BANNED PATTERNS ──────────────────────────────────────────────────────
  const BANNED_PATTERNS = [
    // Nonsense combinations
    ['i see earnings',true], ['i see travel',true], ['i see traffic',true],
    ['i see which',true], ['i see when',true], ['i see above',true], ['i see upstairs',true],
    ['i see strong',true], ['i see ready',true],
    ['earnings hurt',true], ['earnings pain',true],
    ['left already soon',true], ['already left soon',true],
    ['i have above',true], ['i have downstairs',true], ['is there above',true],
    ['i see the most',true], ['i met the most',true],
    ['i see homebody',true],
    // Traffic as time/place
    ['free on traffic',true], ['go on traffic',true], ['free on raining',true],
    // Rank as location
    ['went to first place',true], ['went to second place',true],
    // Meal as destination
    ['go to lunch',true], ['go to breakfast',true], ['go to dinner',true],
    // Female pronoun + male particle
    ['ดิฉัน','ครับ'],
    // มัน with people
    // Check ไม่+verb mistranslated as never
  ]
  for (const [a, b] of BANNED_PATTERNS) {
    if (b === true && en.includes(a)) return false
    if (typeof b === 'string' && th.includes(a) && th.includes(b)) return false
  }

  return true
}

const TRIPLETS = [
    ['Say you like','Ask if you enjoy','Say you already tried'],
    ['Say you want to','Ask where you can find','Say you will'],
    ['Say you see','Ask if you have','Say you just saw'],
    ['Say it is','Ask when you can','Say you never'],
    ['Say you like','Ask how many','Say you don\'t have'],
    ['Tell a friend','Ask if you want to','Say you already'],
    ['Say you went to','Ask who has','Say you want to'],
    ['Say you know','Ask if it is','Say you already went'],
    ['Say you will go','Ask where','Say you just'],
    ['Tell someone to','Ask if you already','Say there is no'],
  ]

async function generateTrackWithQwen(targets, anchors, apiKey, onProgress, vocab, model) {
  const orModel = model || 'openai/gpt-4o-mini'
  const existingThais = new Set()
  let allPairs = []

  // Deprioritize overly common words as anchors — they appear naturally anyway
  const HIGH_FREQ = new Set(['มี','ไป','มา','ผม','ฉัน','คุณ','เขา','เธอ','เรา','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','เป็น'])
  anchors = anchors.filter(a => !HIGH_FREQ.has(a.thai))

  // Build full allowed set for validation
  const ALWAYS_ALLOWED_V = ['ครับ','ค่ะ','คะ','นะ','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่',
    'หรือ','ว่า','ถ้า','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก',
    'ผม','ฉัน','คุณ','เรา','เขา','เธอ','ที่นี่','ตอนนี้','วันนี้','นี้','นั้น','เพราะ','ให้','กัน','เอง',
    'ไหม','ก็ได้','เคย','อยาก','ต้อง','อาจจะ','กำลัง','เพิ่ง','อย่า',
    'วิว','คัน','เอกสาร','ซุป','ซ่อม','ศัพท์','อัน','ตั้ง','รู้สึก','ปวด','สวย','เล็ก','ใหญ่','เร็ว','ช้า']
  const allAllowed = new Set([...ALWAYS_ALLOWED_V, ...vocab.map(w=>w.thai)])

  const PROMPT_TYPES = [
    'Say','Ask if','Tell someone','Say you want to','Ask where',
    'Ask when','Say you have','Say you like','Ask how many','Say you don\'t',
    'Ask someone to','Say you already','Ask if someone has','Say it\'s','Tell a friend'
  ]

  for (let i = 0; i < targets.length; i++) {
    const target = targets[i]
    // Semantic affinity — pick anchors relevant to this target word's category
    const eng_lower = (target.english || '').toLowerCase()
    let localAnchors
    if (['curry','rice','soup','salad','noodle','chicken','pork','beef','fish','drink','beer','food'].some(f => eng_lower.includes(f))) {
      // Food words: prioritize food/eating anchors
      const foodAnchors = anchors.filter(a => ['กิน','ชอบ','อร่อย','สั่ง','ร้าน','ข้าว','น้ำ','เมนู'].some(w => a.thai.includes(w)))
      localAnchors = [...foodAnchors, ...anchors.filter(a => !foodAnchors.includes(a))].slice(0, 8)
    } else if (['station','market','shop','hotel','beach','temple','road','airport','bank'].some(f => eng_lower.includes(f))) {
      // Place words: prioritize movement anchors
      const placeAnchors = anchors.filter(a => ['ไป','มา','อยู่','ใกล้','ไกล','ถึง','จาก'].some(w => a.thai.includes(w)))
      localAnchors = [...placeAnchors, ...anchors.filter(a => !placeAnchors.includes(a))].slice(0, 8)
    } else if (['nose','ear','mouth','eye','hair','skin','arm','leg','tooth'].some(f => eng_lower.includes(f))) {
      // Body parts: prioritize body-related anchors
      const bodyAnchors = anchors.filter(a => ['ปวด','มี','เห็น','ล้าง','สวย','แข็งแรง'].some(w => a.thai.includes(w)))
      localAnchors = [...bodyAnchors, ...anchors.filter(a => !bodyAnchors.includes(a))].slice(0, 8)
    } else {
      const targetThais = new Set(targets.map(t => t.thai))
      const nonTargetAnchors = anchors.filter(a => !targetThais.has(a.thai))
      const anchorOffset = (i * 4) % Math.max(nonTargetAnchors.length - 8, 1)
      localAnchors = nonTargetAnchors.slice(anchorOffset, anchorOffset + 8)
    }

    // Each word gets a guaranteed triplet: statement + question + past/future
    const triplet = TRIPLETS[i % TRIPLETS.length]
    const t1 = triplet[0], t2 = triplet[1], t3 = triplet[2]

    const wordType = classifyWord(target)
    const risk = getRisk(wordType)
    let pairs = []

    // ── CONCEPT TIER: Use lesson concept frames when available ─────────────
    const compatConcepts = getCompatibleConceptsForTarget(target)
    const conceptFrame = risk === 'low' && compatConcepts.length > 0
      ? selectConceptFrame(target, compatConcepts) : null
    if (conceptFrame && !HARDCODED_FALLBACKS[target.thai]) {
      const cpairs = buildConceptPairs(target, conceptFrame)
      if (cpairs.length >= 2) {
        pairs = cpairs.slice(0, 3)
        console.log('[Concept] ' + target.thai + ' → ' + conceptFrame.concept.id)
      }
    }


    // ── TIER 1: High-risk words OR words with hardcoded banks ──────────────
    // Any word with a hardcoded bank should use it, regardless of risk level
    const hasHardcode = !!HARDCODED_FALLBACKS[target.thai]
    if (risk === 'high' || hasHardcode) {
      const bank = HARDCODED_FALLBACKS[target.thai]
      if (bank && bank.length > 0) {
        // Rotate through bank: pick 3 based on track offset
        const offset = (i + allPairs.length) % Math.max(bank.length - 2, 1)
        const rotated = [...bank.slice(offset), ...bank.slice(0, offset)]
        pairs = rotated.filter(p => !existingThais.has(p.thai)).slice(0, 3).map(p => ({...p, _source:'hardcoded:'+target.thai}))
        // Fill any remaining slots from start of bank
        if (pairs.length < 3) {
          for (const p of bank) {
            if (pairs.length >= 3) break
            if (!existingThais.has(p.thai) && !pairs.some(x => x.thai === p.thai)) pairs.push({...p, _source:'hardcoded:'+target.thai})
          }
        }
      } else {
        // No hardcoded bank — use type-aware fallback
        pairs = makeFallbackPairs(target).filter(p => !existingThais.has(p.thai)).slice(0, 3)
      }
    }

    // ── TIER 2+3: Medium/Low risk — AI generates inside class-approved frames ─
    if (risk !== 'high' || pairs.length < 3) {
      const prompt = buildMicroPrompt(target, localAnchors, vocab, t1, t2, t3, existingThais, allPairs.length, wordType)
      let attempts = 0
      while (attempts < 2 && pairs.length < 3) {
        try {
          const text = await callOpenRouterOnce(apiKey, orModel,
            [{ role:'user', content: prompt }], 2000)
          const parsed = parsePartialArray(text)
          const { effectiveCeil } = getSentenceLengthForVocab(vocab)
          const valid = parsed.filter(p => {
            if (!validatePair(p, target, allAllowed, existingThais, wordType)) return false
            const tokenCount = (p.phonetic||'').split(' ').filter(Boolean).length
            if (tokenCount > effectiveCeil + 1) return false
            return true
          })
          for (const p of valid) {
            if (pairs.length >= 3) break
            if (!existingThais.has(p.thai)) pairs.push(p)
          }
          if (pairs.length >= 3) break
        } catch(e) {}
        attempts++
      }

      // Use type-aware fallback for any still missing
      if (pairs.length < 3) {
        const fb = makeFallbackPairs(target)
        for (const f of fb) {
          if (pairs.length >= 3) break
          if (!existingThais.has(f.thai)) pairs.push(f)
        }
      }
    }

    // Dedup within this target group
    const seenInGroup = new Set()
    pairs = pairs.filter(p => { if(seenInGroup.has(p.thai)) return false; seenInGroup.add(p.thai); return true })

    for (const p of pairs) existingThais.add(p.thai)
    allPairs.push(...pairs.slice(0,3))
    onProgress && onProgress(allPairs.length, targets.length * 3, null)
  }

  // ── AUDIT: log what happened for each target ────────────────────────────────
  const audit = targets.map((t, i) => {
    const myPairs = allPairs.slice(i*3, i*3+3)
    const hasTarget = myPairs.every(p => p.thai && p.thai.includes(t.thai))
    return { thai: t.thai, count: myPairs.length, hasTarget, source: myPairs[0]?._source || 'unknown' }
  })
  const missing = audit.filter(a => a.count < 3 || !a.hasTarget)
  if (missing.length > 0) console.warn('[ThaiTeacher] Pair audit failures:', missing)

  // ── HARD ENFORCE: exactly targets.length * 3 pairs ──────────────────────────
  const targetCount = targets.length * 3
  // First pass: fix each target that's under 3 pairs
  for (let t of targets) {
    const tPairs = allPairs.filter(p => p.thai && p.thai.includes(t.thai))
    const need = 3 - tPairs.length
    if (need > 0) {
      const bank = HARDCODED_FALLBACKS[t.thai]
      const fb = bank && bank.length ? bank : makeFallbackPairs(t)
      const existingNow = new Set(allPairs.map(p => p.thai))
      for (const f of fb) {
        if (tPairs.length + allPairs.filter(p => p.thai === f.thai).length >= 3) break
        if (!existingNow.has(f.thai)) {
          allPairs.push({...f, _source:'repair:'+t.thai})
          existingNow.add(f.thai)
        }
      }
    }
  }
  // Second pass: remove duplicates within each target group
  const seen = new Set()
  allPairs = allPairs.filter(p => {
    if (seen.has(p.thai)) return false
    seen.add(p.thai)
    return true
  })
  // Report if still short
  if (allPairs.length < targetCount) {
    console.warn('[ThaiTeacher] Still short after repair: '+allPairs.length+'/'+targetCount)
  }
  onProgress && onProgress(allPairs.length, targetCount, null)
  return allPairs
}

async function generateConvoWithOpenRouter(targets, vocab, apiKey, model) {
  const { system, user } = buildConvoPrompt(targets, vocab)
  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}`, 'HTTP-Referer': 'https://magical-druid-656889.netlify.app', 'X-Title': 'Thai Teacher' },
    body: JSON.stringify({ model: model || 'openai/gpt-4o-mini', max_tokens: 4000, temperature: 0.4, stream: false,
      messages: [{ role: 'system', content: system }, { role: 'user', content: user }] })
  })
  if (!res.ok) throw new Error(`Convo error ${res.status}`)
  const data = await res.json()
  let text = (data.choices?.[0]?.message?.content || '').replace(/<think>[\s\S]*?<\/think>/g,'').trim().replace(/^```[\w]*[\r\n]?|[\r\n]?```$/g,'').trim()
  // Extract JSON even if model added preamble text
  const jsonStart = text.indexOf('{')
  const jsonEnd = text.lastIndexOf('}')
  if (jsonStart >= 0 && jsonEnd > jsonStart) text = text.slice(jsonStart, jsonEnd + 1)
  const parsed = JSON.parse(text)
  return parsed.lines || []
}
