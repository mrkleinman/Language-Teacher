  {"id": "abs-lb-s1-13", "num": 13, "season": 3, "series": "Lower Beginner", "title": "Dangerous to Eat Guava Seeds in", "situation": "Warning about eating guava seeds.", "coreConceptIds": ["lb_dont"], "keyPattern": {"thai": "อย่า + verb", "phonetic": "yàa + verb", "english": "Don't verb"}, "teacherExplanation": "อย่า + verb (yàa + verb) — Don't verb", "dialogue": [{"gender": "male", "thai": "ห้ามกินเม็ดฝรัง", "phonetic": "NÓK: hâam gin mét fà-ràng.", "english": "Don't eat guava seeds."}, {"gender": "female", "thai": "ทําไมล่ะ มันเป็นส่วนทีหวานทีสุดนะ", "phonetic": "tham-mai lâ. man bpen sùuan thîi wǎan thîi sùt ná.", "english": "Why? It's the sweetest part."}, {"gender": "male", "thai": "เขาว่ากันว่าถ้ากินเม็ดฝรังแล้วจะเป็นไส้ติงอักเสบ", "phonetic": "NÓK: khǎo wâa gan wâa thâa gin mét fà-ràng láaeo jà bpen sâi-dtìng-àk- sèep. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #13 - DANGEROUS  TO EAT GUAVA S EEDS  I N THAI LAND? 3", "english": "They say that if you eat guava seeds you'll get appendicitis."}, {"gender": "female", "thai": "ฉันกินมานานแล้ว ไม่เห็นมีปัญหาเลย อย่าเชือทีเขาพูดกันทังหมดสิ", "phonetic": "chán gin maa naan láaeo. mâi hěn mii bpan-hǎa looei. yàa chûuea thîi khǎo phûut gan tháng-mòt sì.", "english": "I've eaten them for a long time. I've never had any problems. Don't believe everything they say."}], "vocab": [{"thai": "ห้าม", "phonetic": "hâam", "english": "do not, to forbid"}, {"thai": "ล่ะ", "phonetic": "lâ", "english": "particle used at the"}, {"thai": "ทําไม", "phonetic": "tham-mai", "english": "why"}, {"thai": "อย่า", "phonetic": "yàa", "english": "don’t"}, {"thai": "ทังหมด", "phonetic": "tháng-mòt", "english": "in all, everything"}, {"thai": "เม็ด", "phonetic": "mét", "english": "seed; grain"}, {"thai": "ส่วน", "phonetic": "sùuan", "english": "part; portion"}, {"thai": "ไส้ติงอักเสบ", "phonetic": "sâi-dtìng-àk-sèet", "english": "appendicitis"}], "samples": [{"thai": "อย่าลืมดูข่าวคืนนีนะคะ", "phonetic": "", "english": "Talking in the library is forbidden."}], "cultural": "THAI POD101.COM If you've ever eaten a fresh guava, you know that the center is the sweetest, but it also contains a number of small, hard seeds. Most Thai people will simply discard this portion of the fruit because of a widespread belief that eating guava seeds causes appendicitis. The thought is that the tiny seed can enter into the appendix and then get stuck there, despite there being no medical proof. Another fruit that you may be warned ab", "practicePrompts": []},
  {"id": "abs-lb-s1-14", "num": 14, "season": 3, "series": "Lower Beginner", "title": "It's Not the FirstTime Getting Stuck", "situation": "Getting stuck in traffic again.", "coreConceptIds": ["lb_ordinal"], "keyPattern": {"thai": "ที่ + number", "phonetic": "thîi + number", "english": "First/second/third"}, "teacherExplanation": "ที่ + number (thîi + number) — First/second/third", "dialogue": [{"gender": "female", "thai": "มาสายอีกแล้ว เธอนีเป็นทีหนึงเรืองมาสาย", "phonetic": "maa sǎai ìik láaeo. thooe nîi bpen thîi-nùeng rûueang maa sǎai.", "english": "You're late again. You're number one when it comes to showing up late."}, {"gender": "male", "thai": "นิดเดียว รถติดตรงไฟแดงทีสอง เลยมาสาย", "phonetic": "NÓK: nít diiao. rót-dtìt dtrong fai-daaeng thîi-sǎawng. looei maa sǎai. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #14  - I T'S  NOT THE FIRS T TI ME GETTING S TUCK I N BANGKOK TRAFFIC 3", "english": "Just a little. There was a traffic jam at the second red light, so I got here late."}, {"gender": "female", "thai": "เรามีประชุมกับคุณวิชัยตอนบ่าย", "phonetic": "rao mii bprà-chum gàp khun wí-chai dtaawn-bàai.", "english": "We have a meeting with Mr. Wichai in the afternoon."}, {"gender": "male", "thai": "ประชุมเป็นครังทีสามแล้ว เขาคงอยากให้เรารีบทํางานให้เสร็จ", "phonetic": "NÓK: bprà-chum bpen khráng thîi-sǎam láaeo. khǎo khong yàak hâi rao rîip tham-ngaan hâi sèt.", "english": "This is the third meeting already. He must want us to finish the job quickly."}], "vocab": [{"thai": "ทีหนึง", "phonetic": "thîi-nùeng", "english": "first; primary"}, {"thai": "เรือง", "phonetic": "rûueang", "english": "story, topic"}, {"thai": "นิดเดียว", "phonetic": "nít-diiao", "english": "to be small; a little; a"}, {"thai": "รถติด", "phonetic": "rót-dtìt", "english": "traffic jam"}, {"thai": "ไฟแดง", "phonetic": "fai-daaeng", "english": "red light; traffic light"}, {"thai": "ประชุม", "phonetic": "bprà-chum", "english": "meeting"}, {"thai": "ตอนบ่าย", "phonetic": "dtaawn-bàai", "english": "afternoon"}, {"thai": "ครัง", "phonetic": "khráng", "english": "time"}, {"thai": "รีบ", "phonetic": "rîip", "english": "to hurry, quickly"}], "samples": [], "cultural": "Traffic in Bangkok is notoriously bad. The public rail systems, consisting of both a subway and an elevated train, contain just a few lines that don't reach many parts of the city. So Bangkok citizens and visitors must use the roads most of the time to get where they're going. A large part of the problem is too many cars on the road. At the end of 2013, there were 7.3 million cars in Bangkok. This was an incredible eighty-one percent increase fro", "practicePrompts": []},
  {"id": "abs-lb-s1-15", "num": 15, "season": 3, "series": "Lower Beginner", "title": "Will This Thai Project Be", "situation": "Discussing a Thai project timeline.", "coreConceptIds": ["lb_dates"], "keyPattern": {"thai": "วัน + day / เดือน + month", "phonetic": "wan + day / duuean + month", "english": "Day/month/date"}, "teacherExplanation": "วัน + day / เดือน + month (wan + day / duuean + month) — Day/month/date", "dialogue": [{"gender": "male", "thai": "ช่วยออกแบบห้องนังเล่นให้ผมหน่อย ขอเสร็จก่อนวันที นะครับ", "phonetic": "WÍ-CHAI: chûuai àawk-bàaep hâwng-nâng-lên hâi phǒm nàwy. khǎaw sèt gàawn wan-thîi yîi-sìp-hâa ná khráp.", "english": "Please design my living room. And please finish it before the twenty- fifth."}, {"gender": "female", "thai": "นกช่วยดูตารางงานของเราซิ ว่าเราจะเริมงานวันที ได้มัย", "phonetic": "nók chûuai duu dtaa-raang-ngaan khǎawng rao sí. wâa rao jà rôoem ngaan wan-thîi sìp dâai mái.", "english": "Nok, please check our schedule. Can we start the job on the tenth?"}, {"gender": "male", "thai": "ไม่ได้ค่ะ, เรามีประชุมกับคุณมาลี แต่เราจะว่างวันที ,", "phonetic": "NÓK: mâi dâai khâ. rao mii bprà-chum gàp khun maa-lii. dtàae rao jà wâang wan-thîi sìp-sìi.", "english": "We can't. We have a meeting with Ms. Mali. But we'll be free on the fourteenth."}, {"gender": "female", "thai": "วันที , ก็ทัน งันเราเริมงานวันที , นะคะคุณวิชัย", "phonetic": "wan-thîi sìp-sìi gâaw than. ngán rao rôoem ngaan wan-thîi sìp-sìi ná khá khun wí-chai.", "english": "The fourteenth will give us enough time. Alright, we'll start work on the fourteenth, Mr. Wichai."}, {"gender": "male", "thai": "ครับ, ขอบคุณมาก", "phonetic": "WÍ-CHAI: khráp. khàawp-khun mâak.", "english": "Okay, thank you very much."}], "vocab": [{"thai": "ออกแบบ", "phonetic": "to design", "english": "verb"}, {"thai": "เสร็จ", "phonetic": "sèt", "english": "finished, complete,"}, {"thai": "ตารางงาน", "phonetic": "dtaa-raang-ngaan", "english": "schedule"}, {"thai": "เริม", "phonetic": "rôoem", "english": "to start"}, {"thai": "งาน", "phonetic": "ngaan", "english": "work, task,"}, {"thai": "ว่าง", "phonetic": "wâang", "english": "free, vacant"}, {"thai": "ทัน", "phonetic": "than", "english": "in time, on time, to"}], "samples": [], "cultural": "Large work projects—especially construction projects—are famous for falling behind schedule in Thailand. The cause could be due to a combination of corruption, poor planning, and the use of many unskilled migrant workers in the construction industry. For example, in 2013 there were three new shopping malls scheduled to open in the city of Chiang Mai. Only one of them opened on schedule, and all three had areas still under construction during thei", "practicePrompts": []},
  {"id": "abs-lb-s1-16", "num": 16, "season": 3, "series": "Lower Beginner", "title": "Is It Raining Again inThailand?", "situation": "Complaining about rain.", "coreConceptIds": ["lb_again"], "keyPattern": {"thai": "verb + อีก / verb + อีกครั้ง", "phonetic": "verb + ìik / verb + ìik-khráng", "english": "Verb again"}, "teacherExplanation": "verb + อีก / verb + อีกครั้ง (verb + ìik / verb + ìik-khráng) — Verb again", "dialogue": [{"gender": "female", "thai": "นก งานออกแบบห้องนังเล่นของคุณวิชัยเสร็จรึยัง", "phonetic": "nók ngaan àawk-bàaep hâwng-nâng-lên khǎawng khun wí-chai sèt rúe yang.", "english": "Nok, did you finish the living room design for Mr. Wichai?"}, {"gender": "male", "thai": "เสร็จแล้ว แต่ลืมไว้ทีบ้านอีกแล้ว ต้องกลับไปเอา", "phonetic": "NÓK: sèt láaeo. dtaae luuem wái thîi bâan ìik láaeo. dtâwng glàp bpai ao.", "english": "It's finished, but I forgot it at home again. I have to go back and get it."}, {"gender": "female", "thai": "ต้องรีบหน่อยนะ ฝนจะตกอีกแล้ว", "phonetic": "dtâwng rîip nàwy ná. fǒn jà dtòk ìik láaeo. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #16  - I S  IT RAI NI NG AGAI N I N THAI LAND? 3", "english": "You need to hurry up a little. It's going to rain again."}, {"gender": "male", "thai": "จริงด้วย เราไม่อยากเปียกเหมือนเมือวานแล้วนะ", "phonetic": "NÓK: jing dûuai. rao mâi yàak bpìiak mǔuean mûuea-waan láaeo ná.", "english": "Right. I don't want to get wet again like yesterday."}], "vocab": [{"thai": "ออกแบบ", "phonetic": "to design", "english": "verb"}, {"thai": "ลืม", "phonetic": "luuem", "english": "to forget"}, {"thai": "ไว้", "phonetic": "wái", "english": "to keep, to put, to"}, {"thai": "อีก", "phonetic": "ìik", "english": "again, another"}, {"thai": "กลับ", "phonetic": "glàp", "english": "to return"}, {"thai": "หน่อย", "phonetic": "nàwy", "english": "a little bit, tiny"}, {"thai": "เปียก", "phonetic": "bpìiak", "english": "wet"}, {"thai": "เมือวาน", "phonetic": "mûuea-waan", "english": "yesterday"}], "samples": [{"thai": "อย่า   {"id": "abs-lb-s1-17", "num": 17, "season": 3, "series": "Lower Beginner", "title": "Did You Make Any Copies of Your", "situation": "Making copies of documents.", "coreConceptIds": ["lb_repetition"], "keyPattern": {"thai": "verb + ซ้ำ", "phonetic": "verb + sám", "english": "Do verb repeatedly"}, "teacherExplanation": "verb + ซ้ำ (verb + sám) — Do verb repeatedly", "dialogue": [{"gender": "male", "thai": "ฝนตกฉันลืมปิดกระเป๋าใบงานเปียกหมดเลย", "phonetic": "NÓK: fǒn-dtòk chǎn luuem bpìt grà-bpǎo. bai-ngaan bpìiak mòt looei.", "english": "It rained, and I forgot to close my bag. The worksheet is all wet."}, {"gender": "female", "thai": "ต้องทําใหม่ ให้เสร็จก่อนเที!ยงนะ", "phonetic": "dtâwng tham mài hâi sèt gàawn thiiang ná.", "english": "You must redo it, and finish before noon."}, {"gender": "male", "thai": "ไม่เป็นไร แค่ปรินท์ใหม่ เพราะฉันส่งไฟล์งานเข้าอีเมลแล้ว", "phonetic": "NÓK: mâi bpen rai. khâae bprín mài. phráw chǎn sòng fai ngaan khâo ii- mee láaeo. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #17 - DI D YOU MAKE ANY COPI ES  OF YOUR THAI  REPORT? 3", "english": "No problem. I just need to reprint it because I sent the file in an email."}, {"gender": "female", "thai": "ดีมากรอบคอบดี งันฉันขอด่วนเลยนะ", "phonetic": "dii mâak râawp-khâawp dii. ngán chǎn khǎaw dùuan looei ná.", "english": "It's great that you were so careful. Then, give it to me quickly."}], "vocab": [{"thai": "ปิด", "phonetic": "bpìt", "english": "to close, to turn off"}, {"thai": "ใบงาน", "phonetic": "bai ngaan", "english": "worksheet"}, {"thai": "หมด", "phonetic": "mòt", "english": "be finished, entirely"}, {"thai": "ทําใหม่", "phonetic": "tham mài", "english": "redo, do over"}, {"thai": "ส่ง", "phonetic": "sòng", "english": "to send"}, {"thai": "อีเมล", "phonetic": "ii-mee", "english": "email"}, {"thai": "รอบคอบ", "phonetic": "râawp-khâawp", "english": "to be cautious,"}, {"thai": "งัน", "phonetic": "ngán", "english": "then"}, {"thai": "ด่วน", "phonetic": "dùuan", "english": "express, urgent"}], "samples": [], "cultural": "You'll quickly find out that to get anything official done in Thailand requires filling out and submitting loads of paperwork. In order to get a long-term visa, work permit, driver's license, or register a vehicle in your name, you'll need to prepare many documents. If a government department requires a photocopy of your passport, they'll probably want not only the information page but also the page with your current visa, arrival stamp, 90-day r", "practicePrompts": []},
  {"id": "abs-lb-s1-18", "num": 18, "season": 3, "series": "Lower Beginner", "title": "Do you Want More Thai Chicken", "situation": "Ordering more chicken.", "coreConceptIds": ["lb_additional"], "keyPattern": {"thai": "เพิ่ม + noun / noun + อีก", "phonetic": "phôoem + noun / noun + ìik", "english": "More/additional noun"}, "teacherExplanation": "เพิ่ม + noun / noun + อีก (phôoem + noun / noun + ìik) — More/additional noun", "dialogue": [{"gender": "female", "thai": "เธอมาช้า ฉันสังอาหารแล้ว ถ้าเธออยากได้อะไรก็สังเพิมได้นะ", "phonetic": "thooe maa cháa. chǎn sàng aa-hǎan láaeo. thâa thooe yàak dâai à- rai gâaw sàng phôoem dâai ná.", "english": "You're late; I ordered already. If you want anything, we can order more."}, {"gender": "male", "thai": "โอเค น้องคะ, สังอาหารเพิมหน่อยค่ะ", "phonetic": "NÓK: oo-khee. náawng khá. sàng aa-hǎan phôoem nàwy khâ.", "english": "Okay. Waiter, we'll order more food."}, {"gender": "male", "thai": "ครับ", "phonetic": "PHÁ-NÁK- khráp.", "english": "Yes."}, {"gender": "male", "thai": "เอาข้าวมันไก่ไม่เอาหนังหนึงจาน", "phonetic": "NÓK: ao khâao man gài mâi ao nǎng nùeng jaan.", "english": "I'll have a plate of chicken rice without skin."}, {"gender": "male", "thai": "เอานําเพิมมัยครับ", "phonetic": "PHÁ-NÁK- ao náam phôoem mái khráp.", "english": "Would you like more to drink?"}, {"gender": "male", "thai": "เอาเบียร์ช้างขวดใหญ่", "phonetic": "NÓK: ao biia cháang khùuat yài.", "english": "I'll have a large Chang beer."}], "vocab": [{"thai": "หนึงจาน", "phonetic": "nùeng jaan", "english": "one plate"}, {"thai": "เบียร์ช้าง", "phonetic": "biia cháang", "english": "Chang beer (the"}, {"thai": "ช้า", "phonetic": "cháa", "english": "slowly, late"}, {"thai": "สัง", "phonetic": "sàng", "english": "to order"}, {"thai": "เพิม", "phonetic": "phôoem", "english": "to increase, to grow"}, {"thai": "น้อง", "phonetic": "náawng", "english": "younger sibling,"}, {"thai": "ข้าวมันไก่", "phonetic": "khâao-man-gài", "english": "chicken with rice"}], "samples"   {"id": "abs-lb-s1-19", "num": 19, "season": 3, "series": "Lower Beginner", "title": "How is the Thai Food in This", "situation": "Discussing restaurant food quality.", "coreConceptIds": ["lb_how_question"], "keyPattern": {"thai": "verb/adj + ยังไง", "phonetic": "verb/adj + yang-ngai", "english": "How is/does...?"}, "teacherExplanation": "verb/adj + ยังไง (verb/adj + yang-ngai) — How is/does...?", "dialogue": [{"gender": "female", "thai": "ข้าวมันไก่เป็นยังไง อร่อยมัย", "phonetic": "khâao man gài bpen yang-ngai. à-ràuy mái. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #19  - HOW IS  THE THAI  FOOD IN THI S  RES TAURANT? 3", "english": "How's the chicken rice? Is it tasty?"}, {"gender": "male", "thai": "อร่อยดี", "phonetic": "NÓK: à-ràuy dii.", "english": "It's delicious."}, {"gender": "female", "thai": "ว่าแต่เธอมายังไงน่ะ ทําไมมาสาย", "phonetic": "wâa dtàae thooe maa yang-ngai nâ. tham-mai maa sǎai.", "english": "By the way, how did you get here; why are you late?"}, {"gender": "male", "thai": "ขีมอเตอร์ไซค์มา แต่เขาปิดถนนให้รถนายกฯ ผ่าน", "phonetic": "NÓK: khìi maaw-dtooe-sai maa. dtàae khǎo bpìt thà-nǒn hâi rót naa-yók phàan.", "english": "I drove a motorcycle, but they closed the street for the Prime Minister's car to pass."}, {"gender": "female", "thai": "ไม่เป็นไร ในกรุงเทพฯ ยังไงรถก็ติด", "phonetic": "mâi bpen rai. nai grung-thêep yang-ngai rót gâaw dtìt.", "english": "It's okay. In Bangkok, no matter what there are traffic jams."}], "vocab": [{"thai": "ยังไง", "phonetic": "yang-ngai", "english": "how"}, {"thai": "อร่อย", "phonetic": "à-ràuy", "english": "delicious"}, {"thai": "มอเตอร์ไซค์", "phonetic": "maaw-dtooe-sai", "english": "motorcycle"}, {"thai": "นายกฯ", "phonetic": "naa-yók", "english": "Prime Minister"}, {"thai": "ผ่าน", "phonetic": "phàan", "english": "to pass"}, {"thai": "กรุงเทพฯ", "phonetic": "grung-thêep", "english": "Bangkok"}, {"thai": "ก็", "phonetic": "gâaw", "english": "also, and, then, well"}, {"thai": "รถติด", "phonetic": "rót-dtìt" kers are lucky to earn the equivalent of $500 per month, you might wonder how so many consumers in Thailand are able to afford to buy a car, go on vacation, or purchase the fashions and accessories on display in Thai shopping malls. THAI POD101.COM For many Thai citizens, the answer is by going into debt. At the end of 2013, household debt among Thai people was equal to eighty-two percent of the national g", "practicePrompts": []},

  {"id": "abs-lb-s1-22", "num": 22, "season": 3, "series": "Lower Beginner", "title": "Does the Rain Ever Stop in", "situation": "The endless Thai rainy season.", "coreConceptIds": ["lb_duration_future"], "keyPattern": {"thai": "อีก + time + จะ + verb", "phonetic": "ìik + time + jà + verb", "english": "In time, will verb"}, "teacherExplanation": "อีก + time + จะ + verb (ìik + time + jà + verb) — In time, will verb", "dialogue": [{"gender": "female", "thai": "เบือ ฝนตกทุกวัน ไม่รู้จะตกไปถึงไหน", "phonetic": "bùuea. fǒn-dtòk thúk wan. mâi rúu jà dtòk bpai thǔeng nǎi.", "english": "I'm sick of it raining every day. I don't know how long it's going to rain until."}, {"gender": "male", "thai": "ฉันดูข่าวเขาบอกว่าจะมีพายุเข้าจนถึงพรุ่งนี", "phonetic": "NÓK: chǎn duu khàao khǎo bàawk wâa jà mii phaa-yú khâo jon thǔeng phrûng-níi. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #22 - DOES  THE RAIN EVER S TOP I N THAI LAND? 3", "english": "I saw on the news that we're going to have storms coming until tomorrow."}, {"gender": "female", "thai": "นําท่วมในซอยบ้านฉันแน่นอน ปีทีแล้วนําถึงเอวเลย", "phonetic": "nám-thûuam nai saauy bâan chǎn nâae-naawn. bpii thîi láaeo náam thǔeng eeo looei.", "english": "It's going to flood on my street for sure. Last year the water came up to my waist."}, {"gender": "male", "thai": "คงต้องซือเรือติดบ้านไว้บ้างแล้วมัง", "phonetic": "NÓK: khong dtâwng súue ruuea dtìt bâan wái bâang láaeo máng.", "english": "You should probably buy a boat to keep at home."}], "vocab": [{"thai": "ติดบ้าน", "phonetic": "dtìt bâan", "english": "to keep at home"}, {"thai": "ทุกวัน", "phonetic": "thúk-wan", "english": "everyday"}, {"thai": "ข่าว", "phonetic": "khàao", "english": "news"}, {"thai": "พายุ", "phonetic": "phaa-yú", "english": "storm"}, {"thai": "ท่วม", "phonetic": "thûuam", "english": "flood"}, {"thai": "ซอย", "phonetic": "saauy", "english": "alley, side street"}, {"thai": "แน่นอน", "phonetic": "nâae-naawn", "english": "of course"}, {"thai": "เอว", "phonetic"   {"id": "abs-lb-s1-23", "num": 23, "season": 3, "series": "Lower Beginner", "title": "Trying Some Japanese Food...in", "situation": "Trying Japanese food in Thailand.", "coreConceptIds": ["lb_first_last"], "keyPattern": {"thai": "verb + ก่อน / verb + ทีหลัง", "phonetic": "verb + gàawn / verb + thii-lǎng", "english": "Verb first / verb last"}, "teacherExplanation": "verb + ก่อน / verb + ทีหลัง (verb + gàawn / verb + thii-lǎng) — Verb first / verb last", "dialogue": [{"gender": "male", "thai": "ทําไมห้างนีมีแต่อาหารญีปุ่น", "phonetic": "NÓK: tham-mai hâang níi mii dtàae aa-hǎan yîi-bpùn. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #23 - TRYI NG S OME JAPANES E FOOD...IN THAI LAND 3", "english": "Why does this mall have only Japanese food?"}, {"gender": "female", "thai": "ไม่รู้สิ ฉันก็เพิงมาห้างนีครังแรก", "phonetic": "mâi rúu sì. chǎn gâaw phôeng maa hâang níi khráng-râaek.", "english": "I don't know. This is the first time I've come to this mall too."}, {"gender": "male", "thai": "แล้วเราจะกินร้านไหนดี", "phonetic": "NÓK: láaeo rao jà gin ráan nǎi dii.", "english": "Well, which restaurant should we eat at?"}, {"gender": "female", "thai": "ร้านสุดท้ายมัย อาหารน่าอร่อย มีไอติมรสชาเขียวด้วย", "phonetic": "ráan sùt-tháai mái. aa-hǎan nâa à-ràuy mii ai-dtim rót chaa-khǐiao dûuai.", "english": "The last one? The food looks delicious. And they have green tea ice cream too."}, {"gender": "male", "thai": "ดีเลย ฉันจะได้กินไอติมชาเขียวเป็นครังแรก", "phonetic": "NÓK: dii looei. chǎn jà dâai gin ai-dtim chaa-khǐiao bpen khráng-râaek.", "english": "Great! It'll be my first time eating green tea ice-cream!"}], "vocab": [{"thai": "ห้าง", "phonetic": "hâang", "english": "shopping mall,"}, {"thai": "ครังแรก", "phonetic": "khráng râaek", "english": "first time"}, {"thai": "สุดท้าย", "phonetic": "sùt-tháai", "english": "last"}, {"thai": "ไอติม", "phonetic": "ai-dtim", "english": "ice cream"}, {"thai": "รส", "phonetic": "rót", "english": "flavor, taste"}], "samples": [{"thai": "ร้านไหนมีพิซซ่าทีอร่อยคะ", "phonetic": "", "english": "I drink green tea every day."}, {"thai": "คุณแม่คะ หนูอยากกินไอติม", "phonetic": "", "english": "I'm going to the shopping mall in the \nafternoon."}, {"thai": "คุณแมคะ หนูอยากกินไอติม", "phonetic": "", "english": "Japanese food is (very) delicious."}], "cultural": "THAI POD101.COM Japanese food has become quite popular in Thailand, especially in the past ten years or so. In many of the newer shopping malls, Japanese restaurants outnumber those serving Thai or Western food. Many of them serve all-you-can-eat buffets for around 299 baht, which is an entire day's wages for somebody earning minimum wage in Thailand, and yet it is quite inexpensive for all-you-can-eat sushi when you compare it with prices in Jap", "practicePrompts": []},
  {"id": "abs-lb-s1-24", "num": 24, "season": 3, "series": "Lower Beginner", "title": "Are Beauty Clinics Popular in", "situation": "Beauty clinics in Thailand.", "coreConceptIds": ["lb_regularly"], "keyPattern": {"thai": "verb + เป็นประจำ", "phonetic": "verb + bpen bprà-jam", "english": "Verb regularly/usually"}, "teacherExplanation": "verb + เป็นประจำ (verb + bpen bprà-jam) — Verb regularly/usually", "dialogue": [{"gender": "female", "thai": "ฉันสิวขึนเต็มหน้าเลย ทําไมหน้าเธอใสจังไม่มีสิวเลย", "phonetic": "chǎn sǐu khûen dtem nâa looei. tham-mai nâa thooe sǎi jang mâi mii sǐu looei.", "english": "I've got pimples all over my face. Why is your face so clear? You don't have any pimples!"}, {"gender": "male", "thai": "ก็ฉันไปคลินิกความงามเป็นประจํา", "phonetic": "NÓK: gâaw chǎn bpai khlii-nìk khwaam-ngaam bpen bprà-jam.", "english": "Well, I go to the beauty clinic regularly."}, {"gender": "female", "thai": "เขาทําอะไรให้บ้างเหรอ", "phonetic": "khǎo tham à-rai hâi bâang rǒoe.", "english": "What do they do for you?"}, {"gender": "male", "thai": "ปกติก็ขัดหน้า นวดหน้า รักษาสิว ตามโปรแกรมทีเขามีน่ะแหละ", "phonetic": "NÓK: bpòk-gà-dtì gâaw khàt nâa nûuat nâa rák-sǎa sǐu dtaam bproo- graaem thîi khǎo mii nâ làe.", "english": "Usually, they scrub my face, massage my face, and take care of acne according to their program."}, {"gender": "female", "thai": "น่าสนใจ วันหลังพาฉันไปลองบ้างนะ", "phonetic": "nâa-sǒn-jai. wan-lǎng phaa chǎn bpai laawng bâang ná.", "english": "Interesting. Take me to try it some other day."}], "vocab": [{"thai": "เป็นประจํา", "phonetic": "bpen bprà-jam", "english": "regularly"}, {"thai": "หน้า", "phonetic": "nâa", "english": "face"}, {"thai": "ปกติ", "phonetic": "bpòk-gà-dtì (bpà-gà-", "english": "dtì)"}, {"thai": "ขัด", "phonetic": "khàt", "english": "to scrub"}, {"thai": "นวด", "phonetic": "nûuat", "english": "massage, to"}], "samples": [], "cultural": "Thai Beauty Clinics Thailand has a large number of beauty clinics where women can go for a variety of treatments. These clinics have increased in number, particularly in the past ten years. Weight loss and skin whitening are probably the two most popular services, but Thai women also go to clinics to get help clearing up acne and other skin treatments, such as laser treatment. Beauty clinics will usually be found all grouped together on the same ", "practicePrompts": []},
  {"id": "abs-lb-s1-25", "num": 25, "season": 3, "series": "Lower Beginner", "title": "A Thai City that is Always Growing", "situation": "Bangkok's endless growth.", "coreConceptIds": ["lb_always"], "keyPattern": {"thai": "verb + เสมอ", "phonetic": "verb + sà-mǒoe", "english": "Verb always"}, "teacherExplanation": "verb + เสมอ (verb + sà-mǒoe) — Verb always", "dialogue": [{"gender": "male", "thai": "ชีวิตในกรุงเทพฯ ยุ่งวุ่นวายตลอด บางทีก็คิดอยากจะกลับไปอยู่บ้านที ต่างจังหวัดนะ", "phonetic": "NÓK: chii-wít nai grung-thêep yûng wûn-waai dtà-làawt. baang-thii gâaw khít yàak jà glàp bpai yùu bâan thîi dtàang jang-wàt ná.", "english": "Life in Bangkok is always busy and hectic. Sometimes I think I want to go back home to live in the countryside."}, {"gender": "female", "thai": "ใช่ ในซอยบ้านฉันก็เสียงดังตลอดเวลา", "phonetic": "châi. nai saauy bâan chǎn gâaw sǐiang dang dtà-làawt wee-laa. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #25 - A THAI  CI TY THAT IS  ALWAYS  GROWI NG 3", "english": "Yes, on my street it's noisy all the time."}, {"gender": "male", "thai": "ยุ่งวุ่นวายขึนทุกวัน หลังบ้านฉันเขาก็ตัดต้นไม้ออก จะสร้างคอนโด", "phonetic": "NÓK: yûng wûn-waai khûen thúk wan. lǎng bâan chǎn khǎo gâaw dtàt dtôn-máai àawk. jà sâang khaawn-doo.", "english": "It's getting more busy and hectic every day. Behind my house they also cut down trees to build a condo."}, {"gender": "female", "thai": "น่าสงสาร", "phonetic": "nâa-sǒng-saan.", "english": "What a pity."}], "vocab": [{"thai": "ตัดออก", "phonetic": "dtàt àawk", "english": "to eliminate, to"}, {"thai": "ชีวิต", "phonetic": "chii-wít", "english": "life"}, {"thai": "ยุ่ง", "phonetic": "yûng", "english": "be busy, be hectic,"}, {"thai": "วุ่นวาย", "phonetic": "wûn-waai", "english": "troublesome,"}, {"thai": "ตลอด", "phonetic": "dtà-làawt", "english": "throughout, always"}, {"thai": "ต่างจังหวัด", "phonetic": "dtàang jang-wàt", "english": "up-country, out of"}, {"thai": "ทุกวัน", "phonetic": "thúk-wan", "english": "everyday   {"id": "abs-ub-s1-01", "num": 1, "season": 4, "series": "Upper Beginner", "title": "The Future is Predictable in", "situation": "A travel company discussing bookings.", "coreConceptIds": ["ub_about"], "keyPattern": {"thai": "เกี่ยวกับ + noun", "phonetic": "gìiao-gàp + noun", "english": "About noun / related to noun"}, "teacherExplanation": "เกี่ยวกับ + noun (gìiao-gàp + noun) — About noun / related to noun", "dialogue": [{"gender": "female", "thai": "เช้านีมีโทรเข้ามาบุ๊คไว้ รายแล้วค่ะ, อีกทีหนึงกําลังดูรายละเอียดเกียวกับราคาทีพักอยู่ . เจ้าของบริษัท เห็นไหม พีบอกแล้ว หมอดูเจ้านีแม่นจริงๆ", "phonetic": "cháao níi mii thoo khâo maa búk wáai sǎam raai láaeo khâ. ìik thîi nùeng gam-lang duu raai-lá-ìiat gìiao-gàp raa-khaa thîi-phák yùu.", "english": "This morning, we had three calls to book already. One other is looking over the details of lodging prices."}, {"gender": "female", "thai": "แหม แต่พลอยว่ามันไม่เกียวกับหมอดูหรอกนะคะ, บริษัทเราให้บริการดีอย่างนี ใครๆก็อยากใช้บริการค่ะ", "phonetic": "mǎae. dtàae phlaawy wâa man mâi gìiao-gàp mǎaw-duu ràawk ná khá. baaw-rí-sàt rao hâi baaw-rí-gaan dii yàang níi. khrai-khrai gâaw yàak chái baaw-rí-gaan khâ.", "english": "Oh! But I'm telling you this isn't about any fortune-teller. Our company provides such good service. Anybody would want to use our services."}], "vocab": [{"thai": "ทัวร์", "phonetic": "thuua", "english": "tour"}, {"thai": "ราย", "phonetic": "raai", "english": "individual, person,"}, {"thai": "รายละเอียด", "phonetic": "raai-lá-ìiat", "english": "detail"}, {"thai": "ทีพัก", "phonetic": "thîi-phák", "english": "accommodation,"}, {"thai": "เจ้า", "phonetic": "jâo", "english": "god, lord, proprieter"}, {"thai": "บริการ", "phonetic": "baaw-rí-gaan", "english": "service, to serve"}, {"thai": "แม่น", "phonetic": "mâen", "english": "accurate"}, {"thai": "บริษัท", "phonetic": "baaw-rí-sàt", "english": "company"}, {"thai": "ใครๆ", "phonetic": "khrai-khrai", "english": "anyone"}], "samples": [], "cultural": "The Thai word for a fortune-teller is หมอดู (mǎaw-duu), which literally means \"doctor of looking.\" หมอดู (mǎaw-duu) are quite popular in Thailand, and the average person will consult with one at least twice a year. Fortune-tellers can be found set up in public parks, along the sidewalk, in some shopping malls, and near the entrances to temples. People seek their advice for many issues such as determining marriage compatibility, forecasting financ", "practicePrompts": []},
  {"id": "abs-ub-s1-02", "num": 2, "season": 4, "series": "Upper Beginner", "title": "Do You Know How Thai Shops", "situation": "Learning about Thai shop opening hours.", "coreConceptIds": ["ub_just_enough"], "keyPattern": {"thai": "พอ + verb / verb + พอ", "phonetic": "phaw + verb", "english": "Just enough to verb"}, "teacherExplanation": "พอ + verb / verb + พอ (phaw + verb) — Just enough to verb", "dialogue": [{"gender": "female", "thai": "พีไปดูหมอดูทีไหนมาคะ . เจ้าของบริษัท หน้าร้านดอกไม้แถวบ้านน่ะจ้ะ พอซือพวงมาลัยเสร็จก็เลยลองแวะดูนิดหน่อย", "phonetic": "phîi bpai duu mǎaw-duu thîi-nǎi maa khá. CONT'D OVER UPPER BEGINNER S1 #2 - DO YOU KNOW HOW THAI SHOPS BRING IN THE CUSTOMERS? 3", "english": "Where did you go to see the fortune-teller?"}, {"gender": "female", "thai": "ถึงว่า ทําไมวันนีพวงมาลัยถวายนางกวักสวยมาก . เจ้าของบริษัท นี...ไม่เชือก็ต้องเชือนะ พอพีไหว้เสร็จ ลูกค้าก็โทรเข้ามาทันทีเลย", "phonetic": "thǔeng wâa. tham-mai wan-níi phuuang maa-lai thà-wǎai naang- gwàk sǔuai mâak.", "english": "So that's it. That's why the flower garland for the \"beckoning lady\" is really beautiful today."}], "vocab": [{"thai": "นางกวัก", "phonetic": "naang-gwàk", "english": "beckoning lady"}, {"thai": "แวะ", "phonetic": "wáe", "english": "to stop by"}, {"thai": "ร้านดอกไม้", "phonetic": "ráan-dàawk-máai", "english": "flower shop"}, {"thai": "เสร็จ", "phonetic": "sèt", "english": "finished, complete"}, {"thai": "พวงมาลัย", "phonetic": "phuang-maa-lai", "english": "garland, steering"}, {"thai": "เชือ", "phonetic": "chûuea", "english": "to believe"}], "samples": [{"thai": "แถวๆนีมีร้านขายขนมปังไหมคะ", "phonetic": "", "english": "His shop doesn't have a beckoning lady \nstatue. So  he doesn't get a large amount \nof customers."}], "cultural": "นางกวัก (naang-gwàk) translates as \"lady who beckons.\" In her images, she appears as a young woman dressed in traditional Thai costume, wearing a crown. She sits Thai style, kneeling with her feet tucked off to one side. Her right arm is raised up with the palm of the hand held downward in the gesture used throughout Asia to motion someone toward you. Her main job is to lure customers into a place of business. So, you will often see a small shrin", "practicePrompts": []},

  {"id": "abs-ub-s1-04", "num": 4, "season": 4, "series": "Upper Beginner", "title": "See a Thai Sky Full of Lanterns", "situation": "Watching lanterns at Yi Peng festival.", "coreConceptIds": ["ub_which_that"], "keyPattern": {"thai": "noun + ซึ่ง + clause", "phonetic": "noun + sûeng + clause", "english": "noun which/that clause"}, "teacherExplanation": "noun + ซึ่ง + clause (noun + sûeng + clause) — noun which/that clause", "dialogue": [{"gender": "female", "thai": "สวัสดีค่ะ, บริษัทนําทัวร์ไทยแลนด์ ยินดีรับใช้ค่ะ", "phonetic": "sà-wàt-dii khâ. baaw-rí-sàt nam tuua thai-laaend. yin-dii ráp-chái khâ.", "english": "Hello. This is Nam Tour Thailand. May I help you?"}, {"gender": "male", "thai": "สวัสดีค่ะ, พี อยากไปเที ยวทางเหนือน่ะค่ะ, ช่วงนีมีอะไรที น่าสนใจไหมคะ", "phonetic": "LÛUK-KHÁA YǏNG: sà-wàt-dii khâ. phîi yàak bpai thîiao thaang nǔuea nâ khâ. chûuang-níi mii à-rai thîi nâa-sǒn-jai mǎi khá.", "english": "Hello. I want to go travel up north. Is there anything interesting at this time?"}, {"gender": "female", "thai": "ปลายเดือนพฤศจิกายนจะมีงานยี เป็งที เชียงใหม่ค่ะ, ซึ งจะจัดพร้อมกันกับงานลอยกระทงเลยนะคะ", "phonetic": "bplaai duuean phrúet-sà-jì-gaa-yon jà mii ngaan yîi-bpeng thîi chiiang-mài khâ. sûeng jà jàt phráawm gan gàp ngaan laawy-grà- thong looei ná khá.", "english": "At the end of November, there is the Yee Peng festival in Chiang Mai, which will be held together with the Loi Krathong festival. UPPER BEGINNER S1 #4 - SEE A THAI SKY FULL OF LANTERNS 3"}, {"gender": "male", "thai": "งานยี เป็งคืออะไรคะ", "phonetic": "LÛUK-KHÁA YǏNG: ngaan yîi-bpeng khuue à-rai khá.", "english": "What is the Yee Peng festival?"}, {"gender": "female", "thai": "เป็นงานใหญ่ซึ งจะมีโคมลอยหลายพันลูก สวยมากน่ะค่ะ", "phonetic": "bpen ngaan yàai sûeng jà mii khoom-laawy lǎai phan lûuk. sǔuai mâak nâ khâ.", "english": "It's a big festival in which there are many thousands of floating lanterns. It's very beautiful."}, {"gender": "male", "thai": "น่าสนใจจังค่ะ", "phonetic": "LÛUK-KH
