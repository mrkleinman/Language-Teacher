function ConvoPlayer({ lines, onSkip, onDone, speed, onSpeedChange }) {
  const [lineIdx, setLineIdx] = useState(0)
  const [playing, setPlaying] = useState(false)
  const [voices, setVoices] = useState([])
  const cancelRef = useRef(false)
  const speedRef = useRef(speed)  // ref so speed changes take effect immediately
  const HAS_SPEECH = typeof window !== 'undefined' && 'speechSynthesis' in window

  // Keep speedRef in sync
  useEffect(() => { speedRef.current = speed }, [speed])

  useEffect(() => {
    if (!HAS_SPEECH) return
    const load = () => { const v = window.speechSynthesis.getVoices(); if (v.length) setVoices(v) }
    load(); window.speechSynthesis.onvoiceschanged = load
    return () => { try { window.speechSynthesis.onvoiceschanged = null } catch(e) {} }
  }, [])

  useEffect(() => {
    if (!playing || lineIdx >= lines.length) { if (lineIdx >= lines.length) onDone(); return }
    cancelRef.current = false
    const line = lines[lineIdx]
    const speakLine = () => {
      if (!HAS_SPEECH || cancelRef.current) { setTimeout(() => { if (!cancelRef.current) setLineIdx(i => i + 1) }, 1200); return }
      try { window.speechSynthesis.cancel() } catch(e) {}
      const u = new SpeechSynthesisUtterance(line.thai)
      const isMale = line.speaker === 'M'
      u.lang = 'th-TH'
      u.rate = speedRef.current || 0.8  // use ref for real-time speed
      u.pitch = 1  // no pitch manipulation — let voices be natural
      // Google TTS Thai voices: female = th-TH-Standard-A, male = th-TH-Standard-B
      // Also handles: Google ภาษาไทย (female/male), Nexus voices
      const googleFemale = voices.find(v => v.lang.startsWith('th') && /Standard-A|หญิง|female/i.test(v.name))
      const googleMale = voices.find(v => v.lang.startsWith('th') && /Standard-B|Standard-C|ชาย|male/i.test(v.name))
      const anyThai = voices.filter(v => v.lang.startsWith('th'))
      // If 2+ voices, pick by index: first=female, second=male
      const byIndex = isMale ? (anyThai[1] || anyThai[0]) : (anyThai[0])
      const chosen = isMale ? (googleMale || byIndex) : (googleFemale || anyThai[0])
      if (chosen) u.voice = chosen
      u.onend = () => { if (!cancelRef.current) setTimeout(() => setLineIdx(i => i + 1), 700) }
      u.onerror = () => { if (!cancelRef.current) setTimeout(() => setLineIdx(i => i + 1), 900) }
      window.speechSynthesis.speak(u)
    }
    speakLine()
    return () => { cancelRef.current = true; try { window.speechSynthesis.cancel() } catch(e) {} }
  }, [playing, lineIdx, lines, voices])  // removed speed from deps — speedRef handles it

  const line = lines[lineIdx] || lines[lines.length - 1] || {}
  const pct = Math.round((lineIdx / Math.max(lines.length, 1)) * 100)

  return (
    <div className="fade-in" style={{ padding:16, maxWidth:500, margin:'0 auto', display:'flex', flexDirection:'column', minHeight:'100vh' }}>

      {/* Header */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
        <div>
          <div className="display" style={{ fontSize:17, color:'var(--gold)' }}>Thai Conversation</div>
          <div style={{ fontSize:11, color:'var(--muted)' }}>{lines.length} lines · all track words covered</div>
        </div>
        <button onClick={() => { cancelRef.current = true; try { window.speechSynthesis.cancel() } catch(e) {} onSkip() }}
          style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:20, padding:'7px 14px', cursor:'pointer', color:'var(--muted)', fontSize:12, fontWeight:600, fontFamily:'Sarabun,sans-serif' }}>
          Skip →
        </button>
      </div>

      {/* Play button — at top */}
      <button onClick={() => setPlaying(p => !p)}
        style={{ width:'100%', padding:'13px', borderRadius:12, border:'none', background: playing ? '#1a2a00' : 'linear-gradient(135deg,#d4a94a,#b88a35)', color: playing ? '#86c900' : '#0b1120', fontSize:15, fontWeight:700, cursor:'pointer', fontFamily:'Sarabun,sans-serif', marginBottom:10 }}>
        {playing ? '⏸ Pause' : lineIdx === 0 ? '▶ Play Conversation' : '▶ Resume'}
      </button>

      {/* Speed + progress row */}
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10, background:'var(--surface)', borderRadius:10, padding:'7px 12px' }}>
        <span style={{ fontSize:11 }}>🐢</span>
        <input type="range" min="0.4" max="1.2" step="0.05" value={speed}
          onChange={e => onSpeedChange(parseFloat(e.target.value))}
          style={{ flex:1, accentColor:'var(--gold)', height:4, cursor:'pointer' }} />
        <span style={{ fontSize:11 }}>🐇</span>
        <span className="phon" style={{ fontSize:11, color:'var(--gold)', minWidth:32 }}>{speed.toFixed(2)}x</span>
        <span style={{ fontSize:11, color:'var(--muted)', marginLeft:4 }}>{pct}%</span>
      </div>

      {/* Progress bar */}
      <div style={{ height:3, background:'var(--surface2)', borderRadius:2, marginBottom:14 }}>
        <div style={{ height:'100%', width:`${pct}%`, background:'var(--gold)', borderRadius:2, transition:'width 0.4s' }} />
      </div>

      {/* Conversation lines */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', gap:8, overflowY:'auto' }}>
        {lines.map((l, i) => {
          const isA = l.speaker === 'M'
          const isCurrent = i === lineIdx && playing
          const isPast = i < lineIdx
          return (
            <div key={i} style={{ display:'flex', flexDirection: isA ? 'row' : 'row-reverse', gap:8, opacity: isPast ? 0.45 : isCurrent ? 1 : 0.75 }}>
              <div style={{ width:30, height:30, borderRadius:'50%', background: isA ? '#1e3a5f' : '#2a1e3a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:15, flexShrink:0, marginTop:4, border: isCurrent ? `2px solid ${isA ? '#4a90e2' : '#c084fc'}` : '2px solid transparent', transition:'border 0.2s' }}>
                {isA ? '👨' : '👩'}
              </div>
              <div style={{ maxWidth:'78%', background: isCurrent ? (isA ? '#0a1a2e' : '#1a0a2e') : 'var(--surface)', border:`1px solid ${isCurrent ? (isA ? '#4a90e2' : '#c084fc') : 'var(--border)'}`, borderRadius:12, padding:'10px 12px', transition:'all 0.2s' }}>
                <p className="thai" style={{ fontSize:20, color: isCurrent ? 'var(--text)' : '#8899aa', marginBottom:3 }}>{l.thai}</p>
                <p className="phon" style={{ fontSize:13, color:'var(--gold)', marginBottom:2 }}>{l.phonetic}</p>
                <p style={{ fontSize:12, color:'#c8d8f0', fontStyle:'italic' }}>{l.english}</p>
              </div>
            </div>
          )
        })}
      </div>
    </div>
  )
}

function Generator({ vocab, mode, onGenerated, onBack, apiKey, provider, orKey, onPhonetics, customTargets }) {
  const [error, setError] = useState('')
  const [pairsDone, setPairsDone] = useState(0)
  const [pairsTotal, setPairsTotal] = useState(90)
  const [targetPhonetics, setTargetPhonetics] = useState({})
  const [phase, setPhase] = useState('starting') // starting | streaming | done | error
  const [convoLines, setConvoLines] = useState(null)
  const [showConvo, setShowConvo] = useState(false)
  const [convoLoading, setConvoLoading] = useState(false)
  const [convoPct, setConvoPct] = useState(0)
  const [convoSpeed, setConvoSpeed] = useState(() => { try { return parseFloat(localStorage.getItem('tt-speed') || '0.8') } catch { return 0.8 } })
  const [generatedTrack, setGeneratedTrack] = useState(null)
  const phoneticsRef = useRef({})
  const { targets, anchors } = useMemo(() => {
    if (customTargets && customTargets.length) {
      const targetIds = new Set(customTargets.map(w => w.id))
      const anch = vocab.filter(w => (w.status === 'known' || w.status === 'learning') && !targetIds.has(w.id))
        .sort((a, b) => (!a.lastSeen ? -1 : !b.lastSeen ? 1 : a.lastSeen.localeCompare(b.lastSeen)))
        .slice(0, 25)
      return { targets: customTargets, anchors: anch }
    }
    return pickWords(vocab, mode)
  }, [vocab, mode, customTargets])

  const isWeak = mode === 'weak'
  const color = isWeak ? '#ef4444' : '#10b981'
  const pct = Math.min(100, Math.round((pairsDone / 90) * 100))

  // Latest pair preview from stream
  const [latestPair, setLatestPair] = useState(null)

  useEffect(() => {
    async function build() {
      try {
        let pairs
        if (apiKey) {
          setPhase('streaming')
          // Seed phoneticsRef from vocab words that already have phonetics stored
          const vocabPhonetics = {}
          for (const t of targets) { if (t.phonetic) { vocabPhonetics[t.id] = t.phonetic; vocabPhonetics[t.thai] = t.phonetic } }
          phoneticsRef.current = vocabPhonetics
          if (Object.keys(vocabPhonetics).length) setTargetPhonetics({ ...vocabPhonetics })
          // Only fetch phonetics for words still missing them
          const needsPhonetics = targets.filter(t => !t.phonetic)
          if (needsPhonetics.length > 0) {
            const doPhonetics = async () => {
              let map = {}
              // Use selected provider's key for phonetics
              if (provider === 'gpt4omini' || provider === 'haiku' || (orKey && provider !== 'deepseek')) map = await fetchTargetPhoneticsQwen(needsPhonetics, orKey || apiKey)
              else if (provider === 'deepseek') map = await fetchTargetPhoneticsDeepSeek(needsPhonetics, apiKey)
              else map = await fetchTargetPhonetics(needsPhonetics, apiKey)
              if (Object.keys(map).length) {
                phoneticsRef.current = { ...phoneticsRef.current, ...map }
                setTargetPhonetics({ ...phoneticsRef.current })
                onPhonetics && onPhonetics(map) // save new ones back to vocab
              }
            }
            doPhonetics().catch(() => {})
          }

          pairs = await generateTrackWithQwen(targets, anchors, apiKey,
            (done) => { setPairsDone(done); setPairsTotal(targets.length * 3) },
            vocab, provider === "deepseek" ? "deepseek/deepseek-chat" : provider === "haiku" ? "anthropic/claude-haiku-4-5" : "openai/gpt-4o-mini")
          }
        // Use pre-call phonetics (phoneticsRef) — reliable, per-word accurate
        // Previous regex pair-matching was buggy and overwrote correct data
        if (onPhonetics && Object.keys(phoneticsRef.current).length) {
          onPhonetics(phoneticsRef.current)
        }
        const keywords = targets.map(w => ({ thai: w.thai, english: w.english, wordId: w.id, rating: null, phonetic: phoneticsRef.current[w.id] || phoneticsRef.current[w.thai] || '' }))
        const track = {
          date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
          mode, pairs, keywords, rated: false, createdAt: new Date().toISOString(),
        }
        // Item 42: Verify track can be serialized before showing ready
        try { JSON.stringify(track) } catch(e) { throw new Error('Track data invalid: ' + e.message) }
        setGeneratedTrack(track)
        setPhase('done')
      } catch(e) {
        setPhase('error')
        const msg = e.message || 'Unknown error'
        console.error('Generation error:', msg)
          const isDeepSeekCors = (provider === 'deepseek') && (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('CORS') || msg.includes('fetch'))
          const hint = isDeepSeekCors
          ? '🐋 DeepSeek via OpenRouter requires your OpenRouter API key in Settings.'
          : msg.includes('Failed to fetch') || msg.includes('NetworkError')
          ? msg + '\n\n⚠️ Check your internet connection and API key.'
          : msg
        setError(hint)
      }
    }
    build()
  }, [])

  if (phase === 'error') return (
    <div className="fade-in" style={{ padding:24, maxWidth:500, margin:'0 auto', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:'60vh', gap:20 }}>

      <div style={{ display:'flex', gap:10 }}>
        <Btn onClick={() => { setPhase('starting'); setError(''); setPairsDone(0) }} variant="primary">Try Again</Btn>
        <Btn onClick={onBack} variant="ghost">Back</Btn>

  return (

      <div>
        <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>

        </div>
        <div style={{ display:'flex', justifyContent:'space-between', marginTop:6 }}>
          <span style={{ fontSize:10, color:'var(--muted)' }}>0</span>
          <span style={{ fontSize:10, color:'var(--muted)' }}>90</span>
        </div>
      </div>

      {/* Live pair counter tiles */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(6,1fr)', gap:4 }}>
        {Array.from({length: 90}, (_, i) => (
          <div key={i} style={{
            height: 8, borderRadius: 3,
            background: i < pairsDone ? color : 'var(--surface2)',
            transition: 'background 0.2s',
            opacity: i < pairsDone ? 1 : 0.4
          }} />
        ))}
      </div>

      {/* Status / Action buttons */}
      <div style={{ textAlign:'center', display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
        {phase !== 'done' && <Spinner size={16} color={color} />}

          {phase === 'starting' && 'Connecting...'}
          {phase === 'streaming' && pairsDone === 0 && `Kru ${provider === 'deepseek' ? 'DeepSeek' : provider === 'haiku' ? 'Claude Haiku' : 'GPT-4o mini'} is thinking...`}
          {phase === 'streaming' && pairsDone > 0 && `Word ${Math.ceil(pairsDone/3)} of ${Math.ceil(pairsTotal/3)} — pair ${pairsDone}...`}
        </span>
      </div>

      {/* Track ready actions */}
      {phase === 'done' && generatedTrack && (()=>{
        const totalPairs = generatedTrack.pairs?.length || 0
        const fallbackPairs = generatedTrack.pairs?.filter(p => {
          const pr = p.prompt || ''
          return pr.startsWith('Say "I ') || pr.startsWith('Ask "Do you ') || pr.includes('know about') || pr === '' || pr.length < 10
        }).length || 0
        const missingWords = (generatedTrack.keywords || []).filter(k =>
          !(generatedTrack.pairs || []).some(p => p.thai?.includes(k.thai))
        ).length
        const score = Math.max(0, Math.round(((totalPairs - fallbackPairs * 2 - missingWords * 3) / Math.max(totalPairs, 1)) * 100))
        const scoreColor = score >= 85 ? '#10b981' : score >= 65 ? '#f59e0b' : '#ef4444'
        return (<div style={{ display:'flex', flexDirection:'column', gap:10 }}><div style={{ display:'flex', flexDirection:'column', gap:10 }}>

            <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:10, padding:'10px 14px', display:'flex', gap:12, alignItems:'center' }}>

              <div style={{ flex:1, fontSize:12, color:'var(--muted)' }}>

            <div>

                <span style={{ fontSize:12, color:'#4a90e2' }}>⏳ Generating conversation...</span>

              const lines = await generateConvoWithOpenRouter(targets, vocab, convoKey, orModel)
              clearInterval(ticker)
              setConvoPct(100)
              const trackWithConvo = { ...generatedTrack, convo: lines }
              setGeneratedTrack(trackWithConvo)
              setConvoLines(lines)

            setConvoLoading(false)
          }} variant="secondary" style={{ width:'100%', justifyContent:'center' }} disabled={convoLoading}>
            {convoLoading ? '⏳ Generating conversation...' : convoLines ? '💬 View Conversation' : '💬 Generate Conversation'}
          </Btn>
        </div></div>)
      })()}

      {/* Target words */}
      {targets.length > 0 && (
        <Card style={{ padding:'12px 14px' }}>
          <p style={{ fontSize:11, color:'var(--muted)', marginBottom:8, textTransform:'uppercase', letterSpacing:'0.08em' }}>Targeting {targets.length} words</p>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
            {targets.map((w,i) => {
              const done = i * 3 < pairsDone
              const phonetic = targetPhonetics[w.thai] || targetPhonetics[w.id] || w.phonetic || ''
              return (
                <div key={i} style={{ display:'flex', flexDirection:'column', alignItems:'center', background: done ? 'var(--surface2)' : 'transparent', border:`1px solid ${done ? color : 'var(--border)'}`, borderRadius:8, padding:'4px 10px', transition:'all 0.3s', minWidth:0 }}>
                  <span className="thai" style={{ color: done ? color : 'var(--text)', fontSize:13, lineHeight:1.3 }}>{w.thai}</span>
                  {phonetic && <span className="phon" style={{ color: done ? color : 'var(--gold)', fontSize:9, marginTop:1, opacity: done ? 1 : 0.7 }}>{phonetic}</span>}
                </div>
              )
            })}
          </div>
        </Card>
      )}
    </div>
  )
}

// ── Track Player ─────────────────────────────────────────────────────────────

// Count syllables in Thai text (each Thai syllable cluster = 1 unit)
// Simple heuristic: split on spaces, each token = ~1 syllable for short words, 2 for long
// Count syllables from phonetic string (space-separated tokens = syllables)
// Falls back to Thai char-based estimate if no phonetic available
function countSyllables(thai, phonetic) {
  if (phonetic && phonetic.trim()) {
    return phonetic.trim().split(/\s+/).filter(Boolean).length
  }
  // Thai char estimate: avg ~2.5 chars per syllable (incl tone marks, vowels)
  const chars = (thai || '').replace(/[\s]/g, '').length
  return Math.max(2, Math.round(chars / 2.5))
}

// Pimsleur S = 1.5n + 1.0, but add TTS speaking time on top
// TTS speaks at ~thaiSpeed rate so we add extra buffer
function calcDuration(thai, phase, phonetic) {
  if (phase === 'prompt') {
    // English: ~130wpm reading pace + 1.5s thinking buffer
    const words = (thai || '').trim().split(/\s+/).length
    return Math.max(4000, Math.round(words * 460 + 1500))
  }
  const n = countSyllables(thai, phonetic)
  // Pimsleur repeat pause: S = 2.0n + 1.5 seconds AFTER speech ends
  // Add estimated TTS duration (~0.4s per syllable at 0.8x)
  const ttsDur = Math.round(n * 400)
  const pauseDur = Math.round((2.0 * n + 1.5) * 1000)
  return ttsDur + pauseDur
}

function Player({ track, onComplete, onBack, onKru, onBookmark }) {
  const pairs = track.pairs || []
  const [idx, setIdx] = useState(track.bookmark || 0)
  const [bookmarked, setBookmarked] = useState(false)
  const [phase, setPhase] = useState('prompt')
  const [playing, setPlaying] = useState(false)
  const [countdown3, setCountdown3] = useState(3)
  const [speaking, setSpeaking] = useState(false)
  const [countdown, setCountdown] = useState(1)
  const [lessonDone, setLessonDone] = useState(false)
  const [keywords, setKeywords] = useState((track.keywords || []).map(k => ({ ...k, rating: null })))
  const [allRated, setAllRated] = useState(false)
  const [voices, setVoices] = useState([])
  const [thaiSpeed, setThaiSpeed] = useState(() => { try { const s = localStorage.getItem('tt-speed'); return s ? parseFloat(s) : 0.8 } catch { return 0.8 } })
  const cancelledRef = useRef(false)
  const pausedRef = useRef(false)
  const rafRef = useRef(null)

  const pair = pairs[idx] || {}
  const overallPct = Math.round((idx / pairs.length) * 100)
  const HAS_SPEECH = typeof window !== 'undefined' && 'speechSynthesis' in window

  // Estimated time remaining (sum of all remaining pairs)
  const timeLeft = useMemo(() => {
    let ms = 0
    for (let i = idx; i < pairs.length; i++) {
      const p = pairs[i]
      ms += calcDuration(p.prompt, 'prompt', null) + 1800 + calcDuration(p.thai, 'reveal', p.phonetic) + 2500
    }
    // Subtract current phase if already in reveal
    if (phase === 'reveal') ms -= calcDuration(pair.prompt, 'prompt', null) + 1800
    const mins = Math.ceil(ms / 60000)
    return mins <= 1 ? '< 1 min' : `~${mins} min`
  }, [idx, phase, pairs])

  // ── 3-2-1 lead-in before playback starts ──
  useEffect(() => {
    let n = 3
    setCountdown3(n)
    const iv = setInterval(() => {
      n--
      if (n > 0) setCountdown3(n)
      else { clearInterval(iv); setCountdown3(0); setPlaying(true) }
    }, 1000)
    return () => clearInterval(iv)
  }, [])

  useEffect(() => {
    if (!HAS_SPEECH) return
    function load() { const v = window.speechSynthesis.getVoices(); if (v.length) setVoices(v) }
    load()
    window.speechSynthesis.onvoiceschanged = load
    return () => { try { window.speechSynthesis.onvoiceschanged = null } catch(e) {} }
  }, [])

  function startCountdown(ms) {
    if (rafRef.current) cancelAnimationFrame(rafRef.current)
    const start = Date.now()
    setCountdown(1)
    function tick() {
      const remaining = Math.max(0, 1 - (Date.now() - start) / ms)
      setCountdown(remaining)
      if (remaining > 0 && !cancelledRef.current) rafRef.current = requestAnimationFrame(tick)
    }
    rafRef.current = requestAnimationFrame(tick)
  }

  function stopCountdown() {
    if (rafRef.current) cancelAnimationFrame(rafRef.current)
    setCountdown(0)
  }

  function speakOrWait(text, lang, ms, onDone) {
    if (!HAS_SPEECH) {
      setSpeaking(true); startCountdown(ms)
      const t = setTimeout(() => { setSpeaking(false); stopCountdown(); if (!cancelledRef.current) onDone() }, ms)
      return () => clearTimeout(t)
    }
    try { window.speechSynthesis.cancel() } catch(e) {}
    const utter = new SpeechSynthesisUtterance(text)
    utter.lang = lang
    utter.rate = lang.startsWith('th') ? thaiSpeed : 0.88
    const match = voices.find(v => v.lang.startsWith(lang.slice(0, 2)))
    if (match) utter.voice = match
    setSpeaking(true); startCountdown(ms)
    utter.onend = () => { setSpeaking(false); stopCountdown(); if (!pausedRef.current && !cancelledRef.current) onDone() }
    utter.onerror = () => { setSpeaking(false); stopCountdown(); if (!cancelledRef.current) onDone() }
    try { window.speechSynthesis.speak(utter) } catch(e) { setSpeaking(false); stopCountdown(); onDone() }
    return () => { try { window.speechSynthesis.cancel() } catch(e) {} setSpeaking(false); stopCountdown() }
  }

  useEffect(() => {
    if (!playing || lessonDone) return
    cancelledRef.current = false; pausedRef.current = false
    const promptDur = calcDuration(pair.prompt, 'prompt')
    const revealDur = calcDuration(pair.thai, 'reveal')
    let cleanup = () => {}
    if (phase === 'prompt') {
      // Pause after prompt = Pimsleur formula based on Thai answer syllables
      const n = countSyllables(pair.thai, pair.phonetic)
      const thinkMs = Math.round((0.6 * n + 0.4) * 1000)
      cleanup = speakOrWait(pair.prompt, 'en-US', promptDur, () => {
        // This fires from utter.onend — AFTER speech actually finishes
        startCountdown(thinkMs)
        const t = setTimeout(() => { if (!cancelledRef.current) { stopCountdown(); setPhase('reveal') } }, thinkMs)
        return () => clearTimeout(t)
      }) || (() => {})
    } else {
      cleanup = speakOrWait(pair.thai, 'th-TH', revealDur, () => {
        startCountdown(2500)
        const t = setTimeout(() => {
          if (cancelledRef.current) return
          stopCountdown()
          if (idx < pairs.length - 1) { setIdx(i => i + 1); setPhase('prompt') }
          else setLessonDone(true)
        }, 2500)
        return () => clearTimeout(t)
      }) || (() => {})
    }
    return () => {
      cancelledRef.current = true
      try { if (HAS_SPEECH) window.speechSynthesis.cancel() } catch(e) {}
      setSpeaking(false); stopCountdown(); cleanup()
    }
  }, [idx, phase, playing, lessonDone, voices])

  function togglePlay() {
    if (playing) {
      pausedRef.current = true
      try { if (HAS_SPEECH) window.speechSynthesis.pause() } catch(e) {}
      if (rafRef.current) cancelAnimationFrame(rafRef.current)
      setPlaying(false)
    } else {
      pausedRef.current = false
      try { if (HAS_SPEECH) window.speechSynthesis.resume() } catch(e) {}
      setPlaying(true)
    }
  }

  function jumpTo(newIdx, newPhase = 'prompt') {
    cancelledRef.current = true
    try { if (HAS_SPEECH) window.speechSynthesis.cancel() } catch(e) {}
    setSpeaking(false); stopCountdown()
    setIdx(newIdx); setPhase(newPhase); setPlaying(true)
    setTimeout(() => { cancelledRef.current = false }, 50)
  }

  function rateKeyword(i, rating) {
    setKeywords(kw => {
      const u = kw.map((k, ki) => ki === i ? { ...k, rating } : k)
      setAllRated(u.every(k => k.rating))
      return u
    })
  }

  const Waveform = () => (
    <div style={{ display:'flex', alignItems:'center', gap:3, height:24 }}>
      {[0,1,2,3,4,5,6].map(i => (
        <div key={i} style={{ width:3, borderRadius:2, background:phase==='reveal'?'var(--gold)':'#4a90e2', height:speaking?`${8+Math.sin(i*0.9)*8+4}px`:'4px', animation:speaking?`wave 0.7s ease-in-out ${i*0.09}s infinite alternate`:'none', transition:'height 0.2s' }} />
      ))}
      <style>{`@keyframes wave{from{height:4px}to{height:22px}}`}</style>
    </div>
  )

  if (lessonDone) {
    return (
      <div className="fade-in" style={{ background:'var(--bg)', minHeight:'100vh', padding:'16px 16px 40px', maxWidth:500, margin:'0 auto' }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:8 }}>
          <button onClick={onBack} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', padding:4 }}><Icon name="x" size={20} /></button>
          <div>
            <div className="display" style={{ fontSize:18 }}>Lesson complete!</div>
            <div style={{ fontSize:12, color:'var(--muted)' }}>Rate how well you knew each word</div>
          </div>
        </div>
        <div style={{ height:3, background:'var(--gold)', borderRadius:2, marginBottom:24 }} />
        <div style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:24 }}>
          {keywords.map((kw,i) => (
            <div key={i} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:'14px 16px' }}>
              <div style={{ display:'flex', alignItems:'baseline', gap:10, marginBottom:12 }}>
                <span className="thai" style={{ fontSize:26, color:'var(--gold)' }}>{kw.thai}</span>
                {kw.phonetic && <span className="phon" style={{ fontSize:13, color:'#7a8aad' }}>{kw.phonetic}</span>}
                <span style={{ color:'var(--muted)', fontSize:14 }}>{kw.english}</span>
              </div>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                {[['hard','😅','#ef4444','#2d1515'],['ok','👍','#f59e0b','#3d2800'],['easy','⭐','#10b981','#063d2e']].map(([r,e,col,bg]) => (
                  <button key={r} onClick={() => rateKeyword(i,r)}
                    style={{ flex:1, padding:'9px 4px', borderRadius:8, border:`1px solid ${kw.rating===r?col:'var(--border)'}`, background:kw.rating===r?bg:'transparent', color:kw.rating===r?col:'var(--muted)', cursor:'pointer', fontSize:13, fontWeight:700, fontFamily:'Sarabun,sans-serif', transition:'all 0.15s' }}>
                    {e} {r}
                  </button>
                ))}
                <button onClick={() => rateKeyword(i,'known')}
                  style={{ flexBasis:'48%', padding:'7px 4px', borderRadius:8, border:`1px solid ${kw.rating==='known'?'#10b981':'var(--border)'}`, background:kw.rating==='known'?'#063d2e':'transparent', color:kw.rating==='known'?'#10b981':'var(--muted)', cursor:'pointer', fontSize:11, fontWeight:700, fontFamily:'Sarabun,sans-serif', transition:'all 0.15s' }}>
                  ✓ Mark Known
                </button>
                <button onClick={() => rateKeyword(i,'skip')}
                  style={{ flexBasis:'48%', padding:'7px 4px', borderRadius:8, border:`1px solid ${kw.rating==='skip'?'#6b7280':'var(--border)'}`, background:kw.rating==='skip'?'#1a1a2e':'transparent', color:kw.rating==='skip'?'#9ca3af':'var(--muted)', cursor:'pointer', fontSize:11, fontWeight:600, fontFamily:'Sarabun,sans-serif', transition:'all 0.15s' }}>
                  🚫 Didn't appear
                </button>
              </div>
            </div>
          ))}
        </div>
        <button onClick={() => onComplete(keywords)} disabled={!allRated}
          style={{ width:'100%', padding:'15px', borderRadius:12, border:'none', background:allRated?'linear-gradient(135deg,#d4a94a,#b88a35)':'var(--surface2)', color:allRated?'#0b1120':'var(--muted)', fontSize:16, fontWeight:700, cursor:allRated?'pointer':'not-allowed', fontFamily:'Sarabun,sans-serif', transition:'all 0.2s' }}>
          Save Progress
        </button>
      </div>
    )
  }

  const barColor = speaking ? (phase==='prompt' ? '#4a90e2' : 'var(--gold)') : 'var(--surface2)'

  return (
    <div style={{ background:'var(--bg)', minHeight:'100vh', display:'flex', flexDirection:'column', maxWidth:500, margin:'0 auto', userSelect:'none' }}>

      {/* Overall progress — top */}
      <div style={{ height:3, background:'var(--surface2)' }}>
        <div style={{ height:'100%', width:`${overallPct}%`, background:'linear-gradient(90deg,#d4a94a,#10b981)', transition:'width 0.5s ease' }} />
      </div>

      {/* Controls */}
      <div style={{ display:'flex', alignItems:'center', padding:'10px 16px', gap:8 }}>
        <button onClick={onBack} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', padding:4 }}><Icon name="arrow_left" size={18} /></button>
        <span style={{ fontSize:13, color:'var(--muted)' }}>{idx+1} / {pairs.length}</span>
        <span style={{ fontSize:11, color:'var(--gold-dim)', marginLeft:4 }}>{timeLeft}</span>
        <div style={{ flex:1 }} />
        <button onClick={() => idx>0 && jumpTo(idx-1)} disabled={idx===0}
          style={{ background:'none', border:'none', color:idx===0?'var(--border)':'var(--muted)', cursor:idx===0?'default':'pointer', padding:'6px 8px', fontSize:18 }}>⏮</button>
        <button onClick={togglePlay}
          style={{ width:40, height:40, borderRadius:'50%', border:'1px solid var(--border)', background:'var(--surface)', color:'var(--text)', cursor:'pointer', fontSize:18, display:'flex', alignItems:'center', justifyContent:'center' }}>
          {playing ? '⏸' : '▶'}
        </button>
        <button onClick={() => idx<pairs.length-1 ? jumpTo(idx+1) : setLessonDone(true)}
          style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', padding:'6px 8px', fontSize:18 }}>⏭</button>
        <button onClick={() => { cancelledRef.current = true; try { if (HAS_SPEECH) window.speechSynthesis.cancel() } catch(e) {} setSpeaking(false); stopCountdown(); setLessonDone(true) }}
          style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:20, padding:'5px 10px', cursor:'pointer', color:'#f59e0b', fontSize:12, fontWeight:600, fontFamily:'Sarabun,sans-serif' }}>☑ Review</button>
        <button onClick={() => { onBookmark && onBookmark(idx); setBookmarked(true); setTimeout(() => setBookmarked(false), 2000) }}
          style={{ background: bookmarked ? '#1a2a00' : 'var(--surface)', border:`1px solid ${bookmarked ? '#4a7a00' : 'var(--border)'}`, borderRadius:20, padding:'5px 10px', cursor:'pointer', color: bookmarked ? '#86c900' : 'var(--muted)', fontSize:12, fontWeight:600, fontFamily:'Sarabun,sans-serif', transition:'all 0.2s' }}>
          {bookmarked ? '✓ Saved' : '🔖 Pair ' + (idx + 1)}</button>
        <button onClick={() => { togglePlay(); onKru(pair.prompt) }}
          style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:20, padding:'5px 10px', cursor:'pointer', color:'var(--gold)', fontSize:12, fontWeight:600, fontFamily:'Sarabun,sans-serif' }}>ครู</button>
      </div>

      {/* Resume from bookmark banner */}
      {track.bookmark > 0 && idx === (track.bookmark || 0) && !playing && (
        <div style={{ margin:'6px 16px 0', background:'#0d1a00', border:'1px solid #3a6000', borderRadius:8, padding:'7px 12px', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:13 }}>🔖</span>
          <span style={{ fontSize:12, color:'#86c900', flex:1 }}>Resuming from pair {(track.bookmark || 0) + 1} of {pairs.length}</span>
          <button onClick={() => { setIdx(0) }} style={{ background:'none', border:'none', color:'var(--muted)', fontSize:11, cursor:'pointer', fontFamily:'Sarabun,sans-serif' }}>Start over</button>
        </div>
      )}

      {/* Thai speed control */}
      <div style={{ display:'flex', alignItems:'center', gap:10, padding:'4px 16px 0' }}>
        <span style={{ fontSize:11, color:'var(--muted)', whiteSpace:'nowrap' }}>🐢</span>
        <input type="range" min="0.4" max="1.2" step="0.05" value={thaiSpeed}
          onChange={e => { const v = parseFloat(e.target.value); setThaiSpeed(v); try { localStorage.setItem('tt-speed', v) } catch {} }}
          style={{ flex:1, accentColor:'var(--gold)', height:4, cursor:'pointer' }} />
        <span style={{ fontSize:11, color:'var(--muted)', whiteSpace:'nowrap' }}>🐇</span>
        <span className="phon" style={{ fontSize:11, color:'var(--gold)', minWidth:28, textAlign:'right' }}>{thaiSpeed.toFixed(2)}x</span>
      </div>

      {/* Countdown bar — shrinks left to right, resets each phase */}
      <div style={{ margin:'0 16px', height:5, background:'var(--surface2)', borderRadius:3, overflow:'hidden' }}>
        <div style={{ height:'100%', width:`${countdown*100}%`, background:barColor, borderRadius:3, transition:'background 0.3s' }} />
      </div>
      <div style={{ textAlign:'center', padding:'6px 0 0', fontSize:10, letterSpacing:'0.1em', color:'var(--muted)', textTransform:'uppercase' }}>
        {!playing && countdown3 > 0 ? `Starting in ${countdown3}...` : !playing ? '⏸ paused' : speaking ? (phase==='prompt' ? 'listening...' : 'repeat aloud ↑') : 'get ready...'}
      </div>

      {/* Main content */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'16px 32px 32px', textAlign:'center', gap:24 }}>
        {phase === 'prompt' ? (
          <div className="fade-in" key={`p-${idx}`} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:20 }}>
            <div style={{ fontSize:11, letterSpacing:'0.12em', color:'#4a90e2', textTransform:'uppercase', fontWeight:600 }}>Say in Thai</div>
            <p style={{ fontSize:22, fontWeight:600, lineHeight:1.65, color:'var(--text)', maxWidth:340 }}>{pair.prompt}</p>
            <Waveform />

          </div>
        ) : (
          <div className="fade-in" key={`r-${idx}`} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:14 }}>
            <div style={{ fontSize:11, letterSpacing:'0.12em', color:'var(--gold)', textTransform:'uppercase', fontWeight:600 }}>Repeat aloud</div>
            {/* Aligned phonetic + gloss or plain phonetic fallback */}
            {pair.words && pair.words.length > 0 && pair.words.some(w => w.p) ? (
              <div style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', gap:'6px 10px', maxWidth:360 }}>
                {pair.words.map((w, i) => (
                  <div key={i} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:2 }}>
                    <span className="phon" style={{ fontSize:22, color:'var(--gold)', fontWeight:700 }}>{w.p}</span>
                    <span style={{ fontSize:18, color:'#c8d8f0', fontStyle:'italic', whiteSpace:'nowrap' }}>{w.e}</span>
                  </div>
                ))}
              </div>
            ) : pair.phonetic ? (
              <p className="phon" style={{ fontSize:38, color:'var(--gold)', lineHeight:1.5, maxWidth:360, textAlign:'center' }}>{pair.phonetic}</p>
            ) : (
              <p className="phon" style={{ fontSize:22, color:'var(--muted)', lineHeight:1.5, maxWidth:360, textAlign:'center' }}>
                {pair.phonetic || pair.target_phonetic || ''}
              </p>
            )}
            <Waveform />
            <p className="thai" style={{ fontSize:26, color:'#a8b8d8', letterSpacing:'0.03em', textAlign:'center' }}>{pair.thai}</p>
            <p style={{ fontSize:21, color:'#e8d5a3', fontStyle:'italic' }}>{pair.english}</p>
          </div>
        )}
      </div>
    </div>
  )
}

// ── Browse Vocab ──────────────────────────────────────────────────────────────
function Browser({ vocab, onBack, initialFilter, phonetics, onCustomTrack, orKey, onVocabUpdate }) {
  const [q, setQ] = useState('')
  const [filter, setFilter] = useState(initialFilter || 'all')
  const [selecting, setSelecting] = useState(false)
  const [selected, setSelected] = useState(new Set())
  const today = new Date().toISOString().slice(0, 10)

  const filtered = useMemo(() => {
    return vocab.filter(w => {
      const matchQ = !q || w.thai.includes(q) || w.english.toLowerCase().includes(q.toLowerCase())
      let matchF
      if (filter === 'all') matchF = true
      else if (filter === 'due') matchF = w.status !== 'new' && w.dueDate && w.dueDate <= today
      else matchF = w.status === filter
      return matchQ && matchF
    })
  }, [vocab, q, filter, today])

  function toggleSelect(w) {
    if (!selecting) return
    setSelected(prev => {
      const next = new Set(prev)
      if (next.has(w.id)) next.delete(w.id)
      else if (next.size < 30) next.add(w.id)
      return next
    })
  }

  const [fetchingPhonetics, setFetchingPhonetics] = useState(false)
  const [fetchProgress, setFetchProgress] = useState('')

  function phoneticsNeedsFixing(p) {
    if (!p) return true  // missing
    // IPA characters that don't belong in romanization
    if (/[ɔɛɯʰŋːɪɐɑʌʊ]/u.test(p)) return true
    // No tone marks at all AND more than one syllable (single syllable mid-tone ok)
    const toneMarks = 'àáâǎ'
    const hasTone = [...toneMarks].some(c => p.includes(c))
    if (!hasTone && p.replace(/[-\s]/g,'').length > 4) return true
    return false
  }

  const [fetchCount, setFetchCount] = useState(0)
  const [fetchTotal, setFetchTotal] = useState(0)

  async function getPhonetics() {
    if (!orKey || fetchingPhonetics) return
    const needsFix = vocab.filter(w => phoneticsNeedsFixing(w.phonetic))
    if (!needsFix.length) { setFetchProgress('✅ All phonetics look good!'); setTimeout(() => setFetchProgress(''), 3000); return }
    setFetchingPhonetics(true)
    setFetchCount(0)
    setFetchTotal(needsFix.length)
    const BATCH = 20  // smaller batch so all fit in token limit
    let updated = [...vocab]
    let done = 0
    for (let i = 0; i < needsFix.length; i += BATCH) {
      const batch = needsFix.slice(i, i + BATCH)
      try {
        const map = await fetchTargetPhoneticsQwen(batch, orKey)
        for (const w of batch) {
          const ph = map[w.id] || map[w.thai]  // check both id and thai key
          if (ph) {
            done++
            setFetchCount(done)
            updated = updated.map(v => v.id === w.id ? { ...v, phonetic: ph } : v)
          }
        }
        onVocabUpdate && onVocabUpdate(updated)
      } catch(e) { console.warn('Phonetic batch failed:', e) }
    }
    setFetchingPhonetics(false)
    setFetchTotal(0)
    const good = updated.filter(w => !phoneticsNeedsFixing(w.phonetic)).length
    setFetchProgress(`✅ ${good} / ${vocab.length} words fixed`)
    setTimeout(() => setFetchProgress(''), 5000)
  }

  const filters = [['all','All'],['due','Due'],['new','New'],['learning','Learning'],['known','Known'],['lapsed','Lapsed']]

  return (
    <div className="fade-in" style={{ padding: 16, maxWidth: 500, margin: '0 auto' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer' }}>
          <Icon name="arrow_left" size={20} />
        </button>
        <span className="display" style={{ fontSize: 18 }}>Browse Vocabulary</span>
        <span style={{ marginLeft: 'auto', fontSize: 12, color: 'var(--muted)' }}>{filtered.length} words</span>
      </div>

      {/* Search */}
      <div style={{ position: 'relative', marginBottom: 12 }}>
        <Icon name="search" size={16} color="var(--muted)" style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)' }} />
        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search Thai or English..."
          style={{ width: '100%', padding: '10px 12px 10px 36px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 10, color: 'var(--text)', fontSize: 14, fontFamily: 'Sarabun, sans-serif', outline: 'none' }} />
      </div>

      {/* Filters */}
      <div style={{ display: 'flex', gap: 6, marginBottom: 10, overflowX: 'auto', paddingBottom: 4 }}>
        {filters.map(([id, label]) => (
          <button key={id} onClick={() => setFilter(id)}
            style={{ padding: '6px 12px', borderRadius: 20, border: '1px solid', borderColor: filter === id ? 'var(--gold)' : 'var(--border)', background: filter === id ? '#1e1600' : 'transparent', color: filter === id ? 'var(--gold)' : 'var(--muted)', fontSize: 12, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap', fontFamily: 'Sarabun, sans-serif', transition: 'all 0.15s' }}>
            {label}
          </button>
        ))}
      </div>

      {/* Get Phonetics batch button */}
      {orKey && (
        <div style={{ marginBottom: 8 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <button onClick={getPhonetics} disabled={fetchingPhonetics}
              style={{ padding: '6px 14px', borderRadius: 20, border: `1px solid ${fetchingPhonetics ? 'var(--gold)' : 'var(--border)'}`, background: 'var(--surface)', color: fetchingPhonetics ? 'var(--gold)' : 'var(--text)', fontSize: 12, fontWeight: 600, cursor: fetchingPhonetics ? 'default' : 'pointer', fontFamily: 'Sarabun,sans-serif', minWidth: 120, textAlign: 'center' }}>
              {fetchingPhonetics ? `⏳ ${fetchCount} / ${fetchTotal}` : '🔤 Fix Phonetics'}
            </button>
            <span style={{ fontSize: 11, color: 'var(--gold)' }}>{vocab.filter(w => !phoneticsNeedsFixing(w.phonetic)).length}/{vocab.length} clean</span>
          </div>
          {fetchingPhonetics && fetchTotal > 0 && (
            <div style={{ marginTop: 6 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 3 }}>
                <span style={{ fontSize: 12, color: 'var(--gold)' }}>✔ {fetchCount} / {fetchTotal} words updated</span>
                <span style={{ fontSize: 11, color: 'var(--muted)' }}>{Math.round(fetchCount/fetchTotal*100)}%</span>
              </div>
              <div style={{ height: 4, background: 'var(--surface2)', borderRadius: 2, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${Math.round(fetchCount/fetchTotal*100)}%`, background: 'var(--gold)', borderRadius: 2, transition: 'width 0.1s ease' }} />
              </div>
            </div>
          )}
          {!fetchingPhonetics && fetchProgress && <p style={{ fontSize: 12, color: 'var(--muted)', marginTop: 4 }}>{fetchProgress}</p>}
        </div>
      )}

      {/* Custom Track select mode */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
        <button onClick={() => { setSelecting(s => !s); setSelected(new Set()) }}
          style={{ padding: '6px 14px', borderRadius: 20, border: `1px solid ${selecting ? 'var(--gold)' : 'var(--border)'}`, background: selecting ? '#1e1600' : 'transparent', color: selecting ? 'var(--gold)' : 'var(--muted)', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'Sarabun,sans-serif', transition: 'all 0.15s' }}>
          {selecting ? `☑ Select mode (${selected.size}/30)` : '＋ Custom Track'}
        </button>
        {selecting && selected.size > 0 && (
          <button onClick={() => onCustomTrack(vocab.filter(w => selected.has(w.id)))}
            style={{ padding: '7px 16px', borderRadius: 20, border: 'none', background: 'linear-gradient(135deg,#d4a94a,#b88a35)', color: '#0b1120', fontSize: 12, fontWeight: 700, cursor: 'pointer', fontFamily: 'Sarabun,sans-serif' }}>
            Generate ({selected.size})
          </button>
        )}
      </div>

      {/* List */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, overflowY: 'auto', maxHeight: 'calc(100vh - 300px)' }}>
        {filtered.map(w => {
          const isSelected = selected.has(w.id)
          const phonetic = w.phonetic || (phonetics || {})[w.id] || (phonetics || {})[w.thai] || ''
          return (
            <Card key={w.id} onClick={selecting ? () => toggleSelect(w) : undefined}
              style={{ padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 12, ...(isSelected ? { borderColor: 'var(--gold)', background: '#1a1200' } : {}) }}
              hover={selecting}>
              {selecting && (
                <div style={{ width: 20, height: 20, borderRadius: '50%', border: `2px solid ${isSelected ? 'var(--gold)' : 'var(--border)'}`, background: isSelected ? 'var(--gold)' : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, fontSize: 11, color: '#0b1120', fontWeight: 700 }}>
                  {isSelected && '✓'}
                </div>
              )}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span className="thai" style={{ fontSize: 20, color: 'var(--text)' }}>{w.thai}</span>
                  <Badge status={w.status} />
                  <button onClick={e => { e.stopPropagation(); const u = new SpeechSynthesisUtterance(w.thai); u.lang='th-TH'; u.rate=0.8; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u) }}
                    style={{ background:'none', border:'none', cursor:'pointer', fontSize:14, padding:'0 2px', color:'var(--muted)', lineHeight:1 }} title="Speak">🔊</button>
                  {w.status !== 'known' && (
                    <button onClick={e => { e.stopPropagation(); onVocabUpdate && onVocabUpdate(vocab.map(v => v.id===w.id ? markWordKnown(v) : v)) }}
                      style={{ background:'none', border:'none', cursor:'pointer', fontSize:11, padding:'0 3px', color:'#10b981', lineHeight:1, fontWeight:700 }} title="Mark Known">✓K</button>
                  )}
                </div>
                {phonetic && <p className="phon" style={{ fontSize: 11, color: 'var(--gold)', marginTop: 2 }}>{phonetic}</p>}
                <p style={{ fontSize: 13, color: 'var(--muted)', marginTop: 2 }}>{w.english}</p>
              </div>
              <div style={{ textAlign: 'right', flexShrink: 0 }}>
                <p className="phon" style={{ fontSize: 11, color: 'var(--muted)' }}>×{w.repCount}</p>
                {w.lapses > 0 && <p style={{ fontSize: 10, color: '#ef4444' }}>{w.lapses} lapse</p>}
              </div>
            </Card>
          )
        })}
        {filtered.length === 0 && <p style={{ textAlign: 'center', color: 'var(--muted)', padding: 32 }}>No words found</p>}
      </div>
    </div>
  )
}

// ── Add Words ─────────────────────────────────────────────────────────────────
function Adder({ onBack, onAdded, orKey }) {
  const [thai, setThai] = useState('')
  const [english, setEnglish] = useState('')
  const [phonetic, setPhonetic] = useState('')
  const [added, setAdded] = useState([])
  const [bulk, setBulk] = useState('')
  const [tab, setTab] = useState('single')
  const [filling, setFilling] = useState(false)

  async function autoFill() {
    if (!thai.trim() || !orKey) return
    setFilling(true)
    try {
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${orKey}`, 'HTTP-Referer': 'https://magical-druid-656889.netlify.app', 'X-Title': 'Thai Teacher' },
        body: JSON.stringify({ model: 'openai/gpt-4o-mini', max_tokens: 200, temperature: 0,
          messages: [{ role: 'user', content: `For the Thai word/phrase "${thai.trim()}", give me:
1. English translation (short, common meaning)
2. Tone-marked romanization (mid=none, low=à, falling=â, high=á, rising=ǎ, hyphens between syllables)
Respond ONLY with valid JSON: {"english":"...","phonetic":"..."}` }] })
      })
      if (res.ok) {
        const data = await res.json()
        let text = (data.choices?.[0]?.message?.content || '').replace(/<think>[\s\S]*?<\/think>/g, '').trim().replace(/^```[\w]*[\r\n]?|[\r\n]?```$/g, '').trim()
        const parsed = JSON.parse(text)
        if (parsed.english && !english) setEnglish(parsed.english)
        if (parsed.phonetic) setPhonetic(parsed.phonetic)
      }
    } catch {}
    setFilling(false)
  }

  function addSingle() {
    if (!thai.trim() || !english.trim()) return
    const word = { thai: thai.trim(), english: english.trim(), phonetic: phonetic.trim() || undefined }
    setAdded(a => [...a, word])
    setThai(''); setEnglish(''); setPhonetic('')
  }

  function addBulk() {
    const lines = bulk.split('\n').filter(l => l.includes('=') || l.includes('-') || l.includes(':') || l.includes('\t'))
    const words = lines.map(l => {
      const [t, e] = l.split(/[=\-:\t]/).map(s => s.trim())
      return t && e ? { thai: t, english: e } : null
    }).filter(Boolean)
    setAdded(a => [...a, ...words])
    setBulk('')
  }

  function save() {
    if (!added.length) return
    onAdded(added)
  }

  const inputStyle = { width: '100%', padding: '10px 12px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 10, color: 'var(--text)', fontSize: 15, fontFamily: 'Sarabun, sans-serif', outline: 'none', marginBottom: 10 }

  return (
    <div className="fade-in" style={{ padding: 16, maxWidth: 500, margin: '0 auto' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer' }}>
          <Icon name="arrow_left" size={20} />
        </button>
        <span className="display" style={{ fontSize: 18 }}>Add Words</span>
      </div>

      {/* Tabs */}
      <div style={{ display: 'flex', gap: 0, marginBottom: 16, background: 'var(--surface)', borderRadius: 10, padding: 4 }}>
        {[['single', 'Single'], ['bulk', 'Bulk Import']].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            style={{ flex: 1, padding: '8px', borderRadius: 8, border: 'none', background: tab === id ? 'var(--surface2)' : 'transparent', color: tab === id ? 'var(--text)' : 'var(--muted)', fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'Sarabun, sans-serif', transition: 'all 0.15s' }}>
            {label}
          </button>
        ))}
      </div>

      {tab === 'single' ? (
        <div>
          <input value={thai} onChange={e => setThai(e.target.value)} placeholder="Thai word (e.g. กิน)" className="thai" style={inputStyle} onKeyDown={e => e.key === 'Enter' && addSingle()} />
          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
            <input value={english} onChange={e => setEnglish(e.target.value)} placeholder="English meaning (e.g. eat)" style={{ ...inputStyle, marginBottom: 0, flex: 1 }} onKeyDown={e => e.key === 'Enter' && addSingle()} />
            {orKey && <button onClick={autoFill} disabled={!thai.trim() || filling}
              style={{ padding: '10px 14px', borderRadius: 10, border: '1px solid var(--border)', background: 'var(--surface2)', color: thai.trim() ? 'var(--gold)' : 'var(--muted)', cursor: thai.trim() && !filling ? 'pointer' : 'default', fontSize: 13, fontFamily: 'Sarabun,sans-serif', whiteSpace: 'nowrap' }}>
              {filling ? '⏳' : '✨ Fill'}
            </button>}
          </div>
          <input value={phonetic} onChange={e => setPhonetic(e.target.value)} placeholder="Phonetic (e.g. gin) — optional" className="phon" style={{ ...inputStyle, fontSize: 13, color: 'var(--gold)' }} onKeyDown={e => e.key === 'Enter' && addSingle()} />
          <Btn onClick={addSingle} variant="secondary" style={{ width: '100%', justifyContent: 'center' }}>
            <Icon name="plus" size={14} /> Add Word
          </Btn>
        </div>
      ) : (
        <div>
          <p style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 8 }}>One word per line: Thai = English (or Thai - English, Thai: English)</p>
          <textarea value={bulk} onChange={e => setBulk(e.target.value)} placeholder={"กิน = eat\nดื่ม = drink\nนอน = sleep"}
            style={{ ...inputStyle, minHeight: 160, resize: 'vertical' }} />
          <Btn onClick={addBulk} variant="secondary" style={{ width: '100%', justifyContent: 'center' }}>
            <Icon name="plus" size={14} /> Parse & Add
          </Btn>
        </div>
      )}

      {/* Preview */}
      {added.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <p style={{ fontSize: 12, color: 'var(--muted)' }}>{added.length} words ready to save</p>
            <button onClick={() => setAdded([])} style={{ background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer', fontSize: 12 }}>Clear</button>
          </div>
          <div style={{ maxHeight: 200, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 4 }}>
            {added.map((w, i) => (
              <div key={i} style={{ display: 'flex', gap: 8, padding: '8px 12px', background: 'var(--surface)', borderRadius: 8, fontSize: 13 }}>
                <span className="thai" style={{ color: 'var(--gold)' }}>{w.thai}</span>
                {w.phonetic && <span className="phon" style={{ color: '#9a7a35', fontSize: 12 }}>{w.phonetic}</span>}
                <span style={{ color: 'var(--muted)' }}>= {w.english}</span>
              </div>
            ))}
          </div>
          <Btn onClick={save} variant="primary" style={{ width: '100%', justifyContent: 'center', marginTop: 12 }}>
            <Icon name="check" size={14} /> Save {added.length} Words
          </Btn>
        </div>
      )}
    </div>
  )
}

// ── Import Track (paste JSON from Claude chat) ────────────────────────────────
function ImportTrack({ onBack, onImported, vocab }) {
  const [text, setText] = useState('')
  const [error, setError] = useState('')
  const [preview, setPreview] = useState(null)

  function parse() {
    setError('')
    try {
      // Accept raw JSON or a code block
      const clean = text.replace(/```json\n?|\n?```/g, '').trim()
      const data = JSON.parse(clean)
      // Accept array of pairs OR full track object
      const pairs = Array.isArray(data) ? data : data.pairs
      if (!pairs || !pairs.length) throw new Error('No pairs found')
      // Validate first pair has required fields
      if (!pairs[0].prompt || !pairs[0].thai) throw new Error('Pairs must have "prompt" and "thai" fields')
      // Build keywords list by matching thai words to vocab
      const keywords = []
      const seen = new Set()
      for (const p of pairs) {
        const match = vocab.find(w => p.thai?.includes(w.thai) && !seen.has(w.id))
        if (match) { keywords.push({ thai: match.thai, english: match.english, wordId: match.id, rating: null }); seen.add(match.id) }
      }
      const track = {
        date: data.date || new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
        mode: data.mode || 'daily',
        pairs,
        keywords: keywords.slice(0, 20),
        rated: false,
        createdAt: new Date().toISOString(),
      }
      setPreview(track)
    } catch (e) {
      setError(e.message)
    }
  }

  const wordCount = preview?.keywords?.length || 0

  return (
    <div className="fade-in" style={{ padding: 16, maxWidth: 500, margin: '0 auto' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer' }}>
          <Icon name="arrow_left" size={20} />
        </button>
        <span className="display" style={{ fontSize: 18 }}>Import Track from Chat</span>
      </div>

      {!preview ? (
        <>
          <Card style={{ padding: 16, marginBottom: 16, borderColor: 'var(--gold-dim)' }}>
            <p style={{ fontSize: 13, color: 'var(--gold)', fontWeight: 600, marginBottom: 6 }}>How to get your track:</p>
            <ol style={{ color: 'var(--muted)', fontSize: 13, lineHeight: 1.8, paddingLeft: 18 }}>
              <li>Go back to the Claude chat</li>
              <li>Say <strong style={{ color: 'var(--text)' }}>"Generate a daily track for me"</strong></li>
              <li>Claude will output a JSON track</li>
              <li>Copy the full JSON and paste it below</li>
            </ol>
          </Card>

          <textarea value={text} onChange={e => setText(e.target.value)}
            placeholder={'Paste track JSON here...\n\n[{"prompt": "...", "thai": "...", "english": "..."},\n ...]'}
            style={{ width: '100%', minHeight: 200, padding: '12px 14px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 10, color: 'var(--text)', fontSize: 13, fontFamily: 'DM Mono, monospace', outline: 'none', resize: 'vertical', marginBottom: 10 }} />

          {error && <p style={{ color: '#ef4444', fontSize: 13, marginBottom: 10 }}>⚠️ {error}</p>}

          <Btn onClick={parse} variant="primary" disabled={!text.trim()} style={{ width: '100%', justifyContent: 'center' }}>
            Parse Track
          </Btn>
        </>
      ) : (
        <div>
          <Card style={{ padding: 16, marginBottom: 14, borderColor: '#2d6b2d' }}>
            <p style={{ color: '#10b981', fontWeight: 600, marginBottom: 4 }}>✓ Track ready to load</p>
            <p style={{ color: 'var(--muted)', fontSize: 13 }}>{preview.pairs.length} pairs · {wordCount} keywords matched to your vocab</p>
          </Card>

          <div style={{ maxHeight: 260, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 14 }}>
            {preview.pairs.slice(0, 8).map((p, i) => (
              <Card key={i} style={{ padding: '10px 14px' }} hover={false}>
                <p style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 4 }}>{p.prompt}</p>
                <p className="thai" style={{ fontSize: 18, color: 'var(--gold)' }}>{p.thai}</p>
                {p.phonetic && <p className="phon" style={{ fontSize: 11, color: 'var(--muted)', marginTop: 2 }}>{p.phonetic}</p>}
              </Card>
            ))}
            {preview.pairs.length > 8 && <p style={{ textAlign: 'center', color: 'var(--muted)', fontSize: 12 }}>+{preview.pairs.length - 8} more pairs</p>}
          </div>

          <div style={{ display: 'flex', gap: 10 }}>
            <Btn onClick={() => setPreview(null)} variant="ghost" style={{ flex: 1, justifyContent: 'center' }}>Back</Btn>
            <Btn onClick={() => onImported(preview)} variant="primary" style={{ flex: 2, justifyContent: 'center' }}>
              <Icon name="play" size={14} /> Start Track
            </Btn>
          </div>
        </div>
      )}
    </div>
  )
}


// ── Export / Import Data ─────────────────────────────────────────────────────
function DataManager({ onBack, vocab, tracks, onImport }) {
  const [importing, setImporting] = useState(false)
  const [msg, setMsg] = useState('')

  function exportData() {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      vocab,
      tracks,
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = `thai-teacher-backup-${new Date().toISOString().slice(0,10)}.json`
    a.click()
    URL.revokeObjectURL(url)
    setMsg('✅ Downloaded!')
    setTimeout(() => setMsg(''), 3000)
  }

  function handleImport(e) {
    const file = e.target.files[0]
    if (!file) return
    // Warn if this looks like the manifest
    if (file.name === 'manifest.json') {
      setMsg('❌ That is the app manifest file, not your backup. Pick thai-teacher-backup-*.json')
      return
    }
    setImporting(true)
    const reader = new FileReader()
    reader.onload = (ev) => {
      try {
        const raw = ev.target.result
        if (!raw || !raw.trim()) throw new Error('File is empty')
        const data = JSON.parse(raw)
        // Accept {version,vocab,tracks} format or raw vocab array
        let vocab, tracks
        if (Array.isArray(data)) {
          // Raw vocab array
          vocab = data; tracks = []
        } else if (data && Array.isArray(data.vocab)) {
          vocab = data.vocab; tracks = data.tracks || []
        } else {
          throw new Error('Could not find vocab data in file. Keys found: ' + Object.keys(data||{}).join(', '))
        }
        if (!vocab.length) throw new Error('Vocab list is empty')
        onImport(vocab, tracks)
        setMsg(`✅ Restored ${vocab.length} words and ${tracks.length} tracks — reloading...`)
        setTimeout(() => window.location.reload(), 1200)
      } catch(e) {
        setMsg('❌ ' + e.message)
      }
      setImporting(false)
    }
    reader.readAsText(file)
  }

  return (
    <div className="fade-in" style={{ padding:16, maxWidth:500, margin:'0 auto' }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:24 }}>
        <button onClick={onBack} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', padding:4 }}>
          <Icon name="arrow_left" size={20} />
        </button>
        <span className="display" style={{ fontSize:18 }}>Backup & Restore</span>
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
        <Card style={{ padding:16 }}>
          <p style={{ fontSize:13, fontWeight:600, color:'var(--text)', marginBottom:6 }}>Export Data</p>
          <p style={{ fontSize:12, color:'var(--muted)', marginBottom:12, lineHeight:1.6 }}>
            Downloads a JSON file with all your words, SRS progress, and track history. Save this to transfer to another device.
          </p>
          <p style={{ fontSize:11, color:'var(--muted)', marginBottom:12 }}>
            {vocab.length} words · {tracks.length} tracks
          </p>
          <Btn onClick={exportData} variant="primary" style={{ width:'100%', justifyContent:'center' }}>
            ⬇ Download Backup
          </Btn>
        </Card>

        <Card style={{ padding:16, borderColor:'#3d1a1a' }}>
          <p style={{ fontSize:13, fontWeight:600, color:'#ef4444', marginBottom:6 }}>Import & Replace</p>
          <p style={{ fontSize:12, color:'var(--muted)', marginBottom:12, lineHeight:1.6 }}>
            ⚠️ This replaces ALL current data with the backup file. Use to restore on a new device.
          </p>
          <label style={{ display:'block', padding:'12px', borderRadius:10, border:'1px dashed #3d1a1a', textAlign:'center', cursor:'pointer', color:'#ef4444', fontSize:14, fontWeight:600 }}>
            📂 Choose Backup File
            <p style={{ fontSize:10, color:'var(--muted)', marginTop:4 }}>Look for: thai-teacher-backup-YYYY-MM-DD.json</p>
            <input type="file" accept=".json" onChange={handleImport} style={{ display:'none' }} />
          </label>
        </Card>

        {msg && <p style={{ textAlign:'center', fontSize:13, color: msg.startsWith('✅') ? '#10b981' : '#ef4444', padding:8 }}>{msg}</p>}
      </div>
    </div>
  )
}

function DeepSeekTestBtn({ dsKey }) {

  async function test() {

      })
      if (res.ok) setStatus('✅ DeepSeek key works!')
      else { const d = await res.json().catch(()=>({})); setStatus('❌ ' + (d?.error?.message || `Error ${res.status}`)) }
    } catch(e) { setStatus('❌ ' + e.message) }
    setTesting(false)
  }
  return (
    <div>
      <button onClick={test} disabled={!dsKey.trim() || testing}
        style={{ width:'100%', padding:'9px', borderRadius:10, border:'1px solid var(--border)', background:'var(--surface2)', color:dsKey.trim()?'var(--text)':'var(--muted)', cursor:dsKey.trim()?'pointer':'not-allowed', fontSize:13, fontFamily:'Sarabun,sans-serif', fontWeight:600 }}>
        {testing ? 'Testing...' : 'Test DeepSeek Key'}
      </button>
      {status && <p style={{ fontSize:12, marginTop:6, color:status.startsWith('✅')?'#10b981':'#ef4444' }}>{status}</p>}
    </div>
  )
}

const PROVIDERS = [
  { id: 'deepseek', label: 'DeepSeek', sub: 'via OpenRouter', placeholder: 'sk-or-v1-...', storage: 'tt-orkey' },
  { id: 'gpt4omini', label: 'GPT-4o mini', sub: 'via OpenRouter', placeholder: 'sk-or-v1-...', storage: 'tt-orkey' },
  { id: 'haiku', label: 'Claude Haiku', sub: '4.5 via OpenRouter', placeholder: 'sk-or-v1-...', storage: 'tt-orkey' },
]

function Settings({ onBack, apiKey, onSaveKey, provider, onSaveProvider, dsKey, onSaveDsKey, orKey, onSaveOrKey }) {
  // Key state per provider
  const [keys, setKeys] = useState({ claude: apiKey || '', deepseek: dsKey || '', gpt4omini: orKey || '' })
  const [saved, setSaved] = useState('')
  const [testing, setTesting] = useState(false)
  const [testResult, setTestResult] = useState('')

  const prov = PROVIDERS.find(p => p.id === provider) || PROVIDERS[0]
  const currentKey = keys[provider] || ''

  function setKey(k) { setKeys(prev => ({ ...prev, [provider]: k })); setSaved(''); setTestResult('') }

  async function saveKey() {
    const trimmed = currentKey.trim()
    await stSet('tt-orkey', trimmed); onSaveOrKey(trimmed)
    setSaved(provider)
    setTimeout(() => setSaved(''), 2000)
  }

  async function testKey() {
    if (!currentKey.trim()) return
    setTesting(true); setTestResult('')
    try {
      let res
      if (provider === 'claude') {
        res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': currentKey.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 10, messages: [{ role: 'user', content: 'hi' }] })
        })
      } else {
        res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentKey.trim()}`, 'HTTP-Referer': 'https://magical-druid-656889.netlify.app', 'X-Title': 'Thai Teacher' },
          body: JSON.stringify({ model: 'openai/gpt-4o-mini', max_tokens: 10, messages: [{ role: 'user', content: 'hi' }] })
        })
      }
      if (res.ok) setTestResult('✅ Key works!')
      else { const d = await res.json().catch(() => ({})); setTestResult('❌ ' + (d?.error?.message || `Error ${res.status}`)) }
    } catch(e) { setTestResult('❌ ' + e.message) }
    setTesting(false)
  }

  const keySource = { deepseek: 'openrouter.ai → Keys (model: deepseek/deepseek-chat)', gpt4omini: 'openrouter.ai → Keys (model: openai/gpt-4o-mini)', haiku: 'openrouter.ai → Keys (model: anthropic/claude-haiku-4-5)' }

  return (
    <div className="fade-in" style={{ padding: 16, maxWidth: 500, margin: '0 auto' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer', padding: 4 }}>
          <Icon name="arrow_left" size={20} />
        </button>
        <span className="display" style={{ fontSize: 18 }}>Settings</span>
      </div>

      <Card style={{ padding: 16, marginBottom: 12 }}>
        <p style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>AI Provider</p>

        {/* Provider selector */}
        <div style={{ display: 'flex', gap: 6, marginBottom: 16 }}>
          {PROVIDERS.map(p => (
            <button key={p.id} onClick={() => { onSaveProvider(p.id); setTestResult('') }}
              style={{ flex: 1, padding: '10px 4px', borderRadius: 10, border: `1px solid ${provider === p.id ? 'var(--gold)' : 'var(--border)'}`, background: provider === p.id ? '#1e1600' : 'transparent', color: provider === p.id ? 'var(--gold)' : 'var(--muted)', cursor: 'pointer', fontSize: 12, fontWeight: 600, fontFamily: 'Sarabun,sans-serif', textAlign: 'center', lineHeight: 1.3 }}>
              <div>{p.label}</div>
              <div style={{ fontSize: 10, opacity: 0.7 }}>{p.sub}</div>
            </button>
          ))}
        </div>

        {/* Key input for selected provider */}
        <p style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 8 }}>
          Get your key at <span style={{ color: 'var(--text)' }}>{keySource[provider]}</span>
        </p>
        <input type="password" value={currentKey} onChange={e => setKey(e.target.value)}
          placeholder={prov.placeholder}
          style={{ width: '100%', padding: '10px 12px', background: 'var(--surface2)', border: '1px solid var(--border)', borderRadius: 10, color: 'var(--text)', fontSize: 14, fontFamily: 'DM Mono, monospace', outline: 'none', marginBottom: 8 }} />
        <div style={{ display: 'flex', gap: 8 }}>
          <button onClick={testKey} disabled={!currentKey.trim() || testing}
            style={{ flex: 1, padding: '10px', borderRadius: 10, border: '1px solid var(--border)', background: 'var(--surface2)', color: currentKey.trim() ? 'var(--text)' : 'var(--muted)', cursor: currentKey.trim() ? 'pointer' : 'not-allowed', fontSize: 13, fontFamily: 'Sarabun,sans-serif', fontWeight: 600 }}>
            {testing ? 'Testing...' : 'Test Key'}
          </button>
          <button onClick={saveKey} disabled={!currentKey.trim()}
            style={{ flex: 2, padding: '10px', borderRadius: 10, border: 'none', background: saved === provider ? '#063d2e' : 'linear-gradient(135deg,#d4a94a,#b88a35)', color: saved === provider ? '#10b981' : '#0b1120', cursor: currentKey.trim() ? 'pointer' : 'not-allowed', fontSize: 14, fontFamily: 'Sarabun,sans-serif', fontWeight: 700, transition: 'all 0.3s' }}>
            {saved === provider ? '✓ Saved' : 'Save Key'}
          </button>
        </div>
        {testResult && <p style={{ fontSize: 13, marginTop: 10, color: testResult.startsWith('✅') ? '#10b981' : '#ef4444' }}>{testResult}</p>}

        {/* Status */}
        <div style={{ marginTop: 14, padding: '10px 12px', borderRadius: 10, background: 'var(--surface2)', display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: (provider === 'claude' && apiKey) || (provider === 'deepseek' && dsKey) || ((provider === 'gpt4omini' || provider === 'haiku') && orKey) ? '#10b981' : '#6b7280', flexShrink: 0 }} />
          <p style={{ fontSize: 12, color: 'var(--muted)' }}>
            {(provider === 'claude' && apiKey) || (provider === 'deepseek' && dsKey) || ((provider === 'gpt4omini' || provider === 'haiku') && orKey)
              ? `${prov.label} ${prov.sub} active — generates tracks, phonetics and translation`
              : `No ${prov.label} key saved — add your key above to enable AI track generation`}
          </p>
        </div>
      </Card>
    </div>
  )
}

function BeltRankView({ vocab, onBack }) {
  const known = (vocab||[]).filter(w => w.status === 'known').length

  const BELTS = [
    { name:'Mukyu',    belt:'White Belt',        color:'#9ca3af', min:0,    max:99,   sentMin:2,  sentMax:4,  desc:'First steps. Short survival phrases.' },
    { name:'10th Kyu', belt:'Orange Belt',        color:'#f97316', min:100,  max:199,  sentMin:5,  sentMax:6,  desc:'Basic greetings, food, directions.' },
    { name:'9th Kyu',  belt:'Orange + Stripe',    color:'#fb923c', min:200,  max:349,  sentMin:6,  sentMax:7,  desc:'Simple present. Ordering, asking questions.' },
    { name:'8th Kyu',  belt:'Blue Belt',          color:'#3b82f6', min:350,  max:499,  sentMin:7,  sentMax:8,  desc:'Short conversations. Tense markers.' },
    { name:'7th Kyu',  belt:'Blue + Stripe',      color:'#60a5fa', min:500,  max:749,  sentMin:8,  sentMax:9,  desc:'Expanded topics. Past, future, negation.' },
    { name:'6th Kyu',  belt:'Yellow Belt',        color:'#eab308', min:750,  max:999,  sentMin:9,  sentMax:10, desc:'Connectors, comparisons, opinions.' },
    { name:'5th Kyu',  belt:'Yellow + Stripe',    color:'#facc15', min:1000, max:1499, sentMin:10, sentMax:11, desc:'Natural dialogue. Hypotheticals, nuance.' },
    { name:'4th Kyu',  belt:'Green Belt',         color:'#22c55e', min:1500, max:1999, sentMin:11, sentMax:12, desc:'Fluid conversation. Idioms, culture.' },
    { name:'3rd Kyu',  belt:'Green + Stripe',     color:'#4ade80', min:2000, max:2999, sentMin:12, sentMax:13, desc:'Complex topics. Abstract, formal register.' },
    { name:'2nd Kyu',  belt:'Brown Belt',         color:'#92400e', min:3000, max:3999, sentMin:13, sentMax:14, desc:'Near-fluent. Long discourse, multiple clauses.' },
    { name:'1st Kyu',  belt:'Brown + Stripe',     color:'#b45309', min:4000, max:4999, sentMin:14, sentMax:15, desc:'Advanced fluency. Rare words, register switching.' },
    { name:'Shodan',   belt:'Black Belt',         color:'#111827', min:5000, max:99999,sentMin:16, sentMax:20, desc:'Master level. Natural unrestricted Thai.' },
  ]

  const currentIdx = BELTS.findIndex(b => known >= b.min && known <= b.max)
  const currentBelt = BELTS[currentIdx] || BELTS[0]
  const nextBelt = BELTS[currentIdx + 1]
  const wordsToNext = nextBelt ? nextBelt.min - known : 0
  const progress = nextBelt ? Math.round(((known - currentBelt.min) / (nextBelt.min - currentBelt.min)) * 100) : 100

  return (
    <div style={{ padding:'16px', maxWidth:480, margin:'0 auto' }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:20 }}>
        <button onClick={onBack} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', fontSize:22, padding:0, lineHeight:1 }}>←</button>
        <h2 style={{ margin:0, fontSize:20, color:'var(--text)' }}>Belt Ranks</h2>
      </div>

      {/* Current rank card */}
      <div style={{ background:'var(--surface)', border:'2px solid '+currentBelt.color, borderRadius:12, padding:'16px', marginBottom:20 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
          <div>
            <div style={{ fontSize:20, fontWeight:800, color:currentBelt.color }}>{currentBelt.name}</div>
            <div style={{ fontSize:13, color:'var(--muted)', marginTop:2 }}>{currentBelt.belt}</div>
          </div>
          <div style={{ textAlign:'right' }}>
            <div style={{ fontSize:22, fontWeight:800, color:'var(--gold)' }}>{known}</div>
            <div style={{ fontSize:11, color:'var(--muted)' }}>known words</div>
          </div>
        </div>
        <div style={{ fontSize:12, color:'var(--muted)', margin:'10px 0 8px' }}>{currentBelt.desc}</div>
        <div style={{ display:'flex', gap:16, fontSize:12 }}>
          <div style={{ color:'var(--gold)', fontWeight:700 }}>📏 {currentBelt.sentMin}–{currentBelt.sentMax} words per sentence</div>
          {nextBelt && <div style={{ color:'var(--muted)' }}>{wordsToNext} to {nextBelt.name}</div>}
        </div>
        {nextBelt && (
          <div style={{ marginTop:10, background:'var(--bg)', borderRadius:6, height:6, overflow:'hidden' }}>
            <div style={{ height:'100%', background:currentBelt.color, width:progress+'%', transition:'width 0.3s' }} />
          </div>
        )}
      </div>

      {/* All ranks */}
      <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
        {BELTS.map((b, idx) => {
          const isCurrent = b.name === currentBelt.name
          const isPassed = known > b.max
          return (
            <div key={b.name} style={{
              background: isCurrent ? 'var(--surface)' : 'transparent',
              border: '1px solid ' + (isCurrent ? b.color : 'var(--border)'),
              borderRadius: 10,
              padding: '10px 14px',
              opacity: isPassed ? 0.45 : 1,
            }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                  <div style={{ width:12, height:12, borderRadius:'50%', background:b.color, flexShrink:0, border: isCurrent ? '2px solid white' : 'none' }} />
                  <div>
                    <div style={{ fontSize:14, fontWeight: isCurrent ? 800 : 600, color: isCurrent ? b.color : 'var(--text)' }}>
                      {b.name} {isCurrent ? '← you' : ''}
                    </div>
                    <div style={{ fontSize:11, color:'var(--muted)' }}>{b.belt}</div>
                  </div>
                </div>
                <div style={{ textAlign:'right', flexShrink:0 }}>
                  <div style={{ fontSize:11, color:'var(--muted)' }}>{b.min === 0 ? '0' : b.min}–{b.max === 99999 ? '∞' : b.max}</div>
                  <div style={{ fontSize:12, color:'var(--gold)', fontWeight:700 }}>{b.sentMin}–{b.sentMax}w</div>
                </div>
              </div>
            </div>
          )
        })}
      </div>
      <div style={{ height:30 }} />
    </div>
  )
}
