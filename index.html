  {"id": "abs-beg-s2-01", "num": 1, "season": 2, "title": "Want to Stay in a Thai Guesthouse?", "situation": "Checking in to a Thai guesthouse.", "coreConceptIds": ["s2_availability"], "keyPattern": {"thai": "มี + noun + ไหมครับ", "phonetic": "mii + noun + mǎi khráp", "english": "Do you have [noun]?"}, "teacherExplanation": "มี (mii) + noun + ไหม (mǎi) asks if something is available. มีห้องว่างไหม (mii hâwng-wâang mǎi) means do you have a free room. This is the standard way to ask if anything is available.", "dialogue": [{"gender": "male", "thai": "ไปถนนข้าวสารครับ . เสียงรถวิง . คนขับแท็กซี เกสต์เฮ้าส์ไหนครับ", "phonetic": "bpai thà-nǒn khâao-sǎan khráp.", "english": "I'm going to Khaosan Road."}, {"gender": "male", "thai": "อืมมม...ยังไม่รู้เลยครับ, แต่อยากพักเกสต์เฮ้าส์ทีถูกๆ . คนขับแท็กซี อ้อ...ผมรู้จักเกสต์เฮาส์ทีสะอาด และราคาถูกอยู่ทีหนึงครับ, ชือ แมงโกเฮ้าส์", "phonetic": "uuem...yang mâi rúu looei khráp. dtàae yàak phák géet-háo thîi thùuk-thùuk.", "english": "Um...I don't know yet. But I want to stay in a guesthouse that's very cheap. ABSOLUTE BEGINNER S2 #1 - WANT TO STAY IN A THAI GUESTHOUSE? 3"}, {"gender": "male", "thai": "แมงโกเฮ้าส์ เป็นชือทีตลกจริงๆ โอเคครับ, ไปทีแมงโกเฮ้าส์ครับ", "phonetic": "maaeng-goo-háo. bpen chûue thîi dtà-lòk jing-jing. oo-khee khráp. bpai thîi maaeng-goo-háo khráp.", "english": "Mango House. That's really a funny name. OK. Go to Mango House."}], "vocab": [{"thai": "เกสต์เฮาส์", "phonetic": "géet-háo", "english": "guesthouse"}, {"thai": "ที", "phonetic": "thîi", "english": "at, in, to, that, which,"}, {"thai": "อยาก", "phonetic": "yàak", "english": "to want"}, {"thai": "ถูก", "phonetic": "thùuk", "english": "inexpensive, correct"}, {"thai": "พัก", "phonetic": "phák", "english": "to stay, to rest"}, {"thai": "ราคา", "phonetic": "raa-khaa", "english": "cost, price, to cost"}, {"thai": "ตลก", "phonetic": "dtà-lòk", "english": "funny"}, {"thai": "สะอาด", "phonetic": "sà-àat", "english": "clean"}, {"thai": "รู้จัก", "phonetic": "rú   {"id": "abs-beg-s2-02", "num": 2, "season": 2, "title": "This Thai Hotel Room is Too Small!", "situation": "Complaining that a hotel room is too small.", "coreConceptIds": ["s2_more_than"], "keyPattern": {"thai": "adj + กว่า", "phonetic": "adj + gwàa", "english": "More adj / adj-er"}, "teacherExplanation": "กว่า (gwàa) means more than or -er. Put it after an adjective to compare. ใหญ่กว่า (yài gwàa) = bigger. แพงกว่า (phaeng gwàa) = more expensive.", "dialogue": [{"gender": "male", "thai": "สวัสดีครับ, มีห้องว่างไหมครับ . พนักงานเกสต์เฮ้าส์ มีค่ะ", "phonetic": "sà-wàt-dii khráp. mii hâwng wâang mǎi khráp.", "english": "Hello. Do you have any vacant rooms?"}, {"gender": "male", "thai": "ขอดูห้องหน่อยได้ไหมครับ . พนักงานเกสต์เฮ้าส์ ได้เลยค่ะ . เสียงเดิน และเปิดประตูห้อง . พนักงานเกสต์เฮ้าส์ เป็นยังไงบ้างคะ", "phonetic": "khǎaw duu hâwng nàwy dâai mǎi khráp.", "english": "May I see the room?"}, {"gender": "male", "thai": "เอ่อ....มีห้องทีใหญ่กว่านีไหมครับ . พนักงานเกสต์เฮ้าส์ มีค่ะ . เสียงเดิน และเปิดประตูห้อง . พนักงานเกสต์เฮ้าส์ ห้องนีเป็นยังไงคะ", "phonetic": "òoe...mii hâwng thîi yài gwàa níi mǎi khráp.", "english": "Uh... Do you have any rooms bigger than this?"}, {"gender": "male", "thai": "อืมมม...ห้องนีดีกว่าเยอะเลยครับ, งันเอาห้องนีแล้วกันครับ", "phonetic": "", "english": ""}], "vocab": [{"thai": "ยินดีต้อนรับ", "phonetic": "yin-dii-dtâawn-ráp", "english": "Welcome"}, {"thai": "เยอะ", "phonetic": "yóe", "english": "many, much"}, {"thai": "นี", "phonetic": "níi", "english": "this"}, {"thai": "กว่า", "phonetic": "gwàa", "english": "more than"}, {"thai": "ใหญ่", "phonetic": "yài", "english": "big"}, {"thai": "ดู", "phonetic": "duu", "english": "to look, to watch"}, {"thai": "ว่าง", "phonetic": "wâang", "english": "free, vacant"}, {"thai": "ห้อง", "phonetic": "hâwng", "english": "room"}, {"thai": "สู่", "phonetic": "sùu", "english": "to"}, {"thai": "เอา", "phonetic": "ao", "english": "to take, to get"}], "samples": [{"thai": "สวัสดีค่ะ", "phonetic": "", "english": "Hello. Welcome to Siam Garden Hotel."}, {"thai": "สวัสดีค่ะ", "phonetic": "", "english": "Today Mr. Paul pays a lot of money for \nfood."}, {"thai": "ขอ...หนอยไดไหม ...", "phonetic": "", "english": "I ate too much last night."}, {"thai": "ขอดูหองหนอยไดไหมครับ", "phonetic": "", "english": "I bought this house two years ago."}, {"thai": "ขอนั่งที่นี่หนอยไดไหมคะ", "phonetic": "", "english": "What is this called in Thai?"}], "cultural": "Guesthouses are a common form of budget accommodation in Thailand. Guesthouses typically operate like a small hotel with guests renting out their own room. In some guesthouses, there are cheaper rooms without an attached bathroom, and you must use a shared bathroom down the hall. But most guesthouse rooms these days come with a bathroom included. Guesthouses are often boxy concrete buildings, but others are actually run out of old wooden houses. ", "practicePrompts": []},
  {"id": "abs-beg-s2-03", "num": 3, "season": 2, "title": "How Can a T-shirt be Too Expensive?", "situation": "Haggling over the price of a T-shirt at a market.", "coreConceptIds": ["s2_too_much"], "keyPattern": {"thai": "adj + เกินไป", "phonetic": "adj + gooen bpai", "english": "Too adj"}, "teacherExplanation": "เกินไป (gooen bpai) means too much. Put it after an adjective. แพงเกินไป (phaeng gooen bpai) = too expensive. ร้อนเกินไป (ráawn gooen bpai) = too hot.", "dialogue": [{"gender": "female", "thai": "เฮ่ยูๆ...ทีเชิตๆ", "phonetic": "KHON-KHǍAI- KHǍAWNG: hêe-yuu hêe-yuu...thii-chóoet thii-chóoet.", "english": "Hey you! Hey you!...T-shirt! T-shirt!"}, {"gender": "male", "thai": "มีเสือยืดกระทิงแดงไหมครับ", "phonetic": "mii sûuea-yûuet grà-thing daaeng mǎi khráp. CONT'D OVER ABSOLUTE BEGINNER S2 #3 - HOW CAN A T-SHIRT BE TOO EXPENSIVE IN THAILAND? 4", "english": "Do you have Red Bull T-shirts?"}, {"gender": "female", "thai": "โอ้ย...มีสิครับ, มีสีขาว กับสีนําเงินครับ", "phonetic": "KHON-KHǍAI- KHǍAWNG: ôoi...mii sì khráp. mii sǐi-khǎao gàp sǐi-náam-ngoen khráp.", "english": "Oh...I have them. I've got white and navy blue."}, {"gender": "male", "thai": "อืม...ตัวนีสวยดี แต่เล็กไปหน่อย", "phonetic": "uuem...dtuua níi sǔuai dii. dtàae lék bpai nàwy.", "english": "Um...This shirt looks good, but it's a little too small."}, {"gender": "female", "thai": "อ๋อ...ตัวนีไซส์เอ็มครับ, แต่ไซส์เอ็กซ์แอลก็มี แป๊บนึงนะ นี.ครับ", "phonetic": "KHON-KHǍAI- KHǍAWNG: ǎaw...dtuua níi sai em khráp. dtàae sai èk-aaen gâaw mii.  bpáaep nùeng ná. nîi khráp.", "english": "Oh...This one is size M, but I also have size XL. Just a second. Here you are."}, {"gender": "male", "thai": "อ้อ...ตัวนีดีกว่าจริงๆด้วย ตัวเท่าไหร่ครับ", "phonetic": "âaw...dtuua níi dii gwàa jing-jing dûuai. dtuua thâo-rài khráp.", "english": "Ah...This one really is better. How much is it?"}, {"gender": "female", "thai": "ถูกๆครับ, ตัวละสามร้อยครับ", "phonetic": "KHON-KHǍAI- KHǍAWNG: thùuk-thùuk khráp. dtuua lá sǎam ráawy bàat khráp.", "english": "Very cheap. They're three hundred baht each."}, {"gender": "male", "thai": "สามร้อย โอ้ย...แพงไป ผมมีเงินอยู่แค่สองร้อยบาทเองครับ", "phonetic": "sǎam ráawy. ôoi...phaaeng bpai. phǒm mii ngoen yùu khâae sǎawng ráawy bàat eeng khráp. 10. KHON-KHǍAI- KHǍAWNG: âo...ngán phǒm lót hâi. sǎawng ráawy láaeo gan. 11. DAAEN: khàawp-khun mâak khráp. ngán ao dtuua sǐi-khǎao nùeng dtuua khráp.", "english": "Three hundred? Oh...That's too expensive. I only have two hundred baht. 10. SELLER: Ah...Well, then, I can give you a discount. Two hundred it is. 11. DAN: Thank you very much. Well, I'll take a white one."}, {"gender": "male", "thai": "เอ้า...งันผมลดให้ สองร้อยแล้วกัน", "phonetic": "", "english": ""}, {"gender": "male", "thai": "ขอบคุณมากครับ, งันเอาตัวสีขาวหนึ.งตัวครับ", "phonetic": "", "english": ""}], "vocab": [{"thai": "เสือยืด", "phonetic": "sûuea-yûuet", "english": "T-shirt"}, {"thai": "เงิน", "phonetic": "ngoen", "english": "money"}, {"thai": "แพง", "phonetic": "phaaeng", "english": "expensive"}, {"thai": "หน่อย", "phonetic": "nàwy", "english": "a little bit, tiny"}, {"thai": "เล็ก", "phonetic": "lék", "english": "small"}, {"thai": "ตัว", "phonetic": "dtuua", "english": "body; classifier for"}, {"thai": "กระทิงแดง", "phonetic": "grà-thing daaeng", "english": "Red Bull"}, {"thai": "ลด", "phonetic": "lót", "english": "to reduce"}], "samples": [{"thai": "ช่วยลดราคาให้หน่อยได้ไหมคะ", "phonetic": "", "english": "That pink T-shirt is 150 baht."}, {"thai": "รอแปบหนึ่งนะคะ", "phonetic": "", "english": "The king kindly gave us money."}], "cultural": "The international best-selling energy drink, Red Bull, is based on the Thai drink Krating Daeng กระทิงแดง (grà-thing daaeng). An Austrian man named Dietrich Mateschitz discovered Krating Daeng on a trip to Thailand in 1982. He then worked together with Krating Daeng's owner to develop a similar product to market in Europe and around the world, which he named Red Bull. Grà-thing is the Thai word for the \"gaur,\" which is an animal similar to a wate", "practicePrompts": []},
  {"id": "abs-beg-s2-04", "num": 4, "season": 2, "title": "Have You Seen Bangkok's Grand Palace?", "situation": "Visiting the Grand Palace with a friend.", "coreConceptIds": ["s2_already"], "keyPattern": {"thai": "verb + แล้ว", "phonetic": "verb + láaeo", "english": "Already verb-ed"}, "teacherExplanation": "แล้ว (láaeo) after a verb means already or just did. กินแล้ว (gin láaeo) = already ate. ไปแล้ว (pai láaeo) = already went.", "dialogue": [{"gender": "male", "thai": "สวัสดีครับ . พนักงานเกสต์เฮ้าส์ วันนีคุณแดนจะไปเทียวทีไหนคะ", "phonetic": "sà-wàt-dii khráp. CONT'D OVER ABSOLUTE BEGINNER S2 #4 - HAVE YOU SEEN BANGKOK'S GRAND PALACE? 4", "english": "Good morning."}, {"gender": "male", "thai": "ยังไม่รู้เลยครับ . พนักงานเกสต์เฮ้าส์ ไปพระบรมมหาราชวังสิคะ, เป็นทีทีนักท่องเทียวทุกคนต้องไปชมนะคะ", "phonetic": "yang mâi rúu looei khráp.", "english": "don't know yet."}, {"gender": "male", "thai": "อ้อ...ผมไปมาแล้วเมือวานครับ . พนักงานเกสต์เฮ้าส์ แล้วไปวัดโพธิมาแล้วหรือยังคะ", "phonetic": "âaw...phǒm bpai maa láaeo mûuea-waan khráp.", "english": "Oh...I already went yesterday."}, {"gender": "male", "thai": "ยังครับ . พนักงานเกสต์เฮ้าส์ งันวันนีคุณแดนก็ไปวัดโพธิสิคะ, ทีวัดโพธิมีพระนอนทีมีชือเสียงมากเลยนะคะ", "phonetic": "yang khráp.", "english": "Not yet."}, {"gender": "male", "thai": "โอเคครับ, งันวันนีผมจะไปเทียววัดโพธิ", "phonetic": "", "english": ""}], "vocab": [{"thai": "วันนี", "phonetic": "wan-níi", "english": "today"}, {"thai": "พระนอน", "phonetic": "phrá-naawn", "english": "reclining Buddha"}, {"thai": "วัด", "phonetic": "wát", "english": "temple"}, {"thai": "แล้ว", "phonetic": "láaeo", "english": "already, and then, as"}, {"thai": "เมือวาน", "phonetic": "mûuea-waan", "english": "yesterday"}, {"thai": "ชม", "phonetic": "chom", "english": "to look at, to admire"}, {"thai": "นักท่องเทียว", "phonetic": "nák-thâwng-thîiao", "english": "tourist"}, {"thai": "พระบรมมหาราชวัง", "phonetic": "phrá-baaw-rom-má-", "english": "hǎa-râat-chá-wang"}, {"thai": "ยัง", "phonetic": "yang", "english": "still, yet"}], "samples": [{"thai": "วันนีคือวันเกิดของลุงของดิฉันค่ะ", "phonetic": "", "english": "Today is my mother's elder brother's \nbirthday."}, {"thai": "แล้วคุยกันค่ะ", "phonetic": "", "english": "I keep a reclining Buddha image at home \nbecause I was born on a Tuesday."}, {"thai": "คุณรอดิฉันนานเท่าไหร่แล้วคะ", "phonetic": "", "english": "Phra Phuttha Chinnarat is located at Wat \nPhra Si  Ratana Mahathat in Phitsanulok."}, {"thai": "ดิฉันยังไม่ได้พูดกับเขาเลยค่ะ", "phonetic": "", "english": "Thai people like to make merit at a \ntemple."}], "cultural": "Wat Pho is located just south of the Grand Palace in Bangkok. It is a very old temple site that underwent renovations and expansions during the reign of King Rama III in the late eighteenth century. It is famous for being a place of learning for traditional Thai massage and medicine. But it is probably even more famous for the giant Reclining Buddha image. The Reclining Buddha is forty-six meters long and fifteen meters tall. The body is covered ", "practicePrompts": []},
  {"id": "abs-beg-s2-05", "num": 5, "season": 2, "title": "Getting Your Photo Taken in Thailand", "situation": "Having your photo taken by a stranger in Thailand.", "coreConceptIds": ["s2_let_give"], "keyPattern": {"thai": "ให้ + person + verb", "phonetic": "hâi + person + verb", "english": "Let/have person verb"}, "teacherExplanation": "ให้ (hâi) means to give or to let. ให้ผม (hâi phǒm) = let me. ให้คุณ (hâi khun) = for you. It shows who the action is done for.", "dialogue": [{"gender": "male", "thai": "ขอโทษนะครับ, ช่วยถ่ายรูปให้ผมหน่อยได้ไหมครับ", "phonetic": "khǎaw-thôot ná khráp. chûuai thàai rûup hâi phǒm nàwy dâai mǎi khráp.", "english": "Excuse me. Could you please take my photo?"}, {"gender": "male", "thai": "อ้อ ได้เลยค่ะ, หนึ!ง สอง สาม แชะ", "phonetic": "âaw...dâai looei khâ. nùeng...sǎawng...sǎam (shutter click)", "english": "Oh...sure. One...two...three! (shutter click) ABSOLUTE BEGINNER S2 #5 - GETTING YOUR PHOTO TAKEN IN THAILAND 3"}, {"gender": "male", "thai": "ขอบคุณมากครับ", "phonetic": "khàawp-khun mâak khráp.", "english": "Thank you very much."}, {"gender": "male", "thai": "ไม่เป็นไรค่ะ, คุณพูดภาษาไทยเก่งมากเลย ขอโทษนะคะ, คุณเป็นคนประเทศอะไรเหรอคะ", "phonetic": "mâi-bpen-rai khâ. khun phûut phaa-sǎa-thai gèng mâak looei. khǎaw-thôot ná khá. khun bpen khon phrá-thêet à-rai rǒoe khá.", "english": "No problem. You speak Thai very well. Excuse me, what country are you from?"}, {"gender": "male", "thai": "ผมเป็นคนอเมริกัน ชื!อแดนครับ, แล้วคุณชื!ออะไรครับ", "phonetic": "phǒm bpen khon-à-mee-rí-gan. chûue daaen khráp. láaeo khun chûue à-rai khráp. CONT'D OVER ABSOLUTE BEGINNER S2 #5 - GETTING YOUR PHOTO TAKEN IN THAILAND 4", "english": "I'm American. My name is Dan. And what's your name?"}, {"gender": "male", "thai": "ชื!อกวางค่ะ, ยินดีที!ได้รู้จักค่ะ", "phonetic": "chûue gwaang khâ. yin-dii thîi dâai rúu-jàk khâ.", "english": "My name is Gwang. Nice to meet you."}, {"gender": "male", "thai": "เช่นกันครับ", "phonetic": "chên gan khrap.", "english": "Nice to meet you too."}, {"gender": "male", "thai": "กล้องของคุณแดนสวยจังเลยค่ะ", "phonetic": "glâwng khǎawng khun sǔuai jang looei khâ.", "english": "Your camera is really nice looking."}, {"gender": "male", "thai": "ขอบคุณมากครับ, กล้องตัวนี.คุณพ่อของผมให้เป็นของขวัญวันเกิดครับ", "phonetic": "khàawp-khun mâak khráp. glâwng dtuua níi khun-phâaw khǎawng phǒm hâi bpen khǎawng-khwǎn wan-gòoet khráp.", "english": "Thanks a lot. My father gave me this camera as a birthday present."}], "vocab": [{"thai": "คุณพ่อ", "phonetic": "khun phâaw", "english": "father"}, {"thai": "กล้อง", "phonetic": "glâwng", "english": "camera"}, {"thai": "ประเทศ", "phonetic": "phrá-thêet", "english": "country, nation"}, {"thai": "เก่ง", "phonetic": "gèng", "english": "clever, skillful"}, {"thai": "นวด", "phonetic": "to take a picture", "english": "Phrase"}, {"thai": "วันเกิด", "phonetic": "wan-gòoet", "english": "birthday"}], "samples": [{"thai": "คุณรู้ไหมว่าสถานีตํารวจอยู่ที!ไหน", "phonetic": "", "english": "I'm sorry."}, {"thai": "วันนี.คือวันเกิดของลุงของดิฉันค่ะ", "phonetic": "", "english": "Excuse me, do you know where the \npolice station is?"}, {"thai": "คุณเปนคนประเทศอะไรเหรอคะ", "phonetic": "", "english": "Excuse me."}], "cultural": "Temples in Thailand are popular places for tourists to visit, but it is important to remember that they are primarily places of worship. One should always be careful to be respectful when visiting a temple. The most basic rules of temple etiquette are to always remove shoes before entering temple buildings and to not sit with your feet pointing at a Buddha image, monks, or other people. Dressing respectfully at a temple means dressing modestly. W", "practicePrompts": []},
  {"id": "abs-beg-s2-06", "num": 6, "season": 2, "title": "What Are They Giving Those Thai Monks?", "situation": "Watching people give offerings to monks.", "coreConceptIds": ["s2_present_continuous"], "keyPattern": {"thai": "กำลัง + verb + อยู่", "phonetic": "gam-lang + verb + yùu", "english": "Currently verb-ing"}, "teacherExplanation": "กำลัง (gam-lang) + verb + อยู่ (yùu) = currently doing. กำลังกินอยู่ (gam-lang gin yùu) = currently eating. กำลังทำงานอยู่ (gam-lang tham-ngaan yùu) = currently working.", "dialogue": [{"gender": "male", "thai": "คุณกวางครับ, ตรงนันเขาทําอะไรกันอยู่เหรอครับ", "phonetic": "khun gwaang khráp, dtrong-nán khǎo tham à-rai gan yùu rǒoe khráp.", "english": "Gwang, what are they doing over there?"}, {"gender": "male", "thai": "อ๋อ เขากําลังถวายสังฆทานกันอยู่ค่ะ, ของในถังสีเหลืองเป็นของใช้สําหรับพระสงฆ์ค่ะ", "phonetic": "ǎaw...khǎo gam-lang thà-wǎai sǎng-khá-thaan gan yùu khâ. khǎawng nai thǎng sǐi-lǔueang bpen khǎawng-chái sǎm-ràp phrá- sǒng khâ.", "english": "Oh...They're giving offerings to the monks. The things in the yellow bucket are useful items for the monks."}, {"gender": "male", "thai": "แล้วตรงนันล่ะครับ", "phonetic": "láaeo dtrong-nán lâ khráp.", "english": "And what about over there?"}, {"gender": "male", "thai": "ตรงนันเขากําลังสวดมนต์กันอยู่ค่ะ", "phonetic": "dtrong-nán khǎo gam-lang sùuat-mon gan yùu khâ.", "english": "Over there they are chanting prayers together."}, {"gender": "male", "thai": "พวกเขาสวดมนต์กันทําไมเหรอครับ", "phonetic": "phûuak-khǎo sùuat-mon gan tham-mai rǒoe khráp.", "english": "Why do they pray?"}, {"gender": "male", "thai": "แต่ละคนเขาก็มีเหตุผลทีแตกต่างกันออกไปค่ะ", "phonetic": "dtàae lá khon khǎo gâaw mii hèet-phǒn thîi dtàaek-dtàang gan àawk bpai khâ.", "english": "Each person has different reasons."}], "vocab": [{"thai": "ตรงนัน", "phonetic": "dtrong-nán", "english": "there"}, {"thai": "ทําไม", "phonetic": "tham-mai", "english": "why"}, {"thai": "สวดมนต์", "phonetic": "sùuat-mon", "english": "to pray, to chant"}, {"thai": "แตกต่าง", "phonetic": "dtàaek-dtàang", "english": "different, to be"}], "samples": [{"thai": "คุณมีแผนสําหรับพรุ่งนีไหม", "phonetic": "", "english": "He doesn't want to go there."}], "cultural": "The word สังฆทาน (sǎng-khá-thaan) means an \"offering to monks.\" It comes from the Sanskrit phrase Sangha-dana. Sangha is the term we use for the community of monks who follow the Buddha, and dana means \"generosity.\" In Buddhist belief, the act of generosity toward the community of monks is an important activity for increasing one's \"store of merit\": บุญ (bun). Merit is a sort of intangible measure of accumulated virtue that largely determines und", "practicePrompts": []},
  {"id": "abs-beg-s2-07", "num": 7, "season": 2, "title": "Learn How to Relax at a Thai Spa", "situation": "Booking a Thai spa treatment.", "coreConceptIds": ["s2_also_too"], "keyPattern": {"thai": "verb + ด้วย", "phonetic": "verb + dûuai", "english": "verb too / also"}, "teacherExplanation": "ด้วย (dûuai) at the end means also or too. ผมไปด้วย (phǒm pai dûuai) = I am going too. เอาด้วย (ao dûuai) = take this one too.", "dialogue": [{"gender": "male", "thai": "พระนอนที วัดโพธินี ใหญ่กว่าที ผมคิดไว้มากเลยครับ", "phonetic": "phrá-naawn thîi wát phoo nîi yài gwàa thîi phǒm khít wái mâak looei khráp. CONT'D OVER ABSOLUTE BEGINNER S2 #7 - LEARN HOW TO RELAX AT A THAI MASSAGE SCHOOL 4", "english": "The reclining Buddha at Wat Pho is much larger than I thought it would be."}, {"gender": "male", "thai": "นอกจากพระนอน ที วัดโพธิยังมีโรงเรียนสอนนวดแผนไทยที ดังมากๆด้วยนะคะ, ถ้าคุณแดนมีเวลาว่างน่าจะลองไปนวดดู", "phonetic": "nâawk-jàak phrá-naawn thîi wát phoo yang mii roong-riian sǎawn nûuat-phǎaen-thai thîi dang mâak-mâak dûuai ná khá. thâa khun daaen mii wee-laa wâang nâa jà laawng bpai nûuat duu.", "english": "Besides the reclining Buddha, Wat Pho also has a famous school for teaching Thai massage. If you have free time, you should try a massage."}, {"gender": "male", "thai": "แน่นอนครับ", "phonetic": "nâae-naawn khráp.", "english": "Certainly."}, {"gender": "male", "thai": "เอ้อ...คืนนี คุณแดนจะทําอะไรคะ", "phonetic": "ôoe...khuuen-níi khun daaen jà tham à-rai khea.", "english": "Uh... What are you going to do tonight, Dan?"}, {"gender": "male", "thai": "ผมยังไม่มีแผนเลยครับ", "phonetic": "phǒm yang mâi mii phǎaen looei khráp.", "english": "don't have any plans yet."}, {"gender": "male", "thai": "คืนนีดิฉันจะเจอกับเพื อนที ผับ ไปด้วยกันไหมคะ", "phonetic": "khuuen-níi dì-chǎn jà jooe gàp phûuean thîi phàp. bpai dûuai gan mǎi khá.", "english": "I'm going to meet some friends at a pub tonight. Do you want to come with?"}, {"gender": "male", "thai": "ผับแถวไหนเหรอครับคุณกวาง",   {"id": "abs-beg-s2-08", "num": 8, "season": 2, "title": "Have You Ever Drunk Thai Coconut Water?", "situation": "Trying Thai coconut water for the first time.", "coreConceptIds": ["s2_ever"], "keyPattern": {"thai": "เคย + verb + ไหม", "phonetic": "khooei + verb + mǎi", "english": "Have you ever verb-ed?"}, "teacherExplanation": "เคย (khooei) means ever or used to. เคย + verb + ไหม asks have you ever done it. เคยกินไหม (khooei gin mǎi) = have you ever eaten it.", "dialogue": [{"gender": "male", "thai": "ทิพย์ แอ๊ด นีเพือนใหม่ของเราจ้ะ ชือคุณแดน", "phonetic": "thíp áaet nîi phûuean mài khǎawng rao jâ. chûue khun daaen.", "english": "Thip, Aet, this is my new friend. His name is Dan."}, {"gender": "male", "thai": "สวัสดีครับ", "phonetic": "ÁAET: sà-wàt-dii khráp.", "english": "Hello."}, {"gender": "male", "thai": "สวัสดีค่ะ, ยินดีทีได้รู้จักค่ะ", "phonetic": "THÍP: sà-wàt-dii khâ. yin-dii thîi dâai rúu-jàk khâ.", "english": "Hello. Nice to meet you."}, {"gender": "male", "thai": "สวัสดีครับคุณทิพย์ คุณแอ๊ด ยินดีทีได้รู้จักเช่นกันครับ", "phonetic": "sà-wàt-dii khráp khun thíp khun áaet. yin-dii thîi dâai rúu-jàk chên gan khráp.", "english": "Hello Thip, Aet. It's nice to meet you too."}, {"gender": "male", "thai": "คุณแดนเป็นคนอะไรครับ", "phonetic": "ÁAET: khun daaen bpen khon à-rai khráp.", "english": "What's your nationality, Dan?"}, {"gender": "male", "thai": "อเมริกันครับ", "phonetic": "à-mee-rí-gan khráp.", "english": "American."}, {"gender": "male", "thai": "คุณแดนเคยดืมเหล้าไทยไหมครับ", "phonetic": "ÁAET: khun daaen khooei dùuem lâo-thai mǎi khráp. CONT'D OVER ABSOLUTE BEGINNER S2 #8 - HAVE YOU EVER DRUNK THAI WHISKEY? 5", "english": "Have you ever drunk Thai whiskey?"}, {"gender": "male", "thai": "เคยครับ, ผมชอบมากเลย", "phonetic": "khooei khráp. phǒm châawp mâak looei. 10. ÁAET: ngán dǐiao phǒm sàng sǎaeng-sǒom maa khùuat nùeng láaeo gan ná khráp. 11. THÍP: láaeo khun daaen yùu muueang-thai maa gìi wan láaeo khá. 12. DAAEN: phǒm maa mûuea sǎawng wan gàawn khr   {"id": "abs-beg-s2-09", "num": 9, "season": 2, "title": "Do You Get a Kick out of Thai Food?", "situation": "Talking about Thai food with a friend.", "coreConceptIds": ["s2_or_not"], "keyPattern": {"thai": "verb + หรือเปล่า", "phonetic": "verb + rǔue bplàao", "english": "verb or not?"}, "teacherExplanation": "หรือเปล่า (rǔue bplàao) at the end means or not. อร่อยหรือเปล่า (à-ràwy rǔue bplàao) = is it delicious or not. A softer alternative to ไหม.", "dialogue": [{"gender": "male", "thai": "ฝ่ายแดงต่อยเก่งมากเลยครับคุณแอ๊ด คุณแอ๊ดคิดว่าเขาจะชนะหรือไม่ครับ", "phonetic": "fàai daaeng dtàwy gèeng mâak looei khráp khun áaet. khun áaet khít wâa khǎo jà chá-ná rǔue mâi khráp.", "english": "The red boxer punches really well, Aet. Do you think he's going to win?"}, {"gender": "male", "thai": "น่าจะชนะนะครับ, เพราะฝ่ายแดงต่อยเร็วกว่าฝ่ายนําเงินมาก", "phonetic": "ÁAET: nâa jà chá-ná ná khráp. phráw fàai daaeng dtàwy reo gwàa fàai nám-ngoen mâak.", "english": "He'll probably win because he hits much faster than the blue boxer."}, {"gender": "male", "thai": "แล้วคุณแอ๊ดได้ลงพนันไว้หรือเปล่าครับ", "phonetic": "láaeo kun áaet dâai long phá-nan wái rǔue bplào khráp.", "english": "So did you place a bet?"}, {"gender": "male", "thai": "อ้อ...เปล่าครับ, ผมไม่ชอบเล่นพนันครับ . เสียงต่อยอย่างรุนแรง และผู้ชมส่งเสียงเชียร์ดังขึน", "phonetic": "ÁAET: âaw...bplào khráp. phǒm mâi châawp lên phá-nan khráp.", "english": "Oh...no, I didn't. I don't like to gamble."}, {"gender": "male", "thai": "ฝ่ายนําเงินล้มแล้วครับ", "phonetic": "fàai nám-ngoen lóm láaeo khráp.", "english": "The blue boxer went down already!"}, {"gender": "male", "thai": "หนึง... สอง... สาม... สี... ห้า", "phonetic": "PHÛU-CHOM: nùeng... sǎawng... sǎam... sìi... hâa", "english": "One...two...three...four...five..."}, {"gender": "male", "thai": "คุณแอ๊ดคิดว่าฝ่ายนําเงินจะลุกขึนได้หรือไม่ครับ", "phonetic": "khun áaet khít wâa fàai nám-ngoen jà lúk khûen dâai rǔue mâi khráp. 10. ÁAET: khít wâa lûk khûen mâi dâai khráp. 11. PHÛU   {"id": "abs-beg-s2-11", "num": 11, "season": 2, "title": "How Do I Get to the Thai Post Office?", "situation": "Asking directions to the post office.", "coreConceptIds": ["s2_directions"], "keyPattern": {"thai": "ตรงไป แล้วเลี้ยว + ซ้าย/ขวา", "phonetic": "dtrong bpai láaeo líiao sáai/khwǎa", "english": "Go straight then turn left/right"}, "teacherExplanation": "For directions: ตรงไป (dtrong bpai) = go straight. เลี้ยวซ้าย (líiao sáai) = turn left. เลี้ยวขวา (líiao khwǎa) = turn right. จะอยู่ทาง (jà yùu thaang) = it will be on the.", "dialogue": [{"gender": "male", "thai": "โปสการ์ดใบนีราคาเท่าไหร่ครับ", "phonetic": "bpóot-sà-gáat bai nîi raa-khaa thâo-rài khráp.", "english": "How much is this postcard?"}, {"gender": "female", "thai": "ยีสิบห้าบาทค่ะ", "phonetic": "PHÁ-NÁK- NGAAN KHǍAI: yîi-sìp-hâa bàat khâ.", "english": "Twenty-five baht."}, {"gender": "male", "thai": "เอาสองใบครับ, เอ่อ...ขอโทษนะครับ, รู้ไหมครับว่าไปรษณีย์อยู่ทีไหนครับ", "phonetic": "ao sǎawng bai khráp. òoe...khǎaw-thôot ná khráp. rúu mǎi khráp wâa bprai-sà-nii yùu thîi-nǎi khráp.", "english": "I'll take two. Uh... Excuse me, do you know where there's a post office?"}, {"gender": "female", "thai": "ไปรษณีย์จะอยู่ทางขวาค่ะ", "phonetic": "PHÁ-NÁK- NGAAN KHǍAI: bprai-sà-nii jà yùu thaang-khwǎa khâ.", "english": "There will be a post office on the right."}, {"gender": "male", "thai": "โอเคครับ, ตรงไป แล้วเลี้ยวขวา ไปรษณีย์จะอยู่ทางซ้ายใช่ไหมครับ", "phonetic": "oo-khee khráp. dtrong bpai. láaeo líiao khwǎa. bprai-sà-nii jà yùu thaang-sáai châi mǎi khráp.", "english": "OK. Go straight, and turn right. There will be a post office on the left. Is that right?"}, {"gender": "female", "thai": "ไม่ใช่ค่ะๆ ตรงไป แล้วเลียวซ้าย ไปรษณีย์จะอยู่ทางขวาค่ะ", "phonetic": "PHÁ-NÁK- NGAAN KHǍAI: mâi châi khâ. mâi châi khâ. dtrong bpai. láaeo líiao sáai. bprai-sà- nii jà yùu thaang-khwǎa khâ.", "english": "No, no. Go straight, and turn left. There will be a post office on the right."}, {"gender": "male", "thai": "โอเคค   {"id": "abs-beg-s2-12", "num": 12, "season": 2, "title": "You Simply Must Go and Pet the Tiger!", "situation": "Visiting a tiger sanctuary.", "coreConceptIds": ["s2_must"], "keyPattern": {"thai": "ต้อง + verb", "phonetic": "dtâwng + verb", "english": "Must verb"}, "teacherExplanation": "ต้อง (dtâwng) means must or have to. ต้อง + verb. คุณต้องไป (khun dtâwng pai) = you must go. ต้องลอง (dtâwng laawng) = you must try.", "dialogue": [{"gender": "male", "thai": "สวัสดีครับ, ไม่ทราบว่าทัวร์วันเดียวจากกรุงเทพฯมีไปที!ไหนบ้างครับ . พนักงานบริษัททัวร์ มีไปอยุธยา ฟาร์มจระเข้ เมืองโบราณ วัดเสือ แล้วก็ตลาดนํ,าดําเนินสะดวกค่ะ", "phonetic": "sà-wàt-dii khráp. mâi sâap wâa thuua wan diiao jàak grung-thêep mii bpai thîi-nǎi bâang khráp.", "english": "Hello. Where all do you have one-day tours from Bangkok going to?"}, {"gender": "male", "thai": "ทัวร์ไปตลาดนํ,าเริ!มกี!โมงครับ . พนักงานบริษัททัวร์ ต้องไปถึงที!ตลาดนํ,าเจ็ดโมงเช้าค่ะ", "phonetic": "thuua bpai dtà-làat-náam rôoem gìi moong khráp.", "english": "What time does the tour to the Floating Market begin?"}, {"gender": "male", "thai": "เช้าเกินไป อืม...จริงๆแล้วผมก็ชอบดูสัตว์ . พนักงานบริษัททัวร์ งั,นคุณต้องไปวัดเสือค่ะ, ที!นั!นคุณจับเสือได้ด้วยนะคะ", "phonetic": "cháao gooen bpai. uuem...jing-jing láaeo phǒm gâaw châawp duu sàt.", "english": "That's too early. Umm... Actually, I like to see animals."}, {"gender": "male", "thai": "หา...จับเสือ", "phonetic": "hǎa...jàp sǔuea", "english": "Huh...pet the tigers?"}], "vocab": [{"thai": "ทัวร์วันเดียว", "phonetic": "thuua wan diiao", "english": "one-day tour"}, {"thai": "ที!นั!น", "phonetic": "thîi-nân", "english": "there"}, {"thai": "สัตว์", "phonetic": "sàt", "english": "animal, living being"}, {"thai": "เริ!ม", "phonetic": "rôoem", "english": "to start"}, {"thai": "ก", "phonetic": "dtà-làat-náam dam-", "english": "nooen sà-dùuak"}, {"thai": "โบราณ", "phonetic": "boo-raan", "english": "ancient"}, {"thai": "เมือง", "phonetic": "muueang", "english": "city"}, {"thai": "จระเข้", "phonetic": "jaaw-rá-khêe", "english": "crocodile, alligator"}, {"thai": "จับ", "phonetic": "jàp", "english": "to catch, to capture,"}], "samples": [{"thai": "ไมทราบวาคุณชื่ออะไรคะ", "phonetic": "", "english": "I went to the floating market on a one-day \ntour. And I also bought some fresh fruit \nthere."}], "cultural": "The Ancient City, or เมืองโบราณ (muueang booraan), is a large outdoor museum not too far from Bangkok, in Samut Prakan province. It was laid out in the shape of Thailand and takes up two hundred acres. On the grounds of the Ancient City are replicas of famous monuments and historical buildings from Thailand placed to correspond with their actual geographical locations. There are 116 historical replicas in all. Some of them are scaled-down models,", "practicePrompts": []},
  {"id": "abs-beg-s2-13", "num": 13, "season": 2, "title": "Take a Trip to Thailand's Tiger Temple", "situation": "Discussing a trip to Tiger Temple.", "coreConceptIds": ["s2_animal_classifiers"], "keyPattern": {"thai": "noun + number + ตัว", "phonetic": "noun + number + dtuua", "english": "[number] animals"}, "teacherExplanation": "ตัว (dtuua) is the classifier for animals. เสือหนึ่งตัว (sǔuea nùeng dtuua) = one tiger. ช้างสองตัว (cháang sǎawng dtuua) = two elephants.", "dialogue": [{"gender": "female", "thai": "เอาล่ะค่ะคุณแดน ยืนใกล้ๆเลยค่ะ, เข้าไปอีกค่ะ, จับเสือเลยค่ะ, ไม่ต้องกลัวๆ เอ้า...ยิ!มค่ะ..หนึง สอง สาม . แชะ", "phonetic": "ao lâ khâ khun daaen. yuuen glâi-glâi looei khâ, khâo bpai ìik khâ. jàp sǔuea looei khâi. mâi dtâwng gluua. mai dtâwng gluua. âo...yím khâ...nùeng sǎawng sǎam", "english": "All right Dan, go ahead and stand close. Closer please. Go ahead and pet the tiger. Don't be afraid. OK...smile. One...two...three."}, {"gender": "male", "thai": "โอ้...ขอบคุณมากครับ, เมือกี!กลัวเกือบตายแน่ะ", "phonetic": "ôo...khàawp-khun mâak khráp. mûuea-gîi gluua gùueap dtaai nâe.", "english": "Oh...thank you very much. Just a second ago I was afraid I was about to die for sure!"}, {"gender": "female", "thai": "หัวเราะ", "phonetic": "(laughing)", "english": "(laughing)"}, {"gender": "male", "thai": "ทีนีมีเสือกีตัวครับ", "phonetic": "thîi-nîi mii sǔuea gìi dtuua khráp.", "english": "How many tigers are there here?"}, {"gender": "female", "thai": "มีประมาณห้าสิบตัวค่ะ, แต่...ไม่ได้มีแค่เสือนะคะ, มีสัตว์ชนิดอืนด้วย เช่น ควาย หมูป่า กวาง นกยูง แล้วก็อูฐค่ะ, โอ๊ะ คุณแดนคะๆ ดูนกยูงตัวนั!นสิคะ", "phonetic": "mii bprà-maan hâa-sìp dtuua khâ. dtàae...mâi dâi mii khâae sǔuea ná khá. mii sàt chá-nít ùuen dûuai. chên khwaai mǔu-bpàa gwaang láaeo gâaw ùut khâ. ó khun daaen khá. khun daaen khá. duu nók- yuung dtuua nán sì khá. CONT'D OVER THAI POD101.COM ABS OLUTE BEGI NNER S 2 #13 - TAKE A TRIP TO THAI LAND'S  TIGER TEMPLE 4", "english": "There are about fifty. But...they don't have just tigers. There are other types of animals as well, such as water buffalo, wild boar, deer, and camels. Dan, look at that peacock!"}, {"gender": "male", "thai": "โอ้โห...สวยมากเลย คุณครับ, ขอกล้องหน่อยได้ไหมครับ, ผมจะถ่ายรูปนกยูง", "phonetic": "ôo-hǒo...sǔuai mâak looei. khun khráp. khǎaw glâwng nàwy dâai mǎi khráp. phǒm jà thàai rûup nók-yuung.", "english": "Wow! It's so beautiful. Can you hand me my camera back? I'm going to take a picture of the peacock."}], "vocab": [{"thai": "กลัว", "phonetic": "gluua", "english": "afraid"}, {"thai": "ยืน", "phonetic": "yuuen", "english": "to stand"}, {"thai": "กวาง", "phonetic": "gwaang", "english": "deer"}, {"thai": "เกือบ", "phonetic": "gùueap", "english": "nearly, almost"}, {"thai": "อูฐ", "phonetic": "ùut", "english": "camel"}, {"thai": "ตาย", "phonetic": "dtaai", "english": "to die"}, {"thai": "ยิ!ม", "phonetic": "yím", "english": "to smile"}, {"thai": "นกยูง", "phonetic": "nók-yuung", "english": "peacock"}, {"thai": "ควาย", "phonetic": "khwaai", "english": "buffalo"}], "samples": [], "cultural": "ABS OLUTE BEGI NNER S 2 #13 - TAKE A TRIP TO THAI LAND'S TIGER TEMPLE Will You Find Tigers in That Thai Temple? The Tiger Temple is the popular name for Wat Pa Luangta Maha Bua. It is a Buddhist temple and animal sanctuary located in Kanchanaburi province, near the border with Myanmar. The temple first began caring for tigers in 1999, when villagers brought in an abandoned tiger cub that they had found. After that, people began bringing more tige", "practicePrompts": []},
  {"id": "abs-beg-s2-14", "num": 14, "season": 2, "title": "Taking the Bus in Thailand", "situation": "Taking a bus across Thailand.", "coreConceptIds": ["s2_if_condition"], "keyPattern": {"thai": "ถ้า + condition + จะ + result", "phonetic": "thâa + condition + jà + result", "english": "If condition, will result"}, "teacherExplanation": "ถ้า (thâa) means if. ถ้า + condition + จะ + result. ถ้าไปจะสนุก (thâa pai jà sà-nùk) = if you go it will be fun.", "dialogue": [{"gender": "male", "thai": "สวัสดีครับ . พนักงานขายตัว สวัสดีค่ะ", "phonetic": "sà-wàt-dii khráp.", "english": "Hello."}, {"gender": "male", "thai": "ไปกระบีครับ . พนักงานขายตัว รอบกีโมงคะ, มีรอบหกโมงเย็น กับสองทุ่มค่ะ", "phonetic": "bpai grà-bìi khráp.", "english": "I'm going to Krabi."}, {"gender": "male", "thai": "ถ้าออกตอนหกโมงเย็น จะไปถึงกีโมงครับ . พนักงานขายตัว ถ้าออกตอนหกโมงเย็น จะไปถึงตอนหกโมงเช้าค่ะ, แต่ถ้าออกตอนสองทุ่ม ก็จะไปถึงตอนแปดโมงเช้าค่ะ", "phonetic": "thâa àawk dtaawn hòk moong-yen jà bpai thǔeng gìi moong khráp.", "english": "If I leave at six P.M. what time will I arrive?"}, {"gender": "male", "thai": "อืม...งันขอตัวรอบสองทุ่ม หนึงใบครับ . พนักงานขายตัว หกร้อยบาทค่ะ", "phonetic": "uuem...ngán khǎaw dtǔua râawp sǎawng thûm nùeng bai khráp.", "english": "Umm...Well then, I'll take one ticket for eight P.M."}, {"gender": "male", "thai": "นีครับ . พนักงานขายตัว ขอบคุณค่ะ", "phonetic": "nîi khráp. 10. PHÁ-NÁK- NGAAN KHǍAI DTǓUA: khàawp-khun khâ.", "english": "Here you are. 10. TICKET SELLER: Thank you."}], "vocab": [{"thai": "กีโมง", "phonetic": "gìi moong", "english": "what time"}, {"thai": "รอบ", "phonetic": "râawp", "english": "round, turn, cycle"}, {"thai": "ออก", "phonetic": "àawk", "english": "to go out"}, {"thai": "ตอน", "phonetic": "dtaawn", "english": "when, at the time"}, {"thai": "ถ้า", "phonetic": "thâa", "english": "if"}, {"thai": "หกโมงเย็น", "phonetic": "hòk moong yen", "english": "6 P.M."}, {"thai": "แต่", "phonetic": "dtàae", "english": "but, just, only"}], "samples": [{"thai": "ตัวหนังราคาเท่าไหร่ครับ", "phonetic": "", "english": "What time is it now?"}], "cultural": "Most cities in Thailand have a main bus terminal for intercity travel. Bangkok has three main bus terminals because of its size. Mo Chit bus station serves destinations in the north and northeast. Ekkamai bus station serves destinations in the southeast, such as Pattaya. And the New Southern bus terminal serves destinations in the south. There are both government run and privately run buses available. The government buses come in two types: regul", "practicePrompts": []},
  {"id": "abs-beg-s2-15", "num": 15, "season": 2, "title": "Your Thai Grandson is Really Cute!", "situation": "Meeting a Thai family, complimenting their grandson.", "coreConceptIds": ["s2_worth_doing"], "keyPattern": {"thai": "น่า + verb", "phonetic": "nâa + verb", "english": "Worth verb-ing / sounds adj"}, "teacherExplanation": "น่า (nâa) + verb makes it mean worth doing or sounds good. น่ากิน (nâa-gin) = looks delicious / worth eating. น่าไป (nâa-pai) = worth going.", "dialogue": [{"gender": "male", "thai": "สวัสดีจ้ะ มาคนเดียวเหรอ", "phonetic": "sà-wàt-dii jâ. maa khon diiao rǒoe.", "english": "Hello. You're traveling alone?"}, {"gender": "male", "thai": "ใช่แล้วครับ, ผมมาจากประเทศอเมริกา มาเทียวนานสองอาทิตย์ครับ", "phonetic": "châi láaeo khráp. phǒm maa jàak bprà-thêet à-mee-rí-gaa. maa thîiao naan sǎawng aa-thít khráp.", "english": "That's right. I'm from America. I came for a two-week trip. ABSOLUTE BEGINNER S2 #15 - YOUR THAI GRANDSON IS REALLY CUTE! 3"}, {"gender": "male", "thai": "ยายเป็นคนกรุงเทพฯ จะไปเยียมหลานๆทีกระบี", "phonetic": "yaai bpen khon-grung-thêep. jà bpai yîiam lǎan-lǎan thîi grà-bìi.", "english": "I'm from Bangkok. I'm going to visit my grandson in Krabi."}, {"gender": "male", "thai": "หลานของคุณยายอายุเท่าไหร่ครับ", "phonetic": "lǎan khǎawng khun-yaai aa-yú thâo-rài khráp. CONT'D OVER ABSOLUTE BEGINNER S2 #15 - YOUR THAI GRANDSON IS REALLY CUTE! 4", "english": "How old is your grandson?"}, {"gender": "male", "thai": "อายุสามขวบ น่ารักมาก เอ้อ...ดูรูปไหม ยายมีรูป", "phonetic": "aa-yú sǎam khùuap. nâa-rák mâak. ôoe...duu rûup mǎi. yaai mii rûup.", "english": "He's three years old. He's very cute. Oh... Do you want to see a photo? I have a photo."}, {"gender": "male", "thai": "โอ้....น่ารักจริงๆ เอ่อ...ขอโทษนะครับ, ผมไม่เคยไปกระบีมาก่อน มีทีไหนน่าไปบ้างครับ", "phonetic": "ôo...nâa-rák jing-jing. òoe...khǎaw-thôot ná khráp. phǒm mâi khooei bpai grà-bìi maa gàawn. mii thîi-nǎi nâa bpai bâang khráp.", "english": "Oh... He really is cute! Uh…excuse me. I've never been to Krabi before. Where is worth going to there?"}, {"gender": "male", "thai": "ทีหาดไร่เลย์มีปีนหน้าผา น่าสนุกดีนะ", "phonetic": "thîi hàat râi-lee mii thîi bpiin nâa-phǎa. nâa-sà-nùk dii ná.", "english": "At Railey Beach, there is a place for rock climbing. It should be enjoyable."}, {"gender": "male", "thai": "จริงเหรอครับ, ผมไม่เคยปีนหน้าผามาก่อน อยากไปจัง", "phonetic": "jing rǒoe khráp. phǒm mâi khooei bpiin nâa-phǎa maa gàawn. yàak bpai jang.", "english": "Really? I've never gone rock climbing before. I'd really like to go."}, {"gender": "male", "thai": "แต่ถ้าจะไปหาดไร่เลย์ต้องนังเรือไปนะ", "phonetic": "dtàae thâa jà bpai hàat râi-lee dtâwng nâng ruuea bpai ná. 10. DAAEN: ôo...nâa-sǒn-jai. khàawp-khun mâak khráp.", "english": "But if you will go to Railey Beach, you need to take a boat to get to there. 10. DAN: Oh...that's interesting. Thank you very much."}, {"gender": "male", "thai": "โอ้...น่าสนใจ ขอบคุณมากครับ", "phonetic": "", "english": ""}], "vocab": [{"thai": "คนกรุงเทพฯ", "phonetic": "khon-grung-thêep", "english": "Bangkokian"}, {"thai": "ยาย", "phonetic": "yaai", "english": "maternal"}, {"thai": "น่าสนุก", "phonetic": "nâa-sà-nùk", "english": "enjoyable"}, {"thai": "น่ารัก", "phonetic": "nâa-rák", "english": "cute"}, {"thai": "เยียม", "phonetic": "yîiam", "english": "to visit, to see"}, {"thai": "นังเรือ", "phonetic": "nâng ruuea", "english": "to travel by boat"}, {"thai": "หาด", "phonetic": "hàat", "english": "beach"}], "samples": [], "cultural": "Krabi (pronounced grà-bìi) is the name of both a city and province in southern Thailand. The city is not very large, with only about 25,000 residents. Krabi city was built along the mouth of the Krabi River, which flows into the Andaman Sea on Thailand's west coast. Most tourists just pass through the city on their way to other locations in Krabi province. Krabi is most famous for its beaches and limestone hills. These limestone formations shoot ", "practicePrompts": []},
  {"id": "abs-beg-s2-16", "num": 16, "season": 2, "title": "Time For a Thai Massage", "situation": "Getting a Thai massage.", "coreConceptIds": ["s2_some_any"], "keyPattern": {"thai": "บาง + noun", "phonetic": "bâang + noun", "english": "Some noun"}, "teacherExplanation": "บาง (bâang) means some or any. บางคน (bâang-khon) = some people. บางที (bâang-thii) = sometimes. บางส่วน (bâang-sùuan) = some part.", "dialogue": [{"gender": "male", "thai": "สวัสดีค่ะ", "phonetic": "MǍAW-NÛUAT: sà-wàt-dii khâ.", "english": "Hello."}, {"gender": "male", "thai": "สวัสดีครับ, มีนวดอะไรบ้างครับ", "phonetic": "sà-wàt-dii khráp. mii nûuat à-rai bâang khráp. CONT'D OVER ABSOLUTE BEGINNER S2 #16 - TIME FOR A THAI MASSAGE 4", "english": "Hello. What kinds of massage do you have?"}, {"gender": "male", "thai": "มีนวดไทย นวดนํามัน กับนวดเท้าค่ะ", "phonetic": "MǍAW-NÛUAT: mii nûuat-thai nûuat-nám-man gàp nûuat-tháao khâ.", "english": "We have Thai massage, oil massage, and foot massage."}, {"gender": "male", "thai": "นวดไทยชัวโมงละเท่าไหร่ครับ", "phonetic": "nûuat-thai chûua-moong lá thâo-rài khráp.", "english": "How much per hour is Thai massage?"}, {"gender": "male", "thai": "ชัวโมงละสองร้อยบาทค่ะ", "phonetic": "MǍAW-NÛUAT: chûua-moong lá sǎawng ráawy bàat khâ.", "english": "It's two hundred baht per hour."}, {"gender": "male", "thai": "งัน เอาสองชัวโมงครับ", "phonetic": "ngán ao sǎawng chûua-moong khráp.", "english": "Well then, I'll take two hours."}, {"gender": "male", "thai": "เปลียนเสือตรงนีนะคะ, ถ้าเปลียนเสร็จแล้วเรียกนะคะ . เสียงดนตรี", "phonetic": "MǍAW-NÛUAT: bplìian sûuea dtrong-níi ná khá. thâa bplìian sèt láaeo rîiak ná khá.", "english": "Change your clothes here. Call me when you are done changing."}, {"gender": "male", "thai": "เสร็จแล้วครับ", "phonetic": "sèt láaeo khráp. 10. MǍAW-NÛUAT: bpùuat dtrong-nǎi bâang khá. 11. DAAEN: nâng rót-thuua naan mâak. bpùuat lǎng gàp khǎa khráp. óoi...bao-bao nàwy khráp. 12. MǍAW-NÛUAT: khǎaw-thôot khâ.", "english": "I'm ready. 10. MASSEUSE: Where all do you feel sore? 11. DAN: I rode on a bus for a long time. My back and my legs are sore. Ouch!... A little softer, please. 12. MASSEUSE: Sorry."}, {"gender": "male", "thai": "ปวดตรงไหนบ้างคะ", "phonetic": "", "english": ""}, {"gender": "male", "thai": "นังรถทัวร์นานมาก ปวดหลัง กับขาครับ, โอ๊ย....เบาๆหน่อยครับ", "phonetic": "", "english": ""}, {"gender": "male", "thai": "ขอโทษค่ะ", "phonetic": "", "english": ""}], "vocab": [{"thai": "นํามัน", "phonetic": "nám-man", "english": "oil"}, {"thai": "นวด", "phonetic": "nûuat", "english": "massage, to"}, {"thai": "ชัวโมง", "phonetic": "chûua-moong", "english": "hour"}, {"thai": "เปลียน", "phonetic": "bplìian", "english": "to change, to alter"}, {"thai": "เท้า", "phonetic": "tháao", "english": "foot"}, {"thai": "ปวด", "phonetic": "bpùuat", "english": "sore, painful, to ache"}, {"thai": "เบาๆ", "phonetic": "bao-bao", "english": "softly, gently, lightly"}, {"thai": "เสร็จ", "phonetic": "sèt", "english": "finished, complete"}], "samples": [{"thai": "ช่วยนวดเบาๆหน่อยครับ", "phonetic": "", "english": "These days the price of gasoline is going \nup."}, {"thai": "เปลี่ยนเสื้อตรงนี้นะคะ", "phonetic": "", "english": "The price of oil is very expensive now."}, {"thai": "เปลี่ยนเสื้อที่นี่นะคะ", "phonetic": "", "english": "I'm going to study at Wat Pho because I \nwant to know how to perform Thai \nmassage."}, {"thai": "ปวดตรงไหนบางคะ", "phonetic": "", "english": "Today I sat at work all day long, and my \nback feels sore."}, {"thai": "ปวดที่ไหนบางคะ", "phonetic": "", "english": "I hate when it rains after it snows."}], "cultural": "Thai massage involves both massaging and stretching. It is performed with the subject lying on the floor wearing loose-fitting clothing. The masseuse applies strong pressure with both hands and feet while working on different muscle groups following invisible energy lines. At a certain point, the masseuse may apply sustained pressure to the large veins in the upper thighs for a few moments and then release in order to stimulate blood flow. Stretc", "practicePrompts": []},
  {"id": "abs-beg-s2-17", "num": 17, "season": 2, "title": "The Thai Long-tail Boat is Fine With Me", "situation": "Taking a long-tail boat trip.", "coreConceptIds": ["s2_its_fine"], "keyPattern": {"thai": "noun/verb + ก็ได้", "phonetic": "noun/verb + gâaw dâai", "english": "It is fine / OK"}, "teacherExplanation": "ก็ได้ (gâaw dâai) means it's fine or OK. อะไรก็ได้ (à-rai gâaw dâai) = anything is fine. ที่ไหนก็ได้ (thîi-nǎi gâaw dâai) = anywhere is fine.", "dialogue": [{"gender": "male", "thai": "ไร่เลย์ครับ, ไร่เลย์", "phonetic": "KHON-KHÀP- râi-lee khráp râi-lee.", "english": "Railey! Railey!"}, {"gender": "male", "thai": "เอ่อ...ขอโทษนะครับ, ผมอยากไปหาดไร่เลย์แต่ว่ามาคนเดียว", "phonetic": "òoe...khǎaw-thôot ná khráp. phǒm yàak bpai hàat râi-lee dtàae wâa maa khon diiao.", "english": "Uh... Excuse me. I want to go to Railey Beach, but I'm by myself."}, {"gender": "male", "thai": "ไม่เป็นไรครับ, คนเดียวก็ได้ครับ", "phonetic": "KHON-KHÀP- mâi-bpen-rai khráp. khon diiao gâaw dâai khráp.", "english": "No problem. One person is OK."}, {"gender": "male", "thai": "เท่าไหร่ครับ", "phonetic": "thâo-rài khráp.", "english": "How much is it? ABSOLUTE BEGINNER S2 #17 - THE THAI LONG-TAIL BOAT IS FINE WITH ME 3"}, {"gender": "male", "thai": "เที ยวเดียว สามร้อยบาท ถ้าไปกลับห้าร้อยบาทครับ", "phonetic": "KHON-KHÀP- thîiao-diiao sǎam ráawy bàat. thâa bpai-glàp hâa ráawy bàat khráp.", "english": "one-way trip is three hundred baht. If you take a return trip, it's five hundred baht."}, {"gender": "male", "thai": "แต่ผมจะไปปีนเขาด้วย คุณจะรอได้ไหมครับ", "phonetic": "dtàae phǒm jà bpai bpiin khǎo dûuai. khun jà raaw dâai mǎi khráp. CONT'D OVER ABSOLUTE BEGINNER S2 #17 - THE THAI LONG-TAIL BOAT IS FINE WITH ME 4", "english": "But I'm going to go climbing too. Can you wait for me?"}, {"gender": "male", "thai": "รอก็ได้ครับ", "phonetic": "KHON-KHÀP- raaw gâaw dâai khráp.", "english": "It's fine, I can wait."}, {"gender": "male", "thai": "โอเคครับ, งันไปเลย . เสียงสตาร์ทเครื องเรือ", "ph   {"id": "abs-beg-s2-18", "num": 18, "season": 2, "title": "Climbing Cliffs in Thailand", "situation": "Rock climbing in Krabi.", "coreConceptIds": ["s2_physically_can"], "keyPattern": {"thai": "verb + ไหว", "phonetic": "verb + wǎi", "english": "Physically able to verb"}, "teacherExplanation": "ไหว (wǎi) means physically able. ทำไหวไหม (tham wǎi mǎi) = can you manage it. ไม่ไหว (mâi wǎi) = cannot manage it physically.", "dialogue": [{"gender": "male", "thai": "ปีนไม่ไหวแล้ว ขอพักตรงนีแป๊บหนึงได้ไหมครับ . ครูสอนปีนหน้าผา ได้สิครับ, คุณแดนพูดภาษไทยเก่งมากเลยนะครับ", "phonetic": "bpiin mâi wǎi láaeo. khǎaw phák dtrong-níi bpáaep nùeng dâai mǎi khráp.", "english": "can't climb anymore. Can we rest here for a minute? ABSOLUTE BEGINNER S2 #18 - CLIMBING CLIFFS IN THAILAND 3"}, {"gender": "male", "thai": "แล้วคุณครูล่ะครับ, พูดภาษาอังกฤษเป็นไหมครับ . ครูสอนปีนหน้าผา พูดไม่เป็นเลยครับ, คุณแดนสอนผมหน่อยได้ไหมครับ", "phonetic": "láaeo khun khruu lâ khráp. phûut phaa-sǎa-ang-grìt bpen mǎi khráp.", "english": "Well, how about you? Can you speak English?"}, {"gender": "male", "thai": "สอนได้ครับ, อยากรู้อะไรครับ . ครูสอนปีนหน้าผา ยินดีทีได้รู้จักภาษาอังกฤษพูดว่ายังไงครับ", "phonetic": "sǎawn dâai khráp. yàak rúu à-rai khráp.", "english": "Sure, I can teach you. What do you want to know?"}, {"gender": "male", "thai": "โอ้....พูดว่า . . ครูสอนปีนหน้าผา ไนซ์ ทู มีท ยู", "phonetic": "ôo...phûut wâa “Nice to meet you”.", "english": "Oh...you say \"Nice to meet you.\""}, {"gender": "male", "thai": "ฮ่าๆ ดีมากเลยครับ", "phonetic": "", "english": ""}], "vocab": [{"thai": "ปีน", "phonetic": "bpiin", "english": "to climb"}, {"thai": "เป็น", "phonetic": "bpen", "english": "to know how to"}, {"thai": "ตรงนี", "phonetic": "dtrong-níi", "english": "here"}, {"thai": "แป๊บหนึง", "phonetic": "bpáaep nùeng", "english": "one moment"}, {"thai": "พัก", "phonetic": "phák", "english": "to stay, to rest"}, {"thai": "ยังไง", "phonetic": "yang-ngai", "english": "how"}, {"thai": "เก่ง", "phonetic": "gèng", "english": "clever, skillful"}], "samples": [], "cultural": "When you visit Thailand, you will inevitably encounter the Thai variety of broken English, sometimes called \"Tinglish.\" There are peculiarities of Thai pronunciation and sentence structure that sneak in when Thais try their hand at English speaking. First, Thai speakers have trouble with many consonant clusters. This will often result in an extra short \"-a\" getting put after the first letter of some words. For example, \"spaghetti\" will sound like", "practicePrompts": []},
  {"id": "abs-beg-s2-19", "num": 19, "season": 2, "title": "Feeling Lazy in Thailand", "situation": "Feeling too lazy to do anything.", "coreConceptIds": ["s2_tendency"], "keyPattern": {"thai": "ขี้ + adjective", "phonetic": "khîi + adjective", "english": "Tends to be adj"}, "teacherExplanation": "ขี้ (khîi) + adjective describes a bad tendency. ขี้เกียจ (khîi-gìiat) = lazy. ขี้ลืม (khîi-luuem) = forgetful. ขี้โกรธ (khîi-gròot) = quick to anger.", "dialogue": [{"gender": "male", "thai": "ไปเกาะพีพีเท่าไหร่ครับ . คนขายตัวเรือเฟอร์รี สีร้อยห้าสิบค่ะ", "phonetic": "bpai gàw phii-phii thâo-rài khráp.", "english": "I'm going to Koh Phi-Phi."}, {"gender": "male", "thai": "อ๊ะ....ผมลืมหมวกไว้ทีโรงแรม ขีลืมจริงๆ ขอโทษนะครับ, เรือจะออกตอนกีโมงครับ . คนขายตัวเรือเฟอร์รี อีกห้านาทีค่ะ", "phonetic": "á...phǒm luuem mùuak wái thîi roong-raaem. khîi-luuem jing-jing. khǎaw-thôot ná khráp. ruuea jà àawk dtaawn gìi moong khráp.", "english": "Ah...I forgot my hat at the hotel. I'm so forgetful! Excuse me, what time does the boat leave?"}, {"gender": "male", "thai": "แล้วเรือเทียวถัดไปกีโมงครับ . คนขายตัวเรือเฟอร์รี พรุ่งนีเลยค่ะ", "phonetic": "láaeo ruuea thîiao thàt-bpai gìi moong khráp.", "english": "And when is the next boat?"}, {"gender": "male", "thai": "โอ้....ขีเกียจรอ ซือหมวกใหม่ท่าจะง่ายกว่า งันไปเลยก็แล้วกัน", "phonetic": "ôo...khîi-gìiat raaw. súue mùuak mài thâa jà ngâai gwàa. ngán bpai looei gâaw láaeo gan.", "english": "Oh...I don't want to wait. It's probably easier to just buy a new hat. All right then, I'm going."}], "vocab": [{"thai": "ลืม", "phonetic": "luuem", "english": "to forget"}, {"thai": "เกาะ", "phonetic": "gàw", "english": "island"}, {"thai": "ขีเกียจ", "phonetic": "khîi-gìiat", "english": "lazy"}, {"thai": "ไว้", "phonetic": "wái", "english": "to keep"}, {"thai": "ซือ", "phonetic": "súue", "english": "to buy"}, {"thai": "ขีลืม", "phonetic": "khîi-luuem", "english": "forgetful"}, {"thai": "หมวก", "phonetic": "mùuak", "english": "hat, cap"}, {"thai": "เทียว   {"id": "abs-beg-s2-20", "num": 20, "season": 2, "title": "Deciding on a Drink in Thailand", "situation": "Deciding what to drink at a Thai café.", "coreConceptIds": ["s2_beverage_order"], "keyPattern": {"thai": "เอา + beverage + number + แก้ว", "phonetic": "ao + beverage + number + gâaeo", "english": "I will have [number] drinks"}, "teacherExplanation": "For ordering drinks use number + แก้ว (gâaeo) for glasses, กระป๋อง (grà-bpǎwng) for cans, ขวด (khùuat) for bottles. เอา (ao) = I'll have.", "dialogue": [{"gender": "male", "thai": "ขอนําส้มแก้วหนึงครับ . พนักงานเสิร์ฟ ค่ะนํา้ส้มหนึงแก้วนะคะ", "phonetic": "khǎaw nám-sôm gâaeo nùeng khráp.", "english": "I'd like a glass of tangerine juice."}, {"gender": "male", "thai": "เดี!ยวครับๆ มีนําผลไม้ปันไหมครับ . พนักงานเสิร์ฟ มีค่ะ, มีนําแตงโมปัน นํามะนาวปัน แล้วก็นํามะพร้าวปันค่ะ", "phonetic": "dǐiao khráp dǐiao khráp. mii nám-phǒn-lá-máai bpàn mǎi khráp.", "english": "Wait, wait! Do you have fruit juice shakes?"}, {"gender": "male", "thai": "งันเอานําแตงโมปันครับ . พนักงานเสิร์ฟ ได้ค่ะ, นําแตงโมปันนะคะ", "phonetic": "ngán ao nám-dtaaeng-moo bpàn khráp.", "english": "then, I'll have a watermelon shake."}, {"gender": "male", "thai": "โอ๊ะ...เดี!ยวครับเดี!ยว มีชาไหมครับ . พนักงานเสิร์ฟ มีค่ะ, มีชาเย็น ชาดําเย็น แล้วก็ชาร้อนค่ะ", "phonetic": "ó...dǐiao khráp dǐiao. mii chaa mǎi khráp.", "english": "Oh!...Wait, wait! Do you have tea?"}, {"gender": "male", "thai": "อืม...งันเอา ชาดําเย็นก็แล้วกันครับ . พนักงานเสิร์ฟ ค่ะ, ชาดําเย็นนะคะ", "phonetic": "", "english": ""}, {"gender": "male", "thai": "โอ๊ะ...เดี!ยวครับเดี!ยว ขอโทษจริงๆครับ, แต่มีกาแฟไหมครับ . พนักงานเสิร์ฟ มีค่ะ, มีกาแฟเย็น แล้วก็กาแฟสด", "phonetic": "", "english": ""}, {"gender": "male", "thai": "อืม.....งัน เอานําส้มก็แล้วกันครับ", "phonetic": "", "english": ""}], "vocab": [{"thai": "นําส้ม", "phonetic": "nám-sôm", "english": "tangerine juice,"}, {"thai": "ร้อน", "phonetic": "ráawn", "english": "hot"}, {"thai": "มะนาว", "phonetic": "má-naao", "english": "lime"}, {"thai": "กาแฟ", "phonetic": "gaa-faae", "english": "coffee"}, {"thai": "มะพร้าว", "phonetic": "má-phráao", "english": "coconut"}, {"thai": "แตงโม", "phonetic": "dtaaeng-moo", "english": "watermelon"}, {"thai": "เย็น", "phonetic": "yen", "english": "cool, cold"}, {"thai": "สด", "phonetic": "sòt", "english": "fresh"}, {"thai": "ชา", "phonetic": "chaa", "english": "tea"}], "samples": [], "cultural": "You will often see the Thai drink นํ้ามะนาว (nám-má-naao) listed in English as \"lemonade\" on menus. However, this is not really correct. The word มะนาว (má-naao) can refer to either \"a lemon\" or \"a lime,\" but in Thailand, it usually means \"a lime.\" Limes are used extensively in Thai cooking, but lemons are hardly used at all. นํ้ามะนาว (nám-má-naao) almost always refers to a drink made from limes, and so it would be better to call it \"limeade.\" I", "practicePrompts": []},
  {"id": "abs-beg-s2-21", "num": 21, "season": 2, "title": "A Thai Meal Marathon", "situation": "Ordering multiple dishes at a Thai restaurant.", "coreConceptIds": ["s2_food_order"], "keyPattern": {"thai": "เอา + food", "phonetic": "ao + food", "english": "I will have [food]"}, "teacherExplanation": "เอา (ao) means I'll have or I want when ordering food. เอาผัดไทย (ao phàt-thai) = I'll have Pad Thai. More casual than ขอ (khǎaw).", "dialogue": [{"gender": "male", "thai": "สวัสดีครับ, ว่ายนํามาทังวันเลยหิวมาก . พนักงานเสิร์ฟ รับอะไรดีคะ", "phonetic": "sà-wàt-dii khráp. wâai-náam maa tháng wan looei hǐu mâak.", "english": "Hello. I was swimming all day, and now I'm very hungry."}, {"gender": "male", "thai": "เอาแกงเขียวหวาน กับ ผัดผักรวมครับ . พนักงานเสิร์ฟ ค่ะ, แกงเขียวหวาน กับ ผัดผักรวมนะคะ", "phonetic": "ao gaaeng-khǐiao-wǎan gàp phàt-phàk-ruuam khráp.", "english": "I'll take green curry and stir-fried mixed vegetables."}, {"gender": "male", "thai": "แล้วก็ เอา ปอเปี ยะทอดครับ . พนักงานเสิร์ฟ ค่ะ, แกงเขียวหวาน ผัดผักรวม กับ ปอเปี ยะทอดนะคะ", "phonetic": "láaeo gâaw ao bpaaw-bpía-thâawt khráp.", "english": "And I'll also have some deep-fried spring rolls."}, {"gender": "male", "thai": "โอ้...แล้วก็ เอาต้มข่าไก่ด้วยนะครับ . พนักงานเสิร์ฟ ค่ะ, แกงเขียวหวาน ผัดผักรวม ปอเปี ยะทอด กับ ต้มข่าไก่นะคะ", "phonetic": "ôo...láaeo gâaw ao dtôm-khàa-gài dûuai ná khráp.", "english": "Oh... And I'll also take chicken coconut soup."}, {"gender": "male", "thai": "อืม...แล้วก็ เอา ยําทะเลครับ . พนักงานเสิร์ฟ ค่ะ, แกงเขียวหวาน ผัดผักรวม ปอเปี ยะทอด ต้มข่าไก่ กับ ยําทะเล เอาข้าวไหมคะ", "phonetic": "", "english": ""}, {"gender": "male", "thai": "ครับ, เอาข้าวสวยสามจานเลยครับ . พนักงานเสิร์ฟ ค่ะ, ข้าวสวยสามจาน", "phonetic": "", "english": ""}], "vocab": [{"thai": "ว่ายนํา", "phonetic": "wâai-náam", "english": "to swim"}, {"thai": "ผัดผักรวม", "phonetic": "phàt-phàk-ruuam", "english": "stir-fried mixed"}, {"thai": "จาน", "phonetic": "jaan", "english": "dish, plate"}, {"thai": "ปอเปี ยะทอด"   {"id": "abs-beg-s2-22", "num": 22, "season": 2, "title": "Are You in Thailand as a Tourist?", "situation": "Meeting someone who asks if you are a tourist.", "coreConceptIds": ["s2_type_of_person"], "keyPattern": {"thai": "นัก + verb", "phonetic": "nák + verb", "english": "Person who verb-s"}, "teacherExplanation": "นัก (nák) + verb makes a word for a type of person. นักท่องเที่ยว (nák-thâwng-thîiao) = tourist. นักเรียน (nák-rian) = student. นักกีฬา (nák-gii-laa) = athlete.", "dialogue": [{"gender": "male", "thai": "ขอโทษนะครับ, ผมนังทีนีได้ไหมครับ", "phonetic": "khǎaw-thôot ná khráp. phǒm nâng thîi-nîi dâai mǎi khráp.", "english": "Excuse me. Can I sit here?"}, {"gender": "male", "thai": "ได้สิครับ, คุณเป็นคนประเทศอะไรเหรอครับ", "phonetic": "LÉK: dâai sì khráp. khun bpen khon bprà-thêet à-rai rǒoe khráp.", "english": "Yes, certainly. What nationality are you?"}, {"gender": "male", "thai": "ผมเป็นคนอเมริกันครับ, ชือแดน", "phonetic": "phǒm bpen khon-à-mee-rí-gan khráp chûue daaen.", "english": "I'm American. My name is Dan."}, {"gender": "male", "thai": "ผมชือเล็กครับ, และนีภรรยาผมชือน้อย", "phonetic": "LÉK: phǒm chûue lék khráp. láe nîi phan-rá-yaa phǒm chûue náawy. CONT'D OVER THAI POD101.COM ABS OLUTE BEGI NNER S 2 #22 - ARE YOU I N THAI LAND AS  A TOURI S T? 4", "english": "My name is Lek, and this is my wife Noi."}, {"gender": "male", "thai": "ยินดีทีได้รู้จักครับ", "phonetic": "yin-dii thîi dâai rúu-jàk khráp.", "english": "Nice to meet you."}, {"gender": "male", "thai": "เช่นกันค่ะ", "phonetic": "NÁAWY: chên gan khâ.", "english": "Nice to meet you too."}, {"gender": "male", "thai": "เช่นกันครับ", "phonetic": "LÉK: chên gan khráp.", "english": "Nice to meet you too."}, {"gender": "male", "thai": "คุณแดนเป็นนักท่องเทียวใช่ไหมคะ", "phonetic": "NÁAWY: khun daaen bpen nák-thâwng-thîiao châi mǎi khá.", "english": "You're a tourist, right?"}, {"gender": "male", "thai": "ใช่ครับ, ทีอเมริกาทํางานเป็นนักบินน่ะครับ", "phonetic": "châi khráp. thîi à-mee-rí-gaa tham-ngaan   {"id": "abs-beg-s2-23", "num": 23, "season": 2, "title": "Is Everyone in Thailand a Buddhist?", "situation": "Discussing Buddhism in Thailand.", "coreConceptIds": ["s2_people_type"], "keyPattern": {"thai": "คน + adjective", "phonetic": "khon + adjective", "english": "Person who is adj"}, "teacherExplanation": "คน (khon) + adjective describes a type of person. คนไทย (khon-thai) = Thai person. คนพุทธ (khon-phút) = Buddhist person. ชาว (chaao) is more formal.", "dialogue": [{"gender": "male", "thai": "ทานข้าวเลยครับ", "phonetic": "LÉK: thaan khâao looei khráp.", "english": "Go ahead and eat. ABSOLUTE BEGINNER S2 #23 - IS EVERYONE IN THAILAND A BUDDHIST? 3"}, {"gender": "male", "thai": "คุณแดนเป็นคนอเมริกันใช่ไหมคะ, แล้วทีนันทุกคนเป็นคนคริสต์หรือเปล่า", "phonetic": "NÁAWY: khun daaen bpen khon-à-mee-rí-gan châi mǎi khá. láaeo thîi-nân thúk-khon bpen khon-khrít rǔue bplàao.", "english": "So you're from America, right, Dan? Is everyone there Christian?"}, {"gender": "male", "thai": "เปล่าครับ, คนอเมริกันนับถือทุกศาสนา แต่จริงๆแล้วผมไม่นับถือศาสนาอะไรเลย", "phonetic": "bplàao khráp. khon-à-mee-rí-gan náp-thǔue thúk sàat-sà-nǎa. dtàae jing-jing láaeo phǒm mâi náp-thǔue sàat-sà-nǎa à-rai looei. CONT'D OVER ABSOLUTE BEGINNER S2 #23 - IS EVERYONE IN THAILAND A BUDDHIST? 4", "english": "No, they aren't. America has people of every religion. But actually, I don't believe in any religion myself."}, {"gender": "male", "thai": "จริงเหรอครับ, เราเป็นชาวพุทธ แต่ทีภูเก็ตมีชาวมุสลิมเยอะนะครับ", "phonetic": "LÉK: jing rǒoe khráp. rao bpen chaao-phút. dtàae thîi phuu-gèt mii chaao- mú-sà-lim yóe ná khráp.", "english": "Really? We're Buddhist. But in Phuket, there are many Muslims."}, {"gender": "male", "thai": "แล้วก็ ในสมัยก่อนคนจีนมาตั.งรกรากทีภูเก็ตเป็นจํานวนมาก", "phonetic": "NÁAWY: láao gâaw nai sà-mǎi-gàawn khon-jiin maa dtâng-rók-râak thîi phuu-gèt bpen jam-nuuan mâak.", "english": "Also, in olden times, many Chinese people came to settle in Phuket."}, {"gender": "male", "thai":   {"id": "abs-lb-s1-05", "num": 5, "season": 3, "series": "Lower Beginner", "title": "This Thai Beach Isn't As Good As", "situation": "Comparing beaches.", "coreConceptIds": ["lb_unequal"], "keyPattern": {"thai": "A + สู้ + B + ไม่ได้", "phonetic": "A + sûu + B + mâi dâai", "english": "A is not as good as B"}, "teacherExplanation": "A + สู้ + B + ไม่ได้ (A + sûu + B + mâi dâai) — A is not as good as B", "dialogue": [{"gender": "female", "thai": "หาดนีคลืนไม่แรงเหมือนหาดยาว", "phonetic": "hàat níi khlûuen mâi raaeng mǔuean hàat yaao.", "english": "The waves on this beach aren't as strong as on Long Beach."}, {"gender": "male", "thai": "ใช่ แต่หาดยาวไม่มีแมงกะพรุนเหมือนทีนี", "phonetic": "NÓK: châi. dtàae hàat yaao mâi mii maaeng-gà-phrun mǔuean thîi-nîi.", "english": "Yes, but Long Beach doesn't have jellyfish like here."}, {"gender": "female", "thai": "จริงเหรอ มีแมงกะพรุนด้วย", "phonetic": "jing rǒoe. mii maaeng-gà-phrun dûuai. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #5 - THI S  THAI  BEACH I S N'T AS  GOOD AS  THAT ONE! 3", "english": "Really? There are jellyfish!"}, {"gender": "male", "thai": "จริงซิ อย่าเล่นนําดีกว่า", "phonetic": "NÓK: jing sí. yàa lên nám dii gwàa.", "english": "Really. Better if we don't play in the water."}], "vocab": [{"thai": "เล่นนํา", "phonetic": "lên nám", "english": "play in water; play"}, {"thai": "ดีกว่า", "phonetic": "dii-gwàa", "english": "better; rather"}, {"thai": "หาด", "phonetic": "hàat", "english": "beach"}, {"thai": "คลืน", "phonetic": "khlûuen", "english": "wave"}, {"thai": "แรง", "phonetic": "raaeng", "english": "strong"}, {"thai": "ยาว", "phonetic": "yaao", "english": "long"}, {"thai": "แมงกะพรุน", "phonetic": "maaeng-gà-phrun", "english": "jellyfish"}], "samples": [{"thai": "จริงเหรอคะ", "phonetic": "", "english": "Is that true?"}, {"thai": "จริงเหรอคะ", "phonetic": "", "english": "A large number of people came out to \nplay with water on Songkran."}], "cultural": "Many beaches in Thailand seem like paradise, but one potential hazard is jellyfish in the water. Of particular concern is the rare but deadly box jellyfish. In 2002, two tourists died from box jellyfish stings on Koh Phangan, and another tourist died on Koh Lanta in 2008. The box jellyfish is rare, but other species of jellyfish are quite common. While the stings of these other species aren't lethal, they're nevertheless painful. In recent years,", "practicePrompts": []},
  {"id": "abs-lb-s1-06", "num": 6, "season": 3, "series": "Lower Beginner", "title": "Make Sure You Don't Leave", "situation": "Warning about what to bring.", "coreConceptIds": ["lb_possession"], "keyPattern": {"thai": "noun + ของ + ผม/คุณ/เขา", "phonetic": "noun + khǎawng + owner", "english": "My/your/his noun"}, "teacherExplanation": "noun + ของ + ผม/คุณ/เขา (noun + khǎawng + owner) — My/your/his noun", "dialogue": [{"gender": "male", "thai": "ดาวเห็นไดร์เป่าผมของเรามัย", "phonetic": "NÓK: daao hěn dai-bpào-phǒm khǎawng rao mái.", "english": "Dao, have you seen my hairdryer?"}, {"gender": "female", "thai": "อันนีรึเปล่า", "phonetic": "an-níi rúe bplàao.", "english": "Is this it?"}, {"gender": "male", "thai": "ไม่ใช่ นันของโรงแรม ของเราสีแดง", "phonetic": "NÓK: mâi châi. nán khǎawng roong-raaem. khǎawng rao sǐi-daaeng. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #6  - MAKE S URE YOU DON'T LEAVE ANYTHI NG AT YOUR THAI  HOTEL! 3", "english": "No. That's the hotel's. Mine is red."}, {"gender": "female", "thai": "หาทัวแล้วเหรอ ลองหาดูอีกทีซิ", "phonetic": "hǎa thûua láaeo rǒoe. laawng hǎa duu ìik thii sí.", "english": "You looked everywhere already? Try looking for it again."}], "vocab": [{"thai": "เรา", "phonetic": "rao", "english": "I, we"}, {"thai": "รึเปล่า", "phonetic": "rúe bplàao", "english": "or not?"}, {"thai": "โรงแรม", "phonetic": "roong-raaem", "english": "hotel"}, {"thai": "ทัว", "phonetic": "thûua", "english": "throughout"}], "samples": [{"thai": "คุณแนะนําโรงแรมไหนคะ", "phonetic": "", "english": "I can see rows of mountains in the \ndistance."}], "cultural": "There is a wide range of accommodations available for visitors to Thailand. On one end of the spectrum are guesthouses and hostels targeted towards backpackers, and on the other end are luxury resorts geared towards millionaire tourists with lots of money to spend. The cheapest guesthouse rooms will be just a simple room with a fan and a shared bathroom down the hall. This type of very cheap accommodation was once more common, but in recent years", "practicePrompts": []},
  {"id": "abs-lb-s1-07", "num": 7, "season": 3, "series": "Lower Beginner", "title": "Are You Sure that Thai Person is", "situation": "Identifying a person in a photo.", "coreConceptIds": ["lb_this_that"], "keyPattern": {"thai": "คน + นี้/นั้น/โน้น", "phonetic": "khon + níi/nân/nóon", "english": "This/that/that person"}, "teacherExplanation": "คน + นี้/นั้น/โน้น (khon + níi/nân/nóon) — This/that/that person", "dialogue": [{"gender": "female", "thai": "ดูผู้ชายคนนันดิ หล่อมาก!", "phonetic": "duu phûu-chaai khon-nán dì. làaw mâak.", "english": "Look at that guy—so handsome!"}, {"gender": "male", "thai": "เขากําลังเดินมาหาผู้หญิงคนนี อาจจะเป็นแฟนกัน", "phonetic": "NÓK: khǎo gam-lang dooen maa hǎa phûu-yǐng khon-níi. àat-jà bpen faaen gan.", "english": "He's walking over to meet this lady. Maybe they're a couple."}, {"gender": "female", "thai": "ดูดีๆ เธอ คนนันไม่ใช่ผู้หญิงนะ", "phonetic": "duu dii-dii thooe. khon nán mâi châi phûu-yǐng ná. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #7 - ARE YOU S URE THAT THAI  PERS ON I S  REALLY A WOMAN? 3", "english": "Look carefully. That person isn't a lady."}, {"gender": "male", "thai": "เป็นกะเทยเหรอ! สวยเหมือนผู้หญิงจริงๆ เลย", "phonetic": "NÓK: bpen gà-thooei rǒoe. sǔuai mǔuean phûu-yǐng jing-jing looei.", "english": "It's a ladyboy? She's as beautiful as a real woman."}], "vocab": [{"thai": "คนนี", "phonetic": "khon níi", "english": "this person"}, {"thai": "เป็นแฟนกัน", "phonetic": "bpen faaen gan", "english": "to be dating, to be"}, {"thai": "กะเทย", "phonetic": "gà-thooei", "english": "ladyboy, transvestite,"}, {"thai": "ผู้ชาย", "phonetic": "phûu-chaai", "english": "man"}, {"thai": "คนนัน", "phonetic": "khon nán", "english": "that person"}, {"thai": "หล่อ", "phonetic": "làaw", "english": "handsome"}, {"thai": "เดิน", "phonetic": "dooen", "english": "to walk"}], "samples": [], "cultural": "Thailand has a very visible population of transvestites, or \"ladyboys,\" as they're usually called in English. The Thai word กะเทย (gà-thooe) can refer to any males who identify or dress as women, whether or not they've had any surgery to change their appearance or gender. It's quite common for ladyboys to work in the retail, service, and entertainment industries. If you walk into any large department store, you're likely to find that half the gir", "practicePrompts": []},
  {"id": "abs-lb-s1-08", "num": 8, "season": 3, "series": "Lower Beginner", "title": "What Kind of Man Do Thai Women", "situation": "Discussing what Thai women look for.", "coreConceptIds": ["lb_likes_dislikes"], "keyPattern": {"thai": "ชอบ/ไม่ชอบ + noun/verb", "phonetic": "châawp / mâi châawp + noun", "english": "Like/dislike noun"}, "teacherExplanation": "ชอบ/ไม่ชอบ + noun/verb (châawp / mâi châawp + noun) — Like/dislike noun", "dialogue": [{"gender": "male", "thai": "เธอชอบผู้ชายแบบไหน", "phonetic": "NÓK: thooe châawp phûu-chaai bàaep nǎi.", "english": "What kind of man do you like?"}, {"gender": "female", "thai": "หล่อ รวย การศึกษาดี มีรถขับ", "phonetic": "làaw ruuai gaa-sùek-sǎa dii mii rót khàp.", "english": "Handsome...rich...educated...drives a car."}, {"gender": "male", "thai": "เยอะไปมัย แค่คนทีใจดี ไม่ดืมเหล้า ไม่เทียวกลางคืนก็พอ", "phonetic": "NÓK: yóe bpai mái. khâae khon thîi jai-dii mâi dùuem lâo mâi thîiao glaang-khuuen gâaw phaaw. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #8  - WHAT KI ND OF MAN DO THAI  WOMEN LIKE? 3", "english": "A little too much? Just someone who is kind, doesn't drink booze, and doesn't go out at night is enough."}, {"gender": "female", "thai": "พูดเล่น แค่คนทีชอบทีเราเป็นเราก็พอแล้ว", "phonetic": "phûut lên. khâae khon thîi châawp thîi rao bpen rao gâaw phaaw láaeo.", "english": "I'm kidding. Just someone who likes me for who I am is enough."}], "vocab": [{"thai": "พอ", "phonetic": "phaaw", "english": "enough"}, {"thai": "แบบ", "phonetic": "bàaep", "english": "style, design, model,"}, {"thai": "รวย", "phonetic": "ruuai", "english": "rich"}, {"thai": "มีรถขับ", "phonetic": "mii rót khàp", "english": "to have a car to drive"}, {"thai": "ใจดี", "phonetic": "jai-dii", "english": "kind"}, {"thai": "ดืมเหล้า", "phonetic": "dùuem lâo", "english": "to drink alcohol"}, {"thai": "ไปเทียวกลางคืน", "phonetic": "bpai thîiao glaang-", "english": "khuuen"}, {"thai": "ชอบทีเราเป็นเรา", "phonetic": "châawp thîi rao bpen", "english": "rao"}], "samples": [{"thai": "มีรถขับมัยคะ", "phonetic": "", "english": "I ate enough already. I don't want to get \nfat."}], "cultural": "Thai relationships generally still follow specific gender roles. When going out on a date, the man is expected to pay for the dinner and entertainment. Most Thai women would not be shy to say that they're looking for a man who can provide financially for them and their family. In Thailand, adult children are expected to look after their parents. So a woman will often consider how much a potential husband will be able to contribute financially to ", "practicePrompts": []},
  {"id": "abs-lb-s1-09", "num": 9, "season": 3, "series": "Lower Beginner", "title": "How Can You Be Cold in Thailand?", "situation": "Being cold in tropical Thailand.", "coreConceptIds": ["lb_want"], "keyPattern": {"thai": "อยาก + verb", "phonetic": "yàak + verb", "english": "Want to verb"}, "teacherExplanation": "อยาก + verb (yàak + verb) — Want to verb", "dialogue": [{"gender": "female", "thai": "อยากดูหนังเรืองคิดถึงวิทยาจังเลย", "phonetic": "yàak duu nǎng rûueang khít thǔeng wí-thá-yaa jang looei.", "english": "I really want to see the movie \"Miss you Withaya.\""}, {"gender": "male", "thai": "เอาสิ ไปดูกัน! แต่ฉันอยากไปเอาเสือแขนยาวทีบ้านก่อน", "phonetic": "NÓK: ao sì. bpai duu gan. dtàae chǎn yàak bpai ao sûuea-khǎaen-yaao thîi bâan gàawn.", "english": "OK, let's go see it. But I want to go get a sweatshirt from my house first."}, {"gender": "female", "thai": "เราด้วย อยากบอกผู้จัดการว่าโรงหนังหนาวมาก", "phonetic": "rao dûuai. yàak bàawk phûu-jàt-gaan wâa roong-nǎng nǎao mâak. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #9  - HOW CAN YOU BE COLD I N THAI LAND? 3", "english": "Me too. I want to tell the manager that the movie theater is so cold."}, {"gender": "male", "thai": "ถ้าร้อนเกินไปเขากลัวโรงหนังจะมีกลิน ฮ่าๆ", "phonetic": "NÓK: thâa ráawn gooen-bpai khǎo gluua roong-nǎng jà mii glìn. hâa-hâa.", "english": "If it was too hot they'd be afraid that the cinema would stink. Ha-ha."}], "vocab": [{"thai": "อยาก", "phonetic": "yàak", "english": "to want"}, {"thai": "เรือง", "phonetic": "rûueang", "english": "story, topic"}, {"thai": "บอก", "phonetic": "bàawk", "english": "to tell"}, {"thai": "ผู้จัดการ", "phonetic": "phûu-jàt-gaan", "english": "manager"}, {"thai": "กลิน", "phonetic": "glìn", "english": "odor"}], "samples": [], "cultural": "Thailand is a tropical country that can have brutally high temperatures almost year-round. Air conditioning makes living in the tropics much more comfortable—except when it's overused. THAI POD101.COM Some of the main places where the air conditioning temperature is set incredibly low are movie theaters, shopping malls, convenience stores, and long-distance buses. Temperatures on overnight buses are often set as low as", "practicePrompts": []},
  {"id": "abs-lb-s1-10", "num": 10, "season": 3, "series": "Lower Beginner", "title": "How Many Pairs of Sunglasses Do", "situation": "Shopping for sunglasses.", "coreConceptIds": ["lb_need"], "keyPattern": {"thai": "ต้องการ + noun/verb", "phonetic": "dtâwng-gaan + noun/verb", "english": "Need noun/to verb"}, "teacherExplanation": "ต้องการ + noun/verb (dtâwng-gaan + noun/verb) — Need noun/to verb", "dialogue": [{"gender": "female", "thai": "หาอะไรคะ", "phonetic": "KHON KHǍAI: hǎa à-rai khá.", "english": "What are you looking for?"}, {"gender": "female", "thai": "หาร้านขายส่งแว่นกันแดดน่ะค่ะ", "phonetic": "hǎa ráan khǎai-sòng wâen-gan-dàaet nâ khâ. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #10 - HOW MANY PAI RS  OF S UNGLAS S ES  DO YOU NEED I N THAI LAND? 3", "english": "I'm looking for find a shop selling sunglasses wholesale."}, {"gender": "female", "thai": "เรามีหลายแบบเลยค่ะ, คุณอยากได้กีอันคะ", "phonetic": "KHON KHǍAI: rao mii lǎai bàaep looei khâ. khun yàak dâai gìi an khá.", "english": "We have many styles. How many do you want to get?"}, {"gender": "female", "thai": "ประมาณร้อยอันค่ะ, ต้องส่งให้น้องสาวทีเชียงใหม่ไปขายทีถนนคนเดิน", "phonetic": "bprà-maan ráauy an khâ. dtâwng sòng hâi náawng-sǎao thîi chiiang-mài bpai khǎai thîi thà-nǒn khon dooen", "english": "About a hundred pairs. I need to send them to my younger sister in Chiang Mai to sell at the walking street."}], "vocab": [{"thai": "ต้อง", "phonetic": "dtâwng", "english": "must, need"}, {"thai": "ร้าน", "phonetic": "ráan", "english": "shop"}, {"thai": "แว่นกันแดด", "phonetic": "wâen-gan-dàaet", "english": "sunglasses"}, {"thai": "ได้", "phonetic": "dâai", "english": "to get"}, {"thai": "กี", "phonetic": "gìi", "english": "how much, how"}, {"thai": "น้อง", "phonetic": "náawng", "english": "younger sibling,"}], "samples": [], "cultural": "Pratunam Market is a wholesale market in the middle of Bangkok.The majority of the sellers sell clothing, shoes, and fashion accessories. If you want to get a large quantity of clothing at a deeply discounted price, this is the place to do it. Most of the small clothing shops in Bangkok and around the country source their clothing from the wholesale merchants at Pratunam Market. Although the focus is mostly on wholesale quantities, you can still ", "practicePrompts": []},
  {"id": "abs-lb-s1-11", "num": 11, "season": 3, "series": "Lower Beginner", "title": "Check Out the Latest Thai", "situation": "Discussing the latest Thai fashion.", "coreConceptIds": ["lb_opinion"], "keyPattern": {"thai": "ผมคิดว่า + clause", "phonetic": "phǒm khít wâa + clause", "english": "I think that..."}, "teacherExplanation": "ผมคิดว่า + clause (phǒm khít wâa + clause) — I think that...", "dialogue": [{"gender": "male", "thai": "ชอบชุดนีมัย", "phonetic": "NÓK: châawp chút níi mái.", "english": "Do you like this outfit?"}, {"gender": "female", "thai": "ไม่อะ เราว่าเราใส่กางเกงเอวสูงไม่สวย", "phonetic": "mâi à. rao wâa rao sài gaang-geeng eeo sǔung mâi sǔuai.", "english": "No, I think I don't look good wearing high-waisted pants."}, {"gender": "male", "thai": "ไม่เห็นจริงเลย เราว่าดาวใส่แล้วน่ารักออก", "phonetic": "NÓK: mâi hěn jing looei. rao wâa daao sài láaeo nâa-rák àawk. CONT'D OVER THAI POD101.COM LOWER BEGINNER S 1 #11 - CHECK OUT THE LATES T THAI  FAS HI ONS ! 3", "english": "That's not true. I think you look cute wearing them."}, {"gender": "female", "thai": "เราว่าต้องลดนําหนักก่อนนะถึงจะใส่ได้", "phonetic": "rao wâa dtâwng lót nám-nàk gàawn ná thǔeng jà sài dâai.", "english": "I think I need to lose some weight before I can wear them."}], "vocab": [{"thai": "ชุด", "phonetic": "chút", "english": "outfit, uniform, set"}, {"thai": "ว่า", "phonetic": "wâa", "english": "to say, to think that"}, {"thai": "ใส่", "phonetic": "sài", "english": "to wear, to put on, to"}, {"thai": "กางเกง", "phonetic": "gaang-geeng", "english": "pants"}, {"thai": "เอว", "phonetic": "eeo", "english": "waist"}, {"thai": "น่ารัก", "phonetic": "nâa-rák", "english": "cute"}, {"thai": "ลดนําหนัก", "phonetic": "lót nám-nàk", "english": "to lose weight"}], "samples": [{"thai": "เอาผัดไทยไม่ใส่กุ้งค่ะ", "phonetic": "", "english": "He showed up in a blue outfit."}, {"thai": "คุณสูงเท่าไหร่คะ", "phonetic": "", "english": "I think he's lying."}], "cultural": "Fashion in Thailand, as in most places, is always changing and evolving. Much of popular contemporary fashion in Thailand is inspired by the fashion coming out of Japan and Korea. One new trend that has been popular since about 2012 is high-waisted pants, or กางเกงเอวสูง (gaang-geeng eeo sǔung) for women. These pants are usually tight-fitting, with extra material at the waist so that they come up to right around the navel or just slightly below. ", "practicePrompts": []},
