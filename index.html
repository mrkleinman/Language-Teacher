function ThaiTeacher() {
  const [vocab, setVocab] = useState([])
  const [tracks, setTracks] = useState([])
  const [view, setView] = useState('dashboard')
  const [loading, setLoading] = useState(true)
  const [activeTrack, setActiveTrack] = useState(null)
  const [genMode, setGenMode] = useState('daily')
  const [kruOpen, setKruOpen] = useState(false)
  const [kruCtx, setKruCtx] = useState('')
  const [apiKey, setApiKey] = useState('')
  const [provider, setProvider] = useState('claude')
  const [dsKey, setDsKey] = useState('')
  const [orKey, setOrKey] = useState('')
  const [customTargets, setCustomTargets] = useState(null)
  const [browseFilter, setBrowseFilter] = useState('all')

  // Init
  useEffect(() => {
    async function init() {
      const sv = await stGet('tt-vocab')
      const st = await stGet('tt-tracks')
      if (sv && sv.length) {
        // Migration: overwrite ALL phonetics from corrected RAW_VOCAB
        const phMap = {}
        RAW_VOCAB.forEach((d, i) => { if (d.ph) phMap[i + 1] = d.ph })
        const migrated = sv.map(w => phMap[w.id] ? { ...w, phonetic: phMap[w.id] } : w)
        setVocab(migrated)
        await stSet('tt-vocab', migrated)
      } else {
        const v = initVocab()
        setVocab(v)
        await stSet('tt-vocab', v)
      }
      setTracks(st || [])
      const sk = await stGet('tt-apikey')
      if (sk) setApiKey(sk)
      const pv = await stGet('tt-provider'); if (pv) setProvider(pv)
      const dk = await stGet('tt-dskey'); if (dk) setDsKey(dk)
      const ok = await stGet('tt-orkey'); if (ok) setOrKey(ok)
      setLoading(false)
    }
    init()
  }, [])

  const saveVocab = useCallback(async v => { setVocab(v); await stSet('tt-vocab', v) }, [])
  const saveTracks = useCallback(async t => {
    // Item 41: Cap at 20 tracks, remove oldest
    const capped = t.length > 20 ? t.slice(t.length - 20) : t
    setTracks(capped)
    await stSet('tt-tracks', capped)
  }, [])

  function navigate(v) {
    if (v === 'generate-daily') { setGenMode('daily'); setCustomTargets(null); setView('generate') }
    else if (v === 'generate-weak') { setGenMode('weak'); setCustomTargets(null); setView('generate') }
    else if (v.startsWith('browse-')) { setBrowseFilter(v.replace('browse-', '')); setView('browse') }
    else setView(v)
  }

  function onCustomTrack(targets) {
    setCustomTargets(targets); setGenMode('custom'); setView('generate')
  }

  function onTrackGenerated(track) {
    const newTracks = [...tracks, track]
    saveTracks(newTracks)
    setActiveTrack(track)
    setView('player')
  }

  function onTrackComplete(keywords) {
    // Apply SRS ratings — skip words marked as 'skip' (didn't appear)
    const ratedIds = {}
    const knownIds = new Set()
    keywords.forEach(k => {
      if (!k.wordId || !k.rating || k.rating === 'skip') return
      if (k.rating === 'known') knownIds.add(k.wordId)
      else ratedIds[k.wordId] = k.rating
    })
    const newVocab = vocab.map(w => {
      if (knownIds.has(w.id)) return markWordKnown(w)
      if (ratedIds[w.id]) return applyRating(w, ratedIds[w.id])
      return w
    })
    saveVocab(newVocab)

    // Mark track as rated
    const newTracks = tracks.map(t => t === activeTrack ? { ...t, rated: true, keywords } : t)
    saveTracks(newTracks)
    setActiveTrack(null)
    setView('dashboard')
  }

  function onOpenTrack(track) {
    setActiveTrack(track)
    setView('player')
  }

  function onDeleteTrack(idx) {
    const newTracks = tracks.filter((_, i) => i !== idx)
    saveTracks(newTracks)
  }

  function onWordsAdded(words) {
    const maxId = vocab.reduce((m, w) => Math.max(m, w.id), 0)
    const newWords = words.map((w, i) => ({
      id: maxId + i + 1, thai: w.thai, english: w.english, phonetic: w.phonetic || null, status: 'new', difficulty: 'hard', interval: 0, lastSeen: null, dueDate: null, repCount: 0, lapses: 0
    }))
    const newVocab = [...vocab, ...newWords]
    saveVocab(newVocab)
    navigate('dashboard')
  }

  function onPhonetics(map) {
    // map is {wordId: phonetic} — save into vocab words
    let changed = false
    const newVocab = vocab.map(w => {
      if (map[w.id] && !w.phonetic) { changed = true; return { ...w, phonetic: map[w.id] } }
      return w
    })
    if (changed) saveVocab(newVocab)
  }

  function openKru(ctx = '') { setKruCtx(ctx); setKruOpen(true) }

  if (loading) {
    return (
      <div className="app" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', flexDirection: 'column', gap: 16 }}>
        <FontStyle />
        <div className="thai display" style={{ fontSize: 36, color: 'var(--gold)' }}>สวัสดี</div>
        <Spinner size={28} />
        <p style={{ color: 'var(--muted)', fontSize: 14 }}>Loading Thai Teacher...</p>
      </div>
    )
  }

  const trackContext = activeTrack
    ? `Track: ${activeTrack.date}, mode: ${activeTrack.mode}. Keywords: ${(activeTrack.keywords || []).map(k => `${k.thai}=${k.english}`).join(', ')}`
    : ''

  return (
    <div className="app">
      <FontStyle />
      <Header view={view} onNav={navigate} onHome={() => navigate('dashboard')} />
      <main>
        {view === 'dashboard' && <Dashboard vocab={vocab} tracks={tracks} onNav={navigate} onOpenTrack={onOpenTrack} onDeleteTrack={onDeleteTrack}
            onOpenConvo={track => { setActiveTrack(track); setView('convo') }}
            onGenerateConvo={async (track) => {
              const orModel = provider === 'deepseek' ? 'deepseek/deepseek-chat' : provider === 'haiku' ? 'anthropic/claude-haiku-4-5' : 'openai/gpt-4o-mini'
              const convoKey = provider === 'claude' ? apiKey : orKey
              if (!convoKey) {
                alert('No OpenRouter key found. Go to Settings and save your key first.')
                return
              }
              const targets = vocab.filter(w => (track.keywords||[]).some(k => k.wordId === w.id))
              if (!targets.length) { alert('No matching words found for this track'); return }
              try {
                const lines = await generateConvoWithOpenRouter(targets, vocab, convoKey, orModel)
                if (!lines || !lines.length) throw new Error('No conversation lines returned')
                // Find and update track by createdAt
                const updated = tracks.map(t => t.createdAt === track.createdAt ? { ...t, convo: lines } : t)
                await saveTracks(updated)
                setActiveTrack({ ...track, convo: lines })
                setView('convo')
              } catch(e) { alert('Convo failed: ' + e.message) }
            }}
            provider={provider} onSetProvider={async p => { setProvider(p); await stSet('tt-provider', p) }} hasClaudeKey={!!apiKey} hasDeepSeekKey={!!dsKey} hasOrKey={!!orKey} />}
        {view === 'generate' && <Generator vocab={vocab} mode={genMode} onGenerated={onTrackGenerated} onBack={() => navigate('dashboard')}
          apiKey={orKey}
          provider={provider}
          orKey={orKey} onPhonetics={onPhonetics} customTargets={customTargets}
        />}
        {view === 'player' && activeTrack && (
          <Player track={activeTrack} onComplete={onTrackComplete} onBack={() => { setActiveTrack(null); navigate('dashboard') }} onKru={ctx => openKru(ctx)}
            onBookmark={async (pairIdx) => {
              const updated = tracks.map(t => t === activeTrack ? { ...t, bookmark: pairIdx } : t)
              await saveTracks(updated)
              setActiveTrack(prev => ({ ...prev, bookmark: pairIdx }))
            }}
          />
        )}
        {view === 'browse' && <Browser vocab={vocab} onBack={() => navigate('dashboard')} initialFilter={browseFilter} phonetics={{}} onCustomTrack={onCustomTrack} orKey={orKey} onVocabUpdate={saveVocab} />}
        {view === 'add-words' && <Adder onBack={() => navigate('dashboard')} onAdded={onWordsAdded} orKey={orKey} />}
        {view === 'settings' && <Settings onBack={() => navigate('dashboard')} apiKey={apiKey} onSaveKey={k => setApiKey(k)} provider={provider} onSaveProvider={async p => { setProvider(p); await stSet('tt-provider',p) }} dsKey={dsKey} onSaveDsKey={async k => { setDsKey(k); await stSet('tt-dskey',k) }} orKey={orKey} onSaveOrKey={async k => { setOrKey(k); await stSet('tt-orkey',k) }} />}
        {view === 'data' && <DataManager onBack={() => navigate('dashboard')} vocab={vocab} tracks={tracks} onImport={async (v,t) => { await saveVocab(v); await saveTracks(t); navigate('dashboard') }} />}
        {view === 'belt-rank' && <BeltRankView vocab={vocab} onBack={() => navigate('dashboard')} />}
        {view === 'lessons' && <LessonsView vocab={vocab} onBack={() => navigate('dashboard')} />}
        {view === 'convo' && activeTrack?.convo && (
          <ConvoPlayer
            lines={activeTrack.convo}
            speed={parseFloat(localStorage.getItem('tt-speed') || '0.8')}
            onSpeedChange={s => { try { localStorage.setItem('tt-speed', s) } catch {} }}
            onSkip={() => { setView('dashboard') }}
            onDone={() => { setView('dashboard') }}
          />
        )}
      </main>

      {/* Kru floating button */}
      {view !== 'player' && (
        <button onClick={() => openKru()} title="Ask Kru"
          style={{ position: 'fixed', bottom: 20, right: 20, width: 52, height: 52, borderRadius: '50%', background: 'linear-gradient(135deg, #d4a94a, #b88a35)', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 20px rgba(212,169,74,0.4)', fontSize: 22, zIndex: 40, transition: 'transform 0.15s' }}
          onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.1)'}
          onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}>
          ครู
        </button>
      )}

      <KruPanel open={kruOpen} onClose={() => setKruOpen(false)} trackContext={trackContext} vocab={vocab} />
    </div>
  )
}






ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ThaiTeacher))
  </script>
</body>
</html>
