// ── SRS Logic ────────────────────────────────────────────────────────────────
const EASE = { easy: 2.5, ok: 1.3, hard: 0.6 }
function calcInterval(cur, rating) {
  return Math.min(Math.round(Math.max(cur, 1) * (EASE[rating] || 1.3) * 1.5), 365)
}
function applyRating(word, rating) {
  const today = new Date().toISOString().slice(0, 10)
  const newInt = calcInterval(word.interval || 0, rating)
  const d = new Date(); d.setDate(d.getDate() + newInt)
  let { status, lapses = 0 } = word
  if (rating === 'hard') { if (status === 'known') { status = 'lapsed'; lapses++ } else status = 'learning' }
  else status = (rating === 'easy' && newInt >= 21) ? 'known' : 'learning'
  if (word.status === 'new') status = 'learning'
  return { ...word, interval: newInt, lastSeen: today, dueDate: d.toISOString().slice(0, 10), repCount: (word.repCount || 0) + 1, lapses, status, difficulty: rating }
}

async function stGet(key) {
  try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null } catch {}
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : null } catch {}
  return null
}
async function stSet(key, val) {
  try { await window.storage.set(key, JSON.stringify(val)) } catch {}
  try { localStorage.setItem(key, JSON.stringify(val)) } catch {}
}

// ── Vocab Helpers ─────────────────────────────────────────────────────────────
function initVocab() {
  return RAW_VOCAB.map((d, idx) => {
    const l = d.l
    let status = 'new', interval = 0, dueDate = null
    if (l === 'easy') {
      status = 'known'; interval = d.i || 24
      const dd = new Date(); dd.setDate(dd.getDate() + Math.floor(Math.random() * 7))
      dueDate = dd.toISOString().slice(0, 10)
    } else if (l === 'ok') {
      status = 'learning'; interval = d.i || 4
      const dd = new Date(); dd.setDate(dd.getDate() + Math.floor(Math.random() * 3))
      dueDate = dd.toISOString().slice(0, 10)
    }
    return { id: idx + 1, thai: d.t, english: d.e, phonetic: d.ph || null, status, difficulty: l, interval, lastSeen: null, dueDate, repCount: d.r || 0, lapses: d.lp || 0 }
  })
}

function getStats(vocab) {
  const today = new Date().toISOString().slice(0, 10)
  return {
    total: vocab.length,
    due: vocab.filter(w => w.status !== 'new' && w.dueDate && w.dueDate <= today).length,
    newW: vocab.filter(w => w.status === 'new').length,
    learning: vocab.filter(w => w.status === 'learning').length,
    known: vocab.filter(w => w.status === 'known').length,
  }
}

function pickWords(vocab, mode) {
  const today = new Date().toISOString().slice(0, 10)
  let targets
  if (mode === 'weak') {
    targets = vocab.filter(w => w.difficulty === 'hard' || w.status === 'lapsed' || w.lapses >= 2).slice(0, 30)
    if (!targets.length) targets = vocab.filter(w => w.status === 'learning').slice(0, 30)
  } else {
    const due = vocab.filter(w => w.status !== 'new' && w.dueDate && w.dueDate <= today).slice(0, 22)
    const newW = vocab.filter(w => w.status === 'new').slice(0, 9)
    targets = [...due, ...newW].slice(0, 30)
  }
  const targetIds = new Set(targets.map(w => w.id))
  const anchors = vocab
    .filter(w => (w.status === 'known' || w.status === 'learning') && !targetIds.has(w.id))
    .sort((a, b) => (!a.lastSeen ? -1 : !b.lastSeen ? 1 : a.lastSeen.localeCompare(b.lastSeen)))
    .slice(0, 25)
  return { targets, anchors }
}

// ── Pimsleur Track Generator (local, no API) ──────────────────────────────────
// Generates ~90 challenge-response pairs using full Thai sentences.
// Each target word appears 3x at spaced intervals (intro → mid review → late review).
// Anchor words fill gaps with 1-2 sentence reviews.

function shuffle(arr) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] }
  return a
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)] }

// Each frame returns { prompt, thai, english }
// Thai answer is always a complete sentence (subject + verb + object + particle)
const FRAMES = [
  // "I want / would like"
  w => ({ prompt: `Tell someone you want ${w.english}`, thai: `ผมอยากได้${w.thai}ครับ`, english: `I'd like some ${w.english}` }),
  w => ({ prompt: `Say you really want to ${w.english}`, thai: `ผมอยาก${w.thai}มากครับ`, english: `I really want to ${w.english}` }),
  // "I like / don't like"
  w => ({ prompt: `Tell your friend you like ${w.english}`, thai: `ผมชอบ${w.thai}มากเลยครับ`, english: `I really like ${w.english}` }),
  w => ({ prompt: `Say you don't like ${w.english}`, thai: `ผมไม่ชอบ${w.thai}เลยครับ`, english: `I don't like ${w.english} at all` }),
  // "I have / don't have"
  w => ({ prompt: `Say you have ${w.english}`, thai: `ผมมี${w.thai}อยู่ครับ`, english: `I have ${w.english}` }),
  w => ({ prompt: `Say you don't have ${w.english}`, thai: `ผมไม่มี${w.thai}เลยครับ`, english: `I don't have any ${w.english}` }),
  // "I'm going to / just did"
  w => ({ prompt: `Tell someone you're about to ${w.english}`, thai: `ผมจะ${w.thai}แล้วครับ`, english: `I'm about to ${w.english}` }),
  w => ({ prompt: `Say you just ${w.english}`, thai: `ผมเพิ่ง${w.thai}มาเมื่อกี้ครับ`, english: `I just ${w.english} a moment ago` }),
  // "I need / must"
  w => ({ prompt: `Say you need ${w.english}`, thai: `ผมต้องการ${w.thai}ครับ`, english: `I need ${w.english}` }),
  w => ({ prompt: `Say you have to ${w.english}`, thai: `ผมต้อง${w.thai}ก่อนครับ`, english: `I have to ${w.english} first` }),
  // Questions
  w => ({ prompt: `Ask if they have ${w.english}`, thai: `มี${w.thai}ไหมครับ`, english: `Do you have ${w.english}?` }),
  w => ({ prompt: `Ask if you can ${w.english}`, thai: `ผม${w.thai}ได้ไหมครับ`, english: `Can I ${w.english}?` }),

  // Describing / commenting
  w => ({ prompt: `Say this ${w.english} is very good`, thai: `${w.thai}นี้ดีมากเลยครับ`, english: `This ${w.english} is very good` }),
  w => ({ prompt: `Tell them the ${w.english} looks great`, thai: `${w.thai}นี้ดูดีมากครับ`, english: `This ${w.english} looks really good` }),

  // "Someone said / I think"
  w => ({ prompt: `Say you think ${w.english} is good`, thai: `ผมคิดว่า${w.thai}นี้ดีครับ`, english: `I think this ${w.english} is good` }),
  w => ({ prompt: `Tell them you heard about ${w.english}`, thai: `ผมได้ยินเรื่อง${w.thai}มาครับ`, english: `I heard about ${w.english}` }),
  // Currently doing / haven't yet
  w => ({ prompt: `Say you're currently ${w.english}ing`, thai: `ตอนนี้ผมกำลัง${w.thai}อยู่ครับ`, english: `I'm currently ${w.english}ing` }),
  w => ({ prompt: `Say you haven't ${w.english}ed yet`, thai: `ผมยังไม่ได้${w.thai}เลยครับ`, english: `I haven't ${w.english}ed yet` }),
]

// Reverse frames: Thai prompt → student recalls meaning / responds
const REV_FRAMES = [
  w => ({ prompt: `You hear: "${w.thai}" — what does this mean and how do you respond?`, thai: `${w.thai}`, english: `${w.english}` }),
  w => ({ prompt: `Respond to: "${w.thai}"`, thai: `${w.thai}`, english: `(means: ${w.english})` }),
]

function makePair(w, framePool) {
  const f = pick(framePool)(w)
  return { ...f, wordId: w.id }
}

function generatePairsLocal(targets, anchors) {
  // Target words get 3 appearances each: intro (early), review (middle), recall (late)
  // Anchors fill the gaps — 1-2 appearances each

  const TOTAL = 90  // ~45 min at ~30 sec per pair
  const targetSlots = targets.length * 3  // 3 reps per target word
  const anchorCount = Math.max(0, TOTAL - targetSlots)
  const anchorSample = shuffle(anchors).slice(0, Math.ceil(anchorCount / 1.5))

  // Build per-target triplets (intro, mid, late)
  const introGroup = targets.map(w => makePair(w, FRAMES.slice(0, 8)))   // want/like/have frames
  const midGroup   = targets.map(w => makePair(w, FRAMES.slice(6, 14)))  // need/question frames
  const lateGroup  = targets.map(w => makePair(w, FRAMES.slice(12, 20))) // describe/think frames

  // Build anchor review pairs (mix forward + some reverse)
  const anchorPairs = anchorSample.flatMap(w => {
    const fwd = makePair(w, FRAMES)
    return Math.random() < 0.3 ? [fwd, makePair(w, REV_FRAMES)] : [fwd]
  })

  // Weave everything into a 90-pair Pimsleur sequence:
  // [some anchors] → intro group → [anchors] → mid group → [anchors] → late group → [anchors]
  const anchorChunks = chunkArray(shuffle(anchorPairs), 4)
  const ac = i => anchorChunks[i] || []

  const track = [
    ...ac(0),
    ...shuffle(introGroup),
    ...ac(1),
    ...shuffle(midGroup),
    ...ac(2),
    ...shuffle(lateGroup),
    ...ac(3),
    ...ac(4),
  ].slice(0, TOTAL)

  return track
}

function chunkArray(arr, n) {
  const chunks = []
  for (let i = 0; i < arr.length; i += n) chunks.push(arr.slice(i, i + n))
  return chunks
}

async function askKru(msgs, ctx, apiKey) {
  const system = `You are Kru (ครู), a warm and knowledgeable Thai teacher.
Respond in English. Include Thai script + tone-marked romanization for examples.
Tone marks: mid=none, low=à, falling=â, high=á, rising=ǎ. Hyphens between syllables.
Keep answers focused and practical — 2-4 short paragraphs max.
${ctx ? `\nSTUDENT'S CURRENT LESSON:\n${ctx}` : ''}`
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(apiKey ? { 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' } : {}) },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 800, system, messages: msgs })
  })
  if (!res.ok) throw new Error(`API ${res.status}`)
  const data = await res.json()
  return data.content[0].text
}

function downloadTrack(track) {
  const keywords = track.keywords || []
  const pairs = track.pairs || []
  
  // Build readable text file
  const lines = []
  lines.push('THAI TEACHER — TRACK EXPORT')
  lines.push('=' .repeat(50))
  lines.push(`Date: ${track.date}`)
  lines.push(`Mode: ${track.mode || 'daily'}`)
  lines.push(`Pairs: ${pairs.length}`)
  lines.push(`Created: ${track.createdAt || ''}`)
  lines.push('')
  
  lines.push('TARGET WORDS (' + keywords.length + ')')
  lines.push('-'.repeat(30))
  keywords.forEach((k, i) => {
    lines.push(`${String(i+1).padStart(2,'0')}. ${k.thai}  [${k.phonetic || ''}]  —  ${k.english}`)
  })
  lines.push('')
  
  lines.push('TRACK PAIRS (' + pairs.length + ')')
  lines.push('-'.repeat(30))
  pairs.forEach((p, i) => {
    lines.push(`\n[${String(i+1).padStart(3,'0')}] ${p.prompt || ''}`)
    lines.push(`  TH: ${p.thai || ''}`)
    lines.push(`  PH: ${p.phonetic || ''}`)
    lines.push(`  EN: ${p.english || ''}`)
  })

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = 'thai-track-' + track.date.replace(/ /g,'-') + '-' + (track.mode||'daily') + '.txt'
  document.body.appendChild(a)
  a.click()
  document.body.removeChild(a)
  URL.revokeObjectURL(url)
}

const BELT_RANKS = [
  { rank: 'Mukyu',   minWords: 0,    color: '#6b7280', belt: '#4b5563', label: 'No Belt' },
  { rank: '10th Kyu', minWords: 100,  color: '#f3f4f6', belt: '#e5e7eb', label: 'White' },
  { rank: '9th Kyu',  minWords: 200,  color: '#f97316', belt: '#ea580c', label: 'Orange' },
  { rank: '8th Kyu',  minWords: 350,  color: '#f97316', belt: '#ea580c', label: 'Orange' },
  { rank: '7th Kyu',  minWords: 500,  color: '#3b82f6', belt: '#2563eb', label: 'Blue' },
  { rank: '6th Kyu',  minWords: 750,  color: '#3b82f6', belt: '#2563eb', label: 'Blue' },
  { rank: '5th Kyu',  minWords: 1000, color: '#eab308', belt: '#ca8a04', label: 'Yellow' },
  { rank: '4th Kyu',  minWords: 1500, color: '#eab308', belt: '#ca8a04', label: 'Yellow' },
  { rank: '3rd Kyu',  minWords: 2000, color: '#22c55e', belt: '#16a34a', label: 'Green' },
  { rank: '2nd Kyu',  minWords: 3000, color: '#92400e', belt: '#78350f', label: 'Brown' },
  { rank: '1st Kyu',  minWords: 4000, color: '#92400e', belt: '#78350f', label: 'Brown' },
  { rank: 'Shodan',   minWords: 5000, color: '#d4a94a', belt: '#0b1120', label: 'Black' },
]

function calculateBeltRank(known) {
  let current = BELT_RANKS[0]
  let next = BELT_RANKS[1]
  for (let i = BELT_RANKS.length - 1; i >= 0; i--) {
    if (known >= BELT_RANKS[i].minWords) {
      current = BELT_RANKS[i]
      next = BELT_RANKS[i + 1] || null
      break
    }
  }
  const wordsToNext = next ? next.minWords - known : 0
  const rangeStart = current.minWords
  const rangeEnd = next ? next.minWords : current.minWords + 1000
  const progress = next ? Math.round(((known - rangeStart) / (rangeEnd - rangeStart)) * 100) : 100
  return { current, next, wordsToNext, progress, known }
}

// ── Vocab validator ───────────────────────────────────────────────────────────
function validatePairs(pairs, vocab) {
  const ALWAYS_ALLOWED = new Set([
    'ครับ','ค่ะ','คะ','นะ','เลย','มาก','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่',
    'หรือ','ว่า','ถ้า','ก่อน','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก',
    'ที่นี่','ตอนนี้','วันนี้','นี้','นั้น','เพราะ','หลัง','แล้วก็','ให้','กัน','เอง','ๆ','ไหม','ใช่','แค่',
    'ตาม','อย่าง','พอ','แบบ','ต้อง','อยาก','ทุก','บาง','เคย','เพิ่ง','กำลัง','ต่อ','เอา','ใส่','ออก',
    'เข้า','ขึ้น','ลง','ถึง','ผ่าน','แล้วก็','ก็คือ','นั่น','นี่','นั้น','ซึ่ง','เมื่อ','ตั้งแต่','จน','พร้อม',
    'แม้','ทั้ง','ทำให้','ทำให้','ต้องการ','สามารถ','เพื่อ','โดย','ระหว่าง','หลังจาก','ก่อนที่','เวลา',
    'ผม','ฉัน','คุณ','เขา','เธอ','เรา','พวกเขา','มัน','ท่าน'
  ])
  const vocabSet = new Set(vocab.map(w => w.thai))
  const allAllowed = new Set([...ALWAYS_ALLOWED, ...vocabSet])
  // Sort by length descending for greedy matching
  const allAllowedArr = [...allAllowed].sort((a, b) => b.length - a.length)

  function coverSentence(thai) {
    // Greedy: try to cover all Thai characters using known words
    let remaining = thai
    // Remove non-Thai chars (spaces, punctuation)
    remaining = remaining.replace(/[^ก-๙]/g, '')
    if (!remaining) return true
    // Try to consume from left using longest match first
    let attempts = 0
    while (remaining.length > 0 && attempts < 200) {
      attempts++
      const matched = allAllowedArr.find(w => remaining.startsWith(w))
      if (matched) {
        remaining = remaining.slice(matched.length)
      } else {
        // Can't match first char — unknown word
        // Allow up to 2 unmatched chars (tone markers, special chars)
        remaining = remaining.slice(1)
        // If we still have 3+ unmatched chars in a row, it's unknown
        const nextMatch = allAllowedArr.find(w => remaining.startsWith(w))
        if (!nextMatch && remaining.length >= 3) return false
      }
    }
    return remaining.length <= 2
  }

  return pairs.filter(p => {
    if (!p.thai) return false
    return coverSentence(p.thai)
  })
}

function parsePartialArray(str) {
  try { return JSON.parse(str) } catch {}
  const pairs = []
  let depth = 0, start = -1
  for (let i = 0; i < str.length; i++) {
    const c = str[i]
    if (c === '{') { if (depth === 0) start = i; depth++ }
    else if (c === '}') {
      depth--
      if (depth === 0 && start !== -1) {
        try {
          const obj = JSON.parse(str.slice(start, i + 1))
          if (obj.prompt && obj.thai) pairs.push(obj)
        } catch {}
        start = -1
      }
    }
  }
  return pairs
}

function checkBatchQuality(pairs, batchTargets, existingThais) {
  const issues = []
  const missing = batchTargets.filter(t => pairs.filter(p => p.thai && p.thai.includes(t.thai)).length < 3)
  if (missing.length) issues.push({ type:'missing', words: missing })
  const seen = new Set(); const dupes = []
  for (const p of pairs) { if (!p.thai) continue; if (seen.has(p.thai) || existingThais.has(p.thai)) dupes.push(p.thai); seen.add(p.thai) }
  if (dupes.length) issues.push({ type:'dupes', sentences: dupes })
  return issues
}

function buildMicroPrompt(target, anchors, vocab, promptType1, promptType2, promptType3, existingThais, pairOffset) {
  const ALWAYS_ALLOWED = ['ครับ','ค่ะ','คะ','นะ','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่',
    'หรือ','ว่า','ถ้า','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก',
    'ผม','ฉัน','คุณ','เรา','เขา','เธอ','ที่นี่','ตอนนี้','วันนี้','นี้','นั้น','เพราะ','ให้','กัน','เอง','ไหม','ก็ได้']

  // Pick anchors relevant to the target word — avoid anchors that create absurd combinations
  const anchorLines = anchors.slice(0,8).map(w => `${w.thai}=${w.english}`).join(' | ')
  const existingList = [...existingThais].slice(-4).join(' | ')

  // Generate 3 specific real-world scenarios using this word
  const scenarios = [
    `talking about ${target.english} in daily conversation`,
    `asking about ${target.english} in a practical situation`,
    `expressing something about ${target.english} naturally`
  ]

  const { goalMin: gMin, goalMax: gMax, effectiveCeil: eCeil } = getSentenceLengthForVocab(vocab)
  const lenRule = gMin === gMax
    ? `exactly ${gMin} Thai words`
    : `${gMin}–${gMax} Thai words, MAX ${eCeil}`

  return `Write 3 short Thai sentences using ★${target.thai} (${target.english}).${target.phonetic ? ' Phonetic: '+target.phonetic : ''}

KEEP IT SIMPLE. Short sentence, short prompt. Match the complexity of the answer.
Good prompt: "Say you have a nose" → ผมมีจมูกครับ
Bad prompt: "Warn a colleague that asking about lifestyle might be too personal" — TOO COMPLICATED

Pair 1: ${promptType1} something using ★${target.thai}
Pair 2: ${promptType2} something using ★${target.thai}  
Pair 3: ${promptType3} something using ★${target.thai}

RULES:
• Sentence: ${lenRule}. Count: ผม+มี+จมูก+ครับ = 4 words ✓
• Thai words allowed ONLY: ★${target.thai} + ${anchorLines} + ${ALWAYS_ALLOWED.slice(0,15).join(' ')}
• NO other Thai words. Simplify if needed.
• Pair 1 ends ครับ, Pair 2 ends ค่ะ, Pair 3 ends ครับ
• prompt = short simple English like "Say you have [word]" or "Ask if someone likes [word]"
• phonetic: space-separated tokens, NO brackets
• words array count must match phonetic token count

Do NOT repeat: ${existingList || 'none yet'}

Return ONLY JSON array of 3:
[{"prompt":"Say you have ${target.english}","thai":"ผมมี${target.thai}ครับ","english":"I have ${target.english}","phonetic":"phǒm mii ${target.phonetic||'...'} khrâp","words":[{"p":"phǒm","e":"I"},{"p":"mii","e":"have"},{"p":"${target.phonetic||'...'}","e":"${target.english}"},{"p":"khrâp","e":"[polite]"}],"target_phonetic":"${target.phonetic||''}"}]`
}

function makeFallbackPairs(target) {
  // Sensible fallback sentences that actually make sense for any word
  const ph = target.phonetic || target.thai
  const eng = target.english
  return [
    {
      prompt: `Tell someone you have ${eng}`,
      thai: `ผมมี${target.thai}ครับ`,
      english: `I have ${eng}`,
      phonetic: `phǒm mii ${ph} khrâp`,
      words: [{p:'phǒm',e:'I'},{p:'mii',e:'have'},{p:ph,e:eng},{p:'khrâp',e:'[polite]'}],
      target_phonetic: ph
    },
    {
      prompt: `Ask if someone likes ${eng}`,
      thai: `คุณชอบ${target.thai}ไหมคะ`,
      english: `Do you like ${eng}?`,
      phonetic: `khun chôop ${ph} mǎi khá`,
      words: [{p:'khun',e:'you'},{p:'chôop',e:'like'},{p:ph,e:eng},{p:'mǎi',e:'?'},{p:'khá',e:'[polite]'}],
      target_phonetic: ph
    },
    {
      prompt: `Say you want ${eng}`,
      thai: `อยาก${target.thai}ครับ`,
      english: `I want ${eng}`,
      phonetic: `yàak ${ph} khrâp`,
      words: [{p:'yàak',e:'want'},{p:ph,e:eng},{p:'khrâp',e:'[polite]'}],
      target_phonetic: ph
    }
  ]
}


function validatePair(pair, target, allAllowed, existingThais) {
  if (!pair || !pair.thai || !pair.prompt || !pair.phonetic) return false
  // Must contain target word
  if (!pair.thai.includes(target.thai)) return false
  // Must end with polite particle
  if (!/[ครับค่ะคะ]$/.test(pair.thai.trim())) return false
  // Must not be duplicate
  if (existingThais.has(pair.thai)) return false
  // Must not have OOV words (greedy cover check)
  let rem = pair.thai
  for (const w of [...allAllowed].sort((a,b) => b.length - a.length)) rem = rem.split(w).join('▓'.repeat(w.length))
  const unknown = rem.replace(/[▓\s]/g,'').replace(/[^ก-๙]/g,'')
  if (unknown.length > 3) return false  // allow up to 3 chars (tone marks etc)
  // Phonetic must be space-separated, no brackets
  if (pair.phonetic.includes('[') || pair.phonetic.includes(']')) return false
  // Words array must exist and have entries
  if (!pair.words || !pair.words.length) return false
  // Length check will be done externally with vocab context
  // Prompt must be complete (not end with ...)
  if (pair.prompt.trim().endsWith('...') || pair.prompt.trim().length < 15) return false
  return true
}

async function generateTrackWithQwen(targets, anchors, apiKey, onProgress, vocab, model) {
  const orModel = model || 'qwen/qwen3.5-flash-02-23'
  const existingThais = new Set()
  const allPairs = []

  // Build full allowed set for validation
  const ALWAYS_ALLOWED_V = ['ครับ','ค่ะ','คะ','นะ','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่',
    'หรือ','ว่า','ถ้า','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก',
    'ผม','ฉัน','คุณ','เรา','เขา','เธอ','ที่นี่','ตอนนี้','วันนี้','นี้','นั้น','เพราะ','ให้','กัน','เอง',
    'ไหม','ก็ได้','เคย','อยาก','ต้อง','อาจจะ','กำลัง','เพิ่ง','อย่า']
  const allAllowed = new Set([...ALWAYS_ALLOWED_V, ...vocab.map(w=>w.thai)])

  const PROMPT_TYPES = [
    'Say','Ask if','Tell someone','Say you want to','Ask where',
    'Ask when','Say you have','Say you like','Ask how many','Say you don\'t',
    'Ask someone to','Say you already','Ask if someone has','Say it\'s','Tell a friend'
  ]

  for (let i = 0; i < targets.length; i++) {
    const target = targets[i]
    // Spread anchors — cycle through so each word gets different supporting context
    const anchorOffset = (i * 4) % Math.max(anchors.length - 8, 1)
    const localAnchors = anchors.slice(anchorOffset, anchorOffset + 8)

    // 3 different prompt types, spread across the 20 types
    const t1 = PROMPT_TYPES[(i * 3) % PROMPT_TYPES.length]
    const t2 = PROMPT_TYPES[(i * 3 + 7) % PROMPT_TYPES.length]
    const t3 = PROMPT_TYPES[(i * 3 + 14) % PROMPT_TYPES.length]

    const prompt = buildMicroPrompt(target, localAnchors, vocab, t1, t2, t3, existingThais, allPairs.length)

    let pairs = []
    let attempts = 0
    while (attempts < 2) {
      try {
        const text = await callOpenRouterOnce(apiKey, orModel,
          [{ role:'user', content: prompt }], 2000)
        const parsed = parsePartialArray(text)
        // Hard validate each pair client-side
        const { effectiveCeil } = getSentenceLengthForVocab(vocab)
        const valid = parsed.filter(p => {
          if (!validatePair(p, target, allAllowed, existingThais)) return false
          const tokenCount = (p.phonetic||'').split(' ').filter(Boolean).length
          if (tokenCount > effectiveCeil + 1) return false  // +1 tolerance for polite particle
          return true
        })
        if (valid.length >= 2) { pairs = valid.slice(0,3); break }
      } catch(e) {}
      attempts++
    }

    // Use smart fallback for any missing pairs
    if (pairs.length < 3) {
      const fb = makeFallbackPairs(target)
      for (const f of fb) {
        if (pairs.length >= 3) break
        if (!existingThais.has(f.thai)) pairs.push(f)
      }
    }

    for (const p of pairs) existingThais.add(p.thai)
    allPairs.push(...pairs.slice(0,3))
    onProgress && onProgress(allPairs.length, targets.length * 3, null)
  }

  return allPairs
}

async function generateTrackWithClaude(targets, anchors, apiKey, onProgress, vocab, provider) {
  if (provider === 'deepseek') return generateTrackWithQwen(targets, anchors, apiKey, onProgress, vocab, 'deepseek/deepseek-chat')
  if (provider === 'qwen') return generateTrackWithQwen(targets, anchors, apiKey, onProgress, vocab, 'qwen/qwen3.5-flash-02-23')
  const targetList = targets.map(w => `★ ${w.thai} = ${w.english}`).join('\n')
  const anchorList = anchors.slice(0, 50).map(w => `${w.thai} = ${w.english}`).join('\n')

  // Full approved vocabulary — Claude may ONLY use these Thai words in sentences
  // Include particles/grammar words by default since they're universal
  const ALWAYS_ALLOWED = ['ครับ','ค่ะ','คะ','นะ','เลย','มาก','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ที่นี่','ตอนนี้','วันนี้','นี้','นั้น','ไม่','ได้','จะ','และ','แต่','หรือ','เพราะ','ว่า','ถ้า','ก่อน','หลัง','แล้วก็','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก']
  const allThai = new Set([
    ...ALWAYS_ALLOWED,
    ...(vocab || []).map(w => w.thai)
  ])
  const approvedList = [...allThai].join('  ')


  // Build per-word usage schedule — 3 appearances each, spread across 90 pairs
  const schedule = []
  targets.forEach((t, ti) => {
    [ti * 3, ti * 3 + 1, ti * 3 + 2].forEach(s => schedule.push({ slot: s % 90, word: t.thai, eng: t.english }))
  })
  schedule.sort((a, b) => a.slot - b.slot)
  const scheduleStr = schedule.map(s => `Pair ${s.slot + 1}: ★${s.word} (${s.eng})`).join('\n')

  const system = `You are a strict Thai language teaching assistant creating Pimsleur-style audio lessons.

Generate EXACTLY 90 challenge-response pairs as a JSON array.

PAIR STRUCTURE — every pair must have ALL these fields:
- "prompt": creative English instruction using varied types
- "thai": natural Thai sentence, TARGET ${goalMin}–${goalMax} words, MAX ${effectiveCeil} words, MUST end with ครับ or ค่ะ
- "english": natural English translation
- "phonetic": tone-marked romanization, one space-separated token per Thai word
- "words": array of {"p": phonetic_token, "e": English_gloss} — EXACTLY one per Thai word
- "target_phonetic": romanization of the ★ target word in this pair

RULE 1 — STRICT WORD SCHEDULE (HIGHEST PRIORITY):
Follow this assignment exactly — each pair number has one assigned target word:
${scheduleStr}
Do not use a target word in any pair except its assigned slots.

RULE 2 — VOCABULARY: Use ONLY Thai words from the APPROVED VOCABULARY LIST. Zero exceptions.

RULE 3 — PROMPT VARIETY:
Use these types creatively in rotation — no type more than 3 times in a row:
Tell someone | Ask if | Say that | Ask someone to | Respond to | How would you say |
Explain that | Ask where | Ask when | Ask why | Suggest that | Invite someone to |
Warn someone | Refuse politely | Agree by saying | Express surprise | Complain that |
Confirm that | Deny that | Ask how many | Admit that | Promise that | Describe
"Ask" "Say" "Tell" must each appear fewer than 12 times total across 90 pairs.

RULE 4 — TONE MARKS (MANDATORY ON EVERY WORD):
mid=no mark | low=grave(à) | falling=circumflex(â) | high=acute(á) | rising=caron(ǎ)

RULE 5 — SENTENCE CREATIVITY:
Every sentence must be a different situation. Mix questions, statements, invitations,
refusals, suggestions, complaints. Never repeat the same sentence structure twice in a row.

RULE 6 — WORDS ARRAY: Must have EXACTLY the same token count as "phonetic" space-separated.

Respond ONLY with valid JSON array of 90 objects. No markdown, no explanation, no preamble.`
  const user = `APPROVED VOCABULARY (use ONLY these Thai words):\n${approvedList}\n\nANCHOR WORDS (for supporting sentences, 1-2x each):\n${anchorList}\n\nRemember: follow the pair schedule in the system prompt exactly. Every pair number has an assigned target word.`

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 16000, stream: true, system, messages: [{ role: 'user', content: user }] })
  })
  if (!res.ok) {
    const err = await res.json().catch(() => ({}))
    throw new Error(err?.error?.message || `API error ${res.status}`)
  }

  // Stream the response and count pairs as they arrive
  const reader = res.body.getReader()
  const decoder = new TextDecoder()
  let accumulated = ''
  let pairsFound = 0

  while (true) {
    const { done, value } = await reader.read()
    if (done) break
    const chunk = decoder.decode(value, { stream: true })
    for (const line of chunk.split('\n')) {
      if (!line.startsWith('data: ')) continue
      const data = line.slice(6).trim()
      if (data === '[DONE]') break
      try {
        const evt = JSON.parse(data)
        if (evt.type === 'content_block_delta' && evt.delta?.text) {
          accumulated += evt.delta.text
          // Count completed pairs by counting "phonetic" keys (last key in each pair)
          const found = (accumulated.match(/"phonetic"\s*:/g) || []).length
          if (found !== pairsFound) {
            pairsFound = found
            // Try to extract the most recently completed pair
            let latestPair = null
            try {
              const lastBrace = accumulated.lastIndexOf('"}')
              if (lastBrace > 0) {
                const objStart = accumulated.lastIndexOf('{', lastBrace)
                if (objStart >= 0) {
                  const obj = JSON.parse(accumulated.slice(objStart, lastBrace + 2))
                  if (obj.thai && obj.phonetic) latestPair = obj
                }
              }
            } catch {}
            onProgress && onProgress(pairsFound, 90, latestPair)
          }
        }
      } catch {}
    }
  }

  let text = accumulated.trim().replace(/^```json\n?|\n?```$/g, '').trim()

  // Robust parse — extract all complete objects even if array is truncated

  let pairs = parsePartialArray(text)
  if (!pairs.length) throw new Error('No pairs could be parsed from response')
  onProgress && onProgress(pairs.length, 90)
  return pairs
}


async function fetchTargetPhonetics(targets, apiKey) {
  const wordList = targets.map(w => w.thai).join(', ')
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1000,
      messages: [{ role: 'user', content: `Give me the tone-marked romanization for each Thai word. Tone marks: mid=none, low=à, falling=â, high=á, rising=ǎ. Use hyphens between syllables.
Words: ${wordList}
Respond ONLY with valid JSON, no markdown: {"results":[{"thai":"word","phonetic":"romanization"},...]}` }]
    })
  })
  if (!res.ok) return {}
  const data = await res.json()
  const text = data.content[0].text.trim().replace(/^```json\n?|\n?```$/g, '').trim()
  const parsed = JSON.parse(text)
  const map = {}
  for (const r of (parsed.results || [])) {
    const match = targets.find(t => t.thai === r.thai)
    if (match) map[match.id] = r.phonetic
  }
  return map
}

function buildConvoPrompt(targets, vocab) {
  const ALWAYS_ALLOWED = ['ครับ','ค่ะ','คะ','นะ','เลย','มาก','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่','หรือ','ว่า','ถ้า','ก่อน','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก','ผม','ฉัน','คุณ','เขา','เธอ','เรา','พวกเขา']
  const allThai = new Set([...ALWAYS_ALLOWED, ...(vocab||[]).map(w=>w.thai)])
  const vocabPhonMap = Object.fromEntries((vocab||[]).map(w=>[w.thai,w.phonetic]).filter(([,p])=>p))
  const targetList = targets.map(w=>`${w.thai}${w.phonetic?` [${w.phonetic}]`:''} = ${w.english}`).join(', ')
  const approvedList = [...allThai].map(t=>vocabPhonMap[t]?`${t}[${vocabPhonMap[t]}]`:t).join('  ')

  const system = `You are creating a short natural Thai conversation for a language learner.
The conversation must use ALL of these target words at least once: ${targetList}
Use ONLY Thai words from this approved list: ${approvedList}
Rules:
- Write a realistic conversation between a Thai man (speaker "M") and Thai woman (speaker "W")
- The man uses male polite particles: ครับ, ผม
- The woman uses female polite particles: ค่ะ, คะ, ฉัน, หนู
- Use every target word naturally at least once
- Keep sentences short and natural (3-7 words each)
- Include phonetics for every Thai word using the [brackets] shown, or standard romanization
- Respond ONLY with valid JSON, no markdown:
{"lines":[{"speaker":"M","thai":"...","phonetic":"...","english":"..."},{"speaker":"W","thai":"...","phonetic":"...","english":"..."},...]}
- Aim for 12-18 lines total covering all target words
- Make the conversation feel natural — a real situation like meeting, planning a trip, shopping, eating out, etc.`

  return { system, user: 'Generate the conversation now.' }
}

async function generateConvoWithOpenRouter(targets, vocab, apiKey, model) {

  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}`, 'HTTP-Referer': 'https://magical-druid-656889.netlify.app', 'X-Title': 'Thai Teacher' },
    body: JSON.stringify({ model: model || 'qwen/qwen3.5-flash-02-23', max_tokens: 4000, temperature: 0.4, stream: false,
      messages: [{ role: 'system', content: system }, { role: 'user', content: user }] })
  })
  if (!res.ok) throw new Error(`Convo error ${res.status}`)
  const data = await res.json()
  let text = (data.choices?.[0]?.message?.content || '').replace(/<think>[\s\S]*?<\/think>/g,'').trim().replace(/^```[\w]*[\r\n]?|[\r\n]?```$/g,'').trim()
  // Extract JSON even if model added preamble text
  const jsonStart = text.indexOf('{')
  const jsonEnd = text.lastIndexOf('}')
  if (jsonStart >= 0 && jsonEnd > jsonStart) text = text.slice(jsonStart, jsonEnd + 1)
  const parsed = JSON.parse(text)
  return parsed.lines || []
}

async function generateConvoWithClaude(targets, vocab, apiKey) {
  const { system, user } = buildConvoPrompt(targets, vocab)

      system, messages: [{ role: 'user', content: user }] })

  const data = await res.json()

  const jsonStart = text.indexOf('{')
  const jsonEnd = text.lastIndexOf('}')

function ConvoPlayer({ lines, onSkip, onDone, speed, onSpeedChange }) {
  const [lineIdx, setLineIdx] = useState(0)
  const [playing, setPlaying] = useState(false)
  const [voices, setVoices] = useState([])
  const cancelRef = useRef(false)
  const speedRef = useRef(speed)  // ref so speed changes take effect immediately
  const HAS_SPEECH = typeof window !== 'undefined' && 'speechSynthesis' in window

  // Keep speedRef in sync
  useEffect(() => { speedRef.current = speed }, [speed])

  useEffect(() => {
    if (!HAS_SPEECH) return
    const load = () => { const v = window.speechSynthesis.getVoices(); if (v.length) setVoices(v) }
    load(); window.speechSynthesis.onvoiceschanged = load
    return () => { try { window.speechSynthesis.onvoiceschanged = null } catch(e) {} }
  }, [])

  useEffect(() => {
    if (!playing || lineIdx >= lines.length) { if (lineIdx >= lines.length) onDone(); return }
    cancelRef.current = false
    const line = lines[lineIdx]
    const speakLine = () => {
      if (!HAS_SPEECH || cancelRef.current) { setTimeout(() => { if (!cancelRef.current) setLineIdx(i => i + 1) }, 1200); return }
      try { window.speechSynthesis.cancel() } catch(e) {}
      const u = new SpeechSynthesisUtterance(line.thai)
      const isMale = line.speaker === 'M'
      u.lang = 'th-TH'
      u.rate = speedRef.current || 0.8  // use ref for real-time speed
      u.pitch = 1  // no pitch manipulation — let voices be natural
      // Google TTS Thai voices: female = th-TH-Standard-A, male = th-TH-Standard-B
      // Also handles: Google ภาษาไทย (female/male), Nexus voices
      const googleFemale = voices.find(v => v.lang.startsWith('th') && /Standard-A|หญิง|female/i.test(v.name))
      const googleMale = voices.find(v => v.lang.startsWith('th') && /Standard-B|Standard-C|ชาย|male/i.test(v.name))
      const anyThai = voices.filter(v => v.lang.startsWith('th'))
      // If 2+ voices, pick by index: first=female, second=male
      const byIndex = isMale ? (anyThai[1] || anyThai[0]) : (anyThai[0])
      const chosen = isMale ? (googleMale || byIndex) : (googleFemale || anyThai[0])
      if (chosen) u.voice = chosen
      u.onend = () => { if (!cancelRef.current) setTimeout(() => setLineIdx(i => i + 1), 700) }
      u.onerror = () => { if (!cancelRef.current) setTimeout(() => setLineIdx(i => i + 1), 900) }
      window.speechSynthesis.speak(u)
    }
    speakLine()
    return () => { cancelRef.current = true; try { window.speechSynthesis.cancel() } catch(e) {} }
  }, [playing, lineIdx, lines, voices])  // removed speed from deps — speedRef handles it

  const line = lines[lineIdx] || lines[lines.length - 1] || {}
  const pct = Math.round((lineIdx / Math.max(lines.length, 1)) * 100)

  return (
    <div className="fade-in" style={{ padding:16, maxWidth:500, margin:'0 auto', display:'flex', flexDirection:'column', minHeight:'100vh' }}>

      {/* Header */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
        <div>
          <div className="display" style={{ fontSize:17, color:'var(--gold)' }}>Thai Conversation</div>
          <div style={{ fontSize:11, color:'var(--muted)' }}>{lines.length} lines · all track words covered</div>
        </div>
        <button onClick={() => { cancelRef.current = true; try { window.speechSynthesis.cancel() } catch(e) {} onSkip() }}
          style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:20, padding:'7px 14px', cursor:'pointer', color:'var(--muted)', fontSize:12, fontWeight:600, fontFamily:'Sarabun,sans-serif' }}>
          Skip →
        </button>
      </div>

      {/* Play button — at top */}
      <button onClick={() => setPlaying(p => !p)}
        style={{ width:'100%', padding:'13px', borderRadius:12, border:'none', background: playing ? '#1a2a00' : 'linear-gradient(135deg,#d4a94a,#b88a35)', color: playing ? '#86c900' : '#0b1120', fontSize:15, fontWeight:700, cursor:'pointer', fontFamily:'Sarabun,sans-serif', marginBottom:10 }}>
        {playing ? '⏸ Pause' : lineIdx === 0 ? '▶ Play Conversation' : '▶ Resume'}
      </button>

      {/* Speed + progress row */}
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10, background:'var(--surface)', borderRadius:10, padding:'7px 12px' }}>
        <span style={{ fontSize:11 }}>🐢</span>
        <input type="range" min="0.4" max="1.2" step="0.05" value={speed}
          onChange={e => onSpeedChange(parseFloat(e.target.value))}
          style={{ flex:1, accentColor:'var(--gold)', height:4, cursor:'pointer' }} />
        <span style={{ fontSize:11 }}>🐇</span>
        <span className="phon" style={{ fontSize:11, color:'var(--gold)', minWidth:32 }}>{speed.toFixed(2)}x</span>
        <span style={{ fontSize:11, color:'var(--muted)', marginLeft:4 }}>{pct}%</span>
      </div>

      {/* Progress bar */}
      <div style={{ height:3, background:'var(--surface2)', borderRadius:2, marginBottom:14 }}>
        <div style={{ height:'100%', width:`${pct}%`, background:'var(--gold)', borderRadius:2, transition:'width 0.4s' }} />
      </div>

      {/* Conversation lines */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', gap:8, overflowY:'auto' }}>
        {lines.map((l, i) => {
          const isA = l.speaker === 'M'
          const isCurrent = i === lineIdx && playing
          const isPast = i < lineIdx
          return (
            <div key={i} style={{ display:'flex', flexDirection: isA ? 'row' : 'row-reverse', gap:8, opacity: isPast ? 0.45 : isCurrent ? 1 : 0.75 }}>
              <div style={{ width:30, height:30, borderRadius:'50%', background: isA ? '#1e3a5f' : '#2a1e3a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:15, flexShrink:0, marginTop:4, border: isCurrent ? `2px solid ${isA ? '#4a90e2' : '#c084fc'}` : '2px solid transparent', transition:'border 0.2s' }}>
                {isA ? '👨' : '👩'}
              </div>
              <div style={{ maxWidth:'78%', background: isCurrent ? (isA ? '#0a1a2e' : '#1a0a2e') : 'var(--surface)', border:`1px solid ${isCurrent ? (isA ? '#4a90e2' : '#c084fc') : 'var(--border)'}`, borderRadius:12, padding:'10px 12px', transition:'all 0.2s' }}>
                <p className="thai" style={{ fontSize:20, color: isCurrent ? 'var(--text)' : '#8899aa', marginBottom:3 }}>{l.thai}</p>
                <p className="phon" style={{ fontSize:13, color:'var(--gold)', marginBottom:2 }}>{l.phonetic}</p>
                <p style={{ fontSize:12, color:'#c8d8f0', fontStyle:'italic' }}>{l.english}</p>
              </div>
            </div>
          )
        })}
      </div>
    </div>
  )
}

  const [error, setError] = useState('')
  const [pairsDone, setPairsDone] = useState(0)
  const [pairsTotal, setPairsTotal] = useState(90)
  const [targetPhonetics, setTargetPhonetics] = useState({})
  const [phase, setPhase] = useState('starting') // starting | streaming | done | error
  const [convoLines, setConvoLines] = useState(null)
  const [showConvo, setShowConvo] = useState(false)
  const [convoLoading, setConvoLoading] = useState(false)
  const [convoPct, setConvoPct] = useState(0)
  const [convoSpeed, setConvoSpeed] = useState(() => { try { return parseFloat(localStorage.getItem('tt-speed') || '0.8') } catch { return 0.8 } })
  const [generatedTrack, setGeneratedTrack] = useState(null)
  const phoneticsRef = useRef({})
  const { targets, anchors } = useMemo(() => {
    if (customTargets && customTargets.length) {
      const targetIds = new Set(customTargets.map(w => w.id))
      const anch = vocab.filter(w => (w.status === 'known' || w.status === 'learning') && !targetIds.has(w.id))
        .sort((a, b) => (!a.lastSeen ? -1 : !b.lastSeen ? 1 : a.lastSeen.localeCompare(b.lastSeen)))
        .slice(0, 25)
      return { targets: customTargets, anchors: anch }
    }
    return pickWords(vocab, mode)
  }, [vocab, mode, customTargets])

  const isWeak = mode === 'weak'
  const color = isWeak ? '#ef4444' : '#10b981'
  const pct = Math.min(100, Math.round((pairsDone / 90) * 100))

  // Latest pair preview from stream
  const [latestPair, setLatestPair] = useState(null)

  useEffect(() => {
    async function build() {
      try {
        let pairs
        if (apiKey) {
          setPhase('streaming')
          // Seed phoneticsRef from vocab words that already have phonetics stored
          const vocabPhonetics = {}
          for (const t of targets) { if (t.phonetic) { vocabPhonetics[t.id] = t.phonetic; vocabPhonetics[t.thai] = t.phonetic } }
          phoneticsRef.current = vocabPhonetics
          if (Object.keys(vocabPhonetics).length) setTargetPhonetics({ ...vocabPhonetics })
          // Only fetch phonetics for words still missing them
          const needsPhonetics = targets.filter(t => !t.phonetic)
          if (needsPhonetics.length > 0) {
            const doPhonetics = async () => {
              let map = {}
              // Use selected provider's key for phonetics
              if (provider === 'qwen' || (orKey && provider !== 'claude' && provider !== 'deepseek')) map = await fetchTargetPhoneticsQwen(needsPhonetics, orKey || apiKey)
              else if (provider === 'deepseek') map = await fetchTargetPhoneticsDeepSeek(needsPhonetics, apiKey)
              else map = await fetchTargetPhonetics(needsPhonetics, apiKey)
              if (Object.keys(map).length) {
                phoneticsRef.current = { ...phoneticsRef.current, ...map }
                setTargetPhonetics({ ...phoneticsRef.current })
                onPhonetics && onPhonetics(map) // save new ones back to vocab
              }
            }
            doPhonetics().catch(() => {})
          }

          pairs = await generateTrackWithClaude(targets, anchors, apiKey, (done, total, latestPair) => {
            setPairsDone(done)
            setPairsTotal(targets.length * 3)
            // Update chip phonetics from streaming target_word field (reliable)
            if (latestPair && latestPair.target_word && latestPair.target_phonetic) {
              const t = targets.find(t => t.thai === latestPair.target_word)
              if (t && !phoneticsRef.current[t.id]) {

                setTargetPhonetics({ ...phoneticsRef.current })
              }
            }
          }, vocab, provider)
        } else if (provider === 'deepseek') {
          // DeepSeek selected but no key
          throw new Error('No DeepSeek API key saved. Go to ⚙️ Settings and enter your DeepSeek key from platform.deepseek.com')
        } else {
          // No key at all — use local templates
          setPhase('streaming')
          pairs = generatePairsLocal(targets, anchors)
          setPairsDone(pairs.length)
          setPairsTotal(90)
        }
        // Use pre-call phonetics (phoneticsRef) — reliable, per-word accurate
        // Previous regex pair-matching was buggy and overwrote correct data
        if (onPhonetics && Object.keys(phoneticsRef.current).length) {
          onPhonetics(phoneticsRef.current)
        }
        const keywords = targets.map(w => ({ thai: w.thai, english: w.english, wordId: w.id, rating: null, phonetic: phoneticsRef.current[w.id] || phoneticsRef.current[w.thai] || '' }))
        const track = {
          date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
          mode, pairs, keywords, rated: false, createdAt: new Date().toISOString(),
        }
        setGeneratedTrack(track)
        // Track ready — user taps button to start
        setPhase('done')
      } catch(e) {
        setPhase('error')
        const msg = e.message || 'Unknown error'
        console.error('Generation error:', msg)
          const isDeepSeekCors = (provider === 'deepseek') && (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('CORS') || msg.includes('fetch'))
          const hint = isDeepSeekCors
          ? '🐋 DeepSeek cannot be called directly from a browser due to CORS restrictions.\n\nA free Cloudflare Worker proxy is needed (5 min setup). Ask Claude to help set it up, or switch to ⚡ Claude in the meantime.'
          : msg.includes('Failed to fetch') || msg.includes('NetworkError')
          ? msg + '\n\n⚠️ Check your internet connection and API key.'
          : msg
        setError(hint)
      }
    }
    build()
  }, [])

  if (phase === 'error') return (
