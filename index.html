function validatePairs(pairs, vocab) {
  const ALWAYS_ALLOWED = new Set([
    'ครับ','ค่ะ','คะ','นะ','เลย','มาก','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่',
    'หรือ','ว่า','ถ้า','ก่อน','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก',
    'ที่นี่','ตอนนี้','วันนี้','นี้','นั้น','เพราะ','หลัง','แล้วก็','ให้','กัน','เอง','ๆ','ไหม','ใช่','แค่',
    'ตาม','อย่าง','พอ','แบบ','ต้อง','อยาก','ทุก','บาง','เคย','เพิ่ง','กำลัง','ต่อ','เอา','ใส่','ออก',
    'เข้า','ขึ้น','ลง','ถึง','ผ่าน','แล้วก็','ก็คือ','นั่น','นี่','นั้น','ซึ่ง','เมื่อ','ตั้งแต่','จน','พร้อม',
    'แม้','ทั้ง','ทำให้','ทำให้','ต้องการ','สามารถ','เพื่อ','โดย','ระหว่าง','หลังจาก','ก่อนที่','เวลา',
    'ผม','ฉัน','คุณ','เขา','เธอ','เรา','พวกเขา','มัน','ท่าน'
  ])
  const vocabSet = new Set(vocab.map(w => w.thai))
  const allAllowed = new Set([...ALWAYS_ALLOWED, ...vocabSet])
  // Sort by length descending for greedy matching
  const allAllowedArr = [...allAllowed].sort((a, b) => b.length - a.length)

  function coverSentence(thai) {
    // Greedy: try to cover all Thai characters using known words
    let remaining = thai
    // Remove non-Thai chars (spaces, punctuation)
    remaining = remaining.replace(/[^ก-๙]/g, '')
    if (!remaining) return true
    // Try to consume from left using longest match first
    let attempts = 0
    while (remaining.length > 0 && attempts < 200) {
      attempts++
      const matched = allAllowedArr.find(w => remaining.startsWith(w))
      if (matched) {
        remaining = remaining.slice(matched.length)
      } else {
        // Can't match first char — unknown word
        // Allow up to 2 unmatched chars (tone markers, special chars)
        remaining = remaining.slice(1)
        // If we still have 3+ unmatched chars in a row, it's unknown
        const nextMatch = allAllowedArr.find(w => remaining.startsWith(w))
        if (!nextMatch && remaining.length >= 3) return false
      }
    }
    return remaining.length <= 2
  }

  return pairs.filter(p => {
    if (!p.thai) return false
    return coverSentence(p.thai)
  })
}

function parsePartialArray(str) {
  try { return JSON.parse(str) } catch {}
  const pairs = []
  let depth = 0, start = -1
  for (let i = 0; i < str.length; i++) {
    const c = str[i]
    if (c === '{') { if (depth === 0) start = i; depth++ }
    else if (c === '}') {
      depth--
      if (depth === 0 && start !== -1) {
        try {
          const obj = JSON.parse(str.slice(start, i + 1))
          if (obj.prompt && obj.thai) pairs.push(obj)
        } catch {}
        start = -1
      }
    }
  }
  return pairs
}

  const reader = res.body.getReader(); const decoder = new TextDecoder()
  let accumulated = '', fullText = ''
  while (true) {
    const { done, value } = await reader.read(); if (done) break
    accumulated += decoder.decode(value, { stream: true })
    for (const line of accumulated.split('\n')) {
      if (line.startsWith('data: ') && line !== 'data: [DONE]') {
        try { const delta = JSON.parse(line.slice(6)).choices?.[0]?.delta?.content; if (delta) fullText += delta } catch {}

  const j1 = text.indexOf('['), j2 = text.lastIndexOf(']')
  if (j1 >= 0 && j2 > j1) text = text.slice(j1, j2+1)
  return text
}

function checkBatchQuality(pairs, batchTargets, existingThais) {
  const issues = []
  const missing = batchTargets.filter(t => pairs.filter(p => p.thai && p.thai.includes(t.thai)).length < 3)
  if (missing.length) issues.push({ type:'missing', words: missing })
  const seen = new Set(); const dupes = []
  for (const p of pairs) { if (!p.thai) continue; if (seen.has(p.thai) || existingThais.has(p.thai)) dupes.push(p.thai); seen.add(p.thai) }
  if (dupes.length) issues.push({ type:'dupes', sentences: dupes })
  return issues
}

function buildBatchSystem(batchTargets, anchors, vocab, batchNum) {
  const ALWAYS_ALLOWED = ['ครับ','ค่ะ','คะ','นะ','เลย','มาก','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่',
    'หรือ','ว่า','ถ้า','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก',
    'ผม','ฉัน','คุณ','เรา','เขา','เธอ','ที่นี่','ตอนนี้','วันนี้','นี้','นั้น','เพราะ','ให้','กัน','เอง',
    'ไหม','ก็ได้']
  const vocabPhonMap = Object.fromEntries((vocab||[]).map(w=>[w.thai,w.phonetic]).filter(([,p])=>p))
  const targetLines = batchTargets.map((w,i) =>
    `${i+1}. ★ ${w.thai} (${w.english})${w.phonetic ? ' phonetic: '+w.phonetic : ''}`).join('\n')
  const anchorLines = anchors.slice(0,15).map(w =>
    `${w.thai} = ${w.english}${w.phonetic ? ' ['+w.phonetic+']' : ''}`).join('\n')
  const allowedParticles = ALWAYS_ALLOWED.join(' ')
  const slotMap = batchTargets.map((t,wi) => `Pairs ${wi*3+1},${wi*3+2},${wi*3+3} → must use ★${t.thai} (${t.english})`).join('\n')
  const TYPES = ['Tell someone that [concrete situation]','Ask if [yes/no question]','Say that you [action]',
    'Ask someone where [location question]','Ask someone when [time question]','Suggest that [recommendation]',
    'Invite someone to [activity]','Warn someone that [caution]','Confirm that [affirmation]','Deny that [negation]',
    'Express surprise that [reaction]','Complain that [complaint]','Admit that [confession]','Ask how many [quantity]',
    'Respond to a friend who mentioned','Ask someone to [request]','Say you want to [desire]',
    'Explain that [explanation]','Promise that [commitment]','Describe [a scene]']
  const typeRotation = Array.from({length:30}, (_,i) => `Pair ${i+1}: ${TYPES[i%TYPES.length]}`).join('\n')
  return `You are a Thai language teacher writing Pimsleur-style audio lesson pairs. Generate EXACTLY 30 pairs for BATCH ${batchNum}/3.
USER IS 9TH KYU: sentences must be 3–5 Thai words ideally, MAXIMUM 6 words.
SLOT ASSIGNMENTS: ${slotMap}
PROMPT TYPES: ${typeRotation}
VOCABULARY — USE ONLY THESE WORDS:
TARGET: ${targetLines}
ANCHORS: ${anchorLines}
PARTICLES: ${allowedParticles}
⛔ No other Thai words. If stuck, use simpler sentence.
CHECKLIST before each pair:
[1] prompt is a complete concrete English instruction (NOT "Tell someone that...")
[2] thai contains the ★ target word for this pair number
[3] every Thai word is in the vocabulary lists
[4] thai ends with ครับ (odd) or ค่ะ (even)
[5] thai is 3–6 words
[6] thai starts differently from previous 2 sentences
[7] phonetic is space-separated tokens (not brackets)
[8] words array count matches phonetic token count
OUTPUT: JSON array of 30 objects only. Example:
[{"prompt":"Tell someone you want to visit the hill tribe","thai":"คุณอยากไปหมู่บ้านชาวเขาครับ","english":"I want to visit the hill tribe village","phonetic":"khun yàak pai mûu-bâan chaao-khǎo khrâp","words":[{"p":"khun","e":"you"},{"p":"yàak","e":"want"},{"p":"pai","e":"go"},{"p":"mûu-bâan","e":"village"},{"p":"chaao-khǎo","e":"hill tribe"},{"p":"khrâp","e":"[polite]"}],"target_phonetic":"chaao-khǎo"}]`
}

function classifyWord(target) {
  const eng = (target.english || '').toLowerCase().trim()
  const thai = target.thai || ''

  // Corrupted entries
  if (thai.includes('...') || thai.includes('…') || eng.includes('...'))
    return 'corrupted'

  // Grammar/connector words
  if (thai === 'ซึ่ง' || eng === 'which' || eng === 'that (rel)') return 'connector_rel'
  if (thai === 'เกี่ยวกับ' || eng === 'about' || eng === 'regarding') return 'connector_about'
  if (['because','so','therefore'].includes(eng)) return 'connector_because'
  if (['but','however'].includes(eng)) return 'connector_but'
  if (['if','when','although'].includes(eng)) return 'connector_if'
  if (thai === 'เหมือน' || ['similar to','like','same as'].some(w => eng.includes(w))) return 'connector_like'

  // Degree/extent words
  if (['the most','most','best','worst'].some(w => eng.includes(w)) || thai === 'ที่สุด') return 'degree_super'
  if (['very','a lot','too much','too','too many'].some(w => eng === w || eng.startsWith(w + ' '))) return 'degree_modifier'
  if (thai === 'ขนาดนั้น' || thai === 'ขนาดนี้' || ['that much','this much','to that extent'].some(w => eng.includes(w))) return 'degree_extent'
  if (['more than','less than','fewer'].some(w => eng.includes(w))) return 'degree_compare'

  // Question words — must never be used as objects
  if (thai === 'เมื่อไหร่' || eng === 'when') return 'question_when'
  if (['who','whom'].includes(eng)) return 'question_who'
  if (['where','which place'].includes(eng)) return 'question_where'
  if (['what','which thing'].includes(eng)) return 'question_what'
  if (eng === 'why') return 'question_why'
  if (eng === 'how') return 'question_how'
  if (['how many','how much'].some(w => eng.startsWith(w))) return 'question_howmany'

  // Full sentence phrase targets
  if (target._phraseType === 'full_sentence') return 'full_sentence'

  // Quantifiers — must attach to noun, never standalone
  if (['every','all of','each','any','some','both','several','whole'].some(w => eng === w || eng.startsWith(w+' ')) ||
      ['ทุก','บาง','แต่ละ','ทั้งหมด','ทั้ง'].includes(thai)) return 'quantifier'
  if (thai === 'หลาย' || eng === 'many' || eng === 'several') return 'adjective'

  // Quantity phrases — classifier expressions
  if (/^(one|two|three|four|five|\d+) (plate|cup|glass|piece|item|portion|bottle|bowl|bag)/.test(eng) ||
      /^[หนึ่งสองสามสี่ห้า]+(จาน|แก้ว|ชิ้น|ที่|ขวด|ถ้วย|กล่อง)/.test(thai)) return 'quantity_phrase'

  // Verb phrases — cannot be used as nouns
  if (['come from','go out','go eat','pick up','arrive','work out','exercise'].some(w => eng === w) ||
      ['มาจาก','ไปเที่ยว','แวะรับ','มาถึง','ออกกำลังกาย','ไปกิน','ไปซื้อ'].includes(thai)) return 'verb_phrase'

  // Action verbs that need objects — high risk, route to hardcoded banks
  if (['stop by','drop by','cruise','float','drift','offer (religious)','worship'].some(w => eng === w) ||
      ['แวะ','ล่อง','ถวาย','บูชา'].includes(thai)) return 'verb_phrase'

  // Specific verbs with hardcoded banks
  if (['hang up','hang up the phone'].some(w => eng.includes(w)) || thai === 'วางหู') return 'verb_phrase'
  if (['crash into','bump into','collide','hit'].some(w => eng === w) || thai === 'ชน') return 'verb_phrase'
  if (['keep aside','put aside','save for later','set aside','keep it'].some(w => eng.includes(w)) || thai === 'เอาไว้') return 'verb_phrase'
  if (eng === 'run' || thai === 'วิ่ง') return 'verb_intrans'

  // Sports/activity venues — place, never body_part
  if (['football field','soccer field','stadium','sports ground'].some(w => eng.includes(w)) ||
      ['สนามฟุตบอล','สนามกีฬา'].includes(thai)) return 'place'

  // Mythological beings — person class
  if (['naga','nāga','sacred serpent','dragon'].some(w => eng.includes(w)) || thai === 'พญานาค') return 'person'

  // Winding/curved — adjective
  if (['winding','curved','meandering','twisting'].some(w => eng.includes(w)) || thai === 'คดเคี้ยว') return 'adjective'

  // Fit/just right — adjective
  if (['just right','fit','fitting','exact fit','perfect fit'].some(w => eng.includes(w)) || thai === 'พอดี') return 'adjective'

  // All of/everything — quantifier
  if (['all of it','everything','all of that','that is all'].some(w => eng.includes(w)) || thai === 'ทั้งนั้น') return 'quantifier'

  // Abstract concepts AI consistently mishandles
  if (['aviation','feng shui','nature','culture','lifestyle','tradition','freedom','justice'].some(w => eng === w) ||
      ['การบิน','ฮวงจุ้ย','ธรรมชาติ','วัฒนธรรม','วิถีชีวิต','ประเพณี','อิสรภาพ'].includes(thai)) return 'abstract'

  // Downtown/city locations
  if (['downtown','city center','city centre'].some(w => eng.includes(w)) || thai === 'ตัวเมือง') return 'location'

  // Family — person class
  if (thai === 'ครอบครัว' || eng === 'family') return 'person'

  // Emotion words
  if (['excited','happy','sad','afraid','bored','fun','nervous','proud','surprised','worried','angry','lonely'].some(w => eng.includes(w)) ||
      ['ตื่นเต้น','ดีใจ','เสียใจ','กลัว','เบื่อ','สนุก','ภูมิใจ','ตกใจ','กังวล','โกรธ'].includes(thai)) return 'emotion'

  // Polite command / invitation words
  if (thai === 'เชิญ' || eng === 'please (invite)' || eng === 'please come in') return 'polite_command'

  // Condition/event/situation phrases
  if (thai === 'รถติด' || eng.includes('traffic')) return 'condition_traffic'
  if (eng.includes('raining') || eng.includes('rain') || thai === 'ฝนตก') return 'condition_rain'
  if (eng.includes('power out') || thai === 'ไฟดับ') return 'condition_event'
  if (eng.includes('crowded') || thai === 'คนเยอะ') return 'condition_event'
  if (eng.includes('sold out') || thai === 'ของหมด') return 'condition_event'
  if (eng.includes('closed') || thai === 'ร้านปิด') return 'condition_event'
  if (eng.includes('flooded') || thai.includes('น้ำท่วม')) return 'condition_event'

  // Rank/achievement
  if (['first place','second place','third place','first','champion'].some(w => eng.includes(w)) || thai.startsWith('ที่หนึ่ง') || thai.startsWith('ที่สอง')) return 'rank'

  // Time/day expressions
  const TIME_ENG = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday',
    'today','tomorrow','yesterday','morning','afternoon','evening','tonight','night',
    '.m.','oclock','noon','midnight','this week','next week','last week','this month']
  if (TIME_ENG.some(w => eng.includes(w))) return 'time'

  // Location/position
  const LOC = ['upstairs','downstairs','above','below','inside','outside','in front','behind',
    'nearby','alley','soi','corner','middle','here','there','left side','right side']
  if (LOC.some(w => eng.includes(w))) return 'location'

  // Abstract nouns
  const ABSTRACT = ['income','earnings','revenue','travel','journey','homework','education',
    'studying','health','happiness','problem','opportunity','experience','knowledge',
    'culture','lifestyle','tradition','freedom','success','time (concept)','information']
  if (ABSTRACT.some(w => eng.includes(w))) return 'abstract'

  // Personality/tendency
  if (['homebody','shy','lazy','hardworking','kind','addicted'].some(w => eng.includes(w))
    || thai.startsWith('ขี้') || thai.startsWith('ติด') || thai.startsWith('ใจ')) return 'personality'

  // Person/relationship
  const PERSON = ['sibling','brother','sister','parent','father','mother','friend','teacher',
    'doctor','nurse','driver','owner','customer','staff','officer','person','older person','younger']
  if (PERSON.some(w => eng.includes(w)) || ['พี่','น้อง','เพื่อน','แม่','พ่อ','ครู','หมอ','เจ้าของ','ลูกค้า'].includes(thai)) return 'person'

  // Clothing - must not be classified as body
  if (['underwear','pants','shirt','shorts','socks','bra','clothes','clothing','dress','skirt'].some(w => eng.includes(w)) ||
      ['กางเกง','เสื้อ','ถุงเท้า','กระโปรง','ชุด'].some(w => thai.startsWith(w))) return 'object'

  // Body parts
  const BODY = ['head','eye','ear','nose','mouth','tooth','neck','shoulder','arm','hand',
    'finger','chest','stomach','back','waist','leg','knee','foot','toe','skin','hair']
  if (BODY.some(w => eng.includes(w))) return 'body'

  // Nature/weather
  const NATURE = ['wave','wind','sun','cloud','storm','sea','ocean','river','mountain',
    'sky','sand','beach (natural)','flood','fog','thunder']
  if (NATURE.some(w => eng.includes(w))) return 'nature'

  // Food/drink
  const FOOD = ['chicken','pork','beef','fish','rice','noodle','soup','curry','salad',
    'stir','fried','grilled','ketchup','sauce','coffee','tea','beer','water','juice',
    'milk','bread','egg','vegetable','fruit','dessert','red bull','energy drink','drink']
  if (FOOD.some(w => eng.includes(w))) return 'food'

  // Meal words
  if (['lunch','breakfast','dinner','meal'].some(w => eng.includes(w))) return 'meal'

  // Colour words
  if (eng.startsWith('colour') || eng.startsWith('color') || thai.startsWith('สี')) return 'colour'

  // Study materials
  if (['worksheet','homework','exam','exercise book','notebook','letter/character','sentence (study)'].some(w => eng.includes(w))) return 'study_material'

  // Place/shop
  const PLACE = ['station','market','shop','store','hotel','restaurant','hospital','school',
    'temple','road','street','airport','bank','park','laundry','coffee shop','pharmacy']
  if (PLACE.some(w => eng.includes(w))) return 'place'

  // Adjectives/states
  const ADJ = ['broken','ready','strong','hot','cold','expensive','cheap','fast','slow',
    'difficult','easy','tired','hungry','painful','clean','dirty','full','empty','busy',
    'safe','dangerous','loud','quiet','clear','cloudy','wet','dry','late','early','long','short',
    'fit','fitting','just right','perfect fit','exact','precise','appropriate']
  if (ADJ.some(w => eng.includes(w))) return 'adjective'

  // Verb/action words — transitive
  const TRANSITIVE_VERBS = ['reduce','increase','send','pick up','deliver','give','buy','sell',
    'repair','fix','wash','cook','order','pay','forget','remember','call','photo','record','help']
  if (TRANSITIVE_VERBS.some(w => eng.includes(w))) return 'verb_transitive'

  // Verb/action — intransitive/state
  const INTRANS = ['hurry','arrive','wait','travel','work','sleep','walk','run','swim',
    'meet (attend)','practise','compete','interview','train']
  if (INTRANS.some(w => eng.includes(w))) return 'verb_intrans'

  // Specific problem words
  if (thai === 'เดี๋ยวนี้' || eng === 'now' || eng === 'right now') return 'time'
  if (thai === 'รบกวน' || eng === 'disturb' || eng === 'bother') return 'verb_transitive'
  if (thai === 'หัก' || eng === 'break' || eng === 'snap') return 'verb_transitive'
  if (thai === 'ปลาย' || eng === 'end' || eng === 'tip') return 'object'
  if (thai === 'เช่น' || eng === 'such as' || eng === 'for example' || eng === 'like') return 'connector_about'
  if (thai === 'จอง' || eng === 'book' || eng === 'reserve' || eng === 'booking') return 'verb_transitive'

  if (thai === 'ซึ่ง' || eng === 'which' || eng === 'that') return 'connector_rel'
  if (thai === 'โคมลอย' || eng === 'sky lantern' || eng.includes('lantern')) return 'object'
  if (thai === 'กุมารทอง' || eng.includes('golden child') || eng.includes('amulet')) return 'object'
  if (thai === 'นางกวัก' || eng.includes('beckoning')) return 'object'
  if (thai === 'พระพิฆเนศ' || eng === 'ganesha' || eng.includes('ganesha')) return 'person'
  if (thai === 'นครวัด' || eng.includes('angkor')) return 'place'
  if (thai === 'งานไม้ดอก' || eng.includes('flower festival')) return 'place'
  if (thai === 'กุมารทอง' || eng.includes('golden child')) return 'object'

  // Common words that often get misclassified
  if (thai === 'สาย' || eng === 'line' || eng === 'late' || eng === 'cord') return 'object'
  if (thai === 'นางงาม' || eng === 'beauty queen') return 'person'
  if (thai === 'แพ' || eng === 'raft') return 'object'
  if (thai === 'มืดค่ำ' || eng === 'dusk' || eng === 'nightfall') return 'time'
  if (thai === 'เส้นทาง' || eng === 'route' || eng === 'path') return 'place'
  if (thai === 'เส้นผม' || eng.includes('hair strand')) return 'body'
  if (thai === 'ขน' || eng === 'hair/fur' || eng === 'fur' || eng === 'feather') return 'body'
  if (thai === 'ชาวเขา' || eng === 'hill tribe' || eng.includes('hill tribe')) return 'person'
  if (thai === 'กะเหรี่ยงคอยาว' || eng.includes('long-neck')) return 'person'
  if (thai === 'เก่า' || eng === 'old' || eng === 'old (thing)') return 'adjective'
  if (thai === 'เต็ม' || eng === 'full') return 'adjective'
  if (thai === 'สาว' || eng === 'girl' || eng === 'young woman') return 'person'
  if (thai === 'แย่ง' || eng === 'compete' || eng === 'to compete' || eng === 'to snatch') return 'verb_intrans'
  if (thai === 'จัด' || eng === 'arrange' || eng === 'organize') return 'verb_transitive'
  if (thai === 'เข้ารอบ' || eng === 'advance' || eng === 'qualify') return 'verb_phrase'
  if (thai === 'สะดวก' || eng === 'convenient') return 'adjective'

  // Object nouns
  return 'object'
}

// Returns risk level for routing: 'high' | 'medium' | 'low'
function getRisk(type) {
  const HIGH = new Set([
    'corrupted','full_sentence',
    'connector_rel','connector_about','connector_because','connector_but','connector_if','connector_like',
    'degree_super','degree_modifier','degree_extent','degree_compare',
    'question_when','question_who','question_where','question_what','question_why','question_how','question_howmany',
    'quantifier','quantity_phrase','verb_phrase',
    'polite_command','condition_traffic','condition_rain','condition_event','rank',
  ])
  const MEDIUM = new Set([
    'adjective','emotion','personality','body','nature','abstract','verb_transitive','verb_intrans',
    'location','person','colour','study_material',
  ])
  if (HIGH.has(type)) return 'high'
  if (MEDIUM.has(type)) return 'medium'
  return 'low'
}

function allowsRequestFrame(type) {
  return ['object','food','meal'].includes(type)
}

function getCompatibleConceptsForTarget(target) {
  const type = classifyWord(target)
  return (typeof CONCEPT_CARDS !== 'undefined' ? CONCEPT_CARDS : []).filter(c => {
    if (c.bannedClasses && c.bannedClasses.some(b => type.includes(b) || b === type)) return false
    if (c.allowedClasses && c.allowedClasses.length > 0) {
      return c.allowedClasses.some(a => type.includes(a) || a === type ||
        // fuzzy match: object~noun, food~meal, place~location, verb~verb_intrans
        (a === 'noun' && ['object','food','drink','meal','ticket_document','clothing'].includes(type)) ||
        (a === 'place' && ['location','shop'].includes(type)) ||
        (a === 'verb' && ['verb_intrans','verb_transitive','verb_phrase'].includes(type)) ||
        (a === 'object' && type === 'normal') ||
        (a === 'activity' && ['verb_intrans','place'].includes(type))
      )
    }
    return true
  })
}

function selectConceptFrame(target, concepts) {
  if (!concepts || concepts.length === 0) return null
  // Prefer concepts that have {target} in their frame (direct substitution)
  const withTarget = concepts.filter(c => c.generatorFrames && c.generatorFrames.some(f => f.includes('{target}')))
  const pool = withTarget.length > 0 ? withTarget : concepts
  // Pick randomly from top 3 to add variety
  const shuffled = pool.slice(0, 3).sort(() => Math.random() - 0.5)
  const c = shuffled[0]
  if (!c || !c.generatorFrames || c.generatorFrames.length === 0) return null
  const frames = c.generatorFrames.filter(f => f.includes('{target}'))
  const frame = frames.length > 0 ? frames[Math.floor(Math.random() * frames.length)] : c.generatorFrames[0]
  return { concept: c, frame }
}

function buildConceptPairs(target, conceptFrame) {
  const tw = target.thai
  const eng = target.english
  const ph = target.phonetic || tw
  const { concept, frame } = conceptFrame

  const frames = concept.generatorFrames || []
  const ex = concept.goodExamples || []

  // Build real sentences from concept frames, not "Say: X" templates
  const pairs = []

  // Use the actual frame templates
  const f0 = frames[0] ? frames[0].replace('{target}', tw) : tw + 'ครับ'
  const f1 = frames[1] ? frames[1].replace('{target}', tw) : tw + 'ไหมคะ'

  // Ensure proper sentence endings
  const stmt = (f0.endsWith('ครับ') || f0.endsWith('ค่ะ') || f0.endsWith('คะ')) ? f0 : f0 + 'ครับ'
  const qst = (f1.includes('ไหม') || f1.includes('หรือ') || f1.includes('ที่ไหน') || f1.includes('อะไร'))
    ? (f1.endsWith('คะ') || f1.endsWith('ค่ะ') ? f1 : f1.replace('ครับ','คะ').replace(/คะ$/,'คะ'))
    : f1 + 'ไหมคะ'

  // Statement
  if (stmt.includes(tw)) {
    pairs.push({
      prompt: ex[0] ? ex[0].english.replace(ex[0].thai, eng) : concept.meaning.replace('{target}', eng),
      thai: stmt,
      english: eng + '.',
      phonetic: ph + ' khrâp',
      target_phonetic: ph,
      _source: 'concept:' + concept.id,
    })
  }

  // Question
  if (qst.includes(tw)) {
    const qEng = ex[0] ? ex[0].english : concept.meaning.replace('{target}', eng) + '?'
    pairs.push({
      prompt: 'Ask: ' + (concept.meaning || eng).replace('{target}', eng),
      thai: qst,
      english: qEng,
      phonetic: ph + ' mǎi khá',
      target_phonetic: ph,
      _source: 'concept:' + concept.id,
    })
  }

  // Negative using ยังไม่/ไม่ได้ depending on context
  const neg = 'ยังไม่' + tw + 'ครับ'
  if (neg.includes(tw)) {
    pairs.push({
      prompt: 'Say you have not ' + eng + ' yet',
      thai: neg,
      english: "I have not " + eng + " yet.",
      phonetic: 'yang mâi ' + ph + ' khrâp',
      target_phonetic: ph,
      _source: 'concept:' + concept.id,
    })
  }

  // Return only pairs that contain the target word and have decent prompts
  return pairs.filter(p => p.thai && p.thai.includes(tw) && p.prompt && p.prompt.length > 8)
}

function buildMicroPrompt(target, anchors, vocab, promptType1, promptType2, promptType3, existingThais, pairOffset, wordType) {
  const PARTICLES = ['ครับ','ค่ะ','คะ','นะ','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่',
    'หรือ','ว่า','ถ้า','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก',
    'ผม','ฉัน','คุณ','เรา','เขา','เธอ','ที่นี่','ตอนนี้','วันนี้','นี้','นั้น','เพราะ','ให้','กัน','เอง','ไหม','ก็ได้']
  const anchorLines = anchors.slice(0,8).map(w => w.thai + '=' + w.english).join(' | ')
  const existingList = [...existingThais].slice(-4).join(' | ')
  const { goalMin: gMin, goalMax: gMax, effectiveCeil: eCeil } = getSentenceLengthForVocab(vocab)
  const promptCap = Math.max(6, eCeil + 3)

  const tw = target.thai

  const ph = target.phonetic || ''
  const wType = wordType || classifyWord(target)
  const risk = getRisk(wType)

  // ── TIER 2: Medium-risk — locked frame, AI fills content ─────────────────
  if (risk === 'medium') {

  ].join('\n')
}

  const pr = pair.prompt.toLowerCase()
  const tw = target.thai

  if (!th.includes(tw)) return false
  // Must not be duplicate

  if (pr.endsWith('...') || pr.length < 8) return false
  // Prompt must not contain Thai script
  if (/[ก-๙]/.test(pair.prompt)) return false
  // Phonetic must not contain Thai script
  if (/[ก-๙]/.test(ph)) return false
  // EN too long
  if (en.split(' ').length > 15) return false
  // Words array check removed - AI responses don't include words array

  // ── TENSE ALIGNMENT ─────────────────────────────────────────────────────
  // "never" must use ไม่เคย, not ไม่
  if (en.includes('never') && !th.includes('ไม่เคย')) return false
  // "can" questions must use ได้ไหม not จะ+ไหม
  if ((en.endsWith('?') && en.includes('can ')) && th.includes('จะ') && !th.includes('ได้')) return false
  // "have you done" questions should not use bare ไหม
  // "already" needs แล้ว
  if (en.includes('already') && !th.includes('แล้ว')) return false
  // "not yet" needs ยังไม่ได้
  if (en.includes('not yet') && !th.includes('ยัง') && !th.includes('ไม่ได้')) return false

  // ── PROMPT/ANSWER ALIGNMENT ──────────────────────────────────────────────
  // Ask prompt → must have question marker in Thai
  if (pr.startsWith('ask') && !th.includes('ไหม') && !th.includes('หรือ') && !th.includes('เหรอ')
      && !th.includes('กี่') && !th.includes('ที่ไหน') && !th.includes('เมื่อไหร่')
      && !th.includes('ใคร') && !th.includes('อะไร') && !th.includes('ทำไม')) return false
  // Ask prompt → EN must be question
  if (pr.startsWith('ask') && !pair.english.trim().endsWith('?')) return false
  // Say/Tell prompt → EN must NOT be question
  if ((pr.startsWith('say') || pr.startsWith('tell')) && pair.english.trim().endsWith('?')) return false
  // "never" in prompt → ไม่เคย in Thai
  if (pr.includes('never') && !th.includes('ไม่เคย')) return false

  // ── CLASS-SPECIFIC BANNED PATTERNS ─────────────────────────────────────────
  // Never use ขอ+X+หน่อย unless X is a physical/requestable object (low risk)
  const wType = wordType || classifyWord(target)
  const risk = getRisk(wType)
  if (risk !== 'low') {
    if (th.startsWith('ขอ'+tw) || th.includes('ขอ'+tw+'หน่อย')) return false
    if (th.startsWith('ไม่มี'+tw) && risk === 'high') return false
    if (th.startsWith('มี'+tw+'ไหม') && risk === 'high') return false
  }
  // Hard block: ขอ+target+หน่อย only for physical requestable items
  if (!allowsRequestFrame(wType)) {
    if (th.includes('ขอ'+tw+'หน่อย') || (th.startsWith('ขอ'+tw) && th.includes('ครับ'))) return false
  }
  // Hard block: มี/ไม่มี/เห็น templates for high-risk words
  if (risk === 'high') {
    if (th.startsWith('ไม่มี'+tw+'ครับ')) return false
    if (th.startsWith('มี'+tw+'ไหม')) return false
    if (th.startsWith('เห็น'+tw+'ครับ') || th.startsWith('ผมเห็น'+tw)) return false
  }
  // Hard block: body-pain frame for non-body words
  if (wType !== 'body') {
    if (th.includes(tw+'ผมเจ็บ') || th.includes(tw+'เจ็บครับ')) return false
  }
    // ── HARD QA GATE ────────────────────────────────────────────────────────────
  // Generic filler — always reject
  const FILLER_SENTENCES = ['ผมชอบครับ','ดีไหมคะ','ไปแล้วครับ','ผมชอบค่ะ','ดีไหมค่ะ','ไม่มีครับ','ได้ไหมคะ','ผมชอบครับ']
  if (FILLER_SENTENCES.includes(th)) return false
  // Prompt must not say "using [word] differently" — template failure
  if (pr.includes(' using ') || pr.endsWith(' using') || pr.includes('differently')) return false
  // Target word MUST appear in Thai sentence
  if (!th.includes(tw)) return false
  // Prompt contains "using [word]" or "differently" = template failure
  if (/using .+ differently/.test(pr) || pr.includes(' using ') || pr.endsWith(' using')) return false
  // Questions must end คะ not ค่ะ (hard rule, no exceptions)
  const questionEndings = ['ไหมค่ะ','ที่ไหนค่ะ','เมื่อไหร่ค่ะ','ใครค่ะ','อะไรค่ะ','หรือเปล่าค่ะ','ยังค่ะ','หรือยังค่ะ']
  if (questionEndings.some(q => th.includes(q))) return false
  // Auto-fix: if thai has question marker but ends ค่ะ, reject
  const hasQuestion = th.includes('ไหม') || th.includes('หรือ') || th.includes('เหรอ') || /[ที่ไหนเมื่อไหร่ใครอะไรทำไม]/.test(th)
  if (hasQuestion && th.endsWith('ค่ะ')) return false
  // กี่ + ไหม together = broken question
  if (th.includes('กี่') && th.includes('ไหม')) return false
  // ขอ + time/verb phrase = nonsense
  if (th.startsWith('ขอเมื่อ') || th.startsWith('ขอวัน') || th.startsWith('ขอมา') || th.startsWith('ขอซึ่ง')) return false
  // ไม่มี + verb phrase = nonsense
  if (th.startsWith('ไม่มีมา') || th.startsWith('ไม่มีไป') || th.startsWith('ไม่มีซึ่ง')) return false
  // Incomplete relative clause (ซึ่ง at end or followed only by particle)
  if (th.includes('ซึ่งชอบ') || th.includes('ซึ่งอยู่') || th.includes('ซึ่งอยาก') || /ซึ่ง[ครับค่าคะนะ]/.test(th)) return false
  // Full sentence being used as noun  
  if (th.includes('ขอคุณเป็น') || th.includes('ไม่มีคุณเป็น') || th.includes('มีคุณเป็นคน')) return false
  // Quantifier used standalone
  if (/เอาทุก[ครับค่าคะ]/.test(th) || /มีทุก[ครับค่าคะ]/.test(th)) return false
  // Adjective used as destination/object (expanded)
  const ADJ_TARGETS = ['ใส','ช้า','ดึก','ตื่นเต้น','เผ็ด','แพง','ถูก','เหนื่อย','เบื่อ','สนุก','ดีใจ','เสียใจ','กลัว','พอดี']
  for (const adj of ADJ_TARGETS) {
    if (th === 'ผมไป'+adj+'ครับ' || th === 'ผมอยาก'+adj+'ครับ' || th === adj+'ผมเจ็บครับ') return false
    if (th.startsWith('ขอ'+adj) || th.startsWith('มี'+adj+'ไหม') || th.startsWith('ไม่มี'+adj)) return false
    if (en.includes('went to '+adj.toLowerCase()) || en.includes('want to '+adj.toLowerCase())) return false
  }
  // ซึ่ง incomplete clause — reject if ซึ่ง is not followed by subject+verb
  if (th.includes('ซึ่งชอบ') || th.includes('ซึ่งอยู่') || th.includes('ซึ่งอยาก') || th.includes('ซึ่งดี') || th.includes('ซึ่งอร่อย')) return false
  // เมื่อกี้ as object
  if (th.startsWith('ขอเมื่อกี้') || th.includes('มีเมื่อกี้') || th.includes('ไม่มีเมื่อกี้')) return false
  // ไม่เคย + เมื่อกี้ (logically contradictory)
  if (th.includes('ไม่เคย') && th.includes('เมื่อกี้')) return false
  // Double ได้ (จำได้ได้)
  if (th.includes('ได้ได้')) return false
  // รู้ + place/person without จัก (should be รู้จัก)
  const placePersonWords = ['เมืองไทย','กรุงเทพ','ร้าน','ตลาด','ซอย','ถนน','เพื่อน','พี่','น้อง']
  for (const w of placePersonWords) {
    if (th.includes('รู้'+w) && !th.includes('รู้จัก')) return false
  }
  // Food with เจอ/เห็น instead of กิน
  // (allow if really visual context, but flag as suspicious)
  const foodNouns = ['ผัดเปรี้ยว','คะน้า','ข้าวมันไก่','ต้มยำ','ข้าวผัด','ก๋วยเตี๋ยว','หมูปิ้ง']
  if (foodNouns.some(f => th.includes(f)) && (th.startsWith('เห็น') || th.startsWith('เจอ'))) return false

  // ── BANNED PATTERNS ──────────────────────────────────────────────────────
  const BANNED_PATTERNS = [
    // Nonsense combinations
    ['i see earnings',true], ['i see travel',true], ['i see traffic',true],
    ['i see which',true], ['i see when',true], ['i see above',true], ['i see upstairs',true],
    ['i see strong',true], ['i see ready',true],
    ['earnings hurt',true], ['earnings pain',true],
    ['left already soon',true], ['already left soon',true],
    ['i have above',true], ['i have downstairs',true], ['is there above',true],
    ['i see the most',true], ['i met the most',true],
    ['i see homebody',true],
    // Traffic as time/place
    ['free on traffic',true], ['go on traffic',true], ['free on raining',true],
    // Rank as location
    ['went to first place',true], ['went to second place',true],
    // Meal as destination
    ['go to lunch',true], ['go to breakfast',true], ['go to dinner',true],
    // Female pronoun + male particle
    ['ดิฉัน','ครับ'],
    // มัน with people
    // Check ไม่+verb mistranslated as never
  ]
  for (const [a, b] of BANNED_PATTERNS) {
    if (b === true && en.includes(a)) return false
    if (typeof b === 'string' && th.includes(a) && th.includes(b)) return false
  }

  return true
}

function getScenarioForTarget(target) {
  const eng = (target.english || '').toLowerCase()
  const thai = target.thai || ''
  const type = classifyWord(target)
  if (['aviation','airplane','flight','route','convenient','transport','by'].some(w => eng.includes(w)) ||
      ['การบิน','เครื่องบิน','เส้นทาง','โดย','สะดวก'].includes(thai)) return 'travel'
  if (['nature','hill tribe','long-neck','winding','dusk','lifestyle','tradition'].some(w => eng.includes(w)) ||
      ['ธรรมชาติ','ชาวเขา','กะเหรี่ยง','คดเคี้ยว','มืดค่ำ','วิถีชีวิต'].includes(thai)) return 'nature'
  if (['raft','float','river','cruise','drift'].some(w => eng.includes(w)) ||
      ['แพ','ล่อง'].includes(thai)) return 'river'
  if (['nose','ear','eye','skin','hair','fur','tooth','body'].some(w => eng.includes(w)) ||
      ['จมูก','หู','ผิว','เส้นผม','ขน'].includes(thai)) return 'body'
  if (['beauty queen','compete','advance','contest','arrange','pageant'].some(w => eng.includes(w)) ||
      ['นางงาม','แย่ง','เข้ารอบ','จัด'].includes(thai)) return 'competition'
  if (['downtown','city','car','old','full','line','traffic'].some(w => eng.includes(w)) ||
      ['ตัวเมือง','รถยนต์','เก่า','เต็ม','สาย'].includes(thai)) return 'city'
  if (['family','girl','woman','person','people'].some(w => eng.includes(w)) ||
      ['ครอบครัว','สาว'].includes(thai)) return 'family'
  if (type === 'abstract' || ['culture','lifestyle','tradition'].some(w => eng.includes(w))) return 'culture'
  return 'general'
}

      'เหตุการณ์','สถานการณ์','ข่าว','ข้อมูล','ข้อเสนอ','โอกาส',
      'สถานที่','สถานี','โรงพยาบาล','ร้านอาหาร','ห้างสรรพสินค้า',
      'งาน','รายงาน','เอกสาร','รายการ','ผล','ผลลัพธ์','ความ','การ',
      'แว่นตา','แว่น','ถุงมือ','รองเท้า',
      'เค้ก','ขนม','ของหวาน','ผลไม้','อาหาร',
      'แจกัน','แก้วน้ำ','จาน','ชาม','ช้อน','ส้อม','มีด',
      'สไตล์','ดีไซน์','แฟชั่น','เทรนด์','ออนไลน์',
      'สภาพ','ข้อความ','รสชาติ','เสิร์ฟ','ปรุง','สูตร',
      'มัน','ซุป','บอล','สวน','กลุ่ม','กำแพง','ปาร์ตี้',
      'ย้าย','พลาด','เที่ยวบิน','ตรงเวลา','สีสัน',
      'อดีต','ท่องจำ','ท้องถิ่น','ขนบธรรมเนียม',
      'แพทย์','แพทย์แผนโบราณ',
      'สิ่งสำคัญ',
    ])

    for (const p of pairs) {
      // Basic field check
      if (!p.thai || !p.english || !p.prompt) { failures.push('missing fields'); continue }
      // Must contain target word
      if (!p.thai.includes(target.thai)) { failures.push('no target: ' + target.thai + ' in: ' + p.thai.slice(0,30)); continue }
      // Must be a real Thai sentence (at least 5 Thai chars)
      const thaiChars = (p.thai || '').split('').filter(c => c >= '\u0E00' && c <= '\u0E7F').length
      if (thaiChars < 5) { failures.push('too short: ' + p.thai); continue }
      // Length check via phonetic word count (spaces = word boundaries, reliable)
      const phWords = (p.phonetic || '').trim().split(/\s+/).filter(w => w && !/^[?.!,]$/.test(w)).length
      const lenCheck = getSentenceLengthForVocab(vocab) || {}
      const minWords = lenCheck.goalMin || 5
      const maxWords = (lenCheck.hardCeil || 8) + 2  // allow 2 over
      // If phonetic looks incomplete (≤2 tokens), fall back to Thai char count estimate
      const thaiSpaceWords = p.thai.split(/\s+/).filter(t => /[ก-๙]/.test(t)).length
      const phCoverage = phWords / Math.max(1, thaiSpaceWords)
      const effectiveLen = (phWords <= 2 || phCoverage < 0.6) ? Math.max(phWords, thaiSpaceWords) : phWords
      if (effectiveLen < minWords) { failures.push('too short: ' + effectiveLen + ' words (need ' + minWords + '+): ' + p.thai); continue }
      if (phWords > 2 && phWords > maxWords) { failures.push('too long: ' + phWords + ' words (max ' + maxWords + '): ' + p.thai); continue }
      // Must not be a duplicate
      if (existingThais.has(p.thai)) { failures.push('duplicate'); continue }
      // ── Unknown vocab check (skipped on lenient mode for final AI attempts) ──
      if (strict && knownThaiWords.size > 0) {
        // Find Thai substrings not covered by known words or always-ok words
        let remaining = p.thai
        // Strip known words WHOLE-WORD only (sort longest first to avoid substring false-positives)
        const stripWords = [...knownThaiWords, ...alwaysOk, target.thai].filter(Boolean).sort((a,b) => b.length - a.length)
        for (const w of stripWords) {
          let pos = 0; let out = ''
          while (pos < remaining.length) {
            if (remaining.startsWith(w, pos)) {
              const before = pos === 0 ? '' : remaining[pos-1]
              const after2 = remaining[pos + w.length]
              const beforeOk = pos === 0 || before < '\u0E00' || before > '\u0E7F'
              const afterOk = !after2 || after2 < '\u0E00' || after2 > '\u0E7F'
              if (beforeOk && afterOk) { out += ' '; pos += w.length; continue }
            }
            out += remaining[pos]; pos++
          }
          remaining = out
        }
        // Remove non-Thai chars and spaces
        const unknownChars = remaining.replace(/[^฀-๿]/g, '').trim()
        if (unknownChars.length > 4) {
          failures.push('unknown vocab: ' + unknownChars.slice(0,20))
          continue
        }
      }
      // Prompt must be reasonable English
      const pr = (p.prompt || '').toLowerCase().trim()
      const engLower = target.english.toLowerCase()
      if (pr === 'say: ' + engLower || pr === 'say ' + engLower ||
          pr === 'ask: ' + engLower + '?' || pr === 'ask ' + engLower ||
          pr === 'negative: ' + engLower || pr.match(/^(say|ask|negative):\s*\S+$/i)) {
        failures.push('lazy prompt: ' + p.prompt); continue
      }
      if (p.prompt.length < 10) { failures.push('prompt too short'); continue }
      // Reject vague meta-instruction prompts — must be specific speaking instructions
      const vagueVerbs = /^(describe|discuss|talk about|inquire about|mention|explain|elaborate|explore|consider|reflect|think about|share|express your thoughts|tell me about|speak about|comment on)/i
      if (vagueVerbs.test(pr)) {
        failures.push('vague prompt (not specific): ' + p.prompt); continue
      }
      // Question check
      const hasAnyQuestion = p.thai.includes('ไหม') || p.thai.includes('หรือ') ||
          p.thai.includes('ที่ไหน') || p.thai.includes('อะไร') || p.thai.includes('ใคร') ||
          p.thai.includes('ทำไม') || p.thai.includes('ยังไง') || p.thai.includes('อย่างไร') ||
          p.thai.includes('กี่') || p.thai.includes('เมื่อไหร่') || p.thai.includes('เท่าไหร่') ||
          p.thai.includes('ได้ไหม') || p.thai.includes('เหรอ') || p.thai.includes('มั้ย') ||
          p.thai.includes('เป็นยังไง') || p.thai.includes('อย่างงั้น') ||
          !p.thai.endsWith('ครับ')
      if (pr.startsWith('ask') && !hasAnyQuestion) {
        failures.push('ask prompt but no question marker'); continue
      }
      // ── Grammar validators (v179-v182) ──────────────────────────────────
      let gramFail = null
      // 1. Grok spaced Thai
      {
        const thaiToks = p.thai.split(' ').filter(t => /[ก-๙]/.test(t))
        const shortRatio = thaiToks.length > 0 ? thaiToks.filter(t => t.length <= 3).length / thaiToks.length : 0
        if (thaiToks.length >= 4 && shortRatio > 0.5) gramFail = 'spaced Thai: model put spaces between Thai words: ' + p.thai
      }
      // 2. เดี๋ยว between จะ+verb
      if (!gramFail && /จะเดี๋ยว[ก-๙]/.test(p.thai)) gramFail = 'เดี๋ยว between จะ+verb: ' + p.thai
      // 3. ไม่ at end
      if (!gramFail && /ไม่(ครับ|ค่ะ|คะ)$/.test(p.thai)) gramFail = 'ไม่ at sentence end: ' + p.thai
      // 4. มี+verb+ตั้งแต่
      if (!gramFail && /มี[ก-๙]{1,8}ตั้งแต่/.test(p.thai)) gramFail = 'มี+verb+ตั้งแต่ wrong: ' + p.thai
      // 5. หักข่าว wrong
      if (!gramFail && p.thai.includes('หักข่าว')) gramFail = 'หักข่าว wrong idiom — use แจ้งข่าว/บอกข่าว: ' + p.thai
      // 6. อยากมีเครื่องดื่ม
      if (!gramFail && p.thai.includes('อยากมีเครื่องดื่ม')) gramFail = 'อยากมีเครื่องดื่ม — use อยากดื่ม: ' + p.thai
      // 7. อยาก/ไม่อยาก + bare noun
      if (!gramFail) {
        const drinkNouns = ['เครื่องดื่ม','น้ำ','กาแฟ','ชา','เบียร์','น้ำส้ม','น้ำเปล่า','อาหาร','ข้าว','ผลไม้','ขนม']
        if (drinkNouns.some(n => p.thai.includes('อยาก'+n) || p.thai.includes('ไม่อยาก'+n)))
          gramFail = 'อยาก+noun missing verb: use อยากดื่ม/กิน/ได้: ' + p.thai
      }
      // 8. ตั้งแต่ needs verb before it
      if (!gramFail && p.thai.includes('ตั้งแต่')) {
        const sub = p.thai.replace(/^(ผม|ดิฉัน|คุณ|เขา|เธอ|เรา|พวกเรา|หนู)\s*/,'')
        if (sub.startsWith('ตั้งแต่')) gramFail = 'ตั้งแต่ needs verb before it: ผมรอตั้งแต่เช้า not ผมตั้งแต่เช้า: ' + p.thai
      }
      // 9. ตั้งแต่+point-in-time
      if (!gramFail && /ตั้งแต่(เมื่อวาน|อาทิตย์ที่แล้ว|เดือนที่แล้ว|ปีที่แล้ว)/.test(p.thai))
        gramFail = 'ตั้งแต่+point-in-time: wrong. ตั้งแต่ = since (ongoing): ' + p.thai
      // 10. สะสาง wrong domain
      if (!gramFail && p.thai.includes('สะสาง') && /ผิว|สิว|หน้า/.test(p.thai))
        gramFail = 'สะสาง wrong domain (admin/tasks only, not skin): ' + p.thai
      // 11. ว่างไม่ได้ awkward
      if (!gramFail && /ว่าง[ก-๙]*ไม่ได้/.test(p.thai)) gramFail = 'ว่างไม่ได้ awkward — use ไม่ว่าง: ' + p.thai
      // 12. SAY + question ending
      if (!gramFail) {
        const prL = (p.prompt||'').toLowerCase()
        if ((prL.startsWith('say') || prL.startsWith('tell')) && /ไหม(ครับ|คะ|ค่ะ)$/.test(p.thai))
          gramFail = 'SAY prompt but Thai ends ไหม (question): ' + p.thai
      }
      // 13. ผม + ค่ะ gender mismatch
      if (!gramFail && p.thai.includes('ผม') && /ค่ะ$/.test(p.thai)) gramFail = 'ผม+ค่ะ gender mismatch: ' + p.thai
      // 14. เป็นสี wrong
      if (!gramFail && /เป็นสี[ก-๙]/.test(p.thai)) gramFail = 'เป็นสี wrong — drop เป็น: ' + p.thai
      // 15. 1:1 check: just in prompt but เพิ่ง missing
      if (!gramFail) {
        const prL = (p.prompt||'').toLowerCase()
        if (/\bjust\b/.test(prL) && !p.thai.includes('เพิ่ง') && !p.thai.includes('เมื่อกี้') && !/just (a|like|in case|for)/.test(prL))
          gramFail = "'just' in prompt but เพิ่ง missing in Thai: " + p.thai
      }
      if (gramFail) { failures.push(gramFail); continue }

      // Grammar variety — batch check after all 3 valid
      valid.push(p)
    }

    // Batch: reject if all 3 share identical structure
    if (valid.length === 3) {
      const endings = valid.map(p => {
        const th = p.thai || ''
        if (/ไหม(ครับ|คะ|ค่ะ)$/.test(th)) return 'question'
        if (/ไม่[ก-๙]/.test(th)) return 'negative'
        return 'positive'
      })
      const coreVerbs = valid.map(p => (p.thai||'').replace(/^(ผม|คุณ|เขา|เธอ|เรา|ดิฉัน|หนู)\s*/,'').slice(0,8))
      if (new Set(endings).size === 1 && new Set(coreVerbs).size === 1) {
        valid.forEach(p => failures.push('identical grammar pattern — regenerating'))
        valid.length = 0
      }
    }

    console.log('[validate] ' + target.thai + ': ' + valid.length + ' valid, ' + failures.length + ' failed: ' + failures.join(' | '))
    return { valid, failures }
  }

  // ── Single API call with retry ─────────────────────────────────────────────
  async function callModel(mdl, prompt) {
    try {
      const sysMsg = 'You are a Thai language teacher writing Pimsleur-style speaking prompts. ' +
        'STRICT RULE: Every Thai word must be from the WHITELIST in the prompt or be the target word. ' +
        'The "prompt" field must be a SPECIFIC, CONCRETE instruction — exactly what the student should say. ' +
        'GOOD prompts: "Say your nose is big", "Ask if the route is winding", "Tell them you just arrived", "Ask how much the raft costs". ' +
        'BAD prompts: "Describe your nose", "Discuss the route", "Talk about transport", "Inquire about hair" — these are vague topics not speaking instructions. ' +
        'Each prompt must tell the student precisely what sentence to produce. ' +
        'CRITICAL 1:1 RULE: The "english" field must be an exact translation of what the Thai says — not a paraphrase of the prompt. If prompt says "just" Thai MUST have เพิ่ง. If prompt says "normally" Thai MUST have ปกติ. ' +
        'All 3 Thai sentences must use DIFFERENT grammar patterns (statement / question / negative or past). ' +
        'FEW-SHOT EXAMPLES: ' +
        'OK: {prompt:"Say you just arrived",thai:"ผมเพิ่งมาถึงครับ",english:"I just arrived."} | ' +
        'BAD: {prompt:"Say you just arrived",thai:"ผมมาถึงแล้วครับ",english:"I have arrived."} — แล้ว=already not just, english must match Thai | ' +
        'OK: {prompt:"Ask if the route is winding",thai:"เส้นทางนี้คดเคี้ยวไหมครับ",english:"Is this route winding?"} | ' +
        'BAD: {prompt:"Ask if the route is winding",thai:"เส้นทางนี้คดเคี้ยวมากครับ",english:"The route is very winding."} — ask must end ไหมครับ. ' +
        'SELF-CHECK before outputting: (1) Thai contains target word; (2) every Thai word in whitelist; (3) english is exact translation of Thai; (4) each pair uses different grammar structure. Rewrite any that fail. ' +
        'Return ONLY a JSON array: [{"prompt":"...","thai":"...","phonetic":"...","english":"..."}].'
      const messages = [
        { role: 'system', content: sysMsg },
        { role: 'user', content: prompt }
      ]
      const text = await callOpenRouterOnce(apiKey, mdl, messages, 3000)
      const parsed = parsePartialArray(text)
      console.log('[AI] ' + mdl.split('/').pop().slice(0,10) + ' returned ' + parsed.length + ' pairs')
      return parsed
    } catch(e) {
      console.error('[AI] error:', e.message)
      return []
    }
  }

  // ── Get local anchors for semantic affinity ────────────────────────────────
  function getLocalAnchors(target, i) {
    const eng_lower = (target.english || '').toLowerCase()
    let local
    if (['curry','rice','soup','noodle','chicken','fish','food','drink'].some(f => eng_lower.includes(f))) {
      const food = anchors.filter(a => ['กิน','ชอบ','อร่อย','สั่ง','ร้าน'].some(w => a.thai.includes(w)))
      local = [...food, ...anchors.filter(a => !food.includes(a))].slice(0, 8)
    } else if (['station','market','shop','hotel','beach','temple','airport'].some(f => eng_lower.includes(f))) {
      const place = anchors.filter(a => ['ไป','มา','อยู่','ใกล้','ถึง'].some(w => a.thai.includes(w)))
      local = [...place, ...anchors.filter(a => !place.includes(a))].slice(0, 8)
    } else {
      const targetThais = new Set(targets.map(t => t.thai))
      const nonTarget = anchors.filter(a => !targetThais.has(a.thai))
      const offset = (i * 4) % Math.max(nonTarget.length - 8, 1)
      local = nonTarget.slice(offset, offset + 8)
    }
    return local
  }

  // ── Pre-compute shared context ─────────────────────────────────────────────
  const vocabContext = getVocabContext()
  const failureLog = {}  // tracks why each word used fallback

  // Sort targets by scenario so pairs from the same scenario are adjacent — better track flow
  const scenarioOrder = ['body','travel','river','nature','competition','city','family','culture','general']
  targets = [...targets].sort((a,b) => {
    const sa = scenarioOrder.indexOf(getScenarioForTarget(a))
    const sb = scenarioOrder.indexOf(getScenarioForTarget(b))
    return (sa < 0 ? 99 : sa) - (sb < 0 ? 99 : sb)
  })

  // ── Main loop — word by word ───────────────────────────────────────────────
  for (let i = 0; i < targets.length; i++) {
    const target = targets[i]
    const wordType = classifyWord(target)
    const risk = getRisk(wordType)
    let pairs = []

    // ── CONCEPT TIER: direct frame substitution (no API) ─────────────────
    const compatConcepts = getCompatibleConceptsForTarget(target)
    const conceptFrame = (risk === 'low' || risk === 'medium') && compatConcepts.length > 0
      ? selectConceptFrame(target, compatConcepts) : null
    // Concept tier disabled - concept cards feed AI as context instead
    // (buildConceptPairs produced unreliable output for most word types)

    // ── TIER 1: Hardcoded bank removed from front — all words go through AI ───
    const hasHardcode = !!HARDCODED_FALLBACKS[target.thai]

    // ── TIER 2: Smart AI generation (V2 + V2 recheck + GPT escalation) ───
    if (pairs.length < 3) {
      const conceptBlock = getConceptBlock(target)
      const scenario = getScenarioForTarget(target)

      // ── Call 1: V2 generates ─────────────────────────────────────────────
      const prompt1 = buildSmartPrompt(target, conceptBlock, vocabContext, scenario, false, '')
      let generated = await callModel(GPT_MODEL, prompt1)
      let { valid, failures } = validateSmartPairs(generated, target)
      for (const p of valid) { if (pairs.length >= 3) break; if (!existingThais.has(p.thai)) pairs.push({...p, _source:'gpt:'+ target.thai}) }

      if (failures && failures.length > 0) failureLog[target.thai] = (failureLog[target.thai] || []).concat((failures||[]).map(f => 'GPT1: ' + f))
      console.log('[GPT] ' + target.thai + ': ' + valid.length + '/3 valid, failures: ' + failures.slice(0,2).join(', '))

      // ── Call 2: GPT recheck — ALWAYS runs to improve quality ─────────────
      {
        const lenRes = getSentenceLengthForVocab(vocab) || {}
        const lenHint = 'REQUIRED: sentences must be ' + (lenRes.goalMin||4) + '-' + (lenRes.hardCeil||8) + ' Thai words long'
        const recheckHint = lenHint + (failures && failures.length > 0 ? '. ALSO FIX: ' + failures.slice(0,3).join('; ') : '. Improve variety and naturalness')
        const prompt2 = buildSmartPrompt(target, conceptBlock, vocabContext, scenario, true, recheckHint)
        const recheck1 = await callModel(GPT_MODEL, prompt2)
        const { valid: v2, failures: f2 } = validateSmartPairs(recheck1, target)
        for (const p of v2) {
          if (!existingThais.has(p.thai)) {
            if (pairs.length < 3) {
              pairs.push({...p, _source:'gpt-recheck:'+ target.thai})
            } else {
              const whiteIdx = pairs.findIndex(x => x._source && x._source.startsWith('gpt:' + target.thai))
              if (whiteIdx >= 0) pairs[whiteIdx] = {...p, _source:'gpt-recheck:'+ target.thai}
            }
          }
        }
        if (f2 && f2.length > 0) failureLog[target.thai] = (failureLog[target.thai] || []).concat((f2||[]).map(f => 'GPT2: ' + f))
        console.log('[GPT recheck always] ' + target.thai + ': ' + v2.length + ' valid')

        // ── Call 3: GPT second check ─────────────────────────────────────
        if (pairs.length < 3) {
          const failReason2 = f2.slice(0, 3).join('; ') || 'still failing after GPT recheck'
          const prompt3 = buildSmartPrompt(target, conceptBlock, vocabContext, scenario, true, failReason2)
          const recheck2 = await callModel(GPT_MODEL, prompt3)
          const { valid: v3, failures: f3 } = validateSmartPairs(recheck2, target, false)  // lenient on 3rd attempt
          for (const p of v3) { if (pairs.length >= 3) break; if (!existingThais.has(p.thai)) pairs.push({...p, _source:'gpt-recheck2:'+ target.thai}) }
          console.log('[GPT second] ' + target.thai + ': ' + v3.length + ' more valid')

          // ── Call 4: Haiku final escalation ───────────────────────────────
          if (pairs.length < 3) {
            const failReason3 = f3.slice(0, 3).join('; ') || 'still failing after GPT second check'
            const prompt4 = buildSmartPrompt(target, conceptBlock, vocabContext, scenario, true, failReason3)
            const recheck3 = await callModel(HAIKU_MODEL, prompt4)
            const { valid: v4 } = validateSmartPairs(recheck3, target, false)  // lenient — accept Haiku output
            for (const p of v4) { if (pairs.length >= 3) break; if (!existingThais.has(p.thai)) pairs.push({...p, _source:'haiku:'+ target.thai}) }
            console.log('[Haiku] ' + target.thai + ': ' + v4.length + ' more valid')
          }
        }
      }

      // ── Final fallback — only reached after all AI calls failed ──────────────
      if (pairs.length < 3) console.warn('[generateTrack] All AI calls failed for: ' + target.thai + ' | failures: ' + JSON.stringify(failureLog[target.thai]||[]))
      if (pairs.length < 3) {
        // Try hardcoded bank (now last resort, not first choice)
        const hbank = HARDCODED_FALLBACKS[target.thai]
        if (hbank) {
          for (const p of hbank) {
            if (pairs.length >= 3) break
            if (!existingThais.has(p.thai)) pairs.push({...p, _source:'hardcoded:'+target.thai})
          }
        }
        // Generic fallback if still not enough
        if (pairs.length < 3) {
          const fb = makeFallbackPairs(target).filter(p => !existingThais.has(p.thai))
          for (const f of fb) { if (pairs.length >= 3) break; pairs.push({...f, _source:'fallback:'+target.thai}) }
        }
        if (pairs.length < 3) failureLog[target.thai] = (failureLog[target.thai] || []).concat(['FINAL FALLBACK: only ' + pairs.length + '/3 pairs'])
      }
    }

    // Dedup within this target group
    const seenInGroup = new Set()
    pairs = pairs.filter(p => { if (seenInGroup.has(p.thai)) return false; seenInGroup.add(p.thai); return true })

    for (const p of pairs) existingThais.add(p.thai)
    allPairs.push(...pairs.slice(0, 3))
    try {
      // Pass individual sources for each of the 3 pairs so bricks get correct colours
      const pairSources = pairs.slice(0, 3).map(p => p._source || '')
      onProgress && onProgress(allPairs.length, targets.length * 3, null, pairSources, i)
    } catch(e) {}
  }

  // ── Audit ─────────────────────────────────────────────────────────────────
  const audit = targets.map((t, i) => {
    const myPairs = allPairs.slice(i*3, i*3+3)
    const hasTarget = myPairs.every(p => p.thai && p.thai.includes(t.thai))
    return { thai: t.thai, count: myPairs.length, hasTarget, source: myPairs[0]?._source || 'unknown' }
  })
  const missing = audit.filter(a => a.count < 3 || !a.hasTarget)
  if (missing.length > 0) console.warn('[ThaiTeacher] Pair audit failures:', missing)

  // ── Repair pass ───────────────────────────────────────────────────────────
  for (const t of targets) {
    const tPairs = allPairs.filter(p => p.thai && p.thai.includes(t.thai))
    const need = 3 - tPairs.length
    if (need > 0) {
      const bank = HARDCODED_FALLBACKS[t.thai]
      const fb = bank && bank.length ? bank : makeFallbackPairs(t)
      const existingNow = new Set(allPairs.map(p => p.thai))
      for (const f of fb) {
        if (tPairs.length >= 3) break
        if (!existingNow.has(f.thai)) {
          allPairs.push({...f, _source:'repair:'+t.thai})
          existingNow.add(f.thai)
        }
      }
    }
  }

  // Dedup final pass
  const seen = new Set()
  allPairs = allPairs.filter(p => { if (seen.has(p.thai)) return false; seen.add(p.thai); return true })

  if (allPairs.length < targets.length * 3) console.warn('[ThaiTeacher] Still short after repair: ' + allPairs.length + '/' + (targets.length*3))
  // Build final failure summary
  const fallbackWords = Object.keys(failureLog)
  if (fallbackWords.length > 0) {
    console.warn('[ThaiTeacher] Fallback report:')
    fallbackWords.forEach(w => console.warn('  ' + w + ': ' + failureLog[w].join(' → ')))
  }
  try { onProgress && onProgress(allPairs.length, targets.length * 3, null, '') } catch(e) {}

  // ── Rebuild phonetics from vocab store (post-generation) ─────────────────
  const vocabLookup = {}
  for (const w of vocab || []) {
    const t = w.t || w.thai; const ph = w.ph || w.phonetic
    if (t && ph) vocabLookup[t] = ph
  }
  for (const t of targets) { if (t.thai && t.phonetic) vocabLookup[t.thai] = t.phonetic }
  // Hardcoded supplement for common words not in RAW_VOCAB
  Object.assign(vocabLookup, {
    'เปิด':'bəət','เดิน':'dəən','เร็ว':'reo','เก่า':'gào','เจ็บ':'jèp','เยอะ':'yə́',
    'แพทย์':'phâet','มัน':'man','ย้าย':'yáai','พลาด':'phlâat','กลุ่ม':'glùm',
    'สวน':'sǔan','กำแพง':'gam-phaaeng','ซุป':'súp','บอล':'bɔɔn',
    'เที่ยวบิน':'thîiao-bin','ตรงเวลา':'trong-wee-laa','สีสัน':'sǐi-sǎn',
  })
  const sortedVocabEntries = Object.entries(vocabLookup).sort((a,b) => b[0].length - a[0].length)
  const LEADING_VOWELS = new Set(['เ','แ','โ','ใ','ไ'])

  function buildTrackPhonetic(thai) {
    if (!thai) return ''
    const clean = thai.replace(/[,，.!?]/g,'').trim()
    if (vocabLookup[clean]) return vocabLookup[clean]
    let remaining = clean; const parts = []; let matchedChars = 0; let safety = 0
    while (remaining.length > 0 && safety++ < 80) {
      let matched = false
      for (const [word, ph] of sortedVocabEntries) {
        if (!remaining.startsWith(word)) continue
        const after = remaining[word.length]
        const nextThai = after && after >= '฀' && after <= '๿'
        if (nextThai && word.length < 3) {
          const hasLonger = sortedVocabEntries.some(([w]) => w.length > word.length && remaining.startsWith(w))
          if (hasLonger) continue
        }
        parts.push(ph); matchedChars += word.length; remaining = remaining.slice(word.length); matched = true; break
      }
      if (!matched) {
        if (LEADING_VOWELS.has(remaining[0])) {
          let skip = 1
          while (skip < remaining.length && remaining[skip] >= '฀' && remaining[skip] <= '๿' && !LEADING_VOWELS.has(remaining[skip])) skip++
          remaining = remaining.slice(skip)
        } else remaining = remaining.slice(1)
      }
    }
    const thaiCharCount = clean.split('').filter(c => c >= '฀' && c <= '๿').length
    if (thaiCharCount > 0 && matchedChars / thaiCharCount < 0.4) return ''
    return parts.join(' ')
  }

    return allPairs.map(p => {
    if (!p) return p
    const rebuilt = buildTrackPhonetic(p.thai || '')
    return rebuilt ? { ...p, phonetic: rebuilt } : p
  })
}


function buildConvoPrompt(targets, vocab) {
  // ── Belt level for complexity control ──────────────────────────
  const known = vocab.filter(w => (w.repCount || 0) >= 5).length
  const BELTS = [
    { name:'Mukyu',    sentMin:2,  sentMax:4  },
    { name:'10th Kyu', sentMin:5,  sentMax:6  },
    { name:'9th Kyu',  sentMin:6,  sentMax:7  },
    { name:'8th Kyu',  sentMin:7,  sentMax:8  },
    { name:'7th Kyu',  sentMin:8,  sentMax:9  },
    { name:'6th Kyu',  sentMin:9,  sentMax:10 },
    { name:'5th Kyu',  sentMin:10, sentMax:11 },
    { name:'4th Kyu',  sentMin:11, sentMax:12 },
    { name:'3rd Kyu',  sentMin:12, sentMax:13 },
    { name:'2nd Kyu',  sentMin:13, sentMax:14 },
    { name:'1st Kyu',  sentMin:14, sentMax:15 },
    { name:'Shodan',   sentMin:16, sentMax:20 },
  ]
  const BELT_THRESHOLDS = [0,100,200,350,500,750,1000,1500,2000,3000,4000,5000]
  const beltIdx = BELT_THRESHOLDS.reduce((idx, min, i) => known >= min ? i : idx, 0)
  const belt = BELTS[beltIdx] || BELTS[0]
  const complexityNote = `${belt.name}: sentences ${belt.sentMin}–${belt.sentMax} Thai words. Keep vocabulary simple and natural for this level.`

  // ── Scenario clustering ──────────────────────────────────────
  const SCENARIOS = [
    { id:'market',   keywords:['ตลาด','ร้าน','ซื้อ','ขาย','ราคา','แพง','ถูก','ส่วนลด','ต่อรอง'], scene:'At a market or shop', A:'Customer', B:'Vendor', goal:'Browse, ask prices, maybe buy something' },
    { id:'food',     keywords:['กิน','ดื่ม','อาหาร','ร้านอาหาร','สั่ง','อร่อย','หิว','อิ่ม','เมนู'], scene:'At a restaurant or food stall', A:'Customer', B:'Server', goal:'Order food, chat about dishes' },
    { id:'travel',   keywords:['ไป','มา','รถ','เดิน','สถานี','สนามบิน','โรงแรม','ที่พัก','ตั๋ว','เที่ยว'], scene:'Travelling or getting directions', A:'Traveller', B:'Local or transport staff', goal:'Get to a place, ask for help navigating' },
    { id:'health',   keywords:['เจ็บ','ปวด','หมอ','โรงพยาบาล','ยา','ไข้','อาการ','สุขภาพ'], scene:'At a clinic or pharmacy', A:'Patient', B:'Doctor or pharmacist', goal:'Describe symptoms, get advice' },
    { id:'social',   keywords:['เพื่อน','ครอบครัว','พบ','คุย','ช่วย','ขอบคุณ','ยินดี','สบาย'], scene:'Casual social conversation', A:'Friend A', B:'Friend B', goal:'Catch up, help each other, small talk' },
  ]
  const wordList = targets.map(t => `${t.thai} (${t.english})`).join(', ')
  const allThai = targets.map(t => t.thai).join(' ')
  let scenario = SCENARIOS.find(s => s.keywords.some(k => allThai.includes(k))) || SCENARIOS[4]

  // ── Few-shot example ─────────────────────────────────────────
  const example = '{"lines":[' +
    '{"speaker":"A","thai":"สวัสดีครับ, มีกาแฟร้อนไหมครับ","phonetic":"sà-wàt-dii khrâp, mii gaa-fae rón mǎi khrâp","english":"Hello, do you have hot coffee?"},' +
    '{"speaker":"B","thai":"มีค่ะ, ขนาดเล็กหรือใหญ่คะ","phonetic":"mii khâ, khà-nàat lék rǔue yài khá","english":"Yes, small or large?"},' +
    '{"speaker":"A","thai":"เอาใหญ่ครับ, ไม่ใส่น้ำตาลครับ","phonetic":"ao yài khrâp, mâi sài nám-taan khrâp","english":"Large please, no sugar."}' +
    ']}'

  const system = 'You are a Thai language teacher writing realistic spoken Thai conversations for learners. ' +
    'Write natural Thai as a Thai person would actually speak \u2014 not translated English. ' +
    'GRAMMAR RULES (always apply):\n' +
    '\u2022 Every Thai sentence ends with \u0e04\u0e23\u0e31\u0e1a (male) or \u0e04\u0e48\u0e30/\u0e04\u0e30 (female) \u2014 no exceptions\n' +
    '\u2022 \u0e40\u0e0a\u0e37\u0e48\u0e2d/\u0e04\u0e34\u0e14/\u0e23\u0e39\u0e49\u0e2a\u0e36\u0e01/\u0e2b\u0e27\u0e31\u0e07 must be followed by \u0e27\u0e48\u0e32 before a clause\n' +
    '\u2022 \u0e07\u0e31\u0e49\u0e19\u0e01\u0e47 must sit BETWEEN two clauses, never at the end\n' +
    '\u2022 \u0e0b\u0e36\u0e48\u0e07 must follow a noun, never start a sentence\n' +
    '\u2022 No \u0e04\u0e27\u0e32\u0e21 before adjectives (\u0e04\u0e27\u0e32\u0e21\u0e23\u0e27\u0e22 = wrong, \u0e23\u0e27\u0e22\u0e04\u0e23\u0e31\u0e1a = right)\n' +
    '\u2022 COMMA RULE: If a line has two clauses, separate with a comma. Short single-thought lines need no comma.\n' +
    'Return ONLY valid JSON \u2014 no markdown, no preamble, no thinking.\n' +
    'EXAMPLE OUTPUT:\n' + example

  const user = 'NOW write a 15-line conversation with these details:\n' +
    'SCENE: ' + scenario.scene + '\n' +
    'SPEAKER A: ' + scenario.A + '\n' +
    'SPEAKER B: ' + scenario.B + '\n' +
    'GOAL: ' + scenario.goal + '\n' +
    'LEVEL: ' + complexityNote + '\n' +
    'TARGET WORDS \u2014 use ONLY if they fit naturally in the scene (skip any that do not belong): ' + wordList + '\n' +
    'CRITICAL: NEVER force a word into a sentence where it makes no sense.\n\n' +
    'Return ONLY this JSON:\n' +
    '{"lines":[{"speaker":"A","thai":"...","phonetic":"...","english":"..."},{"speaker":"B","thai":"...","phonetic":"...","english":"..."}]}'

  return { system, user }
}


async function generateConvoWithOpenRouter(targets, vocab, apiKey, model) {
  const { system, user } = buildConvoPrompt(targets, vocab)
  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}`, 'HTTP-Referer': 'https://magical-druid-656889.netlify.app', 'X-Title': 'Thai Teacher' },
    body: JSON.stringify({ model: model || 'qwen/qwen3-32b', max_tokens: 4000, temperature: 0.4, stream: false,
      messages: [{ role: 'system', content: system }, { role: 'user', content: user }] })
  })
  if (!res.ok) throw new Error(`Convo error ${res.status}`)
  const data = await res.json()
  let text = (data.choices?.[0]?.message?.content || '').replace(/<think>[\s\S]*?<\/think>/g,'').trim().replace(/^```[\w]*[\r\n]?|[\r\n]?```$/g,'').trim()
  // Extract JSON even if model added preamble text
  const jsonStart = text.indexOf('{')
  const jsonEnd = text.lastIndexOf('}')
  if (jsonStart >= 0 && jsonEnd > jsonStart) text = text.slice(jsonStart, jsonEnd + 1)
  const parsed = JSON.parse(text)
  return parsed.lines || []
}

function ConvoPlayer({ lines, onSkip, onDone, speed, onSpeedChange }) {
  const [lineIdx, setLineIdx] = useState(0)
  const [playing, setPlaying] = useState(false)
  const [voices, setVoices] = useState([])
  const cancelRef = useRef(false)
  const speedRef = useRef(speed)  // ref so speed changes take effect immediately
  const HAS_SPEECH = typeof window !== 'undefined' && 'speechSynthesis' in window

  // Keep speedRef in sync
  useEffect(() => { speedRef.current = speed }, [speed])

  useEffect(() => {
    if (!HAS_SPEECH) return
    const load = () => { const v = window.speechSynthesis.getVoices(); if (v.length) setVoices(v) }
    load(); window.speechSynthesis.onvoiceschanged = load
    return () => { try { window.speechSynthesis.onvoiceschanged = null } catch(e) {} }
  }, [])

  useEffect(() => {
    if (!playing || lineIdx >= lines.length) { if (lineIdx >= lines.length) onDone(); return }
    cancelRef.current = false
    const line = lines[lineIdx]
    const speakLine = () => {
      if (!HAS_SPEECH || cancelRef.current) { setTimeout(() => { if (!cancelRef.current) setLineIdx(i => i + 1) }, 1200); return }
      try { window.speechSynthesis.cancel() } catch(e) {}
      const u = new SpeechSynthesisUtterance(line.thai)
      const isMale = line.speaker === 'M'
      u.lang = 'th-TH'
      u.rate = speedRef.current || 0.8  // use ref for real-time speed
      u.pitch = 1  // no pitch manipulation — let voices be natural
      // Google TTS Thai voices: female = th-TH-Standard-A, male = th-TH-Standard-B
      // Also handles: Google ภาษาไทย (female/male), Nexus voices
      const googleFemale = voices.find(v => v.lang.startsWith('th') && /Standard-A|หญิง|female/i.test(v.name))
      const googleMale = voices.find(v => v.lang.startsWith('th') && /Standard-B|Standard-C|ชาย|male/i.test(v.name))
      const anyThai = voices.filter(v => v.lang.startsWith('th'))
      // If 2+ voices, pick by index: first=female, second=male
      const byIndex = isMale ? (anyThai[1] || anyThai[0]) : (anyThai[0])
      const chosen = isMale ? (googleMale || byIndex) : (googleFemale || anyThai[0])
      if (chosen) u.voice = chosen
      u.onend = () => { if (!cancelRef.current) setTimeout(() => setLineIdx(i => i + 1), 700) }
      u.onerror = () => { if (!cancelRef.current) setTimeout(() => setLineIdx(i => i + 1), 900) }
      window.speechSynthesis.speak(u)
    }
    speakLine()
    return () => { cancelRef.current = true; try { window.speechSynthesis.cancel() } catch(e) {} }
  }, [playing, lineIdx, lines, voices])  // removed speed from deps — speedRef handles it

  const line = lines[lineIdx] || lines[lines.length - 1] || {}
  const pct = Math.round((lineIdx / Math.max(lines.length, 1)) * 100)

  return (
    <div className="fade-in" style={{ padding:16, maxWidth:500, margin:'0 auto', display:'flex', flexDirection:'column', minHeight:'100vh' }}>

      {/* Header */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
        <div>
          <div className="display" style={{ fontSize:17, color:'var(--gold)' }}>Thai Conversation</div>
          <div style={{ fontSize:11, color:'var(--muted)' }}>{lines.length} lines · all track words covered</div>
        </div>
        <button onClick={() => { cancelRef.current = true; try { window.speechSynthesis.cancel() } catch(e) {} onSkip() }}
          style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:20, padding:'7px 14px', cursor:'pointer', color:'var(--muted)', fontSize:12, fontWeight:600, fontFamily:'Sarabun,sans-serif' }}>
          Skip →
        </button>
      </div>

      {/* Play button — at top */}
      <button onClick={() => setPlaying(p => !p)}
        style={{ width:'100%', padding:'13px', borderRadius:12, border:'none', background: playing ? '#1a2a00' : 'linear-gradient(135deg,#d4a94a,#b88a35)', color: playing ? '#86c900' : '#0b1120', fontSize:15, fontWeight:700, cursor:'pointer', fontFamily:'Sarabun,sans-serif', marginBottom:10 }}>
        {playing ? '⏸ Pause' : lineIdx === 0 ? '▶ Play Conversation' : '▶ Resume'}
      </button>

      {/* Speed + progress row */}
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10, background:'var(--surface)', borderRadius:10, padding:'7px 12px' }}>
        <span style={{ fontSize:11 }}>🐢</span>
        <input type="range" min="0.4" max="1.2" step="0.05" value={speed}
          onChange={e => onSpeedChange(parseFloat(e.target.value))}
          style={{ flex:1, accentColor:'var(--gold)', height:4, cursor:'pointer' }} />
        <span style={{ fontSize:11 }}>🐇</span>
        <span className="phon" style={{ fontSize:11, color:'var(--gold)', minWidth:32 }}>{speed.toFixed(2)}x</span>
        <span style={{ fontSize:11, color:'var(--muted)', marginLeft:4 }}>{pct}%</span>
      </div>

      {/* Progress bar */}
      <div style={{ height:3, background:'var(--surface2)', borderRadius:2, marginBottom:14 }}>
        <div style={{ height:'100%', width:`${pct}%`, background:'var(--gold)', borderRadius:2, transition:'width 0.4s' }} />
      </div>

      {/* Conversation lines */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', gap:8, overflowY:'auto' }}>
        {lines.map((l, i) => {
          const isA = l.speaker === 'M'
          const isCurrent = i === lineIdx && playing
          const isPast = i < lineIdx
          return (
            <div key={i} style={{ display:'flex', flexDirection: isA ? 'row' : 'row-reverse', gap:8, opacity: isPast ? 0.45 : isCurrent ? 1 : 0.75 }}>
              <div style={{ width:30, height:30, borderRadius:'50%', background: isA ? '#1e3a5f' : '#2a1e3a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:15, flexShrink:0, marginTop:4, border: isCurrent ? `2px solid ${isA ? '#4a90e2' : '#c084fc'}` : '2px solid transparent', transition:'border 0.2s' }}>
                {isA ? '👨' : '👩'}
              </div>
              <div style={{ maxWidth:'78%', background: isCurrent ? (isA ? '#0a1a2e' : '#1a0a2e') : 'var(--surface)', border:`1px solid ${isCurrent ? (isA ? '#4a90e2' : '#c084fc') : 'var(--border)'}`, borderRadius:12, padding:'10px 12px', transition:'all 0.2s' }}>
                <p className="thai" style={{ fontSize:20, color: isCurrent ? 'var(--text)' : '#8899aa', marginBottom:3 }}>{l.thai}</p>
                <p className="phon" style={{ fontSize:13, color:'var(--gold)', marginBottom:2 }}>{l.phonetic}</p>
                <p style={{ fontSize:12, color:'#c8d8f0', fontStyle:'italic' }}>{l.english}</p>
              </div>
            </div>
          )
        })}
      </div>
    </div>
  )
}

function TrackQuality({ track }) {
  const tp = (track.pairs || []).length
  const fb = (track.pairs || []).filter(p => (p.prompt || '').length < 10).length
  const sc = Math.max(0, Math.round(((tp - fb * 2) / Math.max(tp, 1)) * 100))
  const cc = sc >= 85 ? '#10b981' : sc >= 65 ? '#f59e0b' : '#ef4444'
  return (
    <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:10, padding:'10px 14px', display:'flex', gap:12, alignItems:'center' }}>
      <span style={{ fontSize:22, fontWeight:800, color:cc }}>{sc}%</span>
      <div style={{ flex:1, fontSize:12, color:'var(--muted)' }}>
        <div style={{ color:'var(--text)', fontWeight:600, marginBottom:2 }}>Track Quality</div>
        <div>{tp} pairs · {fb > 0 ? '⚠️ ' + fb + ' fallbacks' : '✅ all clean'}</div>
      </div>
    </div>
  )
}


function Generator({ vocab, mode, onGenerated, onBack, apiKey, provider, orKey, onPhonetics, customTargets, orBalance, onBalanceRefresh }) {

  const [pairsTotal, setPairsTotal] = useState(90)
  const [targetPhonetics, setTargetPhonetics] = useState({})
  const [phase, setPhase] = useState('starting') // starting | streaming | done | error
  const [convoLines, setConvoLines] = useState(null)
  const [showConvo, setShowConvo] = useState(false)
  const [convoLoading, setConvoLoading] = useState(false)

  const [convoSpeed, setConvoSpeed] = useState(() => { try { return parseFloat(localStorage.getItem('tt-speed') || '0.8') } catch { return 0.8 } })
  const [generatedTrack, setGeneratedTrack] = useState(null)
  const phoneticsRef = useRef({})
  const { targets, anchors } = useMemo(() => {
    if (customTargets && customTargets.length) {
      const targetIds = new Set(customTargets.map(w => w.id))
      const anch = vocab.filter(w => (w.status === 'known' || w.status === 'learning') && !targetIds.has(w.id))
        .sort((a, b) => (!a.lastSeen ? -1 : !b.lastSeen ? 1 : a.lastSeen.localeCompare(b.lastSeen)))
        .slice(0, 25)
      return { targets: customTargets, anchors: anch }
    }
    return pickWords(vocab, mode)
  }, [vocab, mode, customTargets])

  const isWeak = mode === 'weak'
  const color = isWeak ? '#ef4444' : '#10b981'
  const pct = Math.min(100, Math.round((pairsDone / 90) * 100))

  // Latest pair preview from stream
  const [latestPair, setLatestPair] = useState(null)

  useEffect(() => {
    async function build() {
      // Snapshot balance before generation so we can show cost after
      const balanceBefore = orBalance
      try {
        let pairs
        if (apiKey) {
          setPhase('streaming')
          // Seed phoneticsRef from vocab words that already have phonetics stored
          const vocabPhonetics = {}
          for (const t of targets) { if (t.phonetic) { vocabPhonetics[t.id] = t.phonetic; vocabPhonetics[t.thai] = t.phonetic } }
          phoneticsRef.current = vocabPhonetics
          if (Object.keys(vocabPhonetics).length) setTargetPhonetics({ ...vocabPhonetics })
          // Only fetch phonetics for words still missing them
          const needsPhonetics = targets.filter(t => !t.phonetic)
          if (needsPhonetics.length > 0) {
            const doPhonetics = async () => {
              let map = {}
              // Use selected provider's key for phonetics
              if (orKey) map = await fetchTargetPhoneticsQwen(needsPhonetics, orKey || apiKey)
              else if (provider === 'deepseek') map = await fetchTargetPhoneticsDeepSeek(needsPhonetics, apiKey)
              else map = await fetchTargetPhonetics(needsPhonetics, apiKey)
              if (Object.keys(map).length) {

                setTargetPhonetics({ ...phoneticsRef.current })
                onPhonetics && onPhonetics(map) // save new ones back to vocab
              }
            }
            doPhonetics().catch(() => {})
          }

          pairs = await generateTrack(targets, anchors, apiKey,
            (done, total, meta, sources, wordIdx) => {

              setPairsTotal(targets.length * 3)
              if (sources && wordIdx !== undefined) setBrickSources(prev => {
                const next = {...prev}

                for (let si = 0; si < 3; si++) next[base + si] = srcArr[si] || ''
                return next

              if (lastSrc) {
                const tierName = lastSrc.startsWith('gpt-recheck2:') || lastSrc.startsWith('recheck2:') ? '🟢 Qwen second check'

                  : source.startsWith('fallback:') ? '⬛ Generic fallback (all AI calls failed)'
                  : '🟡 Unknown'
                setCurrentTier(tierName)

            },
            vocab, provider === 'haiku' ? 'anthropic/claude-haiku-4-5' : 'qwen/qwen3-32b')
          }
        // Use pre-call phonetics (phoneticsRef) — reliable, per-word accurate

        if (onPhonetics && Object.keys(phoneticsRef.current).length) {
