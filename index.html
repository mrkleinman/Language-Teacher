  {"id": "abs-ub-s1-05", "num": 5, "season": 4, "series": "Upper Beginner", "title": "Solve your Financial Woes with the", "situation": "Solving money problems at a Thai ATM.", "coreConceptIds": ["ub_so_therefore"], "keyPattern": {"thai": "clause + ก็เลย + result", "phonetic": "clause + gâaw looei + result", "english": "So/therefore result"}, "teacherExplanation": "clause + ก็เลย + result (clause + gâaw looei + result) — So/therefore result", "dialogue": [{"gender": "female", "thai": "ว่างค่ะ, มีอะไรให้ช่วยคะ . เจ้าของบริษัท พี กําลังคิดๆอยู่ว่าอยากจะบูชากุมารทองน่ะจ้ะ เพราะเห็นว่าทัวร์เรากําลังไปได้ดี ก็เลยอยากจะชวนน้องพลอยไปซือของไหว้ด้วยกันน่ะค่ะ", "phonetic": "wâang khâ. mii à-rai hâi chûuai khá.", "english": "I'm free. Is there something you need help with?"}, {"gender": "female", "thai": "อ๋อ...ได้สิคะ, งันพลอยจะรีบสะสางงานให้เสร็จก่อนเวลาออฟฟิศปิดเลยค่ะ . เจ้าของบริษัท แหม ขอบใจมากเลยจ้ะ", "phonetic": "ǎaw...dâai sì khâ. ngán phlaawy jà rîip sà-sǎang ngaan hâi sèt gàawn wee-laa áawp-fít bpìt looei khâ.", "english": "Ah...I can do that. Well then, I'll hurry to clear up my work before the office closing time. UPPER BEGINNER S1 #5 - SOLVE YOUR FINANCIAL WOES WITH THE HELP OF A THAI GHOST 3"}], "vocab": [{"thai": "ออฟฟิศ", "phonetic": "áawp-fít", "english": "office"}, {"thai": "กุมารทอง", "phonetic": "gù-maan thaawng", "english": "the name of a child"}, {"thai": "รีบ", "phonetic": "rîip", "english": "to hurry"}, {"thai": "ชวน", "phonetic": "chuuan", "english": "to invite"}, {"thai": "บูชา", "phonetic": "buu-chaa", "english": "to worship, to honor,"}, {"thai": "ว่าง", "phonetic": "wâang", "english": "free, vacant"}, {"thai": "เลิก", "phonetic": "lôoek", "english": "to quit, to cease"}], "samples": [{"thai": "เย็นนี้หลังเลิกงานวางไหม", "phonetic": "", "english": "I come to the office before eight in the \nmorning every day."}], "cultural": "กุมารทอง (gù-maan thaawng), or \"Kuman Thong,\" translates as \"golden boy.\" He is a child spirit or the ghost of a young boy. In his statue images, he appears as a young boy, bare chested, with his hair up in a topknot. He holds a bag of gold in his left hand and makes the beckoning gesture with his right hand, similar to นางกวัก (naang-gwàk), meaning \"the lady who beckons.\" It is believed Kuman Thong can bring you prosperity if you keep his image ", "practicePrompts": []},
  {"id": "abs-ub-s1-06", "num": 6, "season": 4, "series": "Upper Beginner", "title": "Take your Friends to the Thai", "situation": "Taking friends to the flower festival.", "coreConceptIds": ["ub_take_someone"], "keyPattern": {"thai": "พา + person + ไป + place", "phonetic": "phaa + person + bpai + place", "english": "Take person to place"}, "teacherExplanation": "พา + person + ไป + place (phaa + person + bpai + place) — Take person to place", "dialogue": [{"gender": "female", "thai": "จะพาลูกทัวร์ไปงานไม้ดอกทีเชียงใหม่เมือไหร่คะ", "phonetic": "jà phaa lûuk-thuua bpai ngaan-máai-dàawk thîi chiiang-mài mûuea- rài khá.", "english": "When are you taking the tour group to the Chiang Mai Flower Festival?"}, {"gender": "male", "thai": "อาทิตย์หน้าครับ, ตอนเช้าพาไปดูขบวนแห่ในเมือง ตอนเย็นพาไปซือของฝากทีตลาดไนท์บาร์ซ่าครับ", "phonetic": "MÁK-KHÚ-THÊET: aa-thít nâa khráp. dtaawn-cháao phaa bpai duu khà-buuan-hàae nai muueang. dtaawn-yen phaa bpai súue khǎawng-fàak thîi dtà- làat nai-baa-sâa khráp.", "english": "Next week. In the morning, I'm taking them to see the parade in the city. In the evening, I'm taking them to buy souvenirs at the Night Bazaar."}, {"gender": "female", "thai": "อยากไปด้วยจัง", "phonetic": "yàak bpai dûuai jang.", "english": "I really want to go too."}, {"gender": "male", "thai": "เอาไว้คุณพลอยพักร้อนเมือไหร่ ผมจะพาเทียวเอง จะไปรับไปส่งถึงทีพักเลยครับ", "phonetic": "MÁK-KHÚ-THÊET: ao-wái khun phlaawy phák-ráawn mûuea-rài. phǒm jà phaa thîiao eeng. jà bpai ráp bpai sòng thǔeng thîi-phák looei khráp.", "english": "Save it for when you have a vacation. I'll take you traveling myself. I'll pick you up and drop you off right at your accommodation."}, {"gender": "female", "thai": "อย่าล้อเล่นนะคะ, พลอยอยากไปจริงๆ", "phonetic": "yàa láaw-lên ná khá. phlaawy yàak bpai jing-jing.", "english": "Don't kid around! I want to go for real."}], "vocab": [{"thai": "พักร้อน", "phonetic": "phák-ráawn", "english": "to have a vacation"}, {"thai": "เอาไว้", "phonetic": "ao-wái", "english": "to keep"}, {"thai": "ขบวนแห่", "phonetic": "khà-buuan-hàae", "english": "parade"}, {"thai": "งานไม้ดอก", "phonetic": "ngaan-máai-dàawk", "english": "flower festival"}, {"thai": "ส่ง", "phonetic": "sòng", "english": "to send"}, {"thai": "รับ", "phonetic": "ráp", "english": "to receive"}, {"thai": "พา", "phonetic": "phaa", "english": "to take, to lead, to"}, {"thai": "เมือง", "phonetic": "muueang", "english": "city"}], "samples": [{"thai": "เอาไว้ในตู้เย็นสิครับ", "phonetic": "", "english": "I haven't taken a vacation yet this year."}, {"thai": "ไปดูขบวนแห่กันไหมคะ", "phonetic": "", "english": "Keep it in the refrigerator."}, {"thai": "จะพาลูกทัวรไปงานไมดอกที่เชียงใหมเมื่อไหรคะ", "phonetic": "", "english": "Shall we go watch the parade together?"}, {"thai": "เมื่อไหรจะพาลูกทัวรไปงานไมดอกที่เชียงใหมคะ", "phonetic": "", "english": "If you want to see the flower festival, you \nneed to come to Chiang Mai in February."}], "cultural": "The Chiang Mai Flower Festival is held each year on the first weekend of February. It is a nice time of year with mild weather in North Thailand. Around town, many flowers are blooming at this time such as chrysanthemums and dendrobium orchids. The focus of the festival is at Suan Buak Haad public park inside the southwest corner of the moat. The highlight of the festival is a parade of floats decorated with flowers. In a similar fashion to the T", "practicePrompts": []},
  {"id": "abs-ub-s1-07", "num": 7, "season": 4, "series": "Upper Beginner", "title": "Which Thai City is Full of Beautiful", "situation": "Discussing a city full of beautiful women.", "coreConceptIds": ["ub_full_of"], "keyPattern": {"thai": "noun + เต็มไปด้วย + noun2", "phonetic": "noun + dtem bpai dûuai + noun2", "english": "Noun is full of noun2"}, "teacherExplanation": "noun + เต็มไปด้วย + noun2 (noun + dtem bpai dûuai + noun2) — Noun is full of noun2", "dialogue": [{"gender": "female", "thai": "พลอยได้ยินว่า สาวทีเชียงใหม่สวยๆกันทังนัน", "phonetic": "phlaawy dâi-yin wâa sǎao thîi chiiang-mài sǔuai-sǔuai gan tháng- nán.", "english": "I heard that all the ladies in Chiang Mai are beautiful."}, {"gender": "male", "thai": "น่าจะใช่นะครับ, เห็นมีประกวดนางงามเมือไหร่ จะต้องมีนางงามจากเชียงใหม่เข้ารอบสุดท้ายตลอด", "phonetic": "MÁK-KHÚ-THÊET: nâa jà châi ná khráp. hěn mii bpra-gùuat-naang-ngaam mûuea-rài jà dtâwng mii naang-ngaam jàak chiiang-mài khâo-râawp-sùt-tháai dtà-làawt.", "english": "That could be. Whenever I've seen a beauty pageant, there's always a beauty queen from Chiang Mai as a finalist."}, {"gender": "female", "thai": "เพราะอย่างนี ไกด์จึงแย่งกันลงชือจนเต็มทัวร์เชียงใหม่", "phonetic": "phráw yàang-níi gai jueng yâaeng gan long-chûue jon dtem thuua chiiang-mài.", "english": "It's because of this that guides rush to sign up until the Chiang Mai tours are full."}, {"gender": "male", "thai": "แต่สําหรับผม ชอบอากาศทีเย็นสบาย ในเมืองก็เต็มไปด้วยวัดเก่าๆสวยๆ", "phonetic": "MÁK-KHÚ-THÊET: dtàae sǎm-ràp phǒm châawp aa-gàat thîi yen sà-baai. nai muueang gâaw dtem-bpai-dûuai wát gào-gào sǔuai-sǔuai.", "english": "But as for me, I like the cool, comfortable weather. The city is also filled with beautiful ancient temples."}, {"gender": "female", "thai": "แหม พลอยนึกว่าเต็มไปด้วยสาวๆสวยๆ", "phonetic": "mǎae. phlaawy núek wâa dtem-bpai-dûuai sǎao-sǎao sǔuai-sǔuai.", "english": "Oh! I think it's because it's filled with beautiful ladies!"}], "vocab": [{"thai": "เก่า", "phonetic": "gào", "english": "old, ancient"}, {"thai": "แย่ง", "phonetic": "yâaeng", "english": "to catch, to grab"}, {"thai": "เต็ม", "phonetic": "dtem", "english": "to be full, to be filled"}, {"thai": "เข้ารอบ", "phonetic": "khâo-râawp", "english": "to pass, to be"}, {"thai": "นางงาม", "phonetic": "naang-ngaam", "english": "beauty queen"}, {"thai": "ประกวดนางงาม", "phonetic": "bpra-gùuat-naang-", "english": "ngaam"}, {"thai": "สุดท้าย", "phonetic": "sùt-tháai", "english": "last"}, {"thai": "ทังนัน", "phonetic": "tháng-nán", "english": "all of it"}], "samples": [{"thai": "คุณมีแผนสําหรับพรุ่งนีไหม", "phonetic": "", "english": "I met my ex-boyfriend by chance two days \nago."}], "cultural": "There are nearly 500 beauty pageants held per year throughout Thailand. In 1965, Apsara Hongsakul won Miss Universe. A Thai woman won the title again in 1988. This time, it was Pornthip Narkhirunkanok's turn to be crowned Miss Universe. The popularity of these two beauty queens helped fuel the rise in the sponsorship and participation of many beauty pageants. Almost every local province-level festival will have a beauty contest to go with it. Add", "practicePrompts": []},
  {"id": "abs-ub-s1-08", "num": 8, "season": 4, "series": "Upper Beginner", "title": "Ganesha is Loved Even Though he", "situation": "Talking about Ganesha worship.", "coreConceptIds": ["ub_even_though"], "keyPattern": {"thai": "ถึง/ทั้งที่ + clause + ก็ยัง + verb", "phonetic": "thûeng / tháng-thîi + clause + gâaw yang + verb", "english": "Even though clause, still verb"}, "teacherExplanation": "ถึง/ทั้งที่ + clause + ก็ยัง + verb (thûeng / tháng-thîi + clause + gâaw yang + verb) — Even though clause, still verb", "dialogue": [{"gender": "female", "thai": "ได้เลยค่ะ, พลอยเพิงวางหูจากลูกค้ารายสุดท้ายพอดี . เจ้าของบริษัท พีจะปรึกษาเรืองฮวงจุ้ยของบริษัทเราน่ะจ้ะ น้องพลอยว่าเราน่าจะหาพระพิฆเนศมาบูชาจะดีไหม", "phonetic": "dâai looei khâ. phlaawy phôeng waang-hǔu jàak lûuk-kháa raai sùt- tháai phaaw-dii", "english": "Go ahead. I just hung up the phone from the last customer."}, {"gender": "female", "thai": "ก็ดีเหมือนกันค่ะ, ถึงเราจะมีเทพอืนๆอยู่ แต่พระพิฆเนศก็สําคัญมากนะคะ . เจ้าของบริษัท แต่พีไม่รู้จะไปหาเช่าทีไหนดี ลองถามคุณพ่อน้องพลอยดูไหม", "phonetic": "gâaw dii mǔuean-gan khâ. thǔeng rao jà mii thêep ùuen-ùuen yùu dtàae phrá-phí-khá-nêet gâaw sǎm-khan mâak ná khá.", "english": "That would be good. Although we have other gods present, Ganesha is very important."}, {"gender": "female", "thai": "พลอยไม่แน่ใจค่ะ, ถึงพ่อจะชอบดูพระ แต่ก็ไม่เคยเห็นเช่ามาบูชาเลย", "phonetic": "phlaawy mâi nâae-jai khâ. thǔeng phâaw jà châawp duu phrá dtàae gâaw mâi khooei hěn châo maa buu-chaa looei.", "english": "I'm not sure. Even though my father likes to look at sacred images, I've never seen him get one to worship."}], "vocab": [{"thai": "เทพ", "phonetic": "thêep", "english": "god, angel"}, {"thai": "พระพิฆเนศ", "phonetic": "phrá-phí-khá-nêet", "english": "Ganesha"}, {"thai": "ฮวงจุ้ย", "phonetic": "huuang-jûi", "english": "feng shui"}, {"thai": "เพิง", "phonetic": "phôeng", "english": "just now"}, {"thai": "เช่า", "phonetic": "châo", "english": "to rent"}, {"thai": "รบกวน", "phonetic": "róp-guuan", "english": "to bother, to disturb"}, {"thai": "ลูกค้า", "phonetic": "lûuk-kháa", "english": "customer"}], "samples": [{"thai": "ลองถามคุณพอดูไหม", "phonetic": "", "english": "This here is a city of angels"}], "cultural": "Ganesha is the well-loved elephant-headed god of Hinduism. He is the son of the god Shiva and goddess Parvati. In Thai, he is known by the name พระพิฆเณศ (phrá-phí-khá-nêet), which comes from one of his Sanskrit names Vara-Vighnesha, meaning \"Lord of Obstacles.\" As the Lord of Obstacles, it is thought that worship of Ganesha will help remove obstacles to one's success. But he can also help his devotees by putting obstacles in place when not doing", "practicePrompts": []},
  {"id": "abs-ub-s1-09", "num": 9, "season": 4, "series": "Upper Beginner", "title": "Book a Tour of Angkor Wat in Thai", "situation": "Booking an Angkor Wat tour in Thai.", "coreConceptIds": ["ub_such_as"], "keyPattern": {"thai": "noun + เช่น + examples", "phonetic": "noun + chên + examples", "english": "noun, such as examples"}, "teacherExplanation": "noun + เช่น + examples (noun + chên + examples) — noun, such as examples", "dialogue": [{"gender": "female", "thai": "สวัสดีค่ะ, เชิญนังก่อนค่ะ", "phonetic": "sà-wàt-dii khâ. chooen nâng gàawn khâ.", "english": "Hello. Please have a seat."}, {"gender": "male", "thai": "ขอบคุณค่ะ, อยากทราบว่าทีนีมีทัวร์ไปปราสาทนครวัดไหมคะ", "phonetic": "LÛUK-KHÁA YǏNG: khàawp khun khâ. yàak sâap wâa thîi-nîi mii thuua bpai bpraa-sàat ná-khaawn wát mǎi khá.", "english": "Thank you. Do you have any tours to Angkor Wat?"}, {"gender": "female", "thai": "มีค่ะ, ส่วนในเมืองไทยก็มีปราสาทเขมรเช่น ปราสาทหินพิมาย ปราสาทหินพนมรุ้ง ปราสาทหินเมืองตํา เป็นต้นค่ะ", "phonetic": "mii khâ. sùuan nai muueang-thai gâaw mii bpraa-sàat khà-měen chên bpraa-sàat hǐn phí-maai bpraa-sàat hǐn phá-nom-rúng bpraa- sàat hǐn muueang-dtàm bpen-dtôn khâ.", "english": "Yes. And in Thailand, there are also Khmer ruins, such as Prasat Hin Phimai, Prasat Hin Phanom Rung, Prasat Hin Muang Tam, etc."}, {"gender": "male", "thai": "ถ้าไปนครวัดอย่างเดียวล่ะคะ", "phonetic": "LÛUK-KHÁA YǏNG: thâa bpai ná-khaawn wát yàang diiao lâ khá.", "english": "And if I just go to Angkor Wat only? UPPER BEGINNER S1 #9 - BOOK A TOUR OF ANGKOR WAT IN THAI 3"}, {"gender": "female", "thai": "เรารับจองตัวเครืองบินไปกลับในราคาพิเศษให้ค่ะ, พร้อมบริการรับส่งทีสนามบินฟรี", "phonetic": "rao ráp jaawng dtǔua khrûueang-bin bpai glàp nai raa-khaa phí- sèet hâi khâ. phráawn baaw-rí-gaan ráp sòng thîi sà-nǎam-bin frii.", "english": "We can reserve round-trip airplane tickets at a special price. It includes free pick-up and drop-off service at the airport."}, {"gender": "male", "thai": "ดีมากเลยค่ะ", "phonetic": "LÛUK-KHÁA YǏNG: dii maak looei khâ.", "english": "That's great!"}], "vocab": [{"thai": "เป็นต้น", "phonetic": "bpen-dtôn", "english": "etc."}, {"thai": "เช่น", "phonetic": "chên", "english": "for example, such as"}, {"thai": "พิเศษ", "phonetic": "phí-sèet", "english": "special, extraordinary"}, {"thai": "นครวัด", "phonetic": "ná-khaawn wát", "english": "Angkor Wat"}, {"thai": "ปราสาท", "phonetic": "bpraa-sàat", "english": "castle, stone temple"}, {"thai": "บริการ", "phonetic": "baaw-rí-gaan", "english": "service, to serve"}], "samples": [{"thai": "ผมชอบคุณเช่นกันครับ", "phonetic": "", "english": "He waited five hours in the airport."}, {"thai": "คุณเคยไปดูนครวัดไหมคะ", "phonetic": "", "english": "The plane ticket costs forty thousand \nbaht."}, {"thai": "อยากทราบวาที่นี่มีทัวรไปปราสาทนครวัดไหมคะ", "phonetic": "", "english": "I like fruits such as oranges, bananas, \nguavas, etc."}, {"thai": "ถาไปนครวัดอยางเดียวละคะ", "phonetic": "", "english": "I like you, too."}], "cultural": "Before there were any independent Thai kingdoms, much of the area of modern Thailand was controlled by the ancient Khmer empire centered at Angkor. The Khmer civilization is famous for its stone temple architecture, of which Angkor Wat is the largest and most well-known example. Many stone temples were also built in the area now part of Thailand between the ninth and thirteenth centuries CE. Of these, the two most impressive and complete are Phim", "practicePrompts": []},
  {"id": "abs-ub-s1-10", "num": 10, "season": 4, "series": "Upper Beginner", "title": "You Can't See Thai Hill Tribes from", "situation": "Visiting Thai hill tribes.", "coreConceptIds": ["ub_by_vehicle"], "keyPattern": {"thai": "นั่ง + vehicle / โดย + vehicle", "phonetic": "nâng + vehicle / dooi + vehicle", "english": "Travel by vehicle"}, "teacherExplanation": "นั่ง + vehicle / โดย + vehicle (nâng + vehicle / dooi + vehicle) — Travel by vehicle", "dialogue": [{"gender": "female", "thai": "สวัสดีค่ะ", "phonetic": "sà-wàt-dii khâ.", "english": "Hello."}, {"gender": "male", "thai": "สวัสดีครับ, ผมอยากพาครอบครัวไปแม่ฮ่องสอนครับ, ไม่รู้ว่าจะนังเครืองบิน หรือขับรถไปเองดี", "phonetic": "LÛUK-KHÁA sà-wàt-dii khráp. phǒm yàak phaa khràawp-khruua bpai mâae- hâwng-sǎawn khráp. mâi rúu wâa jà nâng khrûueang-bin rǔue khàp rót bpai eeng dii.", "english": "Hello. I want to take my family to Mae Hong Son. I don't know if flying or driving there myself is better."}, {"gender": "female", "thai": "จองตัวไปโดยสายการบินนกแอร์ได้ค่ะ, เร็วและสบายดี แต่ถ้าคุณอยากเห็นวิถีชีวิตของชาวเขาไปโดยรถยนต์จะสะดวกกว่า", "phonetic": "jaawng dtǔua bpai dooi sǎai gaan-bin nók aae dâai khâ. reo láe sà- baai dii. dtàae thâa khun yàak hěn wí-thǐi chíi-wít khǎawng chaao- khǎo bpai dooi rót-yon jà sà-dùuak gwàa.", "english": "You can reserve tickets to go by Nok Air. It's quick and comfortable. But if you want to see the lifestyle of hill tribes then going by car is more convenient."}, {"gender": "male", "thai": "จะได้เจอชาวเขาเผ่าอะไรบ้างครับ", "phonetic": "LÛUK-KHÁA jà dâai jooe chaao-khǎo phào à-rai bâang khráp.", "english": "What are some hill tribes we'll see? UPPER BEGINNER S1 #10 - YOU CAN'T SEE THAI HILL TRIBES FROM THE AIR! 3"}, {"gender": "female", "thai": "แม่ฮ่องสอนมีชาวเขาได้แก่ กะเหรียง มูเซอ แม้ว เป็นต้นค่ะ", "phonetic": "mâae-hâwng-sǎawn mii chaao-khǎo dâi-gàae gà-rìiang muu-sooe máaeo bpen-dtôn khâ.", "english": "Mae Hong Son has hill tribes such as Karen, Lahu, Hmong, etc."}, {"gender": "male", "thai": "น่าสนใจ งั-นผมคิดว่านังรถตู้หรือขับรถไปเองดีกว่า", "phonetic": "LÛUK-KHÁA nâa-sǒn-jai. ngán phǒm khít wâa nâng rót-dtûu rǔue khàp rót bpai eeng dii gwàa.", "english": "That's interesting. Well then, I think it will be better to go by van or to drive myself."}], "vocab": [{"thai": "สะดวก", "phonetic": "sà-dùuak", "english": "to be convenient,"}, {"thai": "การบิน", "phonetic": "gaan-bin", "english": "airline"}, {"thai": "โดย", "phonetic": "dooi", "english": "by, due to"}, {"thai": "รถยนต์", "phonetic": "rót-yon", "english": "car"}, {"thai": "เครืองบิน", "phonetic": "khrûueang-bin", "english": "airplane"}, {"thai": "ครอบครัว", "phonetic": "khrâawp-khruua", "english": "family"}], "samples": [{"thai": "จะไดเจอชาวเขาเผาอะไรบางครับ", "phonetic": "", "english": "America has very convenient \ntransportation."}], "cultural": "Hill tribes are ethnic minorities living in mountainous areas of Thailand's north. Most of the hill tribe groups migrated from Tibet, Burma, China and Laos within the last 200 years. The total population of hill tribe peoples is over half million, divided among about 20 different tribes. The six largest tribes are the Akha, Hmong, Lisu, Lahu, Yao, and Karen. Each tribe has its own language, and can be identified by distinct traditional costumes. ", "practicePrompts": []},
  {"id": "abs-ub-s1-11", "num": 11, "season": 4, "series": "Upper Beginner", "title": "Don't get Car-sick on the Way to", "situation": "Avoiding car sickness on a mountain road.", "coreConceptIds": ["ub_on_the_way"], "keyPattern": {"thai": "ทางไป + place", "phonetic": "thaang bpai + place", "english": "On the way to place"}, "teacherExplanation": "ทางไป + place (thaang bpai + place) — On the way to place", "dialogue": [{"gender": "female", "thai": "ทางไปแม่ฮ่องสอนเป็นถนนคดเคียวไปมาตลอดเส้นทางเลยค่ะ, พอถึงตัวเมืองก็มืดคํ าแล้ว", "phonetic": "thaang bpai mâae-hâwng-sǎawn bpen thà-nǒn khòt-khíiao bpai maa dtà-làawt thaang looei khâ. phaaw thǔeng dtuua-muueang gâaw mûuet-khâm láaeo.", "english": "On the way to Mae Hong Son, the road is twisting the whole way. By the time you reach downtown, it will already be nightfall."}, {"gender": "male", "thai": "แล้วทางไปชมกะเหรี ยงคอยาวล่ะครับ", "phonetic": "LÛUK-KHÁA láaeo thaang bpai chom gà-rìiang khaaw yaao lâ khráp.", "english": "And what about the way to see the Long-Necked Karen?"}, {"gender": "female", "thai": "ไม่ไกลจากตัวเมืองเลยค่ะ, เราก็เลยจัดทัวร์ล่องแพ นั งช้าง ซึ งลูกค้าจะชอบมากค่ะ, เพราะตามทางเต็มไปด้วยธรรมชาติที สวยงาม", "phonetic": "mâi glai jàak dtuua-muueang looei khâ. rao gâaw looei jàt tuua lâwng phaae nâng cháang sûeng lûuk-kháa jà châawp mâak khâ. phráw dtaam thaang dtem-bpai-dûuai tham-má-châat thîi sǔuai- ngaam.", "english": "It's not far from downtown at all. We also organize a tour of rafting and elephant riding, which customers really like because the journey is full of beautiful natural surroundings."}, {"gender": "male", "thai": "น่าสนุกนะครับ, ผมขอจองทัวร์นีเลยก็แล้วกัน", "phonetic": "LÛUK-KHÁA nâa sà-nùk ná khráp. phǒm khǎaw jaawng thuua níi looei gâaw láaeo gan.", "english": "Sounds like fun! I'll go ahead and book this tour."}], "vocab": [{"thai": "ธรรมชาติ", "phonetic": "tham-má-châat", "english": "nature"}, {"thai": "แพ", "phonetic": "phaae", "english": "raft"}, {"thai": "จัด", "phonetic": "jàt", "english": "to arrange, to"}, {"thai": "กะเหรี ยงคอยาว", "phonetic": "gà-rìian khaaw yaao", "english": "long-necked Karen"}, {"thai": "มืดคํ า", "phonetic": "mûuet-khâm", "english": "nightfall"}, {"thai": "ตัวเมือง", "phonetic": "dtuua-muueang", "english": "city, downtown"}, {"thai": "ทาง", "phonetic": "thaang", "english": "way, path"}, {"thai": "เส้นทาง", "phonetic": "sên-thaang", "english": "route, path"}, {"thai": "คดเคียว", "phonetic": "khòt-khíiao", "english": "to twist, to curve"}, {"thai": "ล่อง", "phonetic": "lâwng", "english": "to drift, to float"}], "samples": [{"thai": "ทุกท่าน เชิญทางนีค่ะ", "phonetic": "", "english": "People should not destroy nature."}], "cultural": "The Padaung are a subgroup of the Karen hill tribe. They call themselves Kayan. While in Thai they are known as กะเหรี่ยงคอยาว (gà-rìiang khaaw yaao), or \"long-necked Karen.\" They mostly live in Myanmar; however, a small number migrated to Northern Thailand very recently due to pressure put on them by the Burmese military government. The Padaung women are famous for the brass coils they wear around their neck. They can have between five and twent", "practicePrompts": []},
  {"id": "abs-ub-s1-12", "num": 12, "season": 4, "series": "Upper Beginner", "title": "Whatever Thai Festival You Want to", "situation": "Whatever Thai festival you want to see.", "coreConceptIds": ["ub_depends_on"], "keyPattern": {"thai": "แล้วแต่ + noun/clause", "phonetic": "láaeo dtàae + noun", "english": "Depends on noun"}, "teacherExplanation": "แล้วแต่ + noun/clause (láaeo dtàae + noun) — Depends on noun", "dialogue": [{"gender": "male", "thai": "ผมอาจจะพาเพือนๆไปแม่ฮ่องสอนช่วงปิดเทอมนี จะมีกิจกรรมอะไรทีน่าสนใจบ้างครับ", "phonetic": "LÛUK-KHÁA phǒm àat-jà phaa phûuean-phûuean bpai mâae-hâwng-sǎawn chûuang bpìt thooem níi. jà mii gìt-jà-gam à-rai thîi nâa-sǒn-jai bâang khráp.", "english": "I might take my friends to Mae Hong Son during the school holidays. What interesting activities will there be?"}, {"gender": "female", "thai": "มีหลายแบบให้เลือกค่ะ, แล้วแต่คุณจะชอบ อย่างเช่นทัวร์เดินป่าเพือไปเยียมชมหมู่บ้านชาวเขา ก็กําลังเป็นทีนิยมค่ะ", "phonetic": "mii lǎai bàaep hâi lûueak khâ. láaeo dtàae khun jà châawp. yàang- chên thuua dooen bpàa phûuea bpai yîiam chom mùu-bâan chaao- khǎo gâaw gam-lang bpen thîi ní-yom khâ.", "english": "There are many kinds to choose from. It depends on what you like. For example, trekking tours to visit hill tribe villages are popular now."}, {"gender": "male", "thai": "พอดีพวกเราอยากไปดูงานประเพณีของทีนันด้วยครับ", "phonetic": "LÛUK-KHÁA phaaw-dii phûuak-rao yàak bpai duu ngaan bprà-phee-nii khǎawng thîi-nân dûuai khráp", "english": "OK, we want to go see a traditional festival there also. UPPER BEGINNER S1 #12 - WHATEVER THAI FESTIVAL YOU WANT TO SEE IS UP TO YOU 3"}, {"gender": "female", "thai": "แล้วแต่วันเดินทางนะคะ, ถ้าไปทันช่วงกลางเดือนมีนาคม ก็จะมีงานปอยส่างลองให้ชมกันค่ะ", "phonetic": "láaeo dtàae wan dooen-thaang ná khá. thâa bpai than chûuang glaang duuean mii-naa-khom gâaw jà mii ngaan bpaawy-sàang- laawng hâi chom gan khâ.", "english": "That depends on the day you travel. If you can go in time for the middle of March, there is the Poi Sang Long festival to see."}, {"gender": "male", "thai": "งานปอยส่างลองคืออะไรครับ", "phonetic": "LÛUK-KHÁA ngaan bpaawy-sàang-laawng khuue à-rai khráp.", "english": "What is the Poi Sang Long festival?"}, {"gender": "female", "thai": "เป็นประเพณีของชาวไทยใหญ่เกียวกับการบวชเณร สนุกจริงๆค่ะ", "phonetic": "bpen bprà-phee-nii khǎawng chaao-thai-yài gìiao-gàp gaan-bùuat- neen. sà-nùk jing-jing khâ.", "english": "It's a tradition of the Shan people regarding the ceremony for ordaining novice monks. It's really fun."}], "vocab": [{"thai": "การบวชเณร", "phonetic": "gaan-bùuat-neen", "english": "novice monk"}, {"thai": "ชาวไทยใหญ่", "phonetic": "chaao thai-yàai", "english": "Shan people"}, {"thai": "หมู่บ้าน", "phonetic": "mùu-bâan", "english": "village, housing"}, {"thai": "เยียม", "phonetic": "yîiam", "english": "to visit"}, {"thai": "เดินป่า", "phonetic": "dooen bpàa", "english": "to walk in the forest"}, {"thai": "กิจกรรม", "phonetic": "gìt-jà-gam", "english": "activity"}, {"thai": "ประเพณี", "phonetic": "bprà-phee-nii", "english": "tradition, custom"}, {"thai": "ปิดเทอม", "phonetic": "bpìt thooem", "english": "end of semester,"}, {"thai": "ช่วง", "phonetic": "chûuang", "english": "period, section,"}, {"thai": "ชม", "phonetic": "chom", "english": "to look at, to admire"}], "samples": [{"thai": "คุณจะไปเทียวทีไหนช่วงปิดเทอมคะ", "phonetic": "", "english": "The majority of the people in Mae Hong \nSon are Shan."}], "cultural": "ประเพณีปอยสางลอง (bprà-phee-nii bpaawy-sàang-laawng), or the \"Poi Sang Long Festival,\" is a tradition among the Shan people. The Shan speak a dialect related to Thai. They live mostly in Shan State of Myanmar and also in some parts of Northern Thailand, in particular Mae Hong Son province. Poi Sang Long is a celebration of novice monk ordination lasting three days, usually in March. The participants are boys between the ages of seven and thirtee", "practicePrompts": []},
  {"id": "abs-ub-s1-13", "num": 13, "season": 4, "series": "Upper Beginner", "title": "I Can Fit Only 200 Shirts in my Thai", "situation": "Fitting many shirts into a Thai apartment.", "coreConceptIds": ["ub_only_as_many"], "keyPattern": {"thai": "แค่ + number/noun", "phonetic": "khâae + number", "english": "Only/just number"}, "teacherExplanation": "แค่ + number/noun (khâae + number) — Only/just number", "dialogue": [{"gender": "female", "thai": "ใช่ค่ะ, ห้องเล็กไปหน่อย แค่เสือผ้าก็เต็มห้อง จนไม่มีทีจะเก็บแล้วค่ะ . เจ้าของบริษัท แล้วน้องคิดว่ามีเสือกีตัวจ๊ะ", "phonetic": "châi khâi. hâwng lèk bpai nàwy. kâae sûuea-phâa gâaw dtem hâwng. jon mâi mii thîi jà gèp láaeo khâ.", "english": "That's right. My room is a bit too small. Just my clothing fills the room until there is nowhere to put anything. UPPER BEGINNER S1 #13 - I CAN FIT ONLY 200 SHIRTS IN MY THAI APARTMENT 3"}, {"gender": "female", "thai": "ก็ไม่เยอะมาก แค่ ตัวค่ะ . เจ้าของบริษัท มีเสือตัง ตัว แล้วไปดูไว้บ้างหรือยัง", "phonetic": "gâaw mâi yóe mâak. kâae sǎawng ráawy dtuua khâ. CONT'D OVER UPPER BEGINNER S1 #13 - I CAN FIT ONLY 200 SHIRTS IN MY THAI APARTMENT 4", "english": "Well, not a whole lot. Only 200."}, {"gender": "female", "thai": "กําลังจะไปดูบ้านเช่าค่ะ, ขอแค่บ้านชันเดียว และไม่ไกลจากทีทํางานแค่นันก็พอ . เจ้าของบริษัท พีเห็นมีบ้านเช่าใกล้ๆกับบ้านพี ไม่แพงด้วย แค่ -., บาท", "phonetic": "gam-lang jà bpai duu bâan châo khâ. khǎaw khâe bâan chán diiao láe mâi glai jàak thîi-tham-ngaan khâae nán gâaw phaaw.", "english": "I'm going to go look at rental houses. I just ask for a single-story house, not far from work. Just that is enough."}, {"gender": "female", "thai": "ตัง -., บาท พีจะให้เงินเดือนเพิมขึนเหรอคะ", "phonetic": "dtâng mùuen hâa phan bàat. phîi jà hâi ngoen-duuean phôoem khûen rǒoe khá.", "english": "15,000 baht! Are you going to give me a raise?"}], "vocab": [{"thai": "เงินเดือน", "phonetic": "ngoen-duuean", "english": "salary"}, {"thai": "เดียว", "phonetic": "diiao", "english": "only, single"}, {"thai": "ตัง", "phonetic": "dtâng", "english": "up to, as much as"}, {"thai": "ย้าย", "phonetic": "yáai", "english": "to move, to transfer"}, {"thai": "เพิม", "phonetic": "phôoem", "english": "to increase, to grow"}, {"thai": "ชัน", "phonetic": "chán", "english": "floor, level, layer"}, {"thai": "แค่", "phonetic": "khâae", "english": "just"}, {"thai": "เช่า", "phonetic": "châo", "english": "to rent"}, {"thai": "เสือผ้า", "phonetic": "sûuea-phâa", "english": "clothing"}, {"thai": "ห้อง", "phonetic": "hâwng", "english": "room"}], "samples": [{"thai": "ดิฉันแค่กําลังคิดอยู่ค่ะ", "phonetic": "", "english": "Teacher Lek gets a monthly salary of \neight thousand baht."}, {"thai": "พี่จะใหเงินเดือนเพิมขึ้นเหรอคะ -", "phonetic": "", "english": "Thailand is the sole country in Southeast \nAsia that has never been a colony of \nanother country."}], "cultural": "The majority of Thai apartments are one single room with an attached bathroom. The average size of a one-room apartment is between twenty-four and thirty square meters. There is almost always a small balcony too. Unlike apartments in other countries, Thai apartments do not usually have a kitchen or any cooking facilities. Most people who live in small apartments get their meals outside in restaurants or pick up take-home food from the market. Oth", "practicePrompts": []},
  {"id": "abs-ub-s1-14", "num": 14, "season": 4, "series": "Upper Beginner", "title": "About How Big is a Thai-Style", "situation": "Discussing Thai house sizes.", "coreConceptIds": ["ub_approximately"], "keyPattern": {"thai": "ประมาณ + number/noun", "phonetic": "bprà-maan + number", "english": "About/approximately number"}, "teacherExplanation": "ประมาณ + number/noun (bprà-maan + number) — About/approximately number", "dialogue": [{"gender": "female", "thai": "บ้านหลังนี เนือทีประมาณเท่าไหร่คะ . เจ้าของบ้านเช่า ประมาณ ตารางวา ค่ะ, น้องจะย้ายเข้าเมือไหร่คะ", "phonetic": "bâan lǎng níi núuea-thîi bprà-maan thâo-rài khá.", "english": "About how large is the area of this house?"}, {"gender": "female", "thai": "คงราวๆ อีกสองเดือนข้างหน้าค่ะ . เจ้าของบ้านเช่า พอดีมีคนมาดูไว้หลายราย ถ้าน้องตกลงเช่าก็ต้องขอมัดจําล่วงหน้าสองเดือนนะคะ", "phonetic": "khong raao-raao ìik sǎawng duuean khâang-nâa khâ.", "english": "Probably around two months from now."}], "vocab": [{"thai": "มัดจํา", "phonetic": "mát-jam", "english": "deposit, down"}, {"thai": "ตกลง", "phonetic": "dtòk-long", "english": "to agree"}, {"thai": "ราวๆ", "phonetic": "raao-raao", "english": "approximately,"}, {"thai": "วา", "phonetic": "waa", "english": "unit of length equal"}, {"thai": "ตาราง", "phonetic": "dtaa-raang", "english": "square"}, {"thai": "ประมาณ", "phonetic": "bprà-maan", "english": "about, around,"}, {"thai": "เนือที", "phonetic": "núuea-thîi", "english": "zone, space, area"}, {"thai": "ล่วงหน้า", "phonetic": "lûuang-nâa", "english": "in advance,"}], "samples": [{"thai": "มัดจําของห้องนีเท่าไหร่คะ", "phonetic": "", "english": "How much is the security deposit for this \nroom?"}], "cultural": "Traditional Thai houses were built of wood and raised about two meters off the ground on poles. The space under the house was used for storage, and the extra height was a precaution against flooding. The kitchen in a traditional Thai home is outside, either under the main living area or out in back. Bedding in a traditional Thai home is just unfolded and spread on the floor for sleeping, then folded back up in the morning. Dining is often done si", "practicePrompts": []},
  {"id": "abs-ub-s1-15", "num": 15, "season": 4, "series": "Upper Beginner", "title": "Thai Spirit Houses are Getting", "situation": "The growing popularity of spirit houses.", "coreConceptIds": ["ub_popular"], "keyPattern": {"thai": "นิยม + verb", "phonetic": "ní-yom + verb", "english": "Likes to/it's popular to verb"}, "teacherExplanation": "นิยม + verb (ní-yom + verb) — Likes to/it's popular to verb", "dialogue": [{"gender": "male", "thai": "ว่าไง น้องพลอย", "phonetic": "PHÉT: wâa ngai náawng phlaawy.", "english": "What's up, Ploy?"}, {"gender": "female", "thai": "พีเพชรค่ะ, ไปส่งพลอยซือของเข้าบ้านหน่อย", "phonetic": "phîi phét khâ. bpai sòng phlaawy súue khǎawng khâo bâan nàwy.", "english": "Pet, take me to buy stuff for moving into my house, please."}, {"gender": "male", "thai": "ได้สิ ของเยอะไหม จะได้เอากระบะไป", "phonetic": "PHÉT: dâai sì. khǎawng yóe mǎai. jà dâai ao grà-bà bpai.", "english": "Sure. Is it a lot of stuff? I can take my pick-up. UPPER BEGINNER S1 #15 - THAI SPIRIT HOUSES ARE GETTING POPULAR 3"}, {"gender": "female", "thai": "หลายอย่างเลยค่ะ, อยากได้ศาลพระภูมิแบบเรือนไทยเก่าๆด้วยสักหลัง", "phonetic": "lǎai yàang looei khâ. yàak dâai sǎan-phrá-phuum bàaep ruuean thai gào-gào dûuai sàk lǎng.", "english": "Yeah, many things. I also want to get a spirit house in the style of an old Thai house."}, {"gender": "male", "thai": "เชยจัง เดียวนีเขานิยมใช้แบบปูนกันแล้วจ้ะ ถูกกว่าเยอะ", "phonetic": "PHÉT: chooei jang. dǐiao-níi khǎo ní-yom chái bàaep bpuun gan láaeo jâ. thùuk gwàa yóe.", "english": "That's so old-fashioned! Now they like to use cement-style ones. They're a lot cheaper."}, {"gender": "female", "thai": "แล้วพวกของใช้ในบ้านล่ะคะ, ไปดูทีไหนดี", "phonetic": "láaeo phûuak khǎawng-chái nai bâan lâ khá. bpai duu thîi-nǎi dii. CONT'D OVER UPPER BEGINNER S1 #15 - THAI SPIRIT HOUSES ARE GETTING POPULAR 4", "english": "And for stuff to use in the house, where's a good place to look?"}, {"gender": "male", "thai": "เดียวนีเห็นคนนิยมเข้าห้างโลตัสกันเยอะเลย ของคงจะถูกกว่าทีอืนๆ", "phonetic": "PHÉT: dǐiao-níi hěn khon ní-yom khâo hâang loo-dtàt gan yóe looei. khǎawng khong jà thùuk gwàa thîi ùuen-ùuen.", "english": "These days, I see a lot of people who like going to the Lotus superstore. Stuff might be cheaper there than at other places."}], "vocab": [{"thai": "ปูน", "phonetic": "bpuun", "english": "mortar, lime, cement"}, {"thai": "เชย", "phonetic": "chooei", "english": "to be old-fashioned,"}, {"thai": "เรือน", "phonetic": "ruuean", "english": "house, dwelling"}, {"thai": "กระบะ", "phonetic": "grà-bà", "english": "pick-up truck"}, {"thai": "แบบ", "phonetic": "bàaep", "english": "style, design, model,"}, {"thai": "นิยม", "phonetic": "ní-yom", "english": "to admire, to love, to"}, {"thai": "ห้าง", "phonetic": "hâang", "english": "shopping mall,"}], "samples": [], "cultural": "Almost every house in Thailand will have a miniature spirit house somewhere on the property called ศาลพระภูมิ (sǎan-phrá-phuum). Sometimes there is one spirit house for a whole village or housing complex. The spirit house should be located where the shadow of the house will not land on it. The house is built for the spirit who is the owner or guardian of the land. You should consult an astrologer before setting up the spirit house. And you should", "practicePrompts": []},
  {"id": "abs-ub-s1-16", "num": 16, "season": 4, "series": "Upper Beginner", "title": "Make Sure you Compare Prices at", "situation": "Comparing prices at the market.", "coreConceptIds": ["ub_compare"], "keyPattern": {"thai": "noun + เมื่อเทียบกับ + noun2", "phonetic": "noun + mûuea thîiap gàp + noun2", "english": "Noun compared to noun2"}, "teacherExplanation": "noun + เมื่อเทียบกับ + noun2 (noun + mûuea thîiap gàp + noun2) — Noun compared to noun2", "dialogue": [{"gender": "male", "thai": "ซือแบบยกโหลไปเลยนะพลอย เทียบกับมาซือหลายๆครังทีละสองห่อมันจะไม่คุ้มค่านํา้ามันรถ", "phonetic": "PHÉT: súue bàaep yók lǒo bpai looei ná phlaaw. thîiap gàp maa súue lǎai- lǎai khráng thii lá sǎawng hàaw man jà mâi khúm khâa nám-man- rót.", "english": "Just pick up a whole dozen. Compare it to coming many times and buying only two packs each time, which won't be worth the cost of gas."}, {"gender": "female", "thai": "ทราบแล้วค่ะ, ซือทิชชู่เสร็จก็เหลือดูตู้เย็นอีกอย่างเดียว", "phonetic": "sâap láaeo khâ. súue thít-chûu sèt gâaw lǔuea duu dtûu-yen ìik yàang diiao.", "english": "I know. We bought the tissue; now the only thing left is looking for a refrigerator."}, {"gender": "male", "thai": "แต่พีว่า ไปดูทีร้านเครืองใช้ไฟฟ้าดีกว่า เมือเทียบราคากันแล้ว ทีนีอาจจะถูกกว่านิดหน่อย แต่ทีโน่นของจะมีประกันให้ด้วย", "phonetic": "PHÉT: dtàae phîi wâa bpai duu thîi ráan-khrûueang-chái-fai-fáa dii gwàa. mûuea thîiap raa-khaa gan láaeo thîi-nîi àat-jà thùuk gwàa nít- nàwy. dtàae thîi-nôon khǎawng jà mii bprà-gan hâi dûuai.", "english": "But I think it's better to look at an electrical appliance store. When you compare the price, it might be a little cheaper here, but over there, items have a guarantee too."}, {"gender": "female", "thai": "แล้วแต่พีเพชรก็แล้วกันค่ะ", "phonetic": "láaeo dtàae phîi phét gâaw láaeo gan khâ.", "english": "OK then, up to you, Pet."}], "vocab": [{"thai": "ประกัน", "phonetic": "bprà-gan", "english": "to guarantee, to"}, {"thai": "ร้านเครืองใช้ไฟฟ้า", "phonetic": "ráan-khrûueang-", "english": "chái-fai-fáa"}, {"thai": "ตู้เย็น", "phonetic": "dtûu-yen", "english": "refrigerator"}, {"thai": "นํามันรถ", "phonetic": "nám-man-rót", "english": "petrol, gasoline"}, {"thai": "ค่า", "phonetic": "khâa", "english": "value, price, fee"}, {"thai": "คุ้ม", "phonetic": "khúm", "english": "to be worthwhile"}, {"thai": "ห่อ", "phonetic": "hàaw", "english": "pack, to wrap"}, {"thai": "เทียบ", "phonetic": "thîiap", "english": "to compare with"}, {"thai": "ยก", "phonetic": "yók", "english": "to raise"}], "samples": [{"thai": "พีจะไปร้านเครืองใช้ไฟฟ้า ไปกันไหม", "phonetic": "", "english": "He guarantees the quality of the repairs."}, {"thai": "นีคือแหวนแต่งงานของดิฉันค่ะ", "phonetic": "", "english": "I'm going to the electronics shop. You \nwant to come with?"}, {"thai": "ถ้าอยากพูดอะไรขอให้ยกมือขึนค่ะ", "phonetic": "", "english": "A refrigerator with an automatic ice maker \nis becoming popular in Thailand."}], "cultural": "The Tesco Lotus superstore chain started up in 1998. It began as a joint venture between the British supermarket chain Tesco and a group of Thai investors. Tesco Lotus has many branches around Bangkok and in other Thai cities. About half the store is groceries, and the other half has clothing, stationery, hardware, electronics, bedding, health and beauty products, small furniture, etc. The building also usually includes a food court, bakery, and ", "practicePrompts": []},
  {"id": "abs-ub-s1-17", "num": 17, "season": 4, "series": "Upper Beginner", "title": "You Can Buy so Many Things for", "situation": "Buying many things cheaply in Thailand.", "coreConceptIds": ["ub_many_kinds"], "keyPattern": {"thai": "noun + หลายอย่าง", "phonetic": "noun + lǎai yàang", "english": "Many kinds of noun"}, "teacherExplanation": "noun + หลายอย่าง (noun + lǎai yàang) — Many kinds of noun", "dialogue": [{"gender": "female", "thai": "พลอยยังไม่มีเครืองครัวอีกตังหลายอย่างเลยค่ะ", "phonetic": "phlaawy yang mâi mii khrûueang-khruua ìik dtâng lǎai-yàang looei khâ. CONT'D OVER UPPER BEGINNER S1 #17 - YOU CAN BUY SO MANY THINGS FOR ONLY 19 THAI BAHT! 3", "english": "I still don't have many kitchen utensils at all."}, {"gender": "male", "thai": "ลองดูทีนีแหละ พวกจานชาม แก้วนํา และอะไรอีกหลายอย่างก็ ! บาทเอง", "phonetic": "PHÉT: laawng duu thîi-nîi làe, phûuak jaan-chaam gâaeo-náam láe à-rai ìik lǎai-yàang gâaw gâao-sìp bàat eeng.", "english": "Try right here. All the dishes, glasses, and many other things are only nineteen baht."}, {"gender": "female", "thai": "แต่ของมันวางไว้เยอะแยะมากมายไปหมด แบบก็ซําๆกันไปหมด", "phonetic": "dtàae khǎawng man waang wái yóe-yáe mâak-maai bpai mòt bàaep gâaw sám-sám gan bpai mòt.", "english": "But there are so many things laid out just repeating all the same kinds of stuff."}, {"gender": "male", "thai": "ก็แค่ของใช้ในบ้าน จะเอาอะไรมากมายจ๊ะ ขอแค่ใช้งานได้จริงก็พอแล้ว", "phonetic": "PHÉT: gâaw khâae khǎawng chái nai bâan. jà ao à-rai mâak-maai já. khǎaw khâae chái ngaan dâai jing gâaw phaaw láaeo.", "english": "Well, it's just items used in the house. Are you going to take so much? Just what you'll actually use is enough."}], "vocab": [{"thai": "ซําๆ", "phonetic": "sám-sám", "english": "repeatedly"}, {"thai": "เยอะแยะ", "phonetic": "yóe-yáe", "english": "many, much"}, {"thai": "แก้วนํา", "phonetic": "gâaeo-náam", "english": "glass, cup"}, {"thai": "จานชาม", "phonetic": "jaan-chaam", "english": "bowl, plate, dish"}, {"thai": "เครืองครัว", "phonetic": "khrûueang-khruua", "english": "kitchenware"}, {"thai": "มากมาย", "phonetic": "mâak-maai", "english": "many, much, a lot"}, {"thai": "ไว้", "phonetic": "wái", "english": "to keep"}, {"thai": "วาง", "phonetic": "waang", "english": "to put"}], "samples": [{"thai": "ช่วยเก็บจานชามในตู้หน่อยค่ะ", "phonetic": "", "english": "When you study Thai, you must practice \nwriting repeatedly."}], "cultural": "In many Thai cities, you can find no-name discount shops that sell a wide variety of goods. You can call this type of shop รานสิบเกาบาท (ráan-sìp-gâao-bàat), or \"nineteen baht shop,\" since most of the items are priced at nineteen baht. Nineteen baht is about sixty to sixty-five cents in U.S. money, depending on the current exchange rates. These shops are a little bit similar to 100 yen shops in Japan or dollar shops in the United States. The ac", "practicePrompts": []},
  {"id": "abs-ub-s1-18", "num": 18, "season": 4, "series": "Upper Beginner", "title": "A Picture of the King for Every Thai", "situation": "A picture of the king in every Thai home.", "coreConceptIds": ["ub_probably"], "keyPattern": {"thai": "คง/คงจะ + verb", "phonetic": "khong / khong jà + verb", "english": "Probably will verb"}, "teacherExplanation": "คง/คงจะ + verb (khong / khong jà + verb) — Probably will verb", "dialogue": [{"gender": "female", "thai": "สวัสดีค่ะ, ขอดูรูปในหลวงกับราชินีหน่อยค่ะ", "phonetic": "sà-wàt-dii khâ. khǎaw duu rûup nai-lǔuang gàp raa-chí-nii nàwy khâ.", "english": "Hello. May I see pictures of the King and Queen?"}, {"gender": "male", "thai": "เชิญด้านในเลยค่ะ, มีรูปตอนโบกพระหัตถ์ด้วยนะคะ, ตอนนีคงเหลือไม่กีรูปแล้ว น้องจะเอากีรูปคะ", "phonetic": "JÂO KHǍAWNG RÁAN: chooen dâan-nai looei khâ. mii rûup dtaawn bòok phrá-hàt dûuai ná khá. dtaawn-níi khong lǔuea mâi gìi rûup láaeo. náawng jà ao gìi rûup khá.", "english": "Please come inside. We have pictures of His Majesty waving too. There might not be many pictures left now. How many pictures are you getting?"}, {"gender": "female", "thai": "คงเอาแค่รูปเดียวค่ะ, รูปตอนในหลวงผนวชล่ะคะ, มีไหม", "phonetic": "khong ao khâae rûup diiao khâ. rûup dtaawn nai-lǔuang phà-nùuat lâ khá. mii mǎi.", "english": "I’ll probably get just one picture. How about pictures from when the King ordained? Do you have any?"}, {"gender": "male", "thai": "ถ้าเป็นรุ่นนัน คงหมดไปแล้วล่ะค่ะ, ค่อยๆเดินดูนะคะ, เรามีรูปของทุกรัชกาลเลยค่ะ", "phonetic": "JÂO KHǍAWNG RÁAN: thâa bpen rûn nán khong mòt bpai láaeo lâ khâ. khâawy-khâawy dooen duu ná khá. rao mii rûup khâawng túk rát-chá-gaan looei khâ.", "english": "If it’s from that time, we might be all out. Take your time looking around. We have pictures from every reign."}, {"gender": "female", "thai": "ค่ะ", "phonetic": "khâ", "english": "OK."}], "vocab": [{"thai": "รัชกาล", "phonetic": "rát-chá-gaan", "english": "reign"}, {"thai": "ค่อยๆ", "phonetic": "khâawy-khâawy", "english": "slowly, quietly,"}, {"thai": "ผนวช", "phonetic": "phà-nùuat", "english": "to ordain"}, {"thai": "โบกพระหัตถ์", "phonetic": "bòok phrá-hàt", "english": "royal handwave"}, {"thai": "ราชินี", "phonetic": "raa-chí-nii", "english": "queen"}, {"thai": "รูป", "phonetic": "rûup", "english": "form, picture, image,"}, {"thai": "คง", "phonetic": "khong", "english": "may, might"}, {"thai": "รุ่น", "phonetic": "rûn", "english": "generation, design"}], "samples": [], "cultural": "Nearly every home, business, and public building have a royal portrait. Most often, the current king and queen are paired together. Sometimes, past kings are displayed. The most popular former king is Chulalongkorn (Rama V), who is credited with modernizing the nation and preserving its independence during the age of colonization in the region by Britain and France. Common portraits of the current king show him sitting on the throne during his co", "practicePrompts": []},
  {"id": "abs-ub-s1-19", "num": 19, "season": 4, "series": "Upper Beginner", "title": "Wake Up Early to Oﬀer Food to the", "situation": "Offering food to monks in the morning.", "coreConceptIds": ["ub_intend"], "keyPattern": {"thai": "ตั้งใจจะ + verb", "phonetic": "dtâng-jai jà + verb", "english": "Intend to / plan to verb"}, "teacherExplanation": "ตั้งใจจะ + verb (dtâng-jai jà + verb) — Intend to / plan to verb", "dialogue": [{"gender": "female", "thai": "ฮัลโหล คุณพ่อโทรมาแต่เช้าเลยนะคะ", "phonetic": "han-lǒo. khun-phâaw thoo maa dtàae cháao looei ná khá.", "english": "Hello. Dad, you're calling so early."}, {"gender": "male", "thai": "ก็พ่อตังใจจะโทรมาอวยพรวันเกิดให้ลูก", "phonetic": "PHÂAW: gâaw phâaw dtâng-jai jà thoo maa uuai-phaawn wan-gòoet hâi lûuk.", "english": "Well, I wanted to call to give you birthday wishes."}, {"gender": "female", "thai": "ตายจริง กีโมงแล้วคะเนีย พลอยตังใจว่าจะตืนเช้าไปตักบาตร", "phonetic": "dtaai jing. gìi moong láaeo khá nîia. phlaawy dtâng-jai wâa jà dtùuen cháao bpai dtàk-bàat.", "english": "Oh no! What time is it? I wanted to wake up early to go offer food to the monks! UPPER BEGINNER S1 #19 - WAKE UP EARLY TO OFFER FOOD TO THE THAI MONKS 3"}, {"gender": "male", "thai": "แค่ โมงกว่าเองลูก แต่ถ้าไม่ทันก็ไปถวายสังฆทานทีวัดก็ได้ อย่าให้เสียความตังใจ", "phonetic": "PHÂAW: khâae hòk moong gwàa eeng lûuk. dtàae thâa mâi than gâaw bpai thà-wǎai sǎng-khá-thaan thîi wát gâaw dâai. yàa hâi sǐia khwaam- dtâng-jai.", "english": "It's just a little after six. But if you're not in time, you can just go make offerings at the temple. Don't give up on your intention."}, {"gender": "female", "thai": "ขอบคุณมากพ่อ แค่นีนะคะ, พลอยยังจะรีบไปตักบาตร", "phonetic": "khàawp-khun mâak phâaw. khâae níi ná khá. phlaawy yang jà rîip bpai dtàk-bàat.", "english": "Thank you very much, Dad. That's all, OK? I still want to hurry and go offer food."}, {"gender": "male", "thai": "ครับๆ สวัดดีครับ", "phonetic": "PHÂAW: khráp-khráp sà-wàt-dii khráp.", "english": "OK, OK. Goodbye."}], "vocab": [{"thai": "โทร", "phonetic": "thoo", "english": "to call on the phone"}, {"thai": "ตังใจ", "phonetic": "dtâng-jai", "english": "to intend, to pay"}, {"thai": "อวยพร", "phonetic": "uuai-phaawn", "english": "to bless, to wish well"}, {"thai": "ตักบาตร", "phonetic": "dtàk-bàat", "english": "to offer food to monks"}, {"thai": "ความตังใจ", "phonetic": "khwaam-dtâng-jai", "english": "intention,"}, {"thai": "ทัน", "phonetic": "than", "english": "in time, on time, to"}, {"thai": "วันเกิด", "phonetic": "wan-gòoet", "english": "birthday"}, {"thai": "ตืน", "phonetic": "dtùuen", "english": "to wake up"}], "samples": [{"thai": "ถ้าอยากตักบาตร คุณต้องตืนเช้าๆนะคะ", "phonetic": "", "english": "I called many times. How come you didn't \nanswer the phone at all."}, {"thai": "วันนีคือวันเกิดของลุงของดิฉันค่ะ", "phonetic": "", "english": "We intend to go pay respect to a statue of \nBuddha at the Thai temple in Tokyo."}], "cultural": "The concept of monks going out to beg for food in the morning is older even than Buddhism. It was already common in India in the Buddha's time for wandering holy men and ascetics to collect alms in the morning. And so the Buddha and his followers began doing the same. A number of rules are set down in the Vinaya, or monastic discipline, governing the conduct of monks on alms rounds. Some other unofficial rules of conduct are a product of Thai cul", "practicePrompts": []},
  {"id": "abs-ub-s1-20", "num": 20, "season": 4, "series": "Upper Beginner", "title": "Thai Jokes are Especially Funny", "situation": "Thai jokes and humour.", "coreConceptIds": ["ub_especially"], "keyPattern": {"thai": "adj/verb + เป็นพิเศษ", "phonetic": "adj/verb + bpen phí-sèet", "english": "Especially adj/verb"}, "teacherExplanation": "adj/verb + เป็นพิเศษ (adj/verb + bpen phí-sèet) — Especially adj/verb", "dialogue": [{"gender": "female", "thai": "วันนีรู้สึกเบือเป็นพิเศษ น้องเพลง", "phonetic": "wan-níi rúu-sùek bùuea bpen phí-sèet náawng phleeng.", "english": "I feel rather bored today, Pleng."}, {"gender": "male", "thai": "เหรอคะ, อืมมม...ปลาอะไรพูดเพราะทีสุด", "phonetic": "rǒoe khá. uuemmm...bplaa à-rai phûut phráw thîi-sùt.", "english": "Oh yeah? Ummm... What fish speaks the most politely?"}, {"gender": "female", "thai": "อะไรวะ ปลาพูดไม่ได้ ไม่รู้เหรอ", "phonetic": "à-rai wá. bplaa phûut mâi dâai. mâi rúu rǒoe.", "english": "What? Fish can't talk. Don't you know?"}, {"gender": "male", "thai": "ปลาอะไรพูดเพราะทีสุด", "phonetic": "bplaa à-rai phûut phráw thîi-sùt.", "english": "What fish speaks the most politely?"}, {"gender": "female", "thai": "ก็ไม่รู้", "phonetic": "gâaw mâi rúu.", "english": "Well, I don't know."}, {"gender": "male", "thai": "ปลาทีพูดเพราะทีสุดคือ...ปลาคาร์บบบบบบบบ", "phonetic": "bplaa thîi phûut phráw thîi-sùt khuue... bplaa-kháaaaaaaap", "english": "The fish that speaks the most politely is...carp! UPPER BEGINNER S1 #20 - THAI JOKES ARE ESPECIALLY FUNNY 3"}, {"gender": "female", "thai": "วันนีีน้องบ้าเป็นพิเศษ", "phonetic": "wan-níi náawng bâa bpen phí-sèet.", "english": "You're crazier than usual today."}], "vocab": [{"thai": "บ้า", "phonetic": "bâa", "english": "crazy, to be insane"}, {"thai": "ปลาคาร์บ", "phonetic": "bplaa-kháap", "english": "carp"}, {"thai": "วะ", "phonetic": "wá", "english": "impolite ending"}, {"thai": "เป็นพิเศษ", "phonetic": "bpen phí-sèet", "english": "especially,"}, {"thai": "รู้สึก", "phonetic": "rúu-sùek", "english": "to feel"}, {"thai": "เบือ", "phonetic": "bùuea", "english": "bored"}, {"thai": "ทีสุด", "phonetic": "thîi-sùt", "english": "most"}, {"thai": "ปลา", "phonetic": "bplaa", "english": "fish"}, {"thai": "เพราะ", "phonetic": "phráw", "english": "beautiful sounding,"}], "samples": [{"thai": "จริงเหรอคะ", "phonetic": "", "english": "He's really crazy!"}, {"thai": "วะ . - คะ ครับ", "phonetic": "", "english": "Temples in Japan often have carp."}, {"thai": "คะ ครับ", "phonetic": "", "english": "What did you say? I didn't hear."}], "cultural": "Thai jokes often involve a play on words. Sometimes we do this by making use of compound words in which the first part of the word is quite different in meaning from the full word. For example, มาอะไรวิ่งไมได (máa à-rai wîng mâi dâai), meaning \"Which kind of horse (มา, (máa)) can't run?\" The answer is มาหมุน (máa-mǔn), meaning \"carousel,\" which is literally \"spinning horse.\" In many other riddles, the answer comes as a pair of lines. The fir", "practicePrompts": []},
  {"id": "abs-ub-s1-21", "num": 21, "season": 4, "series": "Upper Beginner", "title": "The Place to be if You’re a Thai", "situation": "The best place for Thai students.", "coreConceptIds": ["ub_compound_noun"], "keyPattern": {"thai": "ที่ + verb", "phonetic": "thîi + verb", "english": "Place where verb / thing that verb-s"}, "teacherExplanation": "ที่ + verb (thîi + verb) — Place where verb / thing that verb-s", "dialogue": [{"gender": "female", "thai": "เพลง หอพักของน้องเป็นยังไงบ้าง", "phonetic": "phleeng hǎaw-phák khǎawng náawng bpen yang-ngai bâang.", "english": "Pleng, how is your dormitory?"}, {"gender": "male", "thai": "ใกล้กับมหาวิทยาลัยเลยค่ะ, ทีจอดรถก็กว้าง ใต้ตึกมีเซเว่นด้วย", "phonetic": "glâi-glâi gàp má-hǎa-wít-thá-yaa-lai looei khâ. thîi-jàawt-rót gâaw gwâang. dtâi dtùek mii see-wên dûuai.", "english": "It's really close to the university. The parking area is large too. There's also a 7-Eleven below the building."}, {"gender": "female", "thai": "เสียดายทีไกลจากทีทํางานพี จะได้ช่วยกันประหยัดตังค์", "phonetic": "sǐia-daai thîi glai jàak thîi-tham-ngaan phîi. jà dâai chûuai gan bprà- yàt dtang.", "english": "It's too bad that you're far from my office. We could help each other save money."}, {"gender": "male", "thai": "ไม่เอาหรอกค่ะ, เกรงใจเวลาทีรักพีพลอยมาหาน่ะ", "phonetic": "mâi ao ràawk khâ. greeng-jai wee-laa thîi-rák phîi phlaawy maa hǎa nâ.", "english": "No thanks. I'd feel in the way when your sweetheart comes over to see you."}, {"gender": "female", "thai": "ว้าย พูดอะไรบ้าๆ แล้วอย่าลืมจดทีอยู่ให้พีด้วยล่ะ", "phonetic": "wáai. phûut à-rai bâa-bâa. láaeo yàa luuem jòt thîi-yùu hâi phîi dûuai lâ.", "english": "Yikes! You're talking crazy. Anyways, don't forget to write down your address for me."}], "vocab": [{"thai": "ทีรัก", "phonetic": "thîi-rák", "english": "dear, beloved,"}, {"thai": "ทีอยู่", "phonetic": "thîi-yùu", "english": "address"}, {"thai": "ทีทํางาน", "phonetic": "thîi-tham-ngaan", "english": "office, workplace"}, {"thai": "ทีจอดรถ", "phonetic": "thîi-jàawt-rót", "english": "car park, parking lot"}, {"thai": "กว้าง", "phonetic": "gwâang", "english": "wide"}, {"thai": "ตึก", "phonetic": "dtùek", "english": "building"}, {"thai": "ประหยัด", "phonetic": "bprà-yàt", "english": "economical, thrifty"}], "samples": [], "cultural": "Like most countries, Thailand has both public and private universities. In contrast to western countries, however, public universities in Thailand are considered more prestigious than private ones. This is despite the fact that private universities are more expensive to attend. This is for several reasons. First, there is the fact that the first public universities were opened by the royal family. One also has to consider the entrance requirement", "practicePrompts": []},
  {"id": "abs-ub-s1-22", "num": 22, "season": 4, "series": "Upper Beginner", "title": "What's Your Favorite Thai Snack?", "situation": "Discussing favourite Thai snacks.", "coreConceptIds": ["ub_favorite"], "keyPattern": {"thai": "noun + โปรด", "phonetic": "noun + bpròot", "english": "Favorite noun"}, "teacherExplanation": "noun + โปรด (noun + bpròot) — Favorite noun", "dialogue": [{"gender": "male", "thai": "วันนีทําอะไรกินกันดี", "phonetic": "wan-níi tham à-rai gin gan dii.", "english": "What should we make to eat today?"}, {"gender": "female", "thai": "แล้วแต่น้องละกัน แต่ตอนนี แวะโรตีเจ้าโปรดกันก่อน เอาอะไรดี", "phonetic": "láao dtàae náawng lá gan. dtàae dtaawn-níi wáe roo-dtii jâo bpròot gan gàawn. ao à-rai dii.", "english": "Up to you. But now, let's stop by my favorite roti seller first. What will you get?"}, {"gender": "male", "thai": "หนูขอช็อกโกแลตรสโปรดเหมือนเดิมค่ะ", "phonetic": "nǔu khǎaw cháwk-goo-láet rót bpròot mǔuean-dooem khâ.", "english": "I'll take my favorite flavor, chocolate, as usual."}, {"gender": "female", "thai": "พีเอาไส้กล้วยหอมดีกว่า แล้วนัน ทีแขนเสือไปโดนอะไรมาน่ะ", "phonetic": "phîi ao sâi glûuai-hǎawm dii gwàa. láaeo nân. thîi khǎaen-sûuea bpai doon à-rai maa nâ.", "english": "I'll get banana filling. And what's that? What did your sleeve rub against?"}, {"gender": "male", "thai": "ตายแล้ว จะซักออกไหมเนีย เสือตัวโปรดเสียด้วย", "phonetic": "dtaai láaeo. jà sák àawk mǎi nîia. sûuea dtuua bpròot sǐia dûuai.", "english": "Oh man! Is this going to wash out? My favorite shirt is ruined!"}], "vocab": [{"thai": "โดน", "phonetic": "doon", "english": "to bump against"}, {"thai": "ไส้", "phonetic": "sâi", "english": "stuffing, filling"}, {"thai": "รส", "phonetic": "rót", "english": "flavor, taste"}, {"thai": "ช็อกโกแลต", "phonetic": "cháwk-goo-láet", "english": "chocolate"}, {"thai": "โปรด", "phonetic": "bpròot", "english": "favorite"}, {"thai": "เจ้า", "phonetic": "jâo", "english": "shop, proprieter"}, {"thai": "แวะ", "phonetic": "wáe", "english": "to stop by"}], "samples": [{"thai": "กล้วยหอมหวีละเท่าไหร่คะ", "phonetic": "", "english": "Who bumped into my sedan?"}, {"thai": "เอาไส้อะไรดีคะ", "phonetic": "", "english": "Why is your shirtsleeve dirty?"}, {"thai": "จะซักออกไหมเนี่ย", "phonetic": "", "english": "How much is a bunch of bananas?"}, {"thai": "ออก . ไหม", "phonetic": "", "english": "What filling would you like?"}], "cultural": "If you've ever eaten at an Indian restaurant, then you might know roti is the name of a small, circular Indian flatbread. Also known as chapati, the Indian roti, which is made with wheat flour, is eaten in a meal along with curries and cooked vegetables. The Thai version of roti is more of a sweet snack food. It came to Thailand via Malaysia, where it is known as roti canai. The origin of roti canai, in turn, is from immigrant workers who came fr", "practicePrompts": []},
  {"id": "abs-ub-s1-23", "num": 23, "season": 4, "series": "Upper Beginner", "title": "Count your Thai Eggs Before they", "situation": "Counting eggs before they hatch.", "coreConceptIds": ["ub_classifiers"], "keyPattern": {"thai": "noun + number + classifier", "phonetic": "noun + number + classifier", "english": "number of noun"}, "teacherExplanation": "noun + number + classifier (noun + number + classifier) — number of noun", "dialogue": [{"gender": "female", "thai": "ป้าคะ, ข้าวหอมมะลิกระสอบนีิกิโลกรัมละเท่าไหร่คะ", "phonetic": "bpâa khá khâao-hǎawm-má-lí grà-sàawp níi gì-loo-gram lá thâo-rài khá.", "english": "How much per kilogram is this sack of jasmine rice?"}, {"gender": "female", "thai": "กิโลกรัมละ บาทจ้ะ หนูเอากีกิโลคะ", "phonetic": "MÂE-KHÁA: gì-loo-gram lá sǎam-sìp bàat jâ. nǔu ao gìi gì-loo khá.", "english": "Thirty baht per kilogram. How many kilograms do you want?"}, {"gender": "female", "thai": "กิโลค่ะ, ขอไข่ไก่ ฟอง แล้วก็วุ้นเส้น ห่อค่ะ", "phonetic": "sǎam gì-loo khâ. khǎaw khài gài sìp faawng. láaeo gâaw wûn-sên sǎawng hàaw khâ.", "english": "Three kilograms. Can I have ten chicken eggs and also two packs of glass noodles?"}, {"gender": "female", "thai": "ได้ครบหรือยังคะ, เอาอะไรเพิมไหมคะ", "phonetic": "MÂE-KHÁA: dâai khróp rǔue yang khá. ao à-rai phôoem mǎi khá.", "english": "Is that all? Do you want anything else?"}, {"gender": "female", "thai": "เพลงดูใบรายการทีจดไว้ซิ มีอะไรอีกบ้าง", "phonetic": "phleeng duu bai-raai-gaan thîi jòt wái sí. mii à-rai ìik bâang.", "english": "Pleng, look at the checklist that we wrote. What else is there?"}, {"gender": "male", "thai": "มีกุ้งแห้ง - ขีด เต้าหู้ขาว ก้อน แล้วก็ ผักบุ้ง มัด ค่ะ", "phonetic": "mii gûng hâaeng hâa khìit dtâo-hûu khǎao sìi gâawn láaeo gâaw phàk-bûng sǎawng mát khâ.", "english": "There's 500 grams of dried shrimp, four chunks of white tofu, and also two bundles of morning glory."}], "vocab": [{"thai": "มัด", "phonetic": "mát", "english": "to tie, to bind, bundle"}, {"thai": "ก้อน", "pho // ── SRS Logic ────────────────────────────────────────────────────────────────
const APP_VERSION = (() => { try { return document.querySelector('meta[name="app-version"]')?.content || 'v131' } catch { return 'v131' } })()

const EASE = { easy: 2.5, ok: 1.3, hard: 0.6 }
function calcInterval(cur, rating) {
  return Math.min(Math.round(Math.max(cur, 1) * (EASE[rating] || 1.3) * 1.5), 365)
}
function applyRating(word, rating) {
  const today = new Date().toISOString().slice(0, 10)
  const newInt = calcInterval(word.interval || 0, rating)
  const d = new Date(); d.setDate(d.getDate() + newInt)
  let { status, lapses = 0 } = word
  if (rating === 'hard') { if (status === 'known') { status = 'lapsed'; lapses++ } else status = 'learning' }
  else status = (rating === 'easy' && newInt >= 14) ? 'known' : 'learning'
  if (word.status === 'new') status = 'learning'
  return { ...word, interval: newInt, lastSeen: today, dueDate: d.toISOString().slice(0, 10), repCount: (word.repCount || 0) + 1, lapses, status, difficulty: rating }
}

function markWordKnown(word) {
  const today = new Date().toISOString().slice(0, 10)
  const d = new Date(); d.setDate(d.getDate() + 30)
  return { ...word, status: 'known', interval: 30, dueDate: d.toISOString().slice(0, 10), lastSeen: today, difficulty: 'easy' }
}

// ── Storage ───────────────────────────────────────────────────────────────────
async function stGet(key) {
  try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null } catch {}
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : null } catch {}
  return null
}
async function stSet(key, val) {
  try { await window.storage.set(key, JSON.stringify(val)) } catch {}
  try { localStorage.setItem(key, JSON.stringify(val)) } catch {}
}

// ── Vocab Helpers ─────────────────────────────────────────────────────────────
function initVocab() {
  return RAW_VOCAB.map((d, idx) => {
    const l = d.l
    let status = 'new', interval = 0, dueDate = null
    if (l === 'easy') {
      status = 'known'; interval = d.i || 24
      const dd = new Date(); dd.setDate(dd.getDate() + Math.floor(Math.random() * 7))
      dueDate = dd.toISOString().slice(0, 10)
    } else if (l === 'ok') {
      status = 'learning'; interval = d.i || 4
      const dd = new Date(); dd.setDate(dd.getDate() + Math.floor(Math.random() * 3))
      dueDate = dd.toISOString().slice(0, 10)
    }
    return { id: idx + 1, thai: d.t, english: d.e, phonetic: d.ph || null, status, difficulty: l, interval, lastSeen: null, dueDate, repCount: d.r || 0, lapses: d.lp || 0 }
  })
}

function getStats(vocab) {
  const today = new Date().toISOString().slice(0, 10)
  return {
    total: vocab.length,
    due: vocab.filter(w => w.status !== 'new' && w.dueDate && w.dueDate <= today).length,
    newW: vocab.filter(w => w.status === 'new').length,
    learning: vocab.filter(w => w.status === 'learning').length,
    known: vocab.filter(w => w.status === 'known').length,
  }
}

function pickWords(vocab, mode) {
  const today = new Date().toISOString().slice(0, 10)
  let targets
  if (mode === 'weak') {
    targets = vocab.filter(w => w.difficulty === 'hard' || w.status === 'lapsed' || w.lapses >= 2).slice(0, 30)
    if (!targets.length) targets = vocab.filter(w => w.status === 'learning').slice(0, 30)
  } else {
    const due = vocab.filter(w => w.status !== 'new' && w.dueDate && w.dueDate <= today).slice(0, 22)
    const newW = vocab.filter(w => w.status === 'new').slice(0, 9)
    targets = [...due, ...newW].slice(0, 30)
  }
  const targetIds = new Set(targets.map(w => w.id))
  const anchors = vocab
    .filter(w => (w.status === 'known' || w.status === 'learning') && !targetIds.has(w.id))
    .sort((a, b) => (!a.lastSeen ? -1 : !b.lastSeen ? 1 : a.lastSeen.localeCompare(b.lastSeen)))
    .slice(0, 25)
  // ── Repair and validate targets before generation ─────────────────────────
  const PURE_PARTICLES = new Set(['ก็','ที่','ของ','กับ','ว่า','แต่','หรือ','และ','เพราะ','แล้ว','ด้วย','นะ','ก็ได้'])
  const TOO_COMMON = new Set(['มี','ไป','มา','ผม','ฉัน','คุณ','เรา','เขา','เธอ','ไม่','ได้','จะ','เป็น','ทำ','รู้'])
  // Hard repairs: known broken entries
  const REPAIRS = {
    'เจ้า': { thai: 'เจ้าของ', english: 'owner', phonetic: 'jâo-khɔ̌ɔng' },
    'เจ้า ...': { thai: 'เจ้าของ', english: 'owner', phonetic: 'jâo-khɔ̌ɔng' },
    'ถนนคนเดิน ...': { thai: 'ถนนคนเดิน', english: 'walking street', phonetic: 'thà-nǒn-khon-dəən' },
  }
  targets = targets
    .map(t => {
      // Repair known broken entries
      if (REPAIRS[t.thai]) return { ...t, ...REPAIRS[t.thai] }
      // Strip trailing "..." or "…" from thai and english
      if (t.thai.includes('...') || t.thai.includes('…')) {
        return { ...t, thai: t.thai.replace(/\.{2,}|…/g,'').trim(), english: t.english.replace(/\.{2,}|…/g,'').trim() }
      }
      return t
    })
    .filter(t => {
      if (!t.thai || t.thai.length < 2) return false
      if (PURE_PARTICLES.has(t.thai)) return false
      if (TOO_COMMON.has(t.thai)) return false
      // Skip if target IS a full sentence (contains spaces AND has a verb particle pattern)
      // Full sentences like "คุณเป็นคนตลก" should be kept but flagged as phrase type
      return true
    })
  // Tag full-sentence targets so generator knows not to treat them as nouns
  targets = targets.map(t => {
    const isFull = t.thai.includes('คุณ') || t.thai.includes('ผม') || t.thai.includes('เขา')
    if (isFull && t.thai.split(' ').length > 1) return { ...t, _phraseType: 'full_sentence' }
    return t
  })
  // Shuffle to avoid same words always first/last
  for (let i = targets.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [targets[i], targets[j]] = [targets[j], targets[i]]
  }
  return { targets, anchors }
}

// ── Pimsleur Track Generator (local, no API) ──────────────────────────────────
// Generates ~90 challenge-response pairs using full Thai sentences.
// Each target word appears 3x at spaced intervals (intro → mid review → late review).
// Anchor words fill gaps with 1-2 sentence reviews.

function shuffle(arr) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] }
  return a
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)] }

// Each frame returns { prompt, thai, english }
// Thai answer is always a complete sentence (subject + verb + object + particle)
const FRAMES = [
  // "I want / would like"
  w => ({ prompt: `Tell someone you want ${w.english}`, thai: `ผมอยากได้${w.thai}ครับ`, english: `I'd like some ${w.english}` }),

]

// Reverse frames: Thai prompt → student recalls meaning / responds
const REV_FRAMES = [
  w => ({ prompt: `You hear: "${w.thai}" — what does this mean and how do you respond?`, thai: `${w.thai}`, english: `${w.english}` }),
  w => ({ prompt: `Respond to: "${w.thai}"`, thai: `${w.thai}`, english: `(means: ${w.english})` }),
]

function makePair(w, framePool) {
  const f = pick(framePool)(w)
  return { ...f, wordId: w.id }
}

function generatePairsLocal(targets, anchors) {
  // Target words get 3 appearances each: intro (early), review (middle), recall (late)
  // Anchors fill the gaps — 1-2 appearances each

  const TOTAL = 90  // ~45 min at ~30 sec per pair
  const targetSlots = targets.length * 3  // 3 reps per target word
  const anchorCount = Math.max(0, TOTAL - targetSlots)
  const anchorSample = shuffle(anchors).slice(0, Math.ceil(anchorCount / 1.5))

  // Build per-target triplets (intro, mid, late)
  const introGroup = targets.map(w => makePair(w, FRAMES.slice(0, 8)))   // want/like/have frames
  const midGroup   = targets.map(w => makePair(w, FRAMES.slice(6, 14)))  // need/question frames
  const lateGroup  = targets.map(w => makePair(w, FRAMES.slice(12, 20))) // describe/think frames

  // Build anchor review pairs (mix forward + some reverse)
  const anchorPairs = anchorSample.flatMap(w => {
    const fwd = makePair(w, FRAMES)
    return Math.random() < 0.3 ? [fwd, makePair(w, REV_FRAMES)] : [fwd]
  })

  // Weave everything into a 90-pair Pimsleur sequence:
  // [some anchors] → intro group → [anchors] → mid group → [anchors] → late group → [anchors]
  const anchorChunks = chunkArray(shuffle(anchorPairs), 4)
  const ac = i => anchorChunks[i] || []

  const track = [
    ...ac(0),
    ...shuffle(introGroup),
    ...ac(1),
    ...shuffle(midGroup),
    ...ac(2),
    ...shuffle(lateGroup),
    ...ac(3),
    ...ac(4),
  ].slice(0, TOTAL)

  return track
}

function chunkArray(arr, n) {
  const chunks = []
  for (let i = 0; i < arr.length; i += n) chunks.push(arr.slice(i, i + n))
  return chunks
}

async function askKru(msgs, ctx, apiKey) {
  const system = `You are Kru (ครู), a warm and knowledgeable Thai teacher.
Respond in English. Include Thai script + tone-marked romanization for examples.
Tone marks: mid=none, low=à, falling=â, high=á, rising=ǎ. Hyphens between syllables.
Keep answers focused and practical — 2-4 short paragraphs max.
${ctx ? `\nSTUDENT'S CURRENT LESSON:\n${ctx}` : ''}`
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(apiKey ? { 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' } : {}) },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 800, system, messages: msgs })
  })
  if (!res.ok) throw new Error(`API ${res.status}`)
  const data = await res.json()
  return data.content[0].text
}

function downloadTrack(track) {
  const keywords = track.keywords || []
  const pairs = track.pairs || []
  
  // Build readable text file
  const lines = []
  lines.push('THAI TEACHER — TRACK EXPORT')
  lines.push('=' .repeat(50))
  lines.push(`Date: ${track.date}`)
  lines.push(`Mode: ${track.mode || 'daily'}`)
  lines.push(`Pairs: ${pairs.length}`)
  lines.push(`Created: ${track.createdAt || ''}`)
  lines.push('')
  
  lines.push('TARGET WORDS (' + keywords.length + ')')
  lines.push('-'.repeat(30))
  keywords.forEach((k, i) => {
    lines.push(`${String(i+1).padStart(2,'0')}. ${k.thai}  [${k.phonetic || ''}]  —  ${k.english}`)
  })
  lines.push('')
  
  lines.push('TRACK PAIRS (' + pairs.length + ')')
  lines.push('-'.repeat(30))
  function srcLabel(src) {
    if (!src) return 'ai:gen'
    if (src.startsWith('fallback:') || src.startsWith('hardcoded:')) return 'fallback:template'
    if (src.startsWith('repair:')) return 'fallback:slot-repair'
    if (src.startsWith('validator-repair:')) return 'ai:validator-repair'
    if (src.startsWith('gpt-recheck2:') || src.startsWith('recheck2:')) return 'ai:recheck-2'
    if (src.startsWith('gpt-recheck:') || src.startsWith('recheck:')) return 'ai:recheck-1'
    if (src.startsWith('haiku:')) return 'ai:haiku-fallback'
    return 'ai:gen'
  }
  pairs.forEach((p, i) => {
    lines.push(`\n[${String(i+1).padStart(3,'0')}] ${p.prompt || ''}`)
    lines.push(`  TH: ${p.thai || ''}`)
    lines.push(`  PH: ${p.phonetic || ''}`)
    lines.push(`  EN: ${p.english || ''}`)
    lines.push(`  SRC: ${srcLabel(p._source || p.source || '')}`)
  })

  // Include conversation if present
  if (track.convo && track.convo.length) {
    lines.push('')
    lines.push('CONVERSATION (' + track.convo.length + ' lines)')
    lines.push('-'.repeat(30))
    track.convo.forEach(l => {
      lines.push(l.speaker + ': ' + l.thai)
      lines.push('   ' + l.phonetic)
      lines.push('   ' + l.english)
      lines.push('')
    })
  }

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = 'thai-track-' + track.date.replace(/ /g,'-') + '-' + (track.mode||'daily') + '.txt'
  document.body.appendChild(a)
  a.click()
  document.body.removeChild(a)
  URL.revokeObjectURL(url)
}

const BELT_RANKS = [
  { rank: 'Mukyu',   minWords: 0,    color: '#6b7280', belt: '#4b5563', label: 'No Belt' },
  { rank: '10th Kyu', minWords: 100,  color: '#f3f4f6', belt: '#e5e7eb', label: 'White' },
  { rank: '9th Kyu',  minWords: 200,  color: '#f97316', belt: '#ea580c', label: 'Orange' },
  { rank: '8th Kyu',  minWords: 350,  color: '#f97316', belt: '#ea580c', label: 'Orange' },
  { rank: '7th Kyu',  minWords: 500,  color: '#3b82f6', belt: '#2563eb', label: 'Blue' },
  { rank: '6th Kyu',  minWords: 750,  color: '#3b82f6', belt: '#2563eb', label: 'Blue' },
  { rank: '5th Kyu',  minWords: 1000, color: '#eab308', belt: '#ca8a04', label: 'Yellow' },
  { rank: '4th Kyu',  minWords: 1500, color: '#eab308', belt: '#ca8a04', label: 'Yellow' },
  { rank: '3rd Kyu',  minWords: 2000, color: '#22c55e', belt: '#16a34a', label: 'Green' },
  { rank: '2nd Kyu',  minWords: 3000, color: '#92400e', belt: '#78350f', label: 'Brown' },
  { rank: '1st Kyu',  minWords: 4000, color: '#92400e', belt: '#78350f', label: 'Brown' },
  { rank: 'Shodan',   minWords: 5000, color: '#d4a94a', belt: '#0b1120', label: 'Black' },
]

function calculateBeltRank(known) {
  let current = BELT_RANKS[0]
  let next = BELT_RANKS[1]
  for (let i = BELT_RANKS.length - 1; i >= 0; i--) {
    if (known >= BELT_RANKS[i].minWords) {
      current = BELT_RANKS[i]
      next = BELT_RANKS[i + 1] || null
      break
    }
  }
  const wordsToNext = next ? next.minWords - known : 0
  const rangeStart = current.minWords
  const rangeEnd = next ? next.minWords : current.minWords + 1000
  const progress = next ? Math.round(((known - rangeStart) / (rangeEnd - rangeStart)) * 100) : 100
  return { current, next, wordsToNext, progress, known }
}

async function fetchTargetPhoneticsQwen(targets, orKey) {

  const wordList = targets.map(w => w.thai).join(', ')
  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${orKey}`, 'HTTP-Referer': 'https://magical-druid-656889.netlify.app', 'X-Title': 'Thai Teacher' },
      body: JSON.stringify({ model: 'qwen/qwen3-32b', max_tokens: 800, temperature: 0, messages: [{ role: 'user', content: `Give tone-marked romanization for each Thai word. Tone marks: mid=none, low=grave(à), falling=circumflex(â), high=acute(á), rising=caron(ǎ). Use hyphens between syllables.\nWords: ${wordList}\nRespond ONLY with valid JSON, no markdown, no thinking tags: {"results":[{"thai":"word","phonetic":"romanization"},...]}` }] })
    })
    if (!res.ok) return {}
    const data = await res.json()
    let text = (data.choices?.[0]?.message?.content || '').trim()
    text = text.replace(/<think>[\s\S]*?<\/think>/g, '').trim()
    text = text.replace(/^```json\n?|\n?```$/g, '').trim()
    const parsed = JSON.parse(text)
    const map = {}
    for (const r of (parsed.results || [])) {
      const match = targets.find(t => t.thai === r.thai)
      if (match) { map[match.id] = r.phonetic; map[match.thai] = r.phonetic }
    }
    return map
  } catch { return {} }
}

function getSentenceLengthForVocab(vocab) {
  const known = (vocab||[]).filter(w => w.l === 'known' || w.status === 'known').length
  const learning = (vocab||[]).filter(w => w.l === 'learning' || w.status === 'learning').length
  // Sentence length targets per belt rank
  let goalMin = 2, goalMax = 4, hardCeil = 4
  if      (known < 100)  { goalMin=2;  goalMax=4;  hardCeil=4  }  // Mukyu
  else if (known < 200)  { goalMin=5;  goalMax=6;  hardCeil=6  }  // 10th Kyu
  else if (known < 350)  { goalMin=6;  goalMax=7;  hardCeil=7  }  // 9th Kyu
  else if (known < 500)  { goalMin=7;  goalMax=8;  hardCeil=8  }  // 8th Kyu
  else if (known < 750)  { goalMin=8;  goalMax=9;  hardCeil=9  }  // 7th Kyu
  else if (known < 1000) { goalMin=9;  goalMax=10; hardCeil=10 }  // 6th Kyu
  else if (known < 1500) { goalMin=10; goalMax=11; hardCeil=11 }  // 5th Kyu
  else if (known < 2000) { goalMin=11; goalMax=12; hardCeil=12 }  // 4th Kyu
  else if (known < 3000) { goalMin=12; goalMax=13; hardCeil=13 }  // 3rd Kyu
  else if (known < 4000) { goalMin=13; goalMax=14; hardCeil=14 }  // 2nd Kyu
  else if (known < 5000) { goalMin=14; goalMax=15; hardCeil=15 }  // 1st Kyu
  else                   { goalMin=16; goalMax=20; hardCeil=25 }  // Shodan
  const learningPenalty = Math.min(learning, 3)
  const effectiveCeil = Math.max(goalMin + 1, hardCeil - learningPenalty)
  return { goalMin, goalMax, hardCeil, effectiveCeil, known }
}

function buildGenerationPrompt(targets, anchors, vocab) {
  // Include stored phonetics so AI uses correct romanization, not its own
  const targetList = targets.map(w => `★ ${w.thai}${w.phonetic ? ` [${w.phonetic}]` : ''} = ${w.english}`).join('\n')
  const anchorList = anchors.slice(0, 50).map(w => `${w.thai}${w.phonetic ? ` [${w.phonetic}]` : ''} = ${w.english}`).join('\n')
  const ALWAYS_ALLOWED = ['ครับ','ค่ะ','คะ','นะ','เลย','มาก','ด้วย','แล้ว','ก็','ที่','ของ','กับ','ใน','ไม่','ได้','จะ','และ','แต่','หรือ','ว่า','ถ้า','ก่อน','อีก','ยัง','เป็น','มี','ไป','มา','อยู่','ทำ','รู้','เห็น','บอก','คิด','รู้สึก']
  const allThai = new Set([...ALWAYS_ALLOWED, ...(vocab||[]).map(w=>w.thai)])
  // approvedList with phonetics for words that have them
  const vocabPhonMap = Object.fromEntries((vocab||[]).map(w => [w.thai, w.phonetic]).filter(([,p]) => p))
  const approvedList = [...allThai].map(t => vocabPhonMap[t] ? `${t}[${vocabPhonMap[t]}]` : t).join('  ')

  // Sentence length by learner rank
  const known = (vocab||[]).filter(w => w.status === 'known').length
  const learning = (vocab||[]).filter(w => w.status === 'learning').length
  let goalMin = 6, goalMax = 12, hardCeil = 12
  if (known < 100)       { goalMin=1;  goalMax=2;  hardCeil=2  }
  else if (known < 200)  { goalMin=2;  goalMax=3;  hardCeil=4  }
  else if (known < 350)  { goalMin=3;  goalMax=4;  hardCeil=6  }
  else if (known < 500)  { goalMin=4;  goalMax=5;  hardCeil=8  }
  else if (known < 750)  { goalMin=5;  goalMax=6;  hardCeil=10 }
  else if (known < 1000) { goalMin=6;  goalMax=7;  hardCeil=11 }
  else if (known < 1500) { goalMin=7;  goalMax=8;  hardCeil=12 }
  else if (known < 2000) { goalMin=8;  goalMax=10; hardCeil=14 }
  else if (known < 3000) { goalMin=10; goalMax=12; hardCeil=16 }
  else if (known < 4000) { goalMin=12; goalMax=14; hardCeil=18 }
  else if (known < 5000) { goalMin=14; goalMax=16; hardCeil=20 }
  else                   { goalMin=15; goalMax=20; hardCeil=25 }
  // Each learning word costs 2 words of headroom
  const learningPenalty = Math.min(learning, 3) * 2
  const effectiveCeil = Math.max(goalMin + 1, hardCeil - learningPenalty)

  const system = `You are a Thai language teaching assistant creating Pimsleur-style audio lessons.
Generate 90 challenge-response pairs. Each pair must have ALL these fields:
- "prompt": English instruction (VARY the types: "Tell someone...", "Ask if...", "Say that...", "Respond to...", "How would you say...", "Ask someone...", "Explain that..."). Do NOT repeat the same type consecutively.
- "thai": natural Thai sentence, TARGET LENGTH ${goalMin}–${goalMax} Thai words, HARD MAX ${effectiveCeil} words. ALWAYS end with a polite particle (ครับ for male, ค่ะ/นะคะ for female, alternate throughout)
- "english": natural English translation
- "phonetic": romanization using the EXACT phonetics from APPROVED VOCABULARY (shown in [brackets]). Copy them verbatim, space-separated.
- "words": array of {"p": phonetic_token, "e": English_gloss} — one per Thai word, copy phonetics from approved list
- "target_phonetic": phonetic of the ★ target word — copy EXACTLY from the bracket shown in the target list

PHONETICS: Use ONLY the romanizations shown in [brackets] in the vocabulary list. Do NOT invent your own.
For words without brackets, use standard romanization with tone marks:
mid=no mark | low=grave(à) | falling=circumflex(â) | high=acute(á) | rising=caron(ǎ)

CRITICAL RULES:
1. ONLY use Thai words from the APPROVED VOCABULARY LIST — no exceptions, no invented words
2. EVERY ★ TARGET WORD MUST APPEAR EXACTLY 3 TIMES — if any target word appears 0, 1, or 2 times you have FAILED
   After every 30 pairs, check: has each target word appeared the right number of times?
   Spread evenly: first appearance in pairs 1-30, second in 31-60, third in 61-90
3. Polite particles (ครับ/ค่ะ) are REQUIRED in every sentence — alternate male/female
4. VARY PROMPT TYPES — use at minimum 15 different prompt starters across 90 pairs
   Never use the same type more than 3 times in a row. Mix: Tell/Ask/Say/Respond/Explain/Warn/Suggest/Invite/Confirm/Deny/Express/Describe/Admit/Promise/Ask how
5. "words" array must have EXACTLY the same token count as space-separated tokens in "phonetic"
6. Use ANCHOR WORDS as supporting vocabulary — don't cluster all target words together
7. Sentences must stay within ${goalMin}–${goalMax} words, NEVER exceed ${effectiveCeil} words

APPROVED VOCABULARY: \${approvedList}

Example pair (correct tone marks on every word):
{"prompt":"Ask if your friend wants to go eat rice","thai":"คุณอยากไปกินข้าวไหมครับ","english":"Do you want to go eat rice?","phonetic":"khun yàak pai gin khâo mǎi khrâp","words":[{"p":"khun","e":"you"},{"p":"yàak","e":"want"},{"p":"pai","e":"go"},{"p":"gin","e":"eat"},{"p":"khâo","e":"rice"},{"p":"mǎi","e":"?"},{"p":"khrâp","e":"[polite]"}],"target_phonetic":"gin"}

Respond ONLY with valid JSON array, no markdown:
[{"prompt":"...","thai":"...","english":"...","phonetic":"...","words":[...],"target_phonetic":"..."}] (90 pairs total)`

  const user = `TARGET WORDS (each must appear 3x):\n${targetList}\n\nANCHOR WORDS (review, 1-2x each):\n${anchorList}`

  return { system, user, approvedList }
}
