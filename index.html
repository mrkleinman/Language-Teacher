                  {phonetic && <span className="phon" style={{ color: done ? color : 'var(--gold)', fontSize:9, marginTop:1, opacity: done ? 1 : 0.7 }}>{phonetic}</span>}
                </div>
              )
            })}
          </div>
        </Card>
      )}
    </div>
  )
}

// ── Track Player ─────────────────────────────────────────────────────────────

// Count syllables in Thai text (each Thai syllable cluster = 1 unit)
// Simple heuristic: split on spaces, each token = ~1 syllable for short words, 2 for long
// Count syllables from phonetic string (space-separated tokens = syllables)
// Falls back to Thai char-based estimate if no phonetic available
function countSyllables(thai, phonetic) {
  if (phonetic && phonetic.trim()) {
    return phonetic.trim().split(/\s+/).filter(Boolean).length
  }
  // Thai char estimate: avg ~2.5 chars per syllable (incl tone marks, vowels)
  const chars = (thai || '').replace(/[\s]/g, '').length
  return Math.max(2, Math.round(chars / 2.5))
}

// Pimsleur S = 1.5n + 1.0, but add TTS speaking time on top
// TTS speaks at ~thaiSpeed rate so we add extra buffer
function calcDuration(thai, phase, phonetic) {
  if (phase === 'prompt') {
    // English: ~130wpm reading pace + 1.5s thinking buffer
    const words = (thai || '').trim().split(/\s+/).length
    return Math.max(4000, Math.round(words * 460 + 1500))
  }
  const n = countSyllables(thai, phonetic)
  // Pimsleur repeat pause: S = 2.0n + 1.5 seconds AFTER speech ends
  // Add estimated TTS duration (~0.4s per syllable at 0.8x)
  const ttsDur = Math.round(n * 400)
  const pauseDur = Math.round((2.0 * n + 1.5) * 1000)
  return ttsDur + pauseDur
}

function Player({ track, onComplete, onBack, onKru, onBookmark }) {
  const pairs = track.pairs || []
  const [idx, setIdx] = useState(track.bookmark || 0)
  const [bookmarked, setBookmarked] = useState(false)
  const [phase, setPhase] = useState('prompt')
  const [playing, setPlaying] = useState(false)
  const [countdown3, setCountdown3] = useState(3)
  const [speaking, setSpeaking] = useState(false)
  const [countdown, setCountdown] = useState(1)
  const [lessonDone, setLessonDone] = useState(false)
  const [keywords, setKeywords] = useState((track.keywords || []).map(k => ({ ...k, rating: null })))
  const [allRated, setAllRated] = useState(false)
  const [voices, setVoices] = useState([])
  const [thaiSpeed, setThaiSpeed] = useState(() => { try { const s = localStorage.getItem('tt-speed'); return s ? parseFloat(s) : 0.8 } catch { return 0.8 } })
  const cancelledRef = useRef(false)
  const pausedRef = useRef(false)
  const rafRef = useRef(null)

  const pair = pairs[idx] || {}
  const overallPct = Math.round((idx / pairs.length) * 100)
  const HAS_SPEECH = typeof window !== 'undefined' && 'speechSynthesis' in window

  // Estimated time remaining (sum of all remaining pairs)
  const timeLeft = useMemo(() => {
    let ms = 0
    for (let i = idx; i < pairs.length; i++) {
      const p = pairs[i]
      ms += calcDuration(p.prompt, 'prompt', null) + 1800 + calcDuration(p.thai, 'reveal', p.phonetic) + 2500
    }
    // Subtract current phase if already in reveal
    if (phase === 'reveal') ms -= calcDuration(pair.prompt, 'prompt', null) + 1800
    const mins = Math.ceil(ms / 60000)
    return mins <= 1 ? '< 1 min' : `~${mins} min`
  }, [idx, phase, pairs])

  // ── 3-2-1 lead-in before playback starts ──
  useEffect(() => {
    let n = 3
    setCountdown3(n)
    const iv = setInterval(() => {
      n--
      if (n > 0) setCountdown3(n)
      else { clearInterval(iv); setCountdown3(0); setPlaying(true) }
    }, 1000)
    return () => clearInterval(iv)
  }, [])

  useEffect(() => {
    if (!HAS_SPEECH) return
    function load() { const v = window.speechSynthesis.getVoices(); if (v.length) setVoices(v) }
    load()
    window.speechSynthesis.onvoiceschanged = load
    return () => { try { window.speechSynthesis.onvoiceschanged = null } catch(e) {} }
  }, [])

  function startCountdown(ms) {
    if (rafRef.current) cancelAnimationFrame(rafRef.current)
    const start = Date.now()
    setCountdown(1)
    function tick() {
      const remaining = Math.max(0, 1 - (Date.now() - start) / ms)
      setCountdown(remaining)
      if (remaining > 0 && !cancelledRef.current) rafRef.current = requestAnimationFrame(tick)
    }
    rafRef.current = requestAnimationFrame(tick)
  }

  function stopCountdown() {
    if (rafRef.current) cancelAnimationFrame(rafRef.current)
    setCountdown(0)
  }

  function speakOrWait(text, lang, ms, onDone) {
    if (!HAS_SPEECH) {
      setSpeaking(true); startCountdown(ms)
      const t = setTimeout(() => { setSpeaking(false); stopCountdown(); if (!cancelledRef.current) onDone() }, ms)
      return () => clearTimeout(t)
    }
    try { window.speechSynthesis.cancel() } catch(e) {}
    const utter = new SpeechSynthesisUtterance(text)
    utter.lang = lang
    utter.rate = lang.startsWith('th') ? thaiSpeed : 0.88
    const match = voices.find(v => v.lang.startsWith(lang.slice(0, 2)))
    if (match) utter.voice = match
    setSpeaking(true); startCountdown(ms)
    utter.onend = () => { setSpeaking(false); stopCountdown(); if (!pausedRef.current && !cancelledRef.current) onDone() }
    utter.onerror = () => { setSpeaking(false); stopCountdown(); if (!cancelledRef.current) onDone() }
    try { window.speechSynthesis.speak(utter) } catch(e) { setSpeaking(false); stopCountdown(); onDone() }
    return () => { try { window.speechSynthesis.cancel() } catch(e) {} setSpeaking(false); stopCountdown() }
  }

  useEffect(() => {
    if (!playing || lessonDone) return
    cancelledRef.current = false; pausedRef.current = false
    const promptDur = calcDuration(pair.prompt, 'prompt')
    const revealDur = calcDuration(pair.thai, 'reveal')
    let cleanup = () => {}
    if (phase === 'prompt') {
      // Pause after prompt = Pimsleur formula based on Thai answer syllables
      const n = countSyllables(pair.thai, pair.phonetic)
      const thinkMs = Math.round((0.6 * n + 0.4) * 1000)
      cleanup = speakOrWait(pair.prompt, 'en-US', promptDur, () => {
        // This fires from utter.onend — AFTER speech actually finishes
        startCountdown(thinkMs)
        const t = setTimeout(() => { if (!cancelledRef.current) { stopCountdown(); setPhase('reveal') } }, thinkMs)
        return () => clearTimeout(t)
      }) || (() => {})
    } else {
      cleanup = speakOrWait(pair.thai, 'th-TH', revealDur, () => {
        startCountdown(2500)
        const t = setTimeout(() => {
          if (cancelledRef.current) return
          stopCountdown()
          if (idx < pairs.length - 1) { setIdx(i => i + 1); setPhase('prompt') }
          else setLessonDone(true)
        }, 2500)
        return () => clearTimeout(t)
      }) || (() => {})
    }
    return () => {
      cancelledRef.current = true
      try { if (HAS_SPEECH) window.speechSynthesis.cancel() } catch(e) {}
      setSpeaking(false); stopCountdown(); cleanup()
    }
  }, [idx, phase, playing, lessonDone, voices])

  function togglePlay() {
    if (playing) {
      pausedRef.current = true
      try { if (HAS_SPEECH) window.speechSynthesis.pause() } catch(e) {}
      if (rafRef.current) cancelAnimationFrame(rafRef.current)
      setPlaying(false)
    } else {
      pausedRef.current = false
      try { if (HAS_SPEECH) window.speechSynthesis.resume() } catch(e) {}
      setPlaying(true)
    }
  }

  function jumpTo(newIdx, newPhase = 'prompt') {
    cancelledRef.current = true
    try { if (HAS_SPEECH) window.speechSynthesis.cancel() } catch(e) {}
    setSpeaking(false); stopCountdown()
    setIdx(newIdx); setPhase(newPhase); setPlaying(true)
    setTimeout(() => { cancelledRef.current = false }, 50)
  }

  function rateKeyword(i, rating) {
    setKeywords(kw => {
      const u = kw.map((k, ki) => ki === i ? { ...k, rating } : k)
      setAllRated(u.every(k => k.rating))
      return u
    })
  }

  const Waveform = () => (
    <div style={{ display:'flex', alignItems:'center', gap:3, height:24 }}>
      {[0,1,2,3,4,5,6].map(i => (
        <div key={i} style={{ width:3, borderRadius:2, background:phase==='reveal'?'var(--gold)':'#4a90e2', height:speaking?`${8+Math.sin(i*0.9)*8+4}px`:'4px', animation:speaking?`wave 0.7s ease-in-out ${i*0.09}s infinite alternate`:'none', transition:'height 0.2s' }} />
      ))}
      <style>{`@keyframes wave{from{height:4px}to{height:22px}}`}</style>
    </div>
  )

  if (lessonDone) {
    return (
      <div className="fade-in" style={{ background:'var(--bg)', minHeight:'100vh', padding:'16px 16px 40px', maxWidth:500, margin:'0 auto' }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:8 }}>
          <button onClick={onBack} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', padding:4 }}><Icon name="x" size={20} /></button>
          <div>
            <div className="display" style={{ fontSize:18 }}>Lesson complete!</div>
            <div style={{ fontSize:12, color:'var(--muted)' }}>Rate how well you knew each word</div>
          </div>
        </div>
        <div style={{ height:3, background:'var(--gold)', borderRadius:2, marginBottom:24 }} />
        <div style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:24 }}>
          {keywords.map((kw,i) => (
            <div key={i} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:'14px 16px' }}>
              <div style={{ display:'flex', alignItems:'baseline', gap:10, marginBottom:12 }}>
                <span className="thai" style={{ fontSize:26, color:'var(--gold)' }}>{kw.thai}</span>
                {kw.phonetic && <span className="phon" style={{ fontSize:13, color:'#7a8aad' }}>{kw.phonetic}</span>}
                <span style={{ color:'var(--muted)', fontSize:14 }}>{kw.english}</span>
              </div>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                {[['hard','😅','#ef4444','#2d1515'],['ok','👍','#f59e0b','#3d2800'],['easy','⭐','#10b981','#063d2e']].map(([r,e,col,bg]) => (
                  <button key={r} onClick={() => rateKeyword(i,r)}
                    style={{ flex:1, padding:'9px 4px', borderRadius:8, border:`1px solid ${kw.rating===r?col:'var(--border)'}`, background:kw.rating===r?bg:'transparent', color:kw.rating===r?col:'var(--muted)', cursor:'pointer', fontSize:13, fontWeight:700, fontFamily:'Sarabun,sans-serif', transition:'all 0.15s' }}>
                    {e} {r}
                  </button>
                ))}
                <button onClick={() => rateKeyword(i,'known')}
                  style={{ flexBasis:'48%', padding:'7px 4px', borderRadius:8, border:`1px solid ${kw.rating==='known'?'#10b981':'var(--border)'}`, background:kw.rating==='known'?'#063d2e':'transparent', color:kw.rating==='known'?'#10b981':'var(--muted)', cursor:'pointer', fontSize:11, fontWeight:700, fontFamily:'Sarabun,sans-serif', transition:'all 0.15s' }}>
                  ✓ Mark Known
                </button>
                <button onClick={() => rateKeyword(i,'skip')}
                  style={{ flexBasis:'48%', padding:'7px 4px', borderRadius:8, border:`1px solid ${kw.rating==='skip'?'#6b7280':'var(--border)'}`, background:kw.rating==='skip'?'#1a1a2e':'transparent', color:kw.rating==='skip'?'#9ca3af':'var(--muted)', cursor:'pointer', fontSize:11, fontWeight:600, fontFamily:'Sarabun,sans-serif', transition:'all 0.15s' }}>
                  🚫 Didn't appear
                </button>
              </div>
            </div>
          ))}
        </div>
        <button onClick={() => onComplete(keywords)} disabled={!allRated}
          style={{ width:'100%', padding:'15px', borderRadius:12, border:'none', background:allRated?'linear-gradient(135deg,#d4a94a,#b88a35)':'var(--surface2)', color:allRated?'#0b1120':'var(--muted)', fontSize:16, fontWeight:700, cursor:allRated?'pointer':'not-allowed', fontFamily:'Sarabun,sans-serif', transition:'all 0.2s' }}>
          Save Progress
        </button>
      </div>
    )
  }

  const barColor = speaking ? (phase==='prompt' ? '#4a90e2' : 'var(--gold)') : 'var(--surface2)'

  return (
    <div style={{ background:'var(--bg)', minHeight:'100vh', display:'flex', flexDirection:'column', maxWidth:500, margin:'0 auto', userSelect:'none' }}>

      {/* Overall progress — top */}
      <div style={{ height:3, background:'var(--surface2)' }}>
        <div style={{ height:'100%', width:`${overallPct}%`, background:'linear-gradient(90deg,#d4a94a,#10b981)', transition:'width 0.5s ease' }} />
      </div>

      {/* Controls */}
      <div style={{ display:'flex', alignItems:'center', padding:'10px 16px', gap:8 }}>
        <button onClick={onBack} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', padding:4 }}><Icon name="arrow_left" size={18} /></button>
        <span style={{ fontSize:13, color:'var(--muted)' }}>{idx+1} / {pairs.length}</span>
        <span style={{ fontSize:11, color:'var(--gold-dim)', marginLeft:4 }}>{timeLeft}</span>
        <div style={{ flex:1 }} />
        <button onClick={() => idx>0 && jumpTo(idx-1)} disabled={idx===0}
          style={{ background:'none', border:'none', color:idx===0?'var(--border)':'var(--muted)', cursor:idx===0?'default':'pointer', padding:'6px 8px', fontSize:18 }}>⏮</button>
        <button onClick={togglePlay}
          style={{ width:40, height:40, borderRadius:'50%', border:'1px solid var(--border)', background:'var(--surface)', color:'var(--text)', cursor:'pointer', fontSize:18, display:'flex', alignItems:'center', justifyContent:'center' }}>
          {playing ? '⏸' : '▶'}
        </button>
        <button onClick={() => idx<pairs.length-1 ? jumpTo(idx+1) : setLessonDone(true)}
          style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', padding:'6px 8px', fontSize:18 }}>⏭</button>
        <button onClick={() => { cancelledRef.current = true; try { if (HAS_SPEECH) window.speechSynthesis.cancel() } catch(e) {} setSpeaking(false); stopCountdown(); setLessonDone(true) }}
          style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:20, padding:'5px 10px', cursor:'pointer', color:'#f59e0b', fontSize:12, fontWeight:600, fontFamily:'Sarabun,sans-serif' }}>☑ Review</button>
        <button onClick={() => { onBookmark && onBookmark(idx); setBookmarked(true); setTimeout(() => setBookmarked(false), 2000) }}
          style={{ background: bookmarked ? '#1a2a00' : 'var(--surface)', border:`1px solid ${bookmarked ? '#4a7a00' : 'var(--border)'}`, borderRadius:20, padding:'5px 10px', cursor:'pointer', color: bookmarked ? '#86c900' : 'var(--muted)', fontSize:12, fontWeight:600, fontFamily:'Sarabun,sans-serif', transition:'all 0.2s' }}>
          {bookmarked ? '✓ Saved' : '🔖 Pair ' + (idx + 1)}</button>
        <button onClick={() => { togglePlay(); onKru(pair.prompt) }}
          style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:20, padding:'5px 10px', cursor:'pointer', color:'var(--gold)', fontSize:12, fontWeight:600, fontFamily:'Sarabun,sans-serif' }}>ครู</button>
      </div>

      {/* Resume from bookmark banner */}
      {track.bookmark > 0 && idx === (track.bookmark || 0) && !playing && (
        <div style={{ margin:'6px 16px 0', background:'#0d1a00', border:'1px solid #3a6000', borderRadius:8, padding:'7px 12px', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:13 }}>🔖</span>
          <span style={{ fontSize:12, color:'#86c900', flex:1 }}>Resuming from pair {(track.bookmark || 0) + 1} of {pairs.length}</span>
          <button onClick={() => { setIdx(0) }} style={{ background:'none', border:'none', color:'var(--muted)', fontSize:11, cursor:'pointer', fontFamily:'Sarabun,sans-serif' }}>Start over</button>
        </div>
      )}

      {/* Thai speed control */}
      <div style={{ display:'flex', alignItems:'center', gap:10, padding:'4px 16px 0' }}>
        <span style={{ fontSize:11, color:'var(--muted)', whiteSpace:'nowrap' }}>🐢</span>
        <input type="range" min="0.4" max="1.2" step="0.05" value={thaiSpeed}
          onChange={e => { const v = parseFloat(e.target.value); setThaiSpeed(v); try { localStorage.setItem('tt-speed', v) } catch {} }}
          style={{ flex:1, accentColor:'var(--gold)', height:4, cursor:'pointer' }} />
        <span style={{ fontSize:11, color:'var(--muted)', whiteSpace:'nowrap' }}>🐇</span>
        <span className="phon" style={{ fontSize:11, color:'var(--gold)', minWidth:28, textAlign:'right' }}>{thaiSpeed.toFixed(2)}x</span>
      </div>

      {/* Countdown bar — shrinks left to right, resets each phase */}
      <div style={{ margin:'0 16px', height:5, background:'var(--surface2)', borderRadius:3, overflow:'hidden' }}>
        <div style={{ height:'100%', width:`${countdown*100}%`, background:barColor, borderRadius:3, transition:'background 0.3s' }} />
      </div>
      <div style={{ textAlign:'center', padding:'6px 0 0', fontSize:10, letterSpacing:'0.1em', color:'var(--muted)', textTransform:'uppercase' }}>
        {!playing && countdown3 > 0 ? `Starting in ${countdown3}...` : !playing ? '⏸ paused' : speaking ? (phase==='prompt' ? 'listening...' : 'repeat aloud ↑') : 'get ready...'}
      </div>

      {/* Main content */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'16px 32px 32px', textAlign:'center', gap:24 }}>
        {phase === 'prompt' ? (
          <div className="fade-in" key={`p-${idx}`} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:20 }}>
            <div style={{ fontSize:11, letterSpacing:'0.12em', color:'#4a90e2', textTransform:'uppercase', fontWeight:600 }}>Say in Thai</div>
            <p style={{ fontSize:22, fontWeight:600, lineHeight:1.65, color:'var(--text)', maxWidth:340 }}>{pair.prompt}</p>
            <Waveform />

          </div>
        ) : (
          <div className="fade-in" key={`r-${idx}`} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:14 }}>
            <div style={{ fontSize:11, letterSpacing:'0.12em', color:'var(--gold)', textTransform:'uppercase', fontWeight:600 }}>Repeat aloud</div>
            {/* Aligned phonetic + gloss or plain phonetic fallback */}
            {pair.words && pair.words.length > 0 && pair.words.some(w => w.p) ? (
              <div style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', gap:'6px 10px', maxWidth:360 }}>
                {pair.words.map((w, i) => (
                  <div key={i} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:2 }}>
                    <span className="phon" style={{ fontSize:22, color:'var(--gold)', fontWeight:700 }}>{w.p}</span>
                    <span style={{ fontSize:18, color:'#c8d8f0', fontStyle:'italic', whiteSpace:'nowrap' }}>{w.e}</span>
                  </div>
                ))}
              </div>
            ) : pair.phonetic ? (
              <p className="phon" style={{ fontSize:38, color:'var(--gold)', lineHeight:1.5, maxWidth:360, textAlign:'center' }}>{pair.phonetic}</p>
            ) : (
              <p className="phon" style={{ fontSize:22, color:'var(--muted)', lineHeight:1.5, maxWidth:360, textAlign:'center' }}>
                {pair.phonetic || pair.target_phonetic || ''}
              </p>
            )}
            <Waveform />
            <p className="thai" style={{ fontSize:26, color:'#a8b8d8', letterSpacing:'0.03em', textAlign:'center' }}>{pair.thai}</p>
            <p style={{ fontSize:21, color:'#e8d5a3', fontStyle:'italic' }}>{pair.english}</p>
          </div>
        )}
      </div>
    </div>
  )
}

// ── Browse Vocab ──────────────────────────────────────────────────────────────
function Browser({ vocab, onBack, initialFilter, phonetics, onCustomTrack, orKey, onVocabUpdate }) {
  const [q, setQ] = useState('')
  const [filter, setFilter] = useState(initialFilter || 'all')
  const [selecting, setSelecting] = useState(false)
  const [selected, setSelected] = useState(new Set())
  const today = new Date().toISOString().slice(0, 10)

  const filtered = useMemo(() => {
    return vocab.filter(w => {
      const matchQ = !q || w.thai.includes(q) || w.english.toLowerCase().includes(q.toLowerCase())
      let matchF
      if (filter === 'all') matchF = true
      else if (filter === 'due') matchF = w.status !== 'new' && w.dueDate && w.dueDate <= today
      else matchF = w.status === filter
      return matchQ && matchF
    })
  }, [vocab, q, filter, today])

  function toggleSelect(w) {
    if (!selecting) return
    setSelected(prev => {
      const next = new Set(prev)
      if (next.has(w.id)) next.delete(w.id)
      else if (next.size < 30) next.add(w.id)
      return next
    })
  }

  const [fetchingPhonetics, setFetchingPhonetics] = useState(false)
  const [fetchProgress, setFetchProgress] = useState('')

  function phoneticsNeedsFixing(p) {
    if (!p) return true  // missing
    // IPA characters that don't belong in romanization
    if (/[ɔɛɯʰŋːɪɐɑʌʊ]/u.test(p)) return true
    // No tone marks at all AND more than one syllable (single syllable mid-tone ok)
    const toneMarks = 'àáâǎ'
    const hasTone = [...toneMarks].some(c => p.includes(c))
    if (!hasTone && p.replace(/[-\s]/g,'').length > 4) return true
    return false
  }

  const [fetchCount, setFetchCount] = useState(0)
  const [fetchTotal, setFetchTotal] = useState(0)

  async function getPhonetics() {
    if (!orKey || fetchingPhonetics) return
    const needsFix = vocab.filter(w => phoneticsNeedsFixing(w.phonetic))
    if (!needsFix.length) { setFetchProgress('✅ All phonetics look good!'); setTimeout(() => setFetchProgress(''), 3000); return }
    setFetchingPhonetics(true)
    setFetchCount(0)
    setFetchTotal(needsFix.length)
    const BATCH = 20  // smaller batch so all fit in token limit
    let updated = [...vocab]
    let done = 0
    for (let i = 0; i < needsFix.length; i += BATCH) {
      const batch = needsFix.slice(i, i + BATCH)
      try {
        const map = await fetchTargetPhoneticsQwen(batch, orKey)
        for (const w of batch) {
          const ph = map[w.id] || map[w.thai]  // check both id and thai key
          if (ph) {
            done++
            setFetchCount(done)
            updated = updated.map(v => v.id === w.id ? { ...v, phonetic: ph } : v)
          }
        }
        onVocabUpdate && onVocabUpdate(updated)
      } catch(e) { console.warn('Phonetic batch failed:', e) }
    }
    setFetchingPhonetics(false)
    setFetchTotal(0)
    const good = updated.filter(w => !phoneticsNeedsFixing(w.phonetic)).length
    setFetchProgress(`✅ ${good} / ${vocab.length} words fixed`)
    setTimeout(() => setFetchProgress(''), 5000)
  }

  const filters = [['all','All'],['due','Due'],['new','New'],['learning','Learning'],['known','Known'],['lapsed','Lapsed']]

  return (
    <div className="fade-in" style={{ padding: 16, maxWidth: 500, margin: '0 auto' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer' }}>
          <Icon name="arrow_left" size={20} />
        </button>
        <span className="display" style={{ fontSize: 18 }}>Browse Vocabulary</span>
        <span style={{ marginLeft: 'auto', fontSize: 12, color: 'var(--muted)' }}>{filtered.length} words</span>
      </div>

      {/* Search */}
      <div style={{ position: 'relative', marginBottom: 12 }}>

              </div>
            </Card>
          )
        })}
        {filtered.length === 0 && <p style={{ textAlign: 'center', color: 'var(--muted)', padding: 32 }}>No words found</p>}
      </div>
    </div>
  )
}

// ── Add Words ─────────────────────────────────────────────────────────────────
function Adder({ onBack, onAdded, orKey }) {
  const [thai, setThai] = useState('')
  const [english, setEnglish] = useState('')
  const [phonetic, setPhonetic] = useState('')
  const [added, setAdded] = useState([])
  const [bulk, setBulk] = useState('')
  const [tab, setTab] = useState('single')
  const [filling, setFilling] = useState(false)

  async function autoFill() {
    if (!thai.trim() || !orKey) return
    setFilling(true)
    try {
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${orKey}`, 'HTTP-Referer': 'https://magical-druid-656889.netlify.app', 'X-Title': 'Thai Teacher' },
        body: JSON.stringify({ model: 'openai/gpt-4o-mini', max_tokens: 200, temperature: 0,
          messages: [{ role: 'user', content: `For the Thai word/phrase "${thai.trim()}", give me:
1. English translation (short, common meaning)
2. Tone-marked romanization (mid=none, low=à, falling=â, high=á, rising=ǎ, hyphens between syllables)
Respond ONLY with valid JSON: {"english":"...","phonetic":"..."}` }] })
      })
      if (res.ok) {
        const data = await res.json()
        let text = (data.choices?.[0]?.message?.content || '').replace(/<think>[\s\S]*?<\/think>/g, '').trim().replace(/^```[\w]*[\r\n]?|[\r\n]?```$/g, '').trim()
        const parsed = JSON.parse(text)
        if (parsed.english && !english) setEnglish(parsed.english)
        if (parsed.phonetic) setPhonetic(parsed.phonetic)
      }
    } catch {}
    setFilling(false)
  }

  function addSingle() {
    if (!thai.trim() || !english.trim()) return
    const word = { thai: thai.trim(), english: english.trim(), phonetic: phonetic.trim() || undefined }
    setAdded(a => [...a, word])
    setThai(''); setEnglish(''); setPhonetic('')
  }

  function addBulk() {
    const lines = bulk.split('\n').filter(l => l.includes('=') || l.includes('-') || l.includes(':') || l.includes('\t'))
    const words = lines.map(l => {
      const [t, e] = l.split(/[=\-:\t]/).map(s => s.trim())
      return t && e ? { thai: t, english: e } : null
    }).filter(Boolean)
    setAdded(a => [...a, ...words])
    setBulk('')
  }

  function save() {
    if (!added.length) return
    onAdded(added)
  }

  const inputStyle = { width: '100%', padding: '10px 12px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 10, color: 'var(--text)', fontSize: 15, fontFamily: 'Sarabun, sans-serif', outline: 'none', marginBottom: 10 }

  return (
    <div className="fade-in" style={{ padding: 16, maxWidth: 500, margin: '0 auto' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer' }}>
          <Icon name="arrow_left" size={20} />
        </button>
        <span className="display" style={{ fontSize: 18 }}>Add Words</span>
      </div>

      {/* Tabs */}
      <div style={{ display: 'flex', gap: 0, marginBottom: 16, background: 'var(--surface)', borderRadius: 10, padding: 4 }}>
        {[['single', 'Single'], ['bulk', 'Bulk Import']].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            style={{ flex: 1, padding: '8px', borderRadius: 8, border: 'none', background: tab === id ? 'var(--surface2)' : 'transparent', color: tab === id ? 'var(--text)' : 'var(--muted)', fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'Sarabun, sans-serif', transition: 'all 0.15s' }}>
            {label}
          </button>
        ))}
      </div>

      {tab === 'single' ? (
        <div>
          <input value={thai} onChange={e => setThai(e.target.value)} placeholder="Thai word (e.g. กิน)" className="thai" style={inputStyle} onKeyDown={e => e.key === 'Enter' && addSingle()} />
          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
            <input value={english} onChange={e => setEnglish(e.target.value)} placeholder="English meaning (e.g. eat)" style={{ ...inputStyle, marginBottom: 0, flex: 1 }} onKeyDown={e => e.key === 'Enter' && addSingle()} />
            {orKey && <button onClick={autoFill} disabled={!thai.trim() || filling}
              style={{ padding: '10px 14px', borderRadius: 10, border: '1px solid var(--border)', background: 'var(--surface2)', color: thai.trim() ? 'var(--gold)' : 'var(--muted)', cursor: thai.trim() && !filling ? 'pointer' : 'default', fontSize: 13, fontFamily: 'Sarabun,sans-serif', whiteSpace: 'nowrap' }}>
              {filling ? '⏳' : '✨ Fill'}
            </button>}
          </div>
          <input value={phonetic} onChange={e => setPhonetic(e.target.value)} placeholder="Phonetic (e.g. gin) — optional" className="phon" style={{ ...inputStyle, fontSize: 13, color: 'var(--gold)' }} onKeyDown={e => e.key === 'Enter' && addSingle()} />
          <Btn onClick={addSingle} variant="secondary" style={{ width: '100%', justifyContent: 'center' }}>
            <Icon name="plus" size={14} /> Add Word
          </Btn>
        </div>
      ) : (
        <div>
          <p style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 8 }}>One word per line: Thai = English (or Thai - English, Thai: English)</p>
          <textarea value={bulk} onChange={e => setBulk(e.target.value)} placeholder={"กิน = eat\nดื่ม = drink\nนอน = sleep"}
            style={{ ...inputStyle, minHeight: 160, resize: 'vertical' }} />
          <Btn onClick={addBulk} variant="secondary" style={{ width: '100%', justifyContent: 'center' }}>
            <Icon name="plus" size={14} /> Parse & Add
          </Btn>
        </div>
      )}

      {/* Preview */}
      {added.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <p style={{ fontSize: 12, color: 'var(--muted)' }}>{added.length} words ready to save</p>
            <button onClick={() => setAdded([])} style={{ background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer', fontSize: 12 }}>Clear</button>
          </div>
          <div style={{ maxHeight: 200, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 4 }}>
            {added.map((w, i) => (
              <div key={i} style={{ display: 'flex', gap: 8, padding: '8px 12px', background: 'var(--surface)', borderRadius: 8, fontSize: 13 }}>
                <span className="thai" style={{ color: 'var(--gold)' }}>{w.thai}</span>
                {w.phonetic && <span className="phon" style={{ color: '#9a7a35', fontSize: 12 }}>{w.phonetic}</span>}
                <span style={{ color: 'var(--muted)' }}>= {w.english}</span>
              </div>
            ))}
          </div>
          <Btn onClick={save} variant="primary" style={{ width: '100%', justifyContent: 'center', marginTop: 12 }}>
            <Icon name="check" size={14} /> Save {added.length} Words
          </Btn>
        </div>
      )}
    </div>
  )
}

// ── Kru Chat ──────────────────────────────────────────────────────────────────
function KruPanel({ open, onClose, trackContext, vocab }) {
  const [msgs, setMsgs] = useState([
    { role: 'assistant', content: 'สวัสดีครับ! I\'m Kru, your Thai teacher. Ask me anything about Thai language — pronunciation, tones, grammar, vocabulary, culture!' }
  ])
  const [input, setInput] = useState('')
  const [loading, setLoading] = useState(false)
  const bottomRef = useRef(null)
  const inputRef = useRef(null)

  useEffect(() => { if (open) setTimeout(() => inputRef.current?.focus(), 300) }, [open])
  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }) }, [msgs])

  async function send() {
    const text = input.trim()
    if (!text || loading) return
    setInput('')
    const userMsg = { role: 'user', content: text }
    setMsgs(m => [...m, userMsg])
    setLoading(true)
    try {
      const history = [...msgs, userMsg].filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content }))
      const reply = await askKru(history, trackContext)
      setMsgs(m => [...m, { role: 'assistant', content: reply }])
    } catch (e) {
      setMsgs(m => [...m, { role: 'assistant', content: `Sorry, I had trouble responding: ${e.message}` }])
    }
    setLoading(false)
  }

  if (!open) return null

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 100, display: 'flex', flexDirection: 'column', background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(4px)' }} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{ marginTop: 'auto', background: 'var(--surface)', borderRadius: '20px 20px 0 0', border: '1px solid var(--border)', borderBottom: 'none', display: 'flex', flexDirection: 'column', maxHeight: '85vh' }}>
        {/* Header */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '14px 16px', borderBottom: '1px solid var(--border)' }}>
          <div style={{ width: 36, height: 36, borderRadius: '50%', background: 'linear-gradient(135deg, #d4a94a, #b88a35)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 }}>ครู</div>
          <div>
            <div className="display" style={{ fontSize: 16, color: 'var(--text)' }}>Kru</div>
            <div style={{ fontSize: 11, color: '#10b981' }}>Thai Teacher · Online</div>
          </div>
          <button onClick={onClose} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer' }}>
            <Icon name="x" size={20} />
          </button>
        </div>

        {/* Messages */}
        <div style={{ flex: 1, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
          {msgs.map((m, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
              <div style={{ maxWidth: '85%', padding: '10px 14px', borderRadius: m.role === 'user' ? '16px 16px 4px 16px' : '16px 16px 16px 4px', background: m.role === 'user' ? 'linear-gradient(135deg, #1e3a1e, #2a4a2a)' : 'var(--surface2)', border: m.role === 'user' ? '1px solid #2d6b2d' : '1px solid var(--border)', fontSize: 14, lineHeight: 1.6, whiteSpace: 'pre-wrap' }}>
                {m.content}
              </div>
            </div>
          ))}
          {loading && (
            <div style={{ display: 'flex', gap: 4, padding: '10px 14px', background: 'var(--surface2)', borderRadius: '16px 16px 16px 4px', width: 'fit-content', border: '1px solid var(--border)' }}>
              {[0, 1, 2].map(i => <div key={i} className="pulse-dot" style={{ width: 7, height: 7, borderRadius: '50%', background: 'var(--gold)', animationDelay: `${i * 0.2}s` }} />)}
            </div>
          )}
          <div ref={bottomRef} />
        </div>

        {/* Input */}
        <div style={{ padding: '12px 16px', borderTop: '1px solid var(--border)', display: 'flex', gap: 8 }}>
          <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && !e.shiftKey && send()}
            placeholder="Ask about Thai..." style={{ flex: 1, padding: '10px 14px', background: 'var(--surface2)', border: '1px solid var(--border)', borderRadius: 10, color: 'var(--text)', fontSize: 14, fontFamily: 'Sarabun, sans-serif', outline: 'none' }} />
          <button onClick={send} disabled={!input.trim() || loading}
            style={{ width: 40, height: 40, borderRadius: 10, background: input.trim() && !loading ? 'linear-gradient(135deg, #d4a94a, #b88a35)' : 'var(--surface2)', border: 'none', cursor: input.trim() && !loading ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.15s', color: '#0b1120' }}>
            <Icon name="send" size={16} color={input.trim() && !loading ? '#0b1120' : 'var(--muted)'} />
          </button>
        </div>
      </div>
    </div>
  )
}

// ── Import Track (paste JSON from Claude chat) ────────────────────────────────
function ImportTrack({ onBack, onImported, vocab }) {
  const [text, setText] = useState('')
  const [error, setError] = useState('')
  const [preview, setPreview] = useState(null)

  function parse() {
    setError('')
    try {
      // Accept raw JSON or a code block
      const clean = text.replace(/```json\n?|\n?```/g, '').trim()
      const data = JSON.parse(clean)
      // Accept array of pairs OR full track object
      const pairs = Array.isArray(data) ? data : data.pairs
      if (!pairs || !pairs.length) throw new Error('No pairs found')
      // Validate first pair has required fields
      if (!pairs[0].prompt || !pairs[0].thai) throw new Error('Pairs must have "prompt" and "thai" fields')
      // Build keywords list by matching thai words to vocab
      const keywords = []
      const seen = new Set()
      for (const p of pairs) {
        const match = vocab.find(w => p.thai?.includes(w.thai) && !seen.has(w.id))
        if (match) { keywords.push({ thai: match.thai, english: match.english, wordId: match.id, rating: null }); seen.add(match.id) }
      }
      const track = {
        date: data.date || new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
        mode: data.mode || 'daily',
        pairs,
        keywords: keywords.slice(0, 20),
        rated: false,
        createdAt: new Date().toISOString(),
      }
      setPreview(track)
    } catch (e) {
      setError(e.message)
    }
  }

  const wordCount = preview?.keywords?.length || 0

  return (
    <div className="fade-in" style={{ padding: 16, maxWidth: 500, margin: '0 auto' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer' }}>
          <Icon name="arrow_left" size={20} />
        </button>
        <span className="display" style={{ fontSize: 18 }}>Import Track from Chat</span>
      </div>

      {!preview ? (
        <>
          <Card style={{ padding: 16, marginBottom: 16, borderColor: 'var(--gold-dim)' }}>
            <p style={{ fontSize: 13, color: 'var(--gold)', fontWeight: 600, marginBottom: 6 }}>How to get your track:</p>
            <ol style={{ color: 'var(--muted)', fontSize: 13, lineHeight: 1.8, paddingLeft: 18 }}>
              <li>Go back to the Claude chat</li>
              <li>Say <strong style={{ color: 'var(--text)' }}>"Generate a daily track for me"</strong></li>
              <li>Claude will output a JSON track</li>
              <li>Copy the full JSON and paste it below</li>
            </ol>
          </Card>

          <textarea value={text} onChange={e => setText(e.target.value)}
            placeholder={'Paste track JSON here...\n\n[{"prompt": "...", "thai": "...", "english": "..."},\n ...]'}
            style={{ width: '100%', minHeight: 200, padding: '12px 14px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 10, color: 'var(--text)', fontSize: 13, fontFamily: 'DM Mono, monospace', outline: 'none', resize: 'vertical', marginBottom: 10 }} />

          {error && <p style={{ color: '#ef4444', fontSize: 13, marginBottom: 10 }}>⚠️ {error}</p>}

          <Btn onClick={parse} variant="primary" disabled={!text.trim()} style={{ width: '100%', justifyContent: 'center' }}>
            Parse Track
          </Btn>
        </>
      ) : (
        <div>
          <Card style={{ padding: 16, marginBottom: 14, borderColor: '#2d6b2d' }}>
            <p style={{ color: '#10b981', fontWeight: 600, marginBottom: 4 }}>✓ Track ready to load</p>
            <p style={{ color: 'var(--muted)', fontSize: 13 }}>{preview.pairs.length} pairs · {wordCount} keywords matched to your vocab</p>
          </Card>

          <div style={{ maxHeight: 260, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 14 }}>
            {preview.pairs.slice(0, 8).map((p, i) => (
              <Card key={i} style={{ padding: '10px 14px' }} hover={false}>
                <p style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 4 }}>{p.prompt}</p>
                <p className="thai" style={{ fontSize: 18, color: 'var(--gold)' }}>{p.thai}</p>
                {p.phonetic && <p className="phon" style={{ fontSize: 11, color: 'var(--muted)', marginTop: 2 }}>{p.phonetic}</p>}
              </Card>
            ))}
            {preview.pairs.length > 8 && <p style={{ textAlign: 'center', color: 'var(--muted)', fontSize: 12 }}>+{preview.pairs.length - 8} more pairs</p>}
          </div>

          <div style={{ display: 'flex', gap: 10 }}>
            <Btn onClick={() => setPreview(null)} variant="ghost" style={{ flex: 1, justifyContent: 'center' }}>Back</Btn>
            <Btn onClick={() => onImported(preview)} variant="primary" style={{ flex: 2, justifyContent: 'center' }}>

// ── Export / Import Data ─────────────────────────────────────────────────────
function DataManager({ onBack, vocab, tracks, onImport }) {
  const [importing, setImporting] = useState(false)
  const [msg, setMsg] = useState('')

  function exportData() {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      vocab,
      tracks,
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = `thai-teacher-backup-${new Date().toISOString().slice(0,10)}.json`
    a.click()
    URL.revokeObjectURL(url)
    setMsg('✅ Downloaded!')
    setTimeout(() => setMsg(''), 3000)
  }

  function handleImport(e) {
    const file = e.target.files[0]
    if (!file) return
    // Warn if this looks like the manifest
    if (file.name === 'manifest.json') {
      setMsg('❌ That is the app manifest file, not your backup. Pick thai-teacher-backup-*.json')
      return
    }
    setImporting(true)
    const reader = new FileReader()
    reader.onload = (ev) => {
      try {
        const raw = ev.target.result
        if (!raw || !raw.trim()) throw new Error('File is empty')
        const data = JSON.parse(raw)
        // Accept {version,vocab,tracks} format or raw vocab array
        let vocab, tracks
        if (Array.isArray(data)) {
          // Raw vocab array
          vocab = data; tracks = []
        } else if (data && Array.isArray(data.vocab)) {
          vocab = data.vocab; tracks = data.tracks || []
        } else {
          throw new Error('Could not find vocab data in file. Keys found: ' + Object.keys(data||{}).join(', '))
        }
        if (!vocab.length) throw new Error('Vocab list is empty')
        onImport(vocab, tracks)
        setMsg(`✅ Restored ${vocab.length} words and ${tracks.length} tracks — reloading...`)
        setTimeout(() => window.location.reload(), 1200)
      } catch(e) {
        setMsg('❌ ' + e.message)
      }
      setImporting(false)
    }
    reader.readAsText(file)
  }

  return (
    <div className="fade-in" style={{ padding:16, maxWidth:500, margin:'0 auto' }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:24 }}>
        <button onClick={onBack} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', padding:4 }}>
          <Icon name="arrow_left" size={20} />
        </button>
        <span className="display" style={{ fontSize:18 }}>Backup & Restore</span>
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
        <Card style={{ padding:16 }}>
          <p style={{ fontSize:13, fontWeight:600, color:'var(--text)', marginBottom:6 }}>Export Data</p>
          <p style={{ fontSize:12, color:'var(--muted)', marginBottom:12, lineHeight:1.6 }}>
            Downloads a JSON file with all your words, SRS progress, and track history. Save this to transfer to another device.
          </p>
          <p style={{ fontSize:11, color:'var(--muted)', marginBottom:12 }}>
            {vocab.length} words · {tracks.length} tracks
          </p>
          <Btn onClick={exportData} variant="primary" style={{ width:'100%', justifyContent:'center' }}>
            ⬇ Download Backup
          </Btn>
        </Card>

        <Card style={{ padding:16, borderColor:'#3d1a1a' }}>
          <p style={{ fontSize:13, fontWeight:600, color:'#ef4444', marginBottom:6 }}>Import & Replace</p>
          <p style={{ fontSize:12, color:'var(--muted)', marginBottom:12, lineHeight:1.6 }}>
            ⚠️ This replaces ALL current data with the backup file. Use to restore on a new device.
          </p>
          <label style={{ display:'block', padding:'12px', borderRadius:10, border:'1px dashed #3d1a1a', textAlign:'center', cursor:'pointer', color:'#ef4444', fontSize:14, fontWeight:600 }}>
            📂 Choose Backup File
            <p style={{ fontSize:10, color:'var(--muted)', marginTop:4 }}>Look for: thai-teacher-backup-YYYY-MM-DD.json</p>
            <input type="file" accept=".json" onChange={handleImport} style={{ display:'none' }} />
          </label>
        </Card>

        {msg && <p style={{ textAlign:'center', fontSize:13, color: msg.startsWith('✅') ? '#10b981' : '#ef4444', padding:8 }}>{msg}</p>}
      </div>
    </div>
  )
}

  })

  const allLessons = typeof LESSON_DATA !== 'undefined' ? LESSON_DATA : []
  const concepts = typeof CONCEPT_CARDS !== 'undefined' ? CONCEPT_CARDS : []

  const s1Lessons = allLessons.filter(l => l.season === 1 || (!l.season && l.id && l.id.includes('s1')))
  const s2Lessons = allLessons.filter(l => l.season === 2 || (l.id && l.id.includes('s2')))
  const seasons = [
    { num: 1, name: 'Noob Season One', lessons: s1Lessons, color: '#d4a94a', bg: 'linear-gradient(135deg, #2a1f00, #3d2d00)' },
    { num: 2, name: 'Noob Season Two', lessons: s2Lessons, color: '#7dd3fc', bg: 'linear-gradient(135deg, #001f3d, #002d5a)' },
  ]

  function markComplete(id) {
    const updated = completedIds.includes(id) ? completedIds.filter(x => x !== id) : [...completedIds, id]
    setCompletedIds(updated)
    try { localStorage.setItem('tt-completed-lessons', JSON.stringify(updated)) } catch {}
  }

  function getVoice(gender) {
    const voices = window.speechSynthesis?.getVoices() || []
    const thaiVoices = voices.filter(v => v.lang.startsWith('th'))
    if (thaiVoices.length > 0) {
      if (gender === 'female') return thaiVoices.find(v => /female|woman/i.test(v.name)) || thaiVoices[0]
      return thaiVoices.find(v => /male|man/i.test(v.name)) || thaiVoices[thaiVoices.length > 1 ? 1 : 0]
    }
    if (gender === 'female') return voices.find(v => /female|woman/i.test(v.name)) || voices[0]
    return voices.find(v => /male|man/i.test(v.name)) || voices[1] || voices[0]
  }

  function speak(text, gender, onEnd) {
    if (!window.speechSynthesis) { onEnd && onEnd(); return }
    window.speechSynthesis.cancel()
    const u = new SpeechSynthesisUtterance(text)
    u.lang = 'th-TH'
    const voice = getVoice(gender)
    if (voice) u.voice = voice
    u.rate = 0.85
    u.onend = () => { setSpeaking(false); onEnd && onEnd() }
    u.onerror = () => { setSpeaking(false); onEnd && onEnd() }
    setSpeaking(true)
    window.speechSynthesis.speak(u)
  }

  function addWordToLibrary(word) {
    if (!onVocabUpdate) return
    const exists = (vocab || []).some(v => v.t === word.thai || v.thai === word.thai)
    if (exists) return
    const newWord = { t: word.thai, e: word.english, ph: word.phonetic, l: 'new', i: 1, r: 0, lp: 0, id: 'lesson_' + Date.now() }
    onVocabUpdate([...(vocab||[]), newWord])
  }

  function wordInLibrary(thai) {
    return (vocab || []).some(v => v.t === thai || v.thai === thai)
  }

  // ── Lesson detail view ────────────────────────────────────────────────────
  if (selected) {
    const lesson = allLessons.find(l => l.id === selected)
    if (!lesson) return null
    const seasonInfo = seasons.find(s => s.num === (lesson.season || 1))
    const lc = (lesson.coreConceptIds||[]).map(id => concepts.find(c => c.id === id)).filter(Boolean)
    const SECTIONS = ['Intro','Dialogue','Vocab','Drill','Sentences','Culture']
    const drills = lesson.samples && lesson.samples.length > 0 ? lesson.samples.slice(0,5) : []
    const currentDrill = drills[drillIdx]
    const isComplete = completedIds.includes(lesson.id)

    return (
      <div style={{ padding:0, maxWidth:480, margin:'0 auto' }}>
        <div style={{ position:'sticky', top:0, background:'rgba(11,17,32,0.97)', borderBottom:'1px solid var(--border)', padding:'10px 16px', zIndex:10 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
            <button onClick={() => { setSelected(null); setSection(0); window.speechSynthesis?.cancel() }}
              style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', fontSize:22, padding:0, flexShrink:0 }}>←</button>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:11, color: seasonInfo?.color || 'var(--gold)', fontWeight:700 }}>
                {seasonInfo?.name?.toUpperCase()} · LESSON {lesson.num}
              </div>
              <div style={{ fontSize:15, fontWeight:800, color:'var(--text)', lineHeight:1.2 }}>{lesson.title}</div>
            </div>
            <button onClick={() => markComplete(lesson.id)}
              style={{ background: isComplete ? '#10b981' : 'var(--surface)', border:'1px solid', borderColor: isComplete ? '#10b981' : 'var(--border)', borderRadius:8, padding:'4px 10px', cursor:'pointer', fontSize:12, color: isComplete ? '#fff' : 'var(--muted)', fontWeight:600, flexShrink:0 }}>
              {isComplete ? '✓ Done' : 'Mark done'}
            </button>
          </div>
          <div style={{ display:'flex', gap:4, overflowX:'auto', paddingBottom:2 }}>
            {SECTIONS.map((s,i) => (
              <button key={i} onClick={() => { setSection(i); setShowAnswer(false); setDrillIdx(0); window.speechSynthesis?.cancel() }}
                style={{ padding:'4px 10px', borderRadius:20, border:'none', cursor:'pointer', fontSize:11, fontWeight:600, whiteSpace:'nowrap', flexShrink:0, background: section===i ? (seasonInfo?.color || 'var(--gold)') : 'var(--surface)', color: section===i ? '#000' : 'var(--muted)' }}>
                {s}
              </button>
            ))}
          </div>
        </div>

        <div style={{ padding:'16px', paddingBottom:80 }}>

          {section === 0 && (
            <div>
              <div style={{ fontSize:13, color:'var(--muted)', marginBottom:16, lineHeight:1.5 }}>{lesson.situation}</div>
              <div style={{ background:'var(--surface)', border:`1px solid ${seasonInfo?.color || 'var(--gold)'}`, borderRadius:12, padding:'16px', marginBottom:16 }}>
                <div style={{ fontSize:11, color: seasonInfo?.color || 'var(--gold)', fontWeight:700, marginBottom:8 }}>KEY PATTERN</div>
                <div style={{ fontSize:24, fontWeight:800, color:'var(--text)', marginBottom:6 }}>{lesson.keyPattern.thai}</div>
                <div style={{ fontSize:14, color:'#7dd3fc', marginBottom:4 }}>{lesson.keyPattern.phonetic}</div>
                <div style={{ fontSize:14, color:'var(--muted)' }}>{lesson.keyPattern.english}</div>
              </div>
              <div style={{ fontSize:14, color:'var(--text)', lineHeight:1.7, marginBottom:16 }}>{lesson.teacherExplanation}</div>
              {lc.length > 0 && lc.map(c => (
                <div key={c.id} style={{ background:'var(--surface)', borderRadius:10, padding:'10px 14px', marginBottom:8 }}>
                  <div style={{ fontSize:12, color: seasonInfo?.color || 'var(--gold)', fontWeight:700, marginBottom:2 }}>{c.name}</div>
                  <div style={{ fontSize:13, color:'var(--text)' }}>{c.pattern}</div>
                  <div style={{ fontSize:12, color:'var(--muted)', marginTop:2 }}>{c.meaning}</div>
                </div>
              ))}
              <button onClick={() => setSection(1)}
                style={{ width:'100%', marginTop:8, padding:'14px', background: seasonInfo?.color || 'var(--gold)', color:'#000', border:'none', borderRadius:10, fontWeight:700, cursor:'pointer', fontSize:15 }}>
                Start Lesson →
              </button>
            </div>
          )}

          {section === 1 && (
            <div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
                <div style={{ fontSize:13, fontWeight:700, color:'var(--text)' }}>Dialogue</div>
                <button onClick={() => {
                  window.speechSynthesis?.cancel()
                  let i = 0
                  const lines = lesson.dialogue || []
                  function next() {
                    if (i >= lines.length) return
                    const line = lines[i]
                    const prev = i > 0 ? lines[i-1] : null
                    const pause = prev && prev.gender !== line.gender ? 1400 : 800
                    i++
                    speak(line.thai, line.gender, () => setTimeout(next, pause))
                  }
                  next()
                }} style={{ padding:'6px 12px', background:'var(--surface)', border:`1px solid ${seasonInfo?.color || 'var(--gold)'}`, borderRadius:8, cursor:'pointer', fontSize:12, color: seasonInfo?.color || 'var(--gold)', fontWeight:600 }}>
                  {speaking ? '■ Stop' : '▶ Play all'}
                </button>
              </div>
              {(lesson.dialogue || []).map((line, i) => (
                <div key={i} style={{ display:'flex', gap:10, marginBottom:14, flexDirection: line.gender==='male' ? 'row' : 'row-reverse' }}>
                  <div style={{ width:32, height:32, borderRadius:'50%', background: line.gender==='male' ? '#1e3a5f' : '#3d1a3d', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, flexShrink:0 }}>
                    {line.gender==='male' ? '👨' : '👩'}
                  </div>
                  <div style={{ background:'var(--surface)', borderRadius:12, padding:'10px 14px', maxWidth:'80%', cursor:'pointer' }} onClick={() => speak(line.thai, line.gender)}>
                    <div style={{ fontSize:17, fontWeight:700, color:'var(--text)', marginBottom:3 }}>{line.thai}</div>
                    <div style={{ fontSize:12, color:'#7dd3fc', marginBottom:3 }}>{line.phonetic}</div>
                    <div style={{ fontSize:12, color:'var(--muted)' }}>{line.english}</div>
                    <div style={{ fontSize:10, color: seasonInfo?.color || 'var(--gold)', marginTop:4, opacity:0.7 }}>Tap to hear</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {section === 2 && (
            <div>
              <div style={{ fontSize:13, color:'var(--muted)', marginBottom:12 }}>Tap to hear. Add words to your SRS library.</div>
              {(lesson.vocab || []).length === 0 && <div style={{ color:'var(--muted)', fontSize:14, textAlign:'center', padding:20 }}>All vocab for this lesson is already in your library.</div>}
              {(lesson.vocab || []).map((w, i) => {
                const inLib = wordInLibrary(w.thai)
                return (
                  <div key={i} style={{ background:'var(--surface)', borderRadius:10, padding:'12px 14px', marginBottom:8, display:'flex', alignItems:'center', gap:12 }}>
                    <div style={{ flex:1, cursor:'pointer' }} onClick={() => speak(w.thai, 'female')}>
                      <div style={{ fontSize:20, fontWeight:800, color:'var(--text)' }}>{w.thai}</div>
                      <div style={{ fontSize:13, color:'#7dd3fc', marginTop:2 }}>{w.phonetic}</div>
                      <div style={{ fontSize:13, color:'var(--muted)', marginTop:1 }}>{w.english}</div>
                    </div>
                    <button onClick={() => addWordToLibrary(w)} disabled={inLib}
                      style={{ padding:'6px 12px', borderRadius:8, border:'none', cursor: inLib ? 'default' : 'pointer', fontSize:12, fontWeight:700, background: inLib ? 'var(--surface)' : (seasonInfo?.color || 'var(--gold)'), color: inLib ? '#10b981' : '#000', flexShrink:0 }}>
                      {inLib ? '✅ Added' : '+ Add'}
                    </button>
                  </div>
                )
              })}
            </div>
          )}

          {section === 3 && drills.length > 0 && currentDrill && (
            <div>
              <div style={{ fontSize:12, color:'var(--muted)', marginBottom:16, textAlign:'right' }}>{drillIdx+1} / {drills.length}</div>
              <div style={{ background:'var(--surface)', borderRadius:12, padding:'20px', marginBottom:16, minHeight:120 }}>
                <div style={{ fontSize:12, color: seasonInfo?.color || 'var(--gold)', fontWeight:700, marginBottom:12 }}>SAY IT IN THAI:</div>
                <div style={{ fontSize:18, color:'var(--text)', lineHeight:1.5 }}>{currentDrill.english}</div>
              </div>
              {showAnswer ? (
                <div>
                  <div style={{ background:'var(--surface)', border:`1px solid ${seasonInfo?.color || 'var(--gold)'}`, borderRadius:12, padding:'16px', marginBottom:16 }}>
                    <div style={{ fontSize:22, fontWeight:800, color: seasonInfo?.color || 'var(--gold)', marginBottom:6, cursor:'pointer' }} onClick={() => speak(currentDrill.thai, 'male')}>
                      {currentDrill.thai}
                    </div>
                    <div style={{ fontSize:14, color:'#7dd3fc', marginBottom:4 }}>{currentDrill.phonetic}</div>
                    <div style={{ fontSize:10, color: seasonInfo?.color || 'var(--gold)', opacity:0.7 }}>Tap Thai to hear</div>
                  </div>
                  <div style={{ display:'flex', gap:8 }}>
                    {drillIdx < drills.length - 1 ? (
                      <button onClick={() => { setDrillIdx(i => i+1); setShowAnswer(false) }}
                        style={{ flex:1, padding:'12px', background: seasonInfo?.color || 'var(--gold)', color:'#000', border:'none', borderRadius:10, fontWeight:700, cursor:'pointer', fontSize:15 }}>Next →</button>
                    ) : (
                      <button onClick={() => { setDrillIdx(0); setShowAnswer(false) }}
                        style={{ flex:1, padding:'12px', background:'var(--surface)', color:'var(--text)', border:'1px solid var(--border)', borderRadius:10, fontWeight:700, cursor:'pointer', fontSize:14 }}>Restart drills</button>
                    )}
                  </div>
                </div>
              ) : (
                <button onClick={() => { setShowAnswer(true); speak(currentDrill.thai, 'male') }}
                  style={{ width:'100%', padding:'14px', background:'var(--surface)', color:'var(--text)', border:`1px solid ${seasonInfo?.color || 'var(--gold)'}`, borderRadius:10, fontWeight:700, cursor:'pointer', fontSize:15 }}>
                  Show Answer + Hear
                </button>
              )}
            </div>
          )}
          {section === 3 && drills.length === 0 && (
            <div style={{ color:'var(--muted)', textAlign:'center', padding:40, fontSize:14 }}>No drills for this lesson yet.</div>
          )}

          {section === 4 && (
            <div>
              <div style={{ fontSize:13, color:'var(--muted)', marginBottom:12 }}>Real sentences using this lesson pattern. Tap to hear.</div>
              {(lesson.samples || []).map((s, i) => (
                <div key={i} style={{ background:'var(--surface)', borderRadius:10, padding:'12px 14px', marginBottom:8, cursor:'pointer' }} onClick={() => speak(s.thai, i%2===0 ? 'male' : 'female')}>
                  <div style={{ fontSize:18, fontWeight:700, color:'var(--text)', marginBottom:4 }}>{s.thai}</div>
                  <div style={{ fontSize:13, color:'#7dd3fc', marginBottom:3 }}>{s.phonetic}</div>
                  <div style={{ fontSize:13, color:'var(--muted)' }}>{s.english}</div>
                </div>
              ))}
              {(!lesson.samples || lesson.samples.length === 0) && <div style={{ color:'var(--muted)', textAlign:'center', padding:40, fontSize:14 }}>No sample sentences for this lesson.</div>}
            </div>
          )}

          {section === 5 && (
            <div>
              <div style={{ background:'var(--surface)', borderRadius:12, padding:'16px', marginBottom:20 }}>
                <div style={{ fontSize:11, color: seasonInfo?.color || 'var(--gold)', fontWeight:700, marginBottom:10 }}>🇹🇭 CULTURAL NOTE</div>
                <div style={{ fontSize:15, color:'var(--text)', lineHeight:1.7 }}>{lesson.cultural || 'No cultural note for this lesson.'}</div>
              </div>
              {!isComplete ? (
                <button onClick={() => { markComplete(lesson.id); setSection(0) }}
                  style={{ width:'100%', padding:'14px', background:'#10b981', color:'#fff', border:'none', borderRadius:10, fontWeight:700, cursor:'pointer', fontSize:15 }}>
                  ✓ Complete Lesson
                </button>
              ) : (
                <div style={{ textAlign:'center', color:'#10b981', fontWeight:700, fontSize:15, padding:12 }}>✓ Lesson Complete</div>
              )}
            </div>
          )}

        </div>
      </div>
    )
  }

  // ── Season lesson list ────────────────────────────────────────────────────
  if (selectedSeason !== null) {
    const season = seasons[selectedSeason]
    const seasonLessons = season.lessons
    const seasonCompleted = seasonLessons.filter(l => completedIds.includes(l.id)).length
    const seasonPct = seasonLessons.length ? Math.round((seasonCompleted / seasonLessons.length) * 100) : 0

    return (
      <div style={{ padding:'16px', maxWidth:480, margin:'0 auto' }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:16 }}>
          <button onClick={() => setSelectedSeason(null)} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', fontSize:22, padding:0 }}>←</button>
          <div style={{ flex:1 }}>
            <h2 style={{ margin:0, fontSize:20, color: season.color }}>{season.name}</h2>
            <div style={{ fontSize:12, color:'var(--muted)' }}>{seasonLessons.length} lessons</div>
          </div>
          <div style={{ textAlign:'right' }}>
            <div style={{ fontSize:18, fontWeight:800, color: season.color }}>{seasonPct}%</div>
            <div style={{ fontSize:11, color:'var(--muted)' }}>{seasonCompleted}/{seasonLessons.length}</div>
          </div>
        </div>
        <div style={{ background:'var(--surface)', borderRadius:6, height:8, overflow:'hidden', marginBottom:20 }}>
          <div style={{ height:'100%', width:`${seasonPct}%`, background: season.color, borderRadius:6, transition:'width 0.4s' }} />
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          {seasonLessons.map(l => {
            const done = completedIds.includes(l.id)
            const lc = (l.coreConceptIds||[]).map(id => concepts.find(c => c.id === id)).filter(Boolean)
            return (
              <div key={l.id} onClick={() => { setSelected(l.id); setSection(0); setShowAnswer(false); setDrillIdx(0) }}
                style={{ background:'var(--surface)', border:`1px solid ${done ? '#10b981' : 'var(--border)'}`, borderRadius:10, padding:'12px 14px', cursor:'pointer' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                  <div style={{ flex:1 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:3 }}>
                      <span style={{ fontSize:11, color: season.color, fontWeight:700 }}>LESSON {l.num}</span>
                      {done && <span style={{ fontSize:11, color:'#10b981', fontWeight:700 }}>✓ DONE</span>}
                    </div>
                    <div style={{ fontSize:14, fontWeight:700, color:'var(--text)', marginBottom:4 }}>{l.title}</div>
                    <div style={{ fontSize:12, color:'#7dd3fc' }}>{l.keyPattern&&l.keyPattern.thai} — {l.keyPattern&&l.keyPattern.english}</div>
                  </div>
                  <div style={{ fontSize:18, color:'var(--muted)', marginLeft:8 }}>›</div>
                </div>
                {lc.length > 0 && (
                  <div style={{ display:'flex', flexWrap:'wrap', gap:4, marginTop:6 }}>
                    {lc.map(c => (
                      <span key={c.id} style={{ fontSize:10, background:`rgba(${season.num===1?'201,160,79':'125,211,252'},0.15)`, color: season.color, padding:'2px 6px', borderRadius:4 }}>
                        {c.name}
                      </span>
                    ))}
                  </div>
                )}
              </div>
            )
          })}
        </div>
        <div style={{ height:30 }} />
      </div>
    )
  }

  // ── Season selector (top level) ───────────────────────────────────────────
  const totalLessons = allLessons.length
  const totalCompleted = completedIds.filter(id => allLessons.some(l => l.id === id)).length
  const totalPct = totalLessons ? Math.round((totalCompleted / totalLessons) * 100) : 0

  return (
    <div style={{ padding:'16px', maxWidth:480, margin:'0 auto' }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:20 }}>
        <button onClick={onBack} style={{ background:'none', border:'none', color:'var(--muted)', cursor:'pointer', fontSize:22, padding:0 }}>←</button>
        <div style={{ flex:1 }}>
          <h2 style={{ margin:0, fontSize:20, color:'var(--text)' }}>Lessons</h2>
          <div style={{ fontSize:12, color:'var(--muted)' }}>{totalLessons} total lessons</div>
        </div>
        <div style={{ textAlign:'right' }}>
          <div style={{ fontSize:18, fontWeight:800, color:'var(--gold)' }}>{totalPct}%</div>
          <div style={{ fontSize:11, color:'var(--muted)' }}>{totalCompleted}/{totalLessons} done</div>
        </div>
      </div>

      {/* Overall progress */}
      <div style={{ background:'var(--surface)', borderRadius:6, height:8, overflow:'hidden', marginBottom:24 }}>
        <div style={{ height:'100%', width:`${totalPct}%`, background:'linear-gradient(90deg, var(--gold), #7dd3fc)', borderRadius:6, transition:'width 0.4s' }} />
      </div>

      {/* Season cards */}
      {seasons.map((season, idx) => {
        const completed = season.lessons.filter(l => completedIds.includes(l.id)).length
        const pct = season.lessons.length ? Math.round((completed / season.lessons.length) * 100) : 0
        return (
          <div key={idx} onClick={() => setSelectedSeason(idx)}
            style={{ background: season.bg, border:`1px solid ${season.color}33`, borderRadius:14, padding:'20px', marginBottom:14, cursor:'pointer', position:'relative', overflow:'hidden' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12 }}>
              <div>
                <div style={{ fontSize:11, color: season.color, fontWeight:700, marginBottom:4, letterSpacing:'0.05em' }}>ABSOLUTE BEGINNER</div>
                <div style={{ fontSize:20, fontWeight:800, color:'#fff' }}>{season.name}</div>
                <div style={{ fontSize:12, color:'rgba(255,255,255,0.5)', marginTop:4 }}>{season.lessons.length} lessons · {season.lessons.reduce((s,l)=>s+(l.dialogue||[]).length,0)} dialogue lines</div>
              </div>
              <div style={{ textAlign:'right' }}>
                <div style={{ fontSize:28, fontWeight:900, color: season.color }}>{pct}%</div>
                <div style={{ fontSize:12, color:'rgba(255,255,255,0.5)' }}>{completed}/{season.lessons.length}</div>
              </div>
            </div>
            <div style={{ background:'rgba(255,255,255,0.1)', borderRadius:6, height:8, overflow:'hidden' }}>
              <div style={{ height:'100%', width:`${pct}%`, background: season.color, borderRadius:6, transition:'width 0.4s' }} />
            </div>
            <div style={{ position:'absolute', right:16, top:'50%', transform:'translateY(-50%)', fontSize:24, color:'rgba(255,255,255,0.2)' }}>›</div>
          </div>
        )
      })}

      <div style={{ height:30 }} />
    </div>
  )
}


function ThaiTeacher() {
  const [vocab, setVocab] = useState([])
  const [tracks, setTracks] = useState([])
  const [view, setView] = useState('dashboard')
  const [loading, setLoading] = useState(true)
  const [activeTrack, setActiveTrack] = useState(null)
  const [genMode, setGenMode] = useState('daily')
  const [kruOpen, setKruOpen] = useState(false)
  const [kruCtx, setKruCtx] = useState('')
  const [apiKey, setApiKey] = useState('')
  const [provider, setProvider] = useState('claude')
  const [dsKey, setDsKey] = useState('')
  const [orKey, setOrKey] = useState('')
  const [customTargets, setCustomTargets] = useState(null)
  const [browseFilter, setBrowseFilter] = useState('all')

  // Init
  useEffect(() => {
    async function init() {
      const sv = await stGet('tt-vocab')
      const st = await stGet('tt-tracks')
      if (sv && sv.length) {
        // Migration: overwrite ALL phonetics from corrected RAW_VOCAB
        const phMap = {}
        RAW_VOCAB.forEach((d, i) => { if (d.ph) phMap[i + 1] = d.ph })
        const migrated = sv.map(w => phMap[w.id] ? { ...w, phonetic: phMap[w.id] } : w)
        setVocab(migrated)
        await stSet('tt-vocab', migrated)
      } else {
        const v = initVocab()
        setVocab(v)
        await stSet('tt-vocab', v)
      }
      setTracks(st || [])
      const sk = await stGet('tt-apikey')
      if (sk) setApiKey(sk)
      const pv = await stGet('tt-provider'); if (pv) setProvider(pv)
      const dk = await stGet('tt-dskey'); if (dk) setDsKey(dk)
      const ok = await stGet('tt-orkey'); if (ok) setOrKey(ok)
      setLoading(false)
    }
    init()
  }, [])

  const saveVocab = useCallback(async v => { setVocab(v); await stSet('tt-vocab', v) }, [])
  const saveTracks = useCallback(async t => {
    // Item 41: Cap at 20 tracks, remove oldest
    const capped = t.length > 20 ? t.slice(t.length - 20) : t
    setTracks(capped)
    await stSet('tt-tracks', capped)
  }, [])

  function navigate(v) {
    if (v === 'generate-daily') { setGenMode('daily'); setCustomTargets(null); setView('generate') }
    else if (v === 'generate-weak') { setGenMode('weak'); setCustomTargets(null); setView('generate') }
    else if (v.startsWith('browse-')) { setBrowseFilter(v.replace('browse-', '')); setView('browse') }
    else setView(v)
  }

  function onCustomTrack(targets) {
    setCustomTargets(targets); setGenMode('custom'); setView('generate')
  }

  function onTrackGenerated(track) {
    const newTracks = [...tracks, track]
    saveTracks(newTracks)
    setActiveTrack(track)
    setView('player')
  }

  function onTrackComplete(keywords) {
    // Apply SRS ratings — skip words marked as 'skip' (didn't appear)
    const ratedIds = {}
    const knownIds = new Set()
    keywords.forEach(k => {
      if (!k.wordId || !k.rating || k.rating === 'skip') return
      if (k.rating === 'known') knownIds.add(k.wordId)
      else ratedIds[k.wordId] = k.rating
    })
    const newVocab = vocab.map(w => {
      if (knownIds.has(w.id)) return markWordKnown(w)
      if (ratedIds[w.id]) return applyRating(w, ratedIds[w.id])
      return w
    })
    saveVocab(newVocab)

    // Mark track as rated
    const newTracks = tracks.map(t => t === activeTrack ? { ...t, rated: true, keywords } : t)
    saveTracks(newTracks)
    setActiveTrack(null)
    setView('dashboard')
  }

  function onOpenTrack(track) {
    setActiveTrack(track)
    setView('player')
  }

  function onDeleteTrack(idx) {
    const newTracks = tracks.filter((_, i) => i !== idx)
    saveTracks(newTracks)
  }

  function onWordsAdded(words) {
    const maxId = vocab.reduce((m, w) => Math.max(m, w.id), 0)
    const newWords = words.map((w, i) => ({
      id: maxId + i + 1, thai: w.thai, english: w.english, phonetic: w.phonetic || null, status: 'new', difficulty: 'hard', interval: 0, lastSeen: null, dueDate: null, repCount: 0, lapses: 0
    }))
    const newVocab = [...vocab, ...newWords]
    saveVocab(newVocab)
    navigate('dashboard')
  }

  function onPhonetics(map) {
    // map is {wordId: phonetic} — save into vocab words
    let changed = false
    const newVocab = vocab.map(w => {
      if (map[w.id] && !w.phonetic) { changed = true; return { ...w, phonetic: map[w.id] } }
      return w
    })
    if (changed) saveVocab(newVocab)
  }

  function openKru(ctx = '') { setKruCtx(ctx); setKruOpen(true) }

  if (loading) {
    return (
      <div className="app" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', flexDirection: 'column', gap: 16 }}>
        <FontStyle />
        <div className="thai display" style={{ fontSize: 36, color: 'var(--gold)' }}>สวัสดี</div>
        <Spinner size={28} />
        <p style={{ color: 'var(--muted)', fontSize: 14 }}>Loading Thai Teacher...</p>
      </div>
    )
  }

  const trackContext = activeTrack
    ? `Track: ${activeTrack.date}, mode: ${activeTrack.mode}. Keywords: ${(activeTrack.keywords || []).map(k => `${k.thai}=${k.english}`).join(', ')}`
    : ''

  return (
    <div className="app">
      <FontStyle />
      <Header view={view} onNav={navigate} onHome={() => navigate('dashboard')} />
      <main>
        {view === 'dashboard' && <Dashboard vocab={vocab} tracks={tracks} onNav={navigate} onOpenTrack={onOpenTrack} onDeleteTrack={onDeleteTrack}
            onOpenConvo={track => { setActiveTrack(track); setView('convo') }}
            onGenerateConvo={async (track) => {
              const orModel = provider === 'deepseek' ? 'deepseek/deepseek-chat' : provider === 'haiku' ? 'anthropic/claude-haiku-4-5' : 'openai/gpt-4o-mini'
              const convoKey = provider === 'claude' ? apiKey : orKey
              if (!convoKey) {
                alert('No OpenRouter key found. Go to Settings and save your key first.')
                return
              }
              const targets = vocab.filter(w => (track.keywords||[]).some(k => k.wordId === w.id))
              if (!targets.length) { alert('No matching words found for this track'); return }
              try {
                const lines = await generateConvoWithOpenRouter(targets, vocab, convoKey, orModel)
                if (!lines || !lines.length) throw new Error('No conversation lines returned')
                // Find and update track by createdAt
                const updated = tracks.map(t => t.createdAt === track.createdAt ? { ...t, convo: lines } : t)
                await saveTracks(updated)
                setActiveTrack({ ...track, convo: lines })
                setView('convo')
              } catch(e) { alert('Convo failed: ' + e.message) }
            }}
            provider={provider} onSetProvider={async p => { setProvider(p); await stSet('tt-provider', p) }} hasClaudeKey={!!apiKey} hasDeepSeekKey={!!dsKey} hasOrKey={!!orKey} />}
        {view === 'generate' && <Generator vocab={vocab} mode={genMode} onGenerated={onTrackGenerated} onBack={() => navigate('dashboard')}
          apiKey={orKey}
          provider={provider}
          orKey={orKey} onPhonetics={onPhonetics} customTargets={customTargets}
        />}
        {view === 'player' && activeTrack && (
          <Player track={activeTrack} onComplete={onTrackComplete} onBack={() => { setActiveTrack(null); navigate('dashboard') }} onKru={ctx => openKru(ctx)}
            onBookmark={async (pairIdx) => {
              const updated = tracks.map(t => t === activeTrack ? { ...t, bookmark: pairIdx } : t)
              await saveTracks(updated)
              setActiveTrack(prev => ({ ...prev, bookmark: pairIdx }))
            }}
          />
        )}
        {view === 'browse' && <Browser vocab={vocab} onBack={() => navigate('dashboard')} initialFilter={browseFilter} phonetics={{}} onCustomTrack={onCustomTrack} orKey={orKey} onVocabUpdate={saveVocab} />}
        {view === 'add-words' && <Adder onBack={() => navigate('dashboard')} onAdded={onWordsAdded} orKey={orKey} />}
        {view === 'settings' && <Settings onBack={() => navigate('dashboard')} apiKey={apiKey} onSaveKey={k => setApiKey(k)} provider={provider} onSaveProvider={async p => { setProvider(p); await stSet('tt-provider',p) }} dsKey={dsKey} onSaveDsKey={async k => { setDsKey(k); await stSet('tt-dskey',k) }} orKey={orKey} onSaveOrKey={async k => { setOrKey(k); await stSet('tt-orkey',k) }} />}
        {view === 'data' && <DataManager onBack={() => navigate('dashboard')} vocab={vocab} tracks={tracks} onImport={async (v,t) => { await saveVocab(v); await saveTracks(t); navigate('dashboard') }} />}
        {view === 'belt-rank' && <BeltRankView vocab={vocab} onBack={() => navigate('dashboard')} />}
        {view === 'lessons' && <LessonsView vocab={vocab} onVocabUpdate={onWordsAdded} onBack={() => navigate('dashboard')} />}
        {view === 'convo' && activeTrack?.convo && (
          <ConvoPlayer
            lines={activeTrack.convo}
            speed={parseFloat(localStorage.getItem('tt-speed') || '0.8')}
            onSpeedChange={s => { try { localStorage.setItem('tt-speed', s) } catch {} }}
            onSkip={() => { setView('dashboard') }}
            onDone={() => { setView('dashboard') }}
          />
        )}
      </main>

      {/* Kru floating button */}
      {view !== 'player' && (
        <button onClick={() => openKru()} title="Ask Kru"
          style={{ position: 'fixed', bottom: 20, right: 20, width: 52, height: 52, borderRadius: '50%', background: 'linear-gradient(135deg, #d4a94a, #b88a35)', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 20px rgba(212,169,74,0.4)', fontSize: 22, zIndex: 40, transition: 'transform 0.15s' }}
          onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.1)'}
          onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}>
          ครู
        </button>
      )}

      <KruPanel open={kruOpen} onClose={() => setKruOpen(false)} trackContext={trackContext} vocab={vocab} />
    </div>
  )
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ThaiTeacher))
  </script>
</body>
</html>
